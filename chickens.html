<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#241043">
<title>Pick a Chicken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Archivo:wght@500;700;900&display=swap">
<style>
  html,body{height:100%;margin:0;background:#150827;overflow:hidden;
    font-family:'Archivo',system-ui,sans-serif;color:#FFF2DE;
    -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
    font-size:11px;font-weight:900;letter-spacing:.2em;white-space:nowrap;
    color:rgba(255,242,222,.45);pointer-events:none;text-align:center}
  #load{position:fixed;inset:0;display:grid;place-items:center;
    font-size:12px;font-weight:900;letter-spacing:.24em;color:rgba(255,242,222,.6);background:#241043}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">TAP A CHICKEN TO MAKE HIM HOP</div>
<div id="load">DRAWING CHICKENS&hellip;</div>
<script>
(() => {
'use strict';
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const TAU=Math.PI*2, clamp=(v,a,b)=>v<a?a:v>b?b:v;

const CAST=[
  {src:'art/snapback.webp', n:'SNAPBACK',    tag:'Cap backwards. Gold chain. Zero notes.',     short:'Cap backwards.'},
  {src:'art/bucket.webp',   n:'BUCKET',      tag:'Bucket hat, shades, totally unbothered.',    short:'Bucket + shades.'},
  {src:'art/fedora.webp',   n:'TINY FEDORA', tag:'Hat too small. Confidence far too big.',     short:'Tiny hat, big ego.'},
  {src:'art/beanie.webp',   n:'BEANIE',      tag:'Beanie with a pom. Fully chilled out.',      short:'Beanie + pom.'}
];

/* Key the flat green out, soften the fringe, crop to what survives.
   Done here so the source art on disk stays untouched. */
function keyGreen(img){
  const w=img.naturalWidth, h=img.naturalHeight;
  const off=document.createElement('canvas'); off.width=w; off.height=h;
  const g=off.getContext('2d',{willReadFrequently:true});
  g.drawImage(img,0,0);
  const d=g.getImageData(0,0,w,h), px=d.data;
  let minX=w, minY=h, maxX=0, maxY=0, found=false;
  for(let i=0;i<px.length;i+=4){
    const r=px[i], gg=px[i+1], b=px[i+2];
    if(gg>90 && gg>r*1.28 && gg>b*1.28){ px[i+3]=0; continue; }
    if(gg>r && gg>b){
      const cap=Math.max(r,b), mix=clamp((gg-cap)/60,0,1);
      px[i+1]=gg+(cap-gg)*mix;
      if(gg-cap>34) px[i+3]=Math.min(px[i+3],255-(gg-cap-34)*6);
    }
    if(px[i+3]>16){
      found=true;
      const p=i/4, x=p%w, y=(p/w)|0;
      if(x<minX)minX=x; if(x>maxX)maxX=x;
      if(y<minY)minY=y; if(y>maxY)maxY=y;
    }
  }
  g.putImageData(d,0,0);
  if(!found){ minX=0;minY=0;maxX=w-1;maxY=h-1; }
  const pad=6;
  minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad);
  maxX=Math.min(w-1,maxX+pad); maxY=Math.min(h-1,maxY+pad);
  const cw=maxX-minX+1, ch=maxY-minY+1;
  const out=document.createElement('canvas'); out.width=cw; out.height=ch;
  out.getContext('2d').drawImage(off,minX,minY,cw,ch,0,0,cw,ch);
  return out;
}

let W=0,H=0,DPR=1,cols=2,rows=2,cellW=0,cellH=0,headH=0;
function resize(){
  W=Math.min(cv.clientWidth||1e9, document.documentElement.clientWidth||1e9, innerWidth);
  H=Math.min(cv.clientHeight||1e9, document.documentElement.clientHeight||1e9, innerHeight);
  DPR=Math.min(devicePixelRatio||1,2.25);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  headH=Math.min(100,H*0.14);
  cols = W>=860 ? 4 : 2; rows = Math.ceil(CAST.length/cols);
  cellW=W/cols; cellH=(H-headH-26)/rows;
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,120));
function cellRect(i){ return {x:(i%cols)*cellW, y:headH+Math.floor(i/cols)*cellH, w:cellW, h:cellH}; }
function fitText(txt,family,weight,start,maxW){
  let size=start;
  do{ ctx.font=weight+' '+size+'px '+family; if(ctx.measureText(txt).width<=maxW) break; size--; }
  while(size>7);
}
addEventListener('pointerdown', e=>{
  for(let i=0;i<CAST.length;i++){ const r=cellRect(i);
    if(e.clientX>=r.x&&e.clientX<r.x+r.w&&e.clientY>=r.y&&e.clientY<r.y+r.h){
      const c=CAST[i]; if(c.air<=0){ c.air=0.001; c.airV=1; } } }
},{passive:true});

let t0=performance.now(), last=t0;
function frame(now){
  requestAnimationFrame(frame);
  const t=(now-t0)/1000, dt=Math.min(0.05,(now-last)/1000); last=now;
  ctx.setTransform(DPR,0,0,DPR,0,0);

  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#241043'); g.addColorStop(0.42,'#5E2569');
  g.addColorStop(0.74,'#C4485E'); g.addColorStop(1,'#F2794A');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  ctx.textAlign='center';
  fitText('PICK A CHICKEN','Bungee, sans-serif','400',Math.round(Math.min(34,W*0.09)),W*0.9);
  ctx.fillStyle='#FFD54A'; ctx.fillText('PICK A CHICKEN', W/2, headH*0.60);
  ctx.font='900 11px Archivo, sans-serif'; ctx.fillStyle='rgba(255,242,222,.55)';
  ctx.fillText('SAME CHICKEN — THE HAT SETS THE ATTITUDE', W/2, headH*0.60+20);

  for(let i=0;i<CAST.length;i++){
    const c=CAST[i], r=cellRect(i);
    if(c.airV>0){ c.air+=dt*3.2*c.airV; if(c.air>=1){c.air=1;c.airV=-1;} }
    else if(c.air>0){ c.air-=dt*2.8; if(c.air<0)c.air=0; }
    const hop=Math.sin(clamp(c.air,0,1)*Math.PI);
    const gy=r.y+r.h-56;

    ctx.fillStyle='rgba(21,8,39,.30)';
    ctx.fillRect(r.x+r.w*0.06, gy+2, r.w*0.88, 4);

    if(c.img){
      const s=Math.min(r.w*0.82/c.img.width, (r.h-96)/c.img.height);
      const w=c.img.width*s, h=c.img.height*s;
      const breathe=Math.sin(t*1.9+i*1.3);
      const sy=1+breathe*0.016-hop*0.05, sx=1-breathe*0.010+hop*0.03;
      ctx.save();
      ctx.translate(r.x+r.w/2, gy-hop*r.h*0.16);
      ctx.rotate(Math.sin(t*1.4+i)*0.014-hop*0.05);
      ctx.beginPath();
      ctx.ellipse(0,6,w*0.30*(1-hop*0.32),w*0.075*(1-hop*0.32),0,0,TAU);
      ctx.fillStyle='rgba(21,8,39,.34)'; ctx.fill();
      ctx.scale(sx,sy);
      ctx.drawImage(c.img,-w/2,-h,w,h);
      ctx.restore();
    } else if(c.missing){
      ctx.font='900 12px Archivo, sans-serif'; ctx.fillStyle='rgba(255,242,222,.4)';
      ctx.fillText('STILL RENDERING…', r.x+r.w/2, gy-r.h*0.35);
    }

    const maxW=r.w*0.9;
    fitText(c.n,'Bungee, sans-serif','400',Math.round(Math.min(24,r.w*0.105)),maxW);
    ctx.fillStyle='#FFD54A'; ctx.fillText(c.n, r.x+r.w/2, gy+30);
    const tag = cols===2 ? c.short : c.tag;
    fitText(tag,'Archivo, sans-serif','700',Math.round(Math.min(13,r.w*0.056)),maxW);
    ctx.fillStyle='rgba(255,242,222,.68)'; ctx.fillText(tag, r.x+r.w/2, gy+49);
  }
}

let pending=CAST.length;
CAST.forEach(c=>{
  c.air=0; c.airV=0; c.img=null; c.missing=false;
  const im=new Image();
  im.onload=()=>{ try{ c.img=keyGreen(im); }catch(e){ c.img=im; } done(); };
  im.onerror=()=>{ c.missing=true; done(); };
  im.src=c.src;
});
function done(){
  if(--pending>0) return;
  document.getElementById('load').style.display='none';
  resize(); requestAnimationFrame(frame);
}
resize(); addEventListener('load',resize);
})();
</script>
</body>
</html>
