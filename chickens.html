<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#241043">
<title>Pick a Chicken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Archivo:wght@500;700;900&display=swap">
<style>
  html,body{height:100%;margin:0;background:#150827;overflow:hidden;
    font-family:'Archivo',system-ui,sans-serif;color:#FFF2DE;
    -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
    font-size:11px;font-weight:900;letter-spacing:.2em;white-space:nowrap;
    color:rgba(255,242,222,.45);pointer-events:none;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">TAP A CHICKEN TO SEE HIM JUMP</div>
<script>
(() => {
'use strict';
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const TAU=Math.PI*2, clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const dirX=a=>Math.sin(a), dirY=a=>Math.cos(a);
const INK='#241043';
if(!ctx.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){if(typeof r==='number')r=[r,r,r,r];const[a,b,c,d]=r;this.moveTo(x+a,y);this.lineTo(x+w-b,y);this.quadraticCurveTo(x+w,y,x+w,y+b);this.lineTo(x+w,y+h-c);this.quadraticCurveTo(x+w,y+h,x+w-c,y+h);this.lineTo(x+d,y+h);this.quadraticCurveTo(x,y+h,x,y+h-d);this.lineTo(x,y+a);this.quadraticCurveTo(x,y,x+a,y);return this;}}
function paint(f,lw){ctx.fillStyle=f;ctx.fill();if(lw!==0){ctx.lineWidth=lw||5;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.stroke();}}
function capsule(x1,y1,x2,y2,w,col){ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
  ctx.strokeStyle=INK;ctx.lineWidth=w+8;ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke();}

/* ---- the same IK rig the game animates: swap the skin, keep the motion ---- */
const R={thigh:32,shin:30,HIPH:60,ANKLE:9};
function legIK(tx,ty,o){const L1=R.thigh,L2=R.shin;let d=Math.hypot(tx,ty);
  const mx=(L1+L2)*0.995,mn=Math.abs(L1-L2)+2;
  if(d>mx){const s=mx/d;tx*=s;ty*=s;d=mx;} if(d<mn){const s=mn/(d||0.001);tx*=s;ty*=s;d=mn;}
  const base=Math.atan2(tx,ty),ca=clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1),a=base+Math.acos(ca);
  o.kx=dirX(a)*L1;o.ky=dirY(a)*L1;o.fx=tx;o.fy=ty;return o;}
const k1={},k2={},f1={},f2={};
function footPath(t,stride,lift,gy,o){t=t-Math.floor(t);
  if(t<0.45){const u=t/0.45;o.x=lerp(stride*0.58,-stride*0.66,u);o.y=gy;}
  else{const u=(t-0.45)/0.55;const f=u<0.42?u*0.55:0.231+(u-0.42)*1.325;
    o.x=lerp(-stride*0.66,stride*0.58,clamp(f,0,1));o.y=gy-lift*Math.pow(Math.sin(u*Math.PI),0.72);}
  return o;}

/* running pose. The gag: the head counter-bobs so it stays locked in space
   while the body pumps underneath it — which is what real chickens do. */
function chickPose(ph, s, air){
  const hy = air>0 ? -2 : s.bob*Math.cos(4*Math.PI*(ph-0.12));
  const gy = R.HIPH-R.ANKLE-hy;
  if(air>0){
    legIK(16+air*10, 40+air*4, k1); legIK(-14-air*8, 46, k2);
  } else {
    footPath(ph,s.stride,s.lift,gy,f1); footPath(ph+0.5,s.stride,s.lift,gy,f2);
    legIK(f1.x,f1.y,k1); legIK(f2.x,f2.y,k2);
  }
  return {hy, hx: air>0?4:2*Math.sin(4*Math.PI*ph),
    kN:{x:k1.kx,y:k1.ky}, fN:{x:k1.fx,y:k1.fy},
    kF:{x:k2.kx,y:k2.ky}, fF:{x:k2.fx,y:k2.fy},
    headLock: air>0 ? 0 : -hy*s.lock,
    wing: air>0 ? Math.sin(performance.now()/40) : Math.sin(ph*TAU)};
}
function foot(fx,fy,col){ctx.save();ctx.translate(fx,fy);
  ctx.strokeStyle=INK;ctx.lineCap='round';
  for(const a of [-0.55,0,0.55]){ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.sin(a+1.35)*17,Math.cos(a+1.35)*9);ctx.stroke();}
  ctx.strokeStyle=col;for(const a of [-0.55,0,0.55]){ctx.lineWidth=4.5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.sin(a+1.35)*17,Math.cos(a+1.35)*9);ctx.stroke();}
  ctx.restore();}
function eye(x,y,r,px,py,lid){
  ctx.beginPath();ctx.ellipse(x,y,r,r*(1-lid*0.55),0,0,TAU);ctx.fillStyle='#fff';ctx.fill();
  ctx.lineWidth=3.4;ctx.strokeStyle=INK;ctx.stroke();
  ctx.beginPath();ctx.arc(x+px,y+py,r*0.46,0,TAU);ctx.fillStyle=INK;ctx.fill();
  ctx.beginPath();ctx.arc(x+px+r*0.2,y+py-r*0.2,r*0.16,0,TAU);ctx.fillStyle='#fff';ctx.fill();}
function beak(x,y,len,dep,col){
  ctx.beginPath();ctx.moveTo(x,y-dep*0.5);ctx.lineTo(x+len,y+dep*0.1);ctx.lineTo(x,y+dep*0.6);ctx.closePath();paint(col,4);
  ctx.beginPath();ctx.moveTo(x,y+dep*0.1);ctx.lineTo(x+len*0.8,y+dep*0.16);ctx.strokeStyle=INK;ctx.lineWidth=2.6;ctx.stroke();}
function plume(len,wide,col,rot){
  ctx.save();ctx.rotate(rot);
  ctx.beginPath();ctx.moveTo(0,0);
  ctx.quadraticCurveTo(-len*0.45,-wide*1.15,-len,-len*0.62);
  ctx.quadraticCurveTo(-len*0.42, wide*0.30,0,wide*0.55);
  ctx.closePath();paint(col,4.5);ctx.restore();}

/* ================= 1. NUGGET ================= */
function nugget(p,t,air){
  const BODY='#FFF4E2',SH='#E8D6BD',LEG='#FFA43D',COMB='#FF4D6D';
  capsule(0,0,p.kF.x,p.kF.y,9,'#D98230'); capsule(p.kF.x,p.kF.y,p.fF.x,p.fF.y,7,'#D98230'); foot(p.fF.x,p.fF.y,'#D98230');
  ctx.beginPath();ctx.moveTo(-50,-58);ctx.quadraticCurveTo(-86,-80,-74,-44);ctx.closePath();paint(SH,4.5);
  ctx.beginPath();ctx.ellipse(-4,-44,52,46,0.05,0,TAU);paint(BODY,5);
  ctx.save();ctx.clip();ctx.beginPath();ctx.ellipse(-46,-30,40,50,0,0,TAU);ctx.fillStyle=SH;ctx.fill();ctx.restore();
  ctx.save();ctx.translate(8,-48);ctx.rotate(-0.5+p.wing*0.95);          // frantic little wing
  ctx.beginPath();ctx.ellipse(0,17,15,27,0,0,TAU);paint(SH,4.5);ctx.restore();
  ctx.save();ctx.translate(24,-86+p.headLock);
  ctx.rotate(Math.sin(t*22)*0.03);                                        // permanent panic jitter
  ctx.beginPath();ctx.ellipse(0,0,26,25,0,0,TAU);paint(BODY,5);
  ctx.beginPath();ctx.moveTo(-14,-21);
  ctx.quadraticCurveTo(-4,-50,13,-35);ctx.quadraticCurveTo(25,-54,31,-27);
  ctx.quadraticCurveTo(40,-35,35,-7);ctx.quadraticCurveTo(16,-14,-14,-21);ctx.closePath();paint(COMB,5);
  ctx.beginPath();ctx.ellipse(15,15,6.5,10,0.3,0,TAU);paint(COMB,3.6);
  beak(21,2,21,16,LEG);
  eye(2,-5,11,2,-1,0); eye(20,-7,4.5,1,0,0);
  ctx.restore();
  capsule(0,0,p.kN.x,p.kN.y,10,LEG); capsule(p.kN.x,p.kN.y,p.fN.x,p.fN.y,8,LEG); foot(p.fN.x,p.fN.y,LEG);
}
/* ================= 2. THE COLONEL ================= */
function colonel(p,t,air){
  const BODY='#F2684F',SH='#C94A38',LEG='#FFD54A',COMB='#FF456E';
  capsule(0,0,p.kF.x,p.kF.y,8,'#D9A82F'); capsule(p.kF.x,p.kF.y,p.fF.x,p.fF.y,6,'#D9A82F'); foot(p.fF.x,p.fF.y,'#D9A82F');
  ctx.save();ctx.translate(-36,-58);                                      // showboat tail
  plume(74,26,'#6BD1FF',-0.30+Math.sin(t*3.0)*0.06);
  plume(84,30,'#FFD54A',-0.62+Math.sin(t*3.0+0.4)*0.06);
  plume(70,26,'#34D9C0',-0.96+Math.sin(t*3.0+0.8)*0.06);
  ctx.restore();
  ctx.beginPath();ctx.ellipse(-2,-50,42,44,-0.08,0,TAU);paint(BODY,5);
  ctx.save();ctx.clip();ctx.beginPath();ctx.ellipse(-38,-38,34,48,0,0,TAU);ctx.fillStyle=SH;ctx.fill();
  ctx.beginPath();ctx.ellipse(26,-46,20,30,0,0,TAU);ctx.fillStyle='rgba(255,180,71,.45)';ctx.fill();ctx.restore();
  ctx.save();ctx.translate(10,-56);ctx.rotate(-0.35+p.wing*0.55);
  ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(22,22,5,43);ctx.quadraticCurveTo(-15,24,0,0);ctx.closePath();paint(SH,4.5);ctx.restore();
  ctx.save();ctx.translate(26,-100+p.headLock);
  capsule(-9,30,0,5,21,BODY);
  ctx.beginPath();ctx.ellipse(0,0,24,23,0,0,TAU);paint(BODY,5);
  ctx.beginPath();ctx.moveTo(-13,-19);ctx.quadraticCurveTo(2,-47,23,-42);
  ctx.quadraticCurveTo(42,-40,31,-16);ctx.quadraticCurveTo(8,-25,-13,-19);ctx.closePath();paint(COMB,5);
  ctx.beginPath();ctx.ellipse(12,17,7,12,0.25,0,TAU);paint(COMB,3.6);
  beak(20,-1,23,15,LEG);
  ctx.beginPath();ctx.roundRect(-15,-26,36,12,5);paint('#1A0E2A',3.4);    // shades pushed up
  ctx.beginPath();ctx.roundRect(-12,-24,13,7,3);ctx.fillStyle='rgba(107,209,255,.5)';ctx.fill();
  eye(3,-2,9,2.6,1,0.40); eye(19,-4,4.2,1.6,1,0.40);
  ctx.restore();
  capsule(0,0,p.kN.x,p.kN.y,9,LEG); capsule(p.kN.x,p.kN.y,p.fN.x,p.fN.y,7,LEG); foot(p.fN.x,p.fN.y,LEG);
}
/* ================= 3. DRUMSTICK ================= */
function drumstick(p,t,air){
  const BODY='#FFD54A',SH='#E0AC2A',LEG='#FF8A3D',COMB='#FF456E',BAND='#3FE0B0';
  capsule(0,0,p.kF.x,p.kF.y,23,'#D97A2E'); capsule(p.kF.x,p.kF.y,p.fF.x,p.fF.y,9,'#D97A2E'); foot(p.fF.x,p.fF.y,'#D97A2E');
  ctx.beginPath();ctx.moveTo(-44,-72);ctx.quadraticCurveTo(-76,-94,-66,-56);ctx.closePath();paint(SH,4.5);
  ctx.beginPath();ctx.moveTo(-40,-16);
  ctx.quadraticCurveTo(-58,-72,-16,-96);ctx.quadraticCurveTo(36,-114,50,-66);
  ctx.quadraticCurveTo(58,-24,20,-10);ctx.quadraticCurveTo(-16,-2,-40,-16);ctx.closePath();paint(BODY,5);
  ctx.save();ctx.clip();ctx.beginPath();ctx.ellipse(-46,-48,34,56,0,0,TAU);ctx.fillStyle=SH;ctx.fill();
  ctx.beginPath();ctx.moveTo(16,-100);ctx.quadraticCurveTo(22,-54,12,-12);ctx.strokeStyle='rgba(224,172,42,.95)';ctx.lineWidth=5;ctx.stroke();ctx.restore();
  ctx.save();ctx.translate(24,-74);ctx.rotate(-1.0+p.wing*0.4);
  ctx.beginPath();ctx.ellipse(0,10,9,16,0,0,TAU);paint(SH,4);ctx.restore();   // uselessly small wing
  ctx.save();ctx.translate(40,-134+p.headLock);
  capsule(-10,26,0,8,17,BODY);
  ctx.beginPath();ctx.ellipse(0,0,18,17,0,0,TAU);paint(BODY,4.8);
  ctx.beginPath();ctx.moveTo(-10,-14);ctx.quadraticCurveTo(0,-30,11,-26);ctx.quadraticCurveTo(22,-24,15,-11);ctx.closePath();paint(COMB,4);
  ctx.beginPath();ctx.roundRect(-16,-17,32,9,4);paint(BAND,3.4);
  beak(15,1,16,11,LEG);
  eye(1,-1,7,2,0,0.28); eye(13,-2,3.4,1,0,0.28);
  ctx.restore();
  capsule(0,0,p.kN.x,p.kN.y,25,LEG); capsule(p.kN.x,p.kN.y,p.fN.x,p.fN.y,10,LEG); foot(p.fN.x,p.fN.y,LEG);
}
/* ================= 4. EGGBERT ================= */
function eggbert(p,t,air){
  const BODY='#F7E9DA',SH='#DCC7B4',LEG='#FFB86B',COMB='#FF7A9E',PACK='#34D9C0';
  capsule(0,0,p.kF.x,p.kF.y,6,'#D99A55'); capsule(p.kF.x,p.kF.y,p.fF.x,p.fF.y,5,'#D99A55'); foot(p.fF.x,p.fF.y,'#D99A55');
  ctx.beginPath();ctx.moveTo(-32,-56);ctx.quadraticCurveTo(-58,-74,-50,-42);ctx.closePath();paint(SH,4);
  ctx.beginPath();ctx.ellipse(-2,-42,33,40,0.04,0,TAU);paint(BODY,5);
  ctx.save();ctx.clip();ctx.beginPath();ctx.ellipse(-30,-32,26,44,0,0,TAU);ctx.fillStyle=SH;ctx.fill();ctx.restore();
  ctx.save();ctx.translate(-28,-50);ctx.rotate(-0.12);                     // tiny backpack
  ctx.beginPath();ctx.roundRect(-20,-20,30,40,9);paint(PACK,4.5);
  ctx.beginPath();ctx.roundRect(-15,-9,20,12,5);paint('#1E9E8C',3.2);ctx.restore();
  ctx.save();ctx.translate(6,-50);ctx.rotate(-0.3+p.wing*1.15);            // flapping hard, going nowhere
  ctx.beginPath();ctx.ellipse(0,13,8,22,0,0,TAU);paint(SH,4);ctx.restore();
  ctx.save();ctx.translate(20,-96+p.headLock);
  capsule(-7,32,0,8,11,BODY);
  ctx.beginPath();ctx.ellipse(0,0,25,24,0,0,TAU);paint(BODY,5);
  for(let i=0;i<3;i++){const a=-0.5+i*0.45+Math.sin(t*4+i)*0.11;
    ctx.lineCap='round';
    ctx.strokeStyle=INK;ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(-2+i*3,-21);ctx.lineTo(-2+i*3+Math.sin(a)*14,-21-Math.cos(a)*26);ctx.stroke();
    ctx.strokeStyle=COMB;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-2+i*3,-21);ctx.lineTo(-2+i*3+Math.sin(a)*14,-21-Math.cos(a)*26);ctx.stroke();}
  ctx.beginPath();ctx.ellipse(13,16,5,8.5,0.3,0,TAU);paint(COMB,3.4);
  beak(20,1,18,13,LEG);
  eye(1,-3,12.5,2,0,0); eye(19,-5,5.5,1.5,0,0);
  ctx.restore();
  capsule(0,0,p.kN.x,p.kN.y,7,LEG); capsule(p.kN.x,p.kN.y,p.fN.x,p.fN.y,6,LEG); foot(p.fN.x,p.fN.y,LEG);
}

/* each one runs differently — that IS the animation */
const CAST=[
  {fn:nugget,   n:'NUGGET',      tag:'Round. Panicking. Comb over one eye.',
   short:'Round. Panicking.',
   s:{rate:2.6, bob:8,  stride:38, lift:26, lock:1.0}},
  {fn:colonel,  n:'THE COLONEL', tag:'Smug rooster. Tail plume. Shades up.',
   short:'Smug. Tail plume.',
   s:{rate:1.6, bob:6,  stride:50, lift:32, lock:1.1}},
  {fn:drumstick,n:'DRUMSTICK',   tag:'All thighs, no head. Leg day forever.',
   short:'All thighs, no head.',
   s:{rate:1.35,bob:12, stride:46, lift:34, lock:0.8}},
  {fn:eggbert,  n:'EGGBERT',     tag:'Scrawny underdog. Three sad feathers.',
   short:'Scrawny underdog.',
   s:{rate:3.1, bob:7,  stride:32, lift:24, lock:1.0}}
];
CAST.forEach(c=>{ c.air=0; c.airV=0; });

let W=0,H=0,DPR=1,cols=1,rows=4,cellW=0,cellH=0,headH=0;
function resize(){
  W=Math.min(cv.clientWidth||1e9, document.documentElement.clientWidth||1e9, innerWidth);
  H=Math.min(cv.clientHeight||1e9, document.documentElement.clientHeight||1e9, innerHeight);
  DPR=Math.min(devicePixelRatio||1,2.25);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  headH = Math.min(96, H*0.13);
  cols = W>=820 ? 4 : 2;
  rows = 4/cols;
  cellW = W/cols; cellH = (H-headH-30)/rows;
}
addEventListener('resize',resize); addEventListener('orientationchange',()=>setTimeout(resize,120));

function fitText(txt, family, weight, start, maxW){
  let size=start;
  do{ ctx.font=weight+' '+size+'px '+family; if(ctx.measureText(txt).width<=maxW) break; size--; }
  while(size>7);
  return size;
}
function cellRect(i){
  const cx=(i%cols)*cellW, cy=headH+Math.floor(i/cols)*cellH;
  return {x:cx,y:cy,w:cellW,h:cellH};
}
addEventListener('pointerdown', e=>{
  const x=e.clientX, y=e.clientY;
  for(let i=0;i<4;i++){ const r=cellRect(i);
    if(x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h){ if(CAST[i].air<=0){ CAST[i].air=0.001; CAST[i].airV=1; } } }
}, {passive:true});

let t0=performance.now(), last=t0;
function frame(now){
  requestAnimationFrame(frame);
  const t=(now-t0)/1000; const dt=Math.min(0.05,(now-last)/1000); last=now;
  ctx.setTransform(DPR,0,0,DPR,0,0);

  // sky
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#241043');g.addColorStop(0.42,'#5E2569');
  g.addColorStop(0.74,'#C4485E');g.addColorStop(1,'#F2794A');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  ctx.textAlign='center';
  fitText('PICK A CHICKEN','Bungee, sans-serif','400',Math.round(Math.min(34,W*0.09)),W*0.9);
  ctx.fillStyle='#FFD54A';
  ctx.fillText('PICK A CHICKEN', W/2, headH*0.62);
  ctx.font='900 11px Archivo, sans-serif'; ctx.fillStyle='rgba(255,242,222,.55)';
  ctx.fillText('EACH ONE RUNS DIFFERENTLY', W/2, headH*0.62+20);

  for(let i=0;i<4;i++){
    const c=CAST[i], r=cellRect(i);
    if(c.airV>0){ c.air+=dt*3.4*c.airV; if(c.air>=1){c.air=1;c.airV=-1;} }
    else if(c.air>0){ c.air-=dt*3.0; if(c.air<0) c.air=0; }
    const hop = Math.sin(clamp(c.air,0,1)*Math.PI);

    const ph=(t*c.s.rate+i*0.21)%1;
    const p=chickPose(ph, c.s, hop);
    const scale = Math.min(r.w/300, (r.h-78)/240);
    const gx = r.x+r.w*0.54, gy = r.y+r.h-58;

    // ground bar
    ctx.fillStyle='rgba(21,8,39,.30)';
    ctx.fillRect(r.x+r.w*0.06, gy+2, r.w*0.88, 4);

    ctx.save(); ctx.translate(gx,gy); ctx.scale(scale,scale);
    ctx.beginPath();ctx.ellipse(0,4,46*(1-hop*0.35),12*(1-hop*0.35),0,0,TAU);
    ctx.fillStyle='rgba(21,8,39,.34)';ctx.fill();
    ctx.translate(p.hx, -R.HIPH + p.hy - hop*70);
    c.fn(p,t,hop);
    ctx.restore();

    const maxW = r.w*0.88;
    fitText(c.n,'Bungee, sans-serif','400',Math.round(Math.min(24,r.w*0.10)),maxW);
    ctx.fillStyle='#FFD54A'; ctx.fillText(c.n, r.x+r.w/2, gy+32);
    const tag = cols===2 ? c.short : c.tag;
    fitText(tag,'Archivo, sans-serif','700',Math.round(Math.min(13,r.w*0.055)),maxW);
    ctx.fillStyle='rgba(255,242,222,.68)'; ctx.fillText(tag, r.x+r.w/2, gy+51);
  }
}
resize(); addEventListener('load',resize); setTimeout(resize,250);
if(document.fonts&&document.fonts.ready){ const to=setTimeout(()=>requestAnimationFrame(frame),1200);
  document.fonts.ready.then(()=>{clearTimeout(to);requestAnimationFrame(frame);}).catch(()=>requestAnimationFrame(frame)); }
else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
