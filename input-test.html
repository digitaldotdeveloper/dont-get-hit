<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#241043">
<title>Input Test</title>
<style>
  html,body{height:100%;margin:0;background:#150827;color:#FFF2DE;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    overscroll-behavior:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  #pad{position:fixed;inset:0;display:grid;place-items:center;text-align:center}
  #big{font-size:clamp(38px,14vw,90px);font-weight:700;line-height:1.1}
  #big.on{color:#3FE0B0}
  #big.off{color:#FF456E}
  #log{position:fixed;left:0;right:0;bottom:0;font-size:12px;line-height:1.5;
    background:#000;padding:8px;white-space:pre;max-height:52%;overflow:hidden}
  #hint{font-size:12px;color:rgba(255,242,222,.6);margin-top:14px;line-height:1.6}
</style>
</head>
<body>
<div id="pad">
  <div>
    <div id="big" class="off">RELEASED</div>
    <div id="hint">PRESS AND HOLD ANYWHERE<br>then screenshot the black panel</div>
  </div>
</div>
<pre id="log"></pre>
<script>
(() => {
'use strict';
const big = document.getElementById('big');
const logEl = document.getElementById('log');
const n = {};                       // per-event-type counters
const recent = [];                  // last few events, in order
let down = 0;                       // presses minus releases
let touches = 0;                    // live touch count from the event itself

function note(type, e){
  n[type] = (n[type] || 0) + 1;
  if(e && e.touches) touches = e.touches.length;
  recent.push(type);
  if(recent.length > 8) recent.shift();
  render();
}
function press(type, e){ down = 1; note(type, e); }
function release(type, e){ down = 0; note(type, e); }

const CAP = {passive:true, capture:true};
const ACT = {passive:false, capture:true};
// every family, every phase, on every plausible target
for(const el of [window, document, document.body]){
  el.addEventListener('touchstart',   e=>{ if(e.cancelable) e.preventDefault(); press('touchstart', e); }, ACT);
  el.addEventListener('touchend',     e=>release('touchend', e), CAP);
  el.addEventListener('touchcancel',  e=>note('touchcancel', e), CAP);
  el.addEventListener('touchmove',    e=>{ if(e.cancelable) e.preventDefault(); note('touchmove', e); }, ACT);
  el.addEventListener('pointerdown',  e=>press('pointerdown', e), CAP);
  el.addEventListener('pointerup',    e=>release('pointerup', e), CAP);
  el.addEventListener('pointercancel',e=>note('pointercancel', e), CAP);
  el.addEventListener('mousedown',    e=>press('mousedown', e), CAP);
  el.addEventListener('mouseup',      e=>release('mouseup', e), CAP);
  el.addEventListener('click',        e=>note('click', e), CAP);
}

function render(){
  big.textContent = down ? 'HOLDING' : 'RELEASED';
  big.className = down ? 'on' : 'off';
  const keys = Object.keys(n).sort();
  const counts = keys.length ? keys.map(k => k + '=' + n[k]).join('\n') : '(no events yet)';
  logEl.textContent =
    'touchSupported=' + (('ontouchstart' in window) ? 1 : 0) +
    '  maxTouchPoints=' + (navigator.maxTouchPoints || 0) +
    '  liveTouches=' + touches + '\n' +
    'down=' + down + '\n\n' +
    counts + '\n\nrecent: ' + (recent.join(' > ') || '-') +
    '\n\nUA: ' + navigator.userAgent.slice(0, 110);
}
render();
setInterval(render, 300);            // keep it fresh even with no events
})();
</script>
</body>
</html>
