/* Tokens, not keys, so a pattern says what SHAPE of hazard it wants and the
   tier decides which one that is. '#zap' a loose wire, '#corn' the crop,
   '#fence' posts on the ground, '#lad' one of the pieces with an opening. */
const PAT = [
  /* tier 0 — one thing at a time, and a long look at it */
  mkPat(0, [1.55,1.95], ['#fence']),
  mkPat(0, [1.50,1.90], ['#corn']),

  /* tier 1 — the loose wire arrives, and the first pairing */
  mkPat(1, [1.35,1.70], ['#zap']),
  mkPat(1, [1.35,1.70], ['#corn']),
  mkPat(1, [1.40,1.75], ['#fence']),
  mkPat(1, [1.45,1.80], ['#corn', 1.05, '#zap']),

  /* tier 2 — wires at other angles, and the first opening to aim at */
  mkPat(2, [1.25,1.55], ['#zap']),
  mkPat(2, [1.30,1.60], ['#lad']),
  mkPat(2, [1.30,1.60], ['#fence', 1.00, '#zap']),
  mkPat(2, [1.25,1.55], ['#corn', 0.95, '#zap']),
  mkPat(2, [1.35,1.65], ['#zap', 1.05, '#zap']),

  /* tier 3 — three beats, and the openings you have to aim at */
  mkPat(3, [1.20,1.50], ['#lad']),
  mkPat(3, [1.20,1.50], ['#zap', 0.95, '#zap']),
  mkPat(3, [1.20,1.50], ['#zap', 0.90, '#corn', 1.00, '#zap']),
  mkPat(3, [1.25,1.55], ['#zap', 0.90, '#lad']),
  mkPat(3, [1.25,1.55], ['#corn', 0.95, '#lad']),

  /* tier 4 — everything, close together, still never closer than the table */
  mkPat(4, [1.15,1.45], ['#zap', 0.85, '#zap', 0.95, '#zap']),
  mkPat(4, [1.15,1.45], ['#lad', 1.00, '#zap']),
  mkPat(4, [1.15,1.45], ['#corn', 0.88, '#zap', 1.00, '#lad']),
  mkPat(4, [1.20,1.50], ['#fence', 0.88, '#zap', 0.95, '#corn']),
  mkPat(4, [1.15,1.45], ['#zap', 0.90, '#lad', 1.05, '#corn']),
];

/* What the basket flies through. Gates and wires, nothing on the floor: corn
   is ankle-high and a basket sails over it without noticing, and a hazard you
   cannot fail is worse than no hazard at all. Spaced a little wider than the
   equivalent tier on foot, because the thing you are steering is twice the
   size and turns like a barge. */
const RIDE_PAT = [
  mkPat(0, [1.60,2.00], ['#lad']),
  mkPat(0, [1.55,1.95], ['#zap']),
  mkPat(1, [1.50,1.85], ['#zap', 1.15, '#lad']),
  mkPat(1, [1.45,1.80], ['#lad', 1.20, '#zap']),
  mkPat(2, [1.40,1.75], ['#zap', 1.05, '#zap']),
  mkPat(2, [1.40,1.75], ['#lad', 1.10, '#lad']),
  mkPat(3, [1.35,1.70], ['#zap', 1.00, '#lad', 1.10, '#zap']),
];
function spawnPattern(){
  const tier = tierNow();
  const table = riding() ? RIDE_PAT : PAT;
  let pool = table.filter(p => p.tier<=tier && !(p.corn && game.cornT>0));
  if(!pool.length) pool = table.filter(p => p.tier<=tier);
  if(!pool.length) pool = table.slice(0, 2);
  /* Weighted towards what has just unlocked. Picking flat from everything
     available means a tier-4 run is mostly tier-0 patterns and the machines
     you unlocked show up twice a minute, which reads as the game running out
     of ideas exactly when it should be at its widest. */
  const fresh = pool.filter(p => p.tier >= tier-1);
  const p = (fresh.length && Math.random() < 0.55) ? pick(fresh) : pick(pool);
  /* Everything in the sequence is placed NOW, at its own arrival time, so the
     spacing inside a pattern is exact rather than the sum of several later
     spawn decisions. */
  const base = (VW - PX + 210)/game.speed + 0.15;
  let lead = base;
  for(const st of p.seq){
    lead += st.dt;
    const k = st.k==='#zap'   ? pick(inTier(ZAP_KEYS, tier))
            : st.k==='#corn'  ? pick(inTier(CORN_KEYS, tier))
            : st.k==='#fence' ? pick(inTier(FENCE_KEYS, tier))
            : st.k==='#lad'   ? pick(inTier(LAD_KEYS, tier))
            : st.k;
    if(!k) continue;                       // a token with nothing in its pool yet
    spawnElec(k, lead);
  }
  /* Corn is a third of the roster now rather than one prop among twenty, so
     the cooldown is short -- it is there to stop two corn beats running into
     each other, not to make the crop rare. */
  if(p.corn) game.cornT = rnd(5, 9);
  game.spawnT = (lead - base) + rnd(p.tail[0], p.tail[1]) * lerp(1, 0.78, game.diff);
}

/* ============================================================
   INPUT
   ============================================================ */
/* thrustOn / thrustOff are the ONLY movement inputs. They set a flag; all
   motion happens in one place in updatePlay. */
let inputDown = false;
function thrustOn(){
  inputDown = true;
  game.tapCount = (game.tapCount||0) + 1;        // counted at entry, for ?dbg=1
  if(game.mode==='menu'){ startIntro(); return; }
  if(game.mode==='intro'){                       // pressing skips ahead to the kick
    if(game.introT < T_KICK-0.05) game.introT = T_KICK-0.05;
    return;
  }
  if(game.mode==='dead'){
    if(game.deadT>0.35) startIntro(); return;
  }
  if(game.mode!=='play') return;
  const wasOff = !player.thrusting;
  player.thrusting = true;                     // FIRST. Nothing below may block it.
  if(wasOff){
    player.flapT = 0.13;                       // start the wingbeat animation
    player.powerT = 1;
    try{
      if(!player.onGround) featherBurst(player.x-24, GROUND-player.y-30, 3, 180);
      S.flap();
    }catch(e){ game.fxErr = e.message; }
  }
  if(game.tut){ game.tut=false; elTut.classList.remove('show'); }
}
function thrustOff(){ inputDown = false; player.thrusting = false; }
const pressJump = thrustOn, releaseJump = thrustOff;   // old names, one system
/* Input, made unmissable.
   taps=0 on device meant no press was reaching pressJump at all. So: listen in
   the CAPTURE phase (nothing downstream can swallow it), bind to the canvas as
   well as window, and register touch AND pointer AND mouse rather than choosing.
   pressJump/releaseJump are idempotent, so overlapping families are harmless.
   Every raw down is counted before any filtering, so the readout can tell
   "no event arrived" apart from "event arrived and was filtered". */
const BUILD = 'b0903-1608';   // shown in ?dbg=1 so a cached build is obvious
const TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints||0) > 0;
/* Only the mute button may swallow a press. Filtering on any <button> was the
   bug: on device every tap reported lastEv=start with taps=0, because the target
   resolved to a button and downFrom returned before pressJump ever ran.
   Tapping PLAY or RETRY should fly as well as start the run - that is the
   behaviour we want anyway. */
function onBtn(e){
  const t = e.target;
  return !!(t && t.closest && t.closest('#mute'));
}
function downFrom(e){
  game.rawDown = (game.rawDown||0) + 1;
  if(onBtn(e)) { game.lastEv = 'btn'; return; }
  pressJump();
  try{ audioInit(); }catch(err){}
}
const CAP = {passive:true, capture:true};
const ACT = {passive:false, capture:true};      // active: may preventDefault
function touchDown(e){
  game.lastEv = 'start';
  const btn = e.target && e.target.closest ? e.target.closest('button') : null;
  // Keeping the touch alive is the whole point: without preventDefault the
  // browser's long-press handling ends it and sends touchend by itself.
  // Buttons are left alone so their click still works.
  if(!btn && e.cancelable) e.preventDefault();
  if(btn && btn.id === 'mute') return;
  downFrom(e);
}
function bindDown(el){
  if(!el) return;
  el.addEventListener('touchstart', touchDown, ACT);
  if(!TOUCH){
    el.addEventListener('pointerdown', e=>{ game.lastEv='pdown'; downFrom(e); }, CAP);
    el.addEventListener('mousedown',  e=>{ game.lastEv='mdown'; downFrom(e); }, CAP);
  }
}
bindDown(window); bindDown(cv);

/* touchmove only keeps the gesture alive; it must never start or stop thrust */
window.addEventListener('touchmove', e=>{ if(e.cancelable) e.preventDefault(); }, ACT);

if(TOUCH){
  /* On a touch device ONLY touch events may stop thrust. blur, mouseleave and
     the pointer family all fire spuriously on phones - a blur listener alone
     killed every hold once already. Keep this branch minimal. */
  window.addEventListener('touchend', e=>{
    game.lastEv='end';
    if(!e.touches || e.touches.length === 0) thrustOff();
  }, CAP);
  window.addEventListener('touchcancel', e=>{
    game.lastEv='cancel';
    if(!e.touches || e.touches.length === 0) thrustOff();
  }, CAP);
} else {
  window.addEventListener('pointerup',    ()=>{ game.lastEv='pup';  thrustOff(); }, CAP);
  window.addEventListener('pointercancel',()=>{ game.lastEv='pcan'; thrustOff(); }, CAP);
  window.addEventListener('mouseup',      ()=>{ game.lastEv='mup';  thrustOff(); }, CAP);
  window.addEventListener('mouseleave',   ()=>{ game.lastEv='mlv';  thrustOff(); }, CAP);
  document.documentElement.addEventListener('mouseleave', ()=>{ game.lastEv='mlv'; thrustOff(); }, CAP);
  window.addEventListener('blur', ()=>{ game.lastEv='blur'; thrustOff(); });
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) thrustOff(); });

window.addEventListener('keydown', e => {
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){
    e.preventDefault(); audioInit(); if(!e.repeat) pressJump();
  }
});
window.addEventListener('keyup', e => {
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') releaseJump();
});
document.addEventListener('contextmenu', e=> e.preventDefault());
/* The buttons go through the escape, exactly like a tap anywhere does. They
   used to call startRun() and drop you straight into a run with the cell still
   around you -- so the one thing a player is most likely to press was the one
   thing that skipped the opening. A real press also fires pointerdown first,
   which has already started the intro by the time the click lands, hence the
   mode check rather than a second startIntro(). */
$('#play').addEventListener('click', ()=>{
  audioInit(); S.click(); if(game.mode==='menu') startIntro(); });
$('#retry').addEventListener('click', ()=>{
  S.click(); if(game.mode!=='intro') startIntro(); });
$('#tomenu').addEventListener('click', ()=>{ S.click(); toMenu(); });
elMute.addEventListener('click', ()=>{
  audioInit(); A.on = !A.on;
  elMute.classList.toggle('muted', !A.on);
  if(A.started) A.master.gain.setTargetAtTime(A.on?0.9:0, A.ctx.currentTime, 0.05);
  if(!A.on){ if(TRACK) TRACK.pause(); if(MENU_TRACK) MENU_TRACK.pause(); }
});
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && A.ctx) A.ctx.suspend();
  else if(A.ctx) A.ctx.resume();
});

/* ============================================================
   FLOW
   ============================================================ */
function toMenu(){
  applyTheme();
  game.mode='menu'; game.obstacles.length=0; game.parts.length=0; game.pops.length=0;
  game.crows.length=0; game.crowT=1e9; game.crowN=0; game.crowWait=0;
  game.cageX = -CAGE_RUNOUT;             // parked so the escape ends on the play mark
  game.door=null; game.doorGone=false; game.lockGone=false; game.doorBow=0;
  player.state='idle'; player.stateT=0; player.beat=''; player.beatT=1.2;
  player.y=0; player.vy=0; player.onGround=true;
  rag.alive=false;
  elMenu.classList.add('show'); elOver.classList.remove('show');
  elHud.classList.remove('on'); elTut.classList.remove('show');
  if(A.started) musicScene('menu');       // silent until the first gesture
}
function startRun(){
  game.runCount = (game.runCount||0) + 1;
  applyTheme();
  game.mode='play'; game.runT=game.presetRunT||0; game.score=0;
  game.dist=(game.presetDist||0)*10;           // ?dist=N starts the odometer there
  game.near=0; game.combo=0; game.comboBest=0; game.comboT=0;
  game.speed=340*PACE; game.diff=0; game.spawnT=2.6; game.cornT=0;
  game.obstacles.length=0; game.parts.length=0; game.pops.length=0; game.ui.length=0;
  game.eggs.length=0; game.eggT=1.6; game.runEggs=0; game.eggStreak=0;
  game.ride=game.forceRide?RIDE_TIME:0; game.rideGrace=0; game.drop=null;
  game.dropT=game.forceRide?1e9:rnd(9, 14);
  game.crows.length=0; game.crowT=5*CROW_GAP; game.crowN=0; game.crowWait=0;
  game.freeze=0; game.timeScale=1; game.tsTarget=1; game.shake=0; game.zoom=1; game.zoomT=1;
  game.camY=0; game.camYT=0; game.deadT=0; game.newBest=false;
  game.door=null; game.doorGone=false; game.lockGone=false; game.doorBow=0;
  game.cageX = -CAGE_RUNOUT;             // the barn stays put and the world leaves it
  player.x=0; player.y=0; player.vy=0; player.onGround=true; player.phase=0;
  player.flapT=0; player.flapBeat=-1; player.flapLag=0;
  player.thrusting=false;                                   // never start a run mid-thrust
  player.state='run'; player.stateT=0; player.landT=0; player.stumbleT=0;
  player.near=0; player.nearT=0; player.nearCool=0;
  player.beat=''; player.beatT=0;
  cam.x = -PX;
  rag.alive=false;
  elMenu.classList.remove('show'); elOver.classList.remove('show');
  elHud.classList.add('on');
  elCard.classList.remove('best');
  if(game.demo){ player.y = 430; player.onGround=false; player.state='fly';
    player.thrusting=true; player.flapT = (game.demoFlap!==undefined?game.demoFlap:0.2); }
  game.tut = game.firstRun;
  elTut.classList.toggle('show', game.tut);
  musicScene('menu');            // the escape still plays over the menu theme
}
/* One pickup at a time, floating where a hazard is not. It is placed by the
   same rule the eggs are -- `eggFree` already answers "is this bit of sky
   safe" -- because a reward you cannot reach without dying is a punishment. */
function spawnBasketDrop(){
  const band = GROUND - CEIL;
  const x = player.x + game.speed*Math.max(1.9, (VW - PX + 260)/game.speed + 0.3);
  for(let tryN = 0; tryN < 20; tryN++){
    const y = rnd(band*0.30, band*0.78);
    if(eggFree(x, y)){ game.drop = { x, y, t:0 }; return true; }
  }
  return false;
}
function startRide(){
  game.ride = RIDE_TIME; game.rideGrace = 0;
  game.drop = null;
  player.vy = Math.min(player.vy, -60);        // a little lift as he climbs in
  S.egg && S.egg();
  pop(player.x, GROUND - player.y - 210, 'BASKET!', C.gold, 56, -70);
  spark(player.x, GROUND - player.y - 120, 16,
        {col:C.gold, s0:120,s1:380, l0:0.3,l1:0.7, r0:3,r1:9});
}
/* Losing it is not dying. The balloons go, the basket drops away behind him,
   and for RIDE_GRACE seconds nothing can touch him -- without that he is
   solid again inside the same gap that just took the basket. */
function loseRide(o){
  game.ride = 0; game.rideGrace = RIDE_GRACE;
  addShake(16); game.flash = 0.35; S.hit();
  const gy = GROUND - player.y;
  featherBurst(player.x, gy - 120, 8, 240);
  spark(player.x, gy - 150, 20, {col:C.coral, s0:200,s1:520, l0:0.3,l1:0.8, r0:4,r1:10});
  pop(player.x, gy - 230, 'POP!', C.coral, 48, -60);
  if(o){ o.hitBy = true; o.spin = rnd(-5,5); o.vy = -320; }
}
function updateRide(dt){
  game.rideGrace = Math.max(0, (game.rideGrace||0) - dt);
  if(riding()){
    game.ride -= dt;
    if(game.ride <= 0){ game.ride = 0; game.rideGrace = RIDE_GRACE*0.6;
      pop(player.x, GROUND - player.y - 230, 'POP!', C.coral, 44, -60);
      featherBurst(player.x, GROUND - player.y - 120, 6, 200); }
    return;
  }
  // not riding: count down to the next one, and float the pickup along
  if(game.drop){
    const d = game.drop;
    d.t += dt;
    if(d.x < player.x - 260) game.drop = null;
    else {
      const dy = (GROUND - player.y - 90) - (GROUND - d.y);
      if(Math.abs(d.x - player.x) < 90 && Math.abs(dy) < 130) startRide();
    }
    return;
  }
  game.dropT = (game.dropT||0) - dt;
  if(game.dropT <= 0 && game.runT > 6){
    game.dropT = rnd(RIDE_EVERY[0], RIDE_EVERY[1]);
    spawnBasketDrop();
  }
}
function drawBasket(){
  const g = basketGeom();
  const x = player.x - cam.x, y = GROUND - player.y;
  if(BALLOONS.ready){
    const sway = Math.sin(game.t*1.7)*0.06 + clamp(player.vy/2600, -0.18, 0.18);
    ctx.save();
    ctx.translate(x, y - g.lift);
    ctx.rotate(sway);
    ctx.drawImage(BALLOONS.img, -g.lw*0.5, -g.lh, g.lw, g.lh);
    ctx.restore();
  }
  if(BASKET.ready) ctx.drawImage(BASKET.img, x - g.bw*0.5, y - g.bh*0.72, g.bw, g.bh);
}
/* The pickup itself: the basket, small, bobbing, with the glow the eggs use so
   it reads as something to go and get rather than something to avoid. */
function drawBasketDrop(){
  const d = game.drop; if(!d || !BASKET.ready) return;
  const sx = d.x - cam.x;
  if(sx < -200 || sx > VW + 200) return;
  const w = GROUND*0.15, h = w*(952/980);
  const yy = GROUND - d.y + Math.sin(game.t*2.6)*7;
  ctx.save();
  ctx.globalAlpha = 0.30;
  ctx.fillStyle = C.gold;
  ctx.beginPath(); ctx.ellipse(sx, yy - h*0.3, w*0.7, h*0.55, 0, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.drawImage(BASKET.img, sx - w*0.5, yy - h*0.72, w, h);
}
function die(o){
  if(game.mode!=='play') return;
  elTut.classList.remove('show');   // the prompt has no business over the score card
  game.mode='dying'; game.dyingT=0;
  game.freeze = 0.11; addShake(30); game.flash=0.75;
  slowmo(0.32, 0.55);
  S.hit();
  if(o && o.spec && o.spec.elec){ S.zap(); game.flash = 1; }
  if(o && o.crow) S.crowhit();         // feathers and a beak, not wood
  if(navigator.vibrate) try{ navigator.vibrate([26,40,60]); }catch(e){}
  const gy = GROUND;
  spark(player.x, gy - player.y - 90, 26, {col:C.gold, s0:180,s1:620, l0:0.4,l1:0.9, r0:4,r1:11});
  spark(player.x, gy - player.y - 90, 14, {col:C.coral, s0:120,s1:420, l0:0.4,l1:0.8, r0:5,r1:13});
  pop(player.x, gy - player.y - 200, pick(['BAWK!','OOF!','YIKES!','NOPE!']), C.danger, 54, -70);
  // hand off to the ragdoll
  featherBurst(player.x, gy - player.y - 60, 26, 460);
  layEgg(player.x - 30, gy - player.y - 40, -240);          // hit hard enough to lay an egg
  const lifted = 300 + Math.random()*180;
  rag.build(player.pose, player.x, gy - player.y, -430 - Math.random()*220, -lifted, rnd(-10,10));
  if(o){ o.hitBy = true; o.spin = rnd(-6,6); o.vy = -420; }
  musicScene('duck');
}
function finish(){
  game.mode='dead'; game.deadT=0;
  game.newBest = game.score > game.best;
  if(game.newBest){
    game.best = Math.floor(game.score);
    try{ localStorage.setItem(BEST_KEY, String(game.best)); }catch(e){}
  }
  try{ localStorage.setItem('dgh.played','1'); }catch(e){}
  game.firstRun=false;
  elFinal.textContent = pad6(game.score);
  elFinalBest.textContent = 'BEST '+pad6(game.best);
  elNear.textContent = game.near;
  elCmb.textContent = 'x'+Math.max(1,game.comboBest);
  elDist.textContent = Math.floor(game.dist/10)+'m';
  elCard.classList.toggle('best', game.newBest);
  elOver.classList.add('show');
  elHud.classList.remove('on');
  if(game.newBest){ S.best(); confettiBurst(); }
  musicScene('menu');            // the score card gets the menu theme back
}
function confettiBurst(){
  const cols=[C.gold,C.mint,C.coral,C.cream,'#6BD1FF'];
  for(let i=0;i<70;i++){
    game.ui.push({ x:rnd(0,VW), y:rnd(-VH*0.3,VH*0.1), vx:rnd(-90,90), vy:rnd(60,240),
      r:rnd(5,11), col:pick(cols), rot:rnd(0,TAU), vr:rnd(-8,8), t:0, life:rnd(2.2,3.6) });
  }
}

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt, rawDt){
  game.t += rawDt;
  // slow-mo easing
  if(game.smT>0){ game.smT-=rawDt; if(game.smT<=0) game.tsTarget=1; }
  game.timeScale = damp(game.timeScale, game.tsTarget, 12, rawDt);

  game.shake = Math.max(0, game.shake - game.shake*6*rawDt - 12*rawDt);
  const sh = game.shake;
  cam.shakeX = (Math.random()*2-1)*sh; cam.shakeY = (Math.random()*2-1)*sh;
  game.flash = Math.max(0, game.flash - rawDt*3.2);
  elFlash.style.opacity = (game.flash*0.55).toFixed(3);

  if(game.mode==='menu')       updateMenu(dt);
  else if(game.mode==='intro') updateIntro(dt);
  else if(game.mode==='play')  updatePlay(dt);
  else if(game.mode==='dying') updateDying(dt);
  else if(game.mode==='dead')  updateDead(dt, rawDt);
  if(game.mode !== 'play') windSet(0, 300);   // no run, no air
  if(game.door) updateDoor(dt);        // outside the chain: it flies on into play
  updateCrows(dt);                     // same: a crow already launched keeps coming

  updateParticles(dt);
  musicTick(); trackTick(rawDt);
}

/* The escape. It waits on the menu for the first press, then runs 1.52s and
   hands straight over to a normal run -- no cinematic, no pause, and he is
   already moving when control returns. Deadpan the whole way through: the joke
   is that breaking out of prison is not worth reacting to. */
function cagePose(){
  const g = cageGeom();
  const floor = cageFloor();                    // the straw is above the dirt outside
  const standX = g.x + ((g.dx0+g.dx1)*0.5)*g.w; // dead centre of the doorway
  const t = game.introT;
  // Waiting. He is visible through the bars from the moment the menu appears —
  // that is the whole hook, so the menu is laid out to leave this half clear.
  if(game.mode === 'menu' || t < T_WIND) return { set:'kick', i:0, x:standX, y:floor };
  if(t < T_KICK){                               // coils, rocking back into it
    const k = (t-T_WIND)/(T_KICK-T_WIND);
    return { set:'kick', i:1, x:standX - 30*Math.sin(k*Math.PI*0.9), y:floor };
  }
  if(t < T_BURST){                              // THE KICK, straight through it
    const k = (t-T_KICK)/(T_BURST-T_KICK);
    return { set:'kick', i:2, x:standX + CAGE_RUNOUT*0.55*k, y:floor + k*30 };
  }
  const k = (t-T_BURST)/(T_OUT-T_BURST);        // out, still airborne, then down
  return { set:'kick', i:3, x:standX + CAGE_RUNOUT*(0.55 + 0.45*k),
           y: (floor + 30) * (1 - k*k) };         // and back onto the road
}
/* Where the pose leaves him, in world units. Read by the handover so the run
   picks him up from exactly there. */
function cageExitX(){
  return game.cageX + CAGE_RUNOUT;
}
function startIntro(){
  startRun();
  elHud.classList.remove('on');
  elTut.classList.remove('show');
  game.mode = 'intro';
  game.introT = 0;
  /* The poster goes on the press, over about a third of a second, so the cell
     is uncovered well before he swings off the bunk at T_UP. It used to hang
     around until the kick, which is fine for a word of text sitting over the
     scene and hopeless for a full-screen picture covering it. */
  game.titleT = (POSTER_TITLE && TITLE.ready) ? -0.001 : 1;
  game.rattleT = 0;
  game.stepT = 0;
  game.doorBow = 0;
  game.boomT = undefined;
  game.introHeld = false;
  game.cheerT = undefined; game.cheerN = 0;
  cam.x = camIntroX();
  player.kickT = 0;
}
function updateIntro(dt){
  /* ?introt=N holds the intro at a moment. It used to assign introT directly,
     which meant `was` and `t` were equal and every one-shot -- the kick, the
     door, the blast -- was skipped: the flag could show the poses and nothing
     that actually happens. It now takes ONE step of the whole remaining time,
     firing each edge on the way, and holds after that. */
  if(game.holdIntro !== undefined){
    if(game.introHeld) dt = 0;
    else { dt = Math.max(0, game.holdIntro - game.introT); game.introHeld = true; }
  }
  if(game.introSlow) dt /= game.introSlow;
  const was = game.introT;
  game.introT += dt;
  const t = game.introT;
  if(game.boomT !== undefined && game.boomT < BOOM_T)
    game.boomT += (game.rawDt||dt) / (game.introSlow||1);

  if(was < T_WIND && t >= T_WIND) S.cluck();            // he clocks the door
  if(t > T_WIND && t < T_KICK){                         // winds up against the bars
    game.rattleT -= dt;
    if(game.rattleT <= 0){ game.rattleT = 0.10; S.cagerattle(); }
  }
  if(game.cheerT !== undefined && game.cheerT > 0){     // three clucks, staggered
    game.cheerT -= dt;
    if(game.cheerT <= 0){
      S.cluck();
      game.cheerN = (game.cheerN||0) + 1;
      if(game.cheerN < 3) game.cheerT = 0.17;
    }
  }
  // The camera rides out with him: pulled back on the cage until the kick,
  // then eased onto the play mark, so the last frame of the escape and the
  // first frame of the run are the same pixel.
  const pk = clamp((t - T_KICK)/(T_OUT - T_KICK), 0, 1);
  cam.x = -(PX + CAGE_CAM*(1 - pk*pk*(3-2*pk)));
  // the iron gives just before it goes
  game.doorBow = (t > T_KICK-0.15 && t < T_KICK) ? (t-(T_KICK-0.15))/0.15 : 0;
  // he compresses into the last stride, then snaps out through the door
  const q = player.pose;
  if(game.doorBow > 0){ q.sx = 1 - game.doorBow*0.13; q.sy = 1 + game.doorBow*0.15; }
  else { q.sx = damp(q.sx, 1, 9, dt); q.sy = damp(q.sy, 1, 9, dt); }

  if(was < T_KICK && t >= T_KICK){                       // THE KICK
    S.doorbreak();
    breakCage(game.cageX - cam.x);
    game.boomT = 0;                                     // and the blast over the doorway
    game.doorBow = 0;
    addShake(46); game.flash = 0.95; game.freeze = 0.13;
    slowmo(0.34, 0.34);
    if(navigator.vibrate) try{ navigator.vibrate([40,30,70]); }catch(e){}
    featherBurst(cam.x + game.cageX, GROUND-cageGeom().h*0.34, 14, 420);
    game.cheerT = 0.12;                                  // the roof joins in
    game.titleT = -1;                                    // and the title goes with it
    player.pose.sx = 1.38; player.pose.sy = 0.72;        // stretched through the doorway
  }
  if(was < T_OUT && t >= T_OUT){                         // straight into the run
    elHud.classList.add('on');
    elEggCount.textContent = game.eggBank;
    musicScene('play');            // through the door, and the chase starts
    if(game.tut) elTut.classList.add('show');
    player.x = cageExitX();          // exactly where the last pose left him
    player.y = 0; player.vy = 0; player.onGround = true;
    player.kickT = 0.14;
    player.thrusting = inputDown;                        // still holding? then fly
    game.mode = 'play';
  }
}
/* the door keeps tumbling long after control is handed back */
function updateDoor(dt){
  const d = game.door; if(!d) return;
  d.vy += 2600*dt;
  d.x += d.vx*dt; d.y += d.vy*dt; d.rot += d.vr*dt;
  d.vx *= Math.pow(0.72, dt);
  if(d.y > 260){ game.door = null; game.doorGone = true; }
}

/* --- menu: he idles with personality beats --- */
function updateMenu(dt){
  const p = player;
  p.stateT += dt;
  p.beatT -= dt;
  if(p.beatT<=0){
    p.beat = pick(['','','peck','strut','peck']);
    p.beatT = p.beat==='' ? rnd(1.4,2.4) : rnd(1.5,2.2);
    p.beatStart = p.stateT;
    if(p.beat==='strut') S.cluck();
  }
  const target = newPose();
  const bt = p.stateT - (p.beatStart||0);
  if(p.beat==='peck'){
    posePeck(clamp(bt/0.7,0,1), target);
    if(bt>0.30 && bt<0.36) spark(player.x-10, GROUND, 3,
      {col:'rgba(255,242,222,.5)', a0:Math.PI,a1:TAU, s0:40,s1:130, l0:0.2,l1:0.45, r0:2,r1:5, g:500});
  }
  else if(p.beat==='strut') poseStrut(p.stateT, clamp(bt/1.4,0,1), target);
  else poseIdle(p.stateT, target);
  blendPose(p.pose, target, dt, 14);
  springUpdate(dt, 0, 0);
  cam.x = damp(cam.x, camIntroX(), 6, dt);   // framed on the cage, not the road
  game.camY = damp(game.camY, -40, 6, dt);
  game.zoom = damp(game.zoom, 1, 6, dt);
}

function updateBlink(p, dt){
  p.blinkT -= dt;
  if(p.blinkT<=0){ p.blinkT = rnd(1.8,5.2); p.blinkPhase = 0.14; }
  if(p.blinkPhase>0){ p.blinkPhase -= dt; p.blink = Math.sin((1-p.blinkPhase/0.14)*Math.PI); }
  else p.blink = 0;
  p.face.blink = p.blink;
}

/* --- the run --- */
function updatePlay(dt){
  const p = player;
  game.runT += dt;
  game.diff = clamp(game.runT/95, 0, 1);
  game.speed = (340 + 400*game.diff)*PACE;
  const speedT = game.diff;

  p.x += game.speed*dt;
  game.dist += game.speed*dt;
  const before = game.score;
  game.score += dt*game.speed*0.25;
  if(Math.floor(game.score/50) !== Math.floor(before/50)) S.tick();

  if(game.demoRun!==undefined){                    // freeze one frame of the run cycle
    p.onGround=true; p.y=0; p.vy=0; p.state='run'; p.thrusting=false;
    p.phase=game.demoRun; buildPlayerPose(dt,speedT); return;
  }
  // ---- flight ----
  p.powerT = Math.max(0, (p.powerT||0) - dt*3.2);
  if(game.demo){
    p.thrusting = game.holdOff ? false : (game.demoFlap!==undefined ? true : Math.sin(game.runT*2.3) > -0.15);
    if(game.demoFlap!==undefined) p.flapT = game.demoFlap;
  }
  p.nearCool = Math.max(0, p.nearCool-dt);
  p.kickT = Math.max(0, (p.kickT||0)-dt);
  const ceilH = GROUND - CEIL;                       // usable altitude, in world units

  /* THE movement model. Gravity always pulls; holding adds constant upward
     thrust; releasing removes it that same frame. Drag makes velocity ease
     toward a terminal speed instead of ramping forever, which is what gives
     smooth acceleration and deceleration without any impulse. */
  /* The same three lines run the basket; only the constants change. A second
     movement model would be a second thing to keep in step with this one. */
  const rG = riding() ? RIDE_G : 1, rT = riding() ? RIDE_T : 1, rD = riding() ? RIDE_D : 1;
  /* Solved, not stepped.

     `dv/dt = a - k*v` is the whole movement model, and it has a closed form:
     the velocity eases toward a/k on an exponential. Integrating it as
     `v -= v*k*dt` is the Euler approximation of that exponential, and its
     error grows with the step -- so the same half-second hold reached a
     different altitude on a 60Hz phone than on a 144Hz one. Measured before
     this change: 4.13% spread across 60/90/120/144Hz, about 28 units of
     altitude, against corridors that are 330 wide. Nobody reports that as a
     bug; they just say the game feels wrong on their device.

     The closed form has no step error at all, so every refresh rate lands on
     the same number, and the position integral is exact for the same reason
     -- moving by `v*dt` after solving for v would put the step error straight
     back into y. Two exp() calls a frame and no accumulator, which keeps the
     one loop this game has. */
  const acc = GRAV*rG - (p.thrusting ? THRUST*rT : 0);
  const k   = DRAG*rD;
  const vT  = acc/k;                                 // terminal speed, this input
  const e   = Math.exp(-k*dt);
  const v0  = p.vy;
  p.vy = clamp(vT + (v0 - vT)*e, VY_UP, VY_DOWN);    // rails are a safety net only
  p.y -= vT*dt + (v0 - vT)*(1 - e)/k;                // exact ∫v dt over the step

  if(p.thrusting){                                   // wingbeat is animation only
    p.flapT += dt*FLAP_HZ;
    const beat = Math.floor(p.flapT);
    if(beat !== p.flapBeat){
      p.flapBeat = beat;
      S.flap();
      if(!p.onGround) featherBurst(p.x-30, GROUND-p.y-40, 1, 90);
      spark(p.x-34, GROUND-p.y-30, 3, {col:'rgba(255,242,222,.5)', a0:Math.PI*0.85,a1:Math.PI*1.25,
        s0:70,s1:190, l0:0.18,l1:0.45, r0:3,r1:7, g:120});
    }
  } else {
    p.flapT += dt*1.4;                               // wings glide, barely moving
    /* ...but it is not silent. A long drop used to be a hole in the mix
       between one wingbeat and the next; this fills it with the sound of the
       wings being OUT, on a cooldown so it never stacks. */
    p.glideT = (p.glideT||0) - dt;
    if(!p.onGround && p.vy < -60 && p.glideT <= 0){ S.glide(); p.glideT = 0.42; }
  }

  if(p.y >= ceilH){ p.y = ceilH; if(p.vy<0){ p.vy *= -0.25; addShake(3);
    S.ceiling(); featherBurst(p.x, GROUND-p.y+10, 3, 150); } }

  if(p.y <= 0){
    const impact = p.vy;
    p.y = 0; p.vy = 0;
    if(!p.onGround){
      p.onGround = true; p.state='land'; p.stateT=0;
      p.landT = clamp(impact/(1200*PACE), 0.35, 1);
      S.land(); addShake(clamp(impact/(220*PACE), 2, 9)); game.camYT = 14;
      // and at speed he does not just land, he runs it off
      if(impact > 420*PACE) S.scuff(clamp(impact/(1400*PACE), 0, 1));
      spark(p.x-6, GROUND, 14, {col:'rgba(255,242,222,.7)', a0:Math.PI*1.05,a1:Math.PI*1.95, s0:110,s1:330, l0:0.22,l1:0.55, r0:3,r1:9, g:520});
      if(impact>700*PACE) featherBurst(p.x, GROUND-24, 3, 190);
    }
  } else if(p.y > 2){
    if(p.onGround){ p.onGround=false; p.state='fly'; p.stateT=0; S.takeoff(); }
  }
  if(p.onGround){
    if(p.state!=='land') p.state='run';
  } else if(p.state!=='fly'){ p.state='fly'; }

  // ---- run cycle phase & footsteps ----
  if(p.onGround){
    const strideLen = lerp(300, 420, speedT);
    const prev = p.phase;
    p.phase += game.speed*dt/strideLen;
    const a = prev - Math.floor(prev), b = p.phase - Math.floor(p.phase);
    const crossed = (x)=> (a < x && (b > x || b < a));
    if(crossed(0.0) || crossed(0.5)){
      S.step(speedT);
      spark(p.x-24, GROUND, 3, {col:'rgba(255,242,222,.45)', a0:Math.PI*1.1,a1:Math.PI*1.85, s0:50,s1:150, l0:0.18,l1:0.4, r0:2,r1:5, g:420});
    }
  }

  updateRide(dt);
  updateEggs(dt);

  // ---- spawn ----
  game.spawnT -= dt;
  game.cornT = Math.max(0, (game.cornT||0) - dt);
  if(game.spawnT<=0) spawnPattern();

  // ---- obstacles ----
  /* The basket is a much bigger thing to fly through a gap than the bird, and
     pretending otherwise would let it clip through wires it visibly touches. */
  const bg = basketGeom();
  const pl = p.x - (riding() ? bg.bw*0.42 : 48), pr = p.x + (riding() ? bg.bw*0.42 : 48);
  const pb = p.y + (riding() ? -bg.bh*0.12 : 8);
  /* Only the lower half of the balloons is solid. They are the tallest part of
     the rig and the least believable thing to lose it to -- clipping the top of
     a balloon on a wire you were never near reads as a bug, not a mistake. */
  const pt = p.y + (riding() ? bg.lift + bg.lh*0.45 : 150);
  for(let i=game.obstacles.length-1;i>=0;i--){
    const o = game.obstacles[i];
    // collision
    /* An electric piece is a bundle of wires, boxes and discs rather than one
       block, so it answers for itself; everything else is the block it looks
       like. The 8px the box is shrunk by is the same forgiveness the block
       test gives, applied once here so both families are equally generous. */
    const ow = o.spec.hw;
    const overlapX = pr > o.x-ow && pl < o.x+ow;
    if(overlapX && !o.hitBy && o.spec.hit(o, pl+8, pr-8, pb+8, pt-8)){
      if(game.rideGrace > 0){ /* just lost it; let him get clear */ }
      else if(riding()) loseRide(o);
      else die(o);
    }
    // near-miss tracking: the true distance to the nearest lethal part
    if(overlapX){
      const gap = o.spec.gapTo(o, pl+8, pr-8, pb+8, pt-8);
      if(gap>0) o.minGap = Math.min(o.minGap, gap);
    }
    if(!o.counted && o.x < p.x-30){
      o.counted = true;
      const thr = 66;
      if(o.minGap < thr && o.minGap > 0 && game.mode==='play') nearMiss(o);
    }
    if(o.x < cam.x - 420) game.obstacles.splice(i,1);
  }

  // ---- combo decay ----
  if(game.combo>0){
    game.comboT -= dt;
    if(game.comboT<=0){ game.combo=0; elCombo.classList.remove('on'); }
  }

  // ---- pose ----
  buildPlayerPose(dt, speedT);

  // ---- camera ----
  cam.x = damp(cam.x, p.x - PX, 14, dt);
  game.camYT = damp(game.camYT, clamp((p.y-240)*0.16, 0, 90), 5, dt);
  game.camY  = damp(game.camY, game.camYT, 9, dt);
  game.zoomT = 1 - speedT*0.045 - (p.nearT>0?0.03:0);
  game.zoom  = damp(game.zoom, game.zoomT, 7, dt);

  // speed lines when running fast
  if(speedT>0.35 && Math.random() < speedT*dt*32){
    game.parts.push({ x: cam.x+VW+40, y: GROUND - rnd(30, VH*0.55), vx:-game.speed*1.6, vy:0,
      life:0.45, t:0, r:rnd(20,70), col:'rgba(255,242,222,.24)', g:0, kind:'line', rot:0, vr:0, drag:1 });
  }
  /* The air. Level follows how fast the air is actually moving past him --
     the run's own speed on the ground, plus what he is doing vertically once
     he is off it -- and the cutoff rises with it, because fast air is thin and
     slow air is not. Pushed every frame rather than triggered, because this is
     the one sound in the game that is a state and not an event. */
  const air = clamp(speedT*0.5 + (p.onGround ? 0 : 0.25 + Math.abs(p.vy)/1100), 0, 1);
  windSet(0.004 + air*0.055, 260 + air*1500);

  // HUD
  elScore.textContent = pad6(game.score);
  if(game.dbg){
    const el=document.getElementById('selftest');
    if(el){ el.style.display='block';
      el.textContent =
        BUILD+'  held='+(p.thrusting?1:0)+'  taps='+(game.tapCount||0)+'  raw='+(game.rawDown||0)+
        '  ev='+(game.lastEv||'-')+'  touch='+(TOUCH?1:0)+String.fromCharCode(10)+
        'y='+Math.round(p.y)+'  vy='+Math.round(p.vy)+'  thrust='+(p.thrusting?1:0)+
        '  ground='+(p.onGround?1:0)+'  mode='+game.mode;
    }
  }
}

function nearMiss(o){
  const p = player;
  game.near++;
  game.combo++; game.comboT = 3.4;
  game.comboBest = Math.max(game.comboBest, game.combo);
  const bonus = 60*game.combo;
  game.score += bonus;
  S.near(); if(game.combo>1) S.combo(game.combo);
  addShake(4); slowmo(0.42, 0.13);
  const y = GROUND - p.y - 150;
  pop(p.x+40, y, (game.combo>1? 'x'+game.combo+' ' : '')+pick(['PHEW!','CLOSE!','NICE!','WOW!']), C.mint, 34, -150);
  pop(p.x+40, y+46, '+'+bonus, C.gold, 24, -110);
  spark(o.x, GROUND - (p.y+70), 10,
    {col:C.mint, s0:80,s1:300, l0:0.25,l1:0.6, r0:3,r1:8, g:200});
  elScore.classList.remove('pop'); void elScore.offsetWidth; elScore.classList.add('pop');
  if(game.combo>1){ elComboTxt.textContent='x'+game.combo; elCombo.classList.add('on');
    elCombo.style.transform='translateX(-50%) scale(1.25)';
    setTimeout(()=>{ elCombo.style.transform='translateX(-50%) scale(1)'; },90); }
  // SIGNATURE: snap a look back at what nearly got him
  if(p.nearCool<=0){ p.nearT = 0.52; p.nearCool = 0.62; }
}

/* build the player's target pose from the state machine */
function buildPlayerPose(dt, speedT){
  const p = player;
  p.stateT += dt;
  const target = newPose();

  if(game.demoPose){                                 // freeze any single state for review
    const k = game.demoPoseK, t = game.t;
    const P = game.demoPose;
    if(P==='idle')       poseIdle(t, target);
    else if(P==='peck')  posePeck(k, target);
    else if(P==='strut') poseStrut(t, k, target);
    else if(P==='glide') poseGlide(t, 1200*k, target);
    else if(P==='land')  poseLand(k, target);
    else if(P==='hurt')  poseHurt(k, target);
    else if(P==='sit')   poseSit(k, t, target);
    else if(P==='cheer') poseCheer(t, target);
    else                 poseIdle(t, target);
    for(let i=0;i<POSE_KEYS.length;i++) p.pose[POSE_KEYS[i]] = target[POSE_KEYS[i]];
    return;
  }

  if(p.state==='run'){
    poseRun(p.phase, speedT, target);
  } else if(p.state==='land'){
    const k = clamp(1 - p.stateT/0.22, 0, 1) * p.landT;
    poseLand(k, target);
    if(p.stateT>0.24 && p.onGround) p.state='run';
  } else {
    if(p.thrusting){
      poseFly(p.flapT, p.powerT||0, p.vy, target);
    } else {
      poseGlide(game.t, p.vy, target);
    }
  }

  // near miss: he flinches away from it and pops a shock mark, then carries on
  if(p.nearT>0){
    p.nearT -= dt;
    const u = 1 - p.nearT/0.50;
    const k = u<0.24 ? easeOutBack(u/0.24) : 1 - easeOutCubic((u-0.24)/0.76);
    target.headR  += -0.55*k;
    target.headDX += -11*k;
    target.headDY += -4*k;
    target.rot    += -0.13*k;
    target.sx *= 1+0.08*k; target.sy *= 1-0.06*k;
    target.shockT = clamp(k,0,1);
  }

  if(game.demoFlap!==undefined || game.demoRun!==undefined){   // inspection: show the exact key
    for(let i=0;i<POSE_KEYS.length;i++) p.pose[POSE_KEYS[i]] = target[POSE_KEYS[i]];
  } else blendPose(p.pose, target, dt, p.state==='run' ? 46 : 38);
  p.pose.shockT = target.shockT;                     // the pop must not be smoothed away
  springUpdate(dt, 0, -p.vy*0.02);
}

/* --- death: ragdoll, then he picks himself up --- */
function updateDying(dt){
  game.dyingT += dt;
  // world keeps sliding, then stops
  game.speed = damp(game.speed, 0, 2.4, dt);
  player.x += game.speed*dt;
  for(const o of game.obstacles){
    o.x += (o.vx||0)*dt;
    if(o.hitBy){ o.vy += 2200*dt; o.y = (o.y||0) - o.vy*dt; o.rot=(o.rot||0)+(o.spin||0)*dt;
      if(o.y<0){ o.y=0; o.vy*=-0.4; if(Math.abs(o.vy)<80) o.vy=0; } }
  }
  rag.step(dt, GROUND);
  if(game.dyingT<0.35 && Math.random()<dt*14) featherBurst(rag.x, rag.y, 1, 150);

  cam.x = damp(cam.x, rag.x - VW*0.42, 4, dt);
  game.camY = damp(game.camY, -20, 3, dt);
  game.zoom = damp(game.zoom, 1.06, 2.4, dt);

  if(game.dyingT>0.95 && (rag.energy||0) < 40){ startRecovery(); }
  else if(game.dyingT>2.2) startRecovery();
}
function startRecovery(){
  game.mode='dead'; game.deadT=0; game.recover=0;
  player.recX = rag.x;
  player.state = 'sit';
  finish();
}
function updateDead(dt, rawDt){
  game.deadT += rawDt;
  game.speed = damp(game.speed, 0, 3, dt);
  game.recover = Math.min(1, (game.recover||0) + dt*2.4);
  const p = player;
  const target = newPose();
  if(game.newBest && game.deadT>0.8) poseCheer(game.t, target);
  else poseSit(clamp(game.deadT*1.6,0,1), game.t, target);
  blendPose(p.pose, target, dt, 10);
  springUpdate(dt,0,0);
  cam.x = damp(cam.x, player.recX - VW*0.5, 3.2, dt);
  game.camY = damp(game.camY, 0, 3, dt);
  game.zoom = damp(game.zoom, 1.0, 3, dt);
  // confetti
  for(let i=game.ui.length-1;i>=0;i--){
    const c=game.ui[i]; c.t+=rawDt;
    c.x+=c.vx*rawDt; c.y+=c.vy*rawDt; c.vy+=420*rawDt; c.rot+=c.vr*rawDt;
    if(c.t>c.life) game.ui.splice(i,1);
  }
}

function updateParticles(dt){
  for(let i=game.parts.length-1;i>=0;i--){
    const q=game.parts[i]; q.t+=dt;
    if(q.t>=q.life){ game.parts.splice(i,1); continue; }
    q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=q.g*dt; q.rot+=q.vr*dt;
    q.vx*=Math.pow(q.drag,dt*60); q.vy*=Math.pow(q.drag,dt*60);
    if(q.kind==='feather'){
      q.vx += Math.sin(q.t*3.4+q.sway)*46*dt;          // feathers wander on the way down
      q.vy = Math.min(q.vy, 120);
      q.rot += Math.sin(q.t*3.4+q.sway)*1.6*dt;
    } else if(q.kind==='egg' && q.y>GROUND){
      q.y=GROUND; q.vy*=-0.42; q.vx*=0.66; q.vr*=0.5;
      if(Math.abs(q.vy)<70){ q.vy=0; q.vr=0; }
    }
  }
  for(let i=game.pops.length-1;i>=0;i--){
    const q=game.pops[i]; q.t+=dt;
    if(q.t>=q.life){ game.pops.splice(i,1); continue; }
    q.y += q.vy*dt; q.vy *= Math.pow(0.9,dt*60);
  }
}

/* ============================================================
   RENDER
   ============================================================ */
/* The painted clouds, cut out of the panel art. Every one is optional: a
   missing image falls back to the old drawn blob rather than a hole. */
const SKY_CLOUDS = [{f:'cloud0.webp',w:210,h:94},{f:'cloud1.webp',w:178,h:89},{f:'cloud2.webp',w:184,h:78},{f:'cloud3.webp',w:141,h:65},{f:'cloud4.webp',w:125,h:66}];
const CLOUD_IMG = {};
SKY_CLOUDS.forEach(d => { const im = new Image(); im.src = 'art/' + d.f; CLOUD_IMG[d.f] = im; });
function drawSky(){
  const T = THEME;
  const top = Math.max(0, GROUND - 1150);
  const skyH = GROUND + 40;
  // sky band and sun: two gradients that never change -> one cached blit
  ctx.drawImage(surface('sky|'+T.id+'|'+Math.round(GROUND), VW, skyH, true, (g) => {
    g.fillStyle=T.skyA; g.fillRect(0,0,VW,top+2);
    const gd = g.createLinearGradient(0,top,0,GROUND+40);
    gd.addColorStop(0, T.skyA); gd.addColorStop(0.30, T.skyB);
    gd.addColorStop(0.56, T.skyC); gd.addColorStop(0.80, T.skyD); gd.addColorStop(1, T.skyE);
    g.fillStyle=gd; g.fillRect(0,top,VW,GROUND+40-top);
    // sun, sinking behind the skyline
    // A low sinking sun suits the city. On the farm the same disc reads as a
    // moon hanging in a bright blue midday sky, so the theme scales it down.
    const R = 96*(T.sunR||1), sx = VW*0.76, sy = GROUND - 500;
    const gr = g.createRadialGradient(sx,sy,10,sx,sy,420);
    const gl = T.sunGlow===undefined ? 1 : T.sunGlow;
    gr.addColorStop(0,'rgba(255,233,168,'+(0.8*gl)+')');
    gr.addColorStop(0.32,'rgba(255,180,71,'+(0.30*gl)+')');
    gr.addColorStop(1,'rgba(255,180,71,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(sx,sy,420,0,TAU); g.fill();
    g.beginPath(); g.arc(sx,sy,R,0,TAU); g.fillStyle=T.sun; g.fill();
    g.globalAlpha=0.5; g.beginPath(); g.arc(sx,sy,R*1.25,0,TAU);
    g.strokeStyle='rgba(255,233,168,.5)'; g.lineWidth=3; g.stroke(); g.globalAlpha=1;
  }), 0, 0, VW, skyH);

  // Clouds. These are cut out of the panel art rather than drawn, because the
  // soft translucent blobs that used to be here sat next to cel-shaded painted
  // clouds looking like smudges on the lens.
  const t=game.t;
  for(let i=0;i<7;i++){
    const cx = ((hash(i*3.1)*VW*2.4) - (t*(6+hash(i)*10) + cam.x*0.04)) % (VW*1.9);
    const x = cx<0? cx+VW*1.9 : cx;
    const y = GROUND - 380 - hash(i*7.7)*VH*0.22;
    const s = 0.9+hash(i*2.2)*0.75;
    const d = SKY_CLOUDS[i % SKY_CLOUDS.length];
    const im = d && CLOUD_IMG[d.f];
    if(im && im.complete && im.naturalWidth){
      ctx.globalAlpha = 0.82+hash(i*5)*0.18;
      ctx.drawImage(im, x-d.w*s*0.5, y-d.h*s*0.5, d.w*s*1.7, d.h*s*1.7);
      ctx.globalAlpha = 1;
      continue;
    }
    ctx.globalAlpha = 0.20+hash(i*5)*0.16;
    ctx.fillStyle=C.cream;
    ctx.beginPath();
    ctx.ellipse(x, y, 90*s, 22*s, 0,0,TAU);
    ctx.ellipse(x+40*s, y-14*s, 56*s, 20*s, 0,0,TAU);
    ctx.ellipse(x-46*s, y-6*s, 44*s, 16*s, 0,0,TAU);
    ctx.fill(); ctx.globalAlpha=1;
  }
  // birds
  for(let i=0;i<3;i++){
    const x = ((hash(i*11)*VW*2) - (t*(34+i*11) + cam.x*0.05)) % (VW*1.6);
    const bx = x<0? x+VW*1.6 : x;
    const by = GROUND - 470 - hash(i*13)*160 + Math.sin(t*2+i)*8;
    ctx.strokeStyle='rgba(36,16,67,.42)'; ctx.lineWidth=3; ctx.lineCap='round';
    const f = Math.sin(t*7+i)*5;
    ctx.beginPath(); ctx.moveTo(bx-9,by+f); ctx.lineTo(bx,by-3); ctx.lineTo(bx+9,by+f); ctx.stroke();
  }
}
function drawLayers(list){
  for(const L of (list||layers)){
    const w = L.tile.w;
    const off = ((cam.x*L.f) % w + w) % w;
    const y = GROUND;
    const dw = L.tile.canvas.width/(SCALE*DPR), dh = L.tile.canvas.height/(SCALE*DPR);
    for(let k=-1;k<=Math.ceil(VW/w);k++){
      ctx.drawImage(L.tile.canvas, k*w - off, y-dh, dw, dh);
    }
  }
}
/* The painted wall panels. Each is redrawn into an offscreen canvas with its
   left edge ramped to transparent, so overlapping neighbours dissolve into one
   another instead of butting up in a visible line. */
/* A set of painted background panels. Each is redrawn into an offscreen canvas
   with an alpha ramp down its LEFT edge, so panels can be laid overlapping and
   dissolve into each other -- they do not tile edge to edge on their own and a
   hard seam through brickwork or a fence line is glaring. `top` optionally
   fades the top of the art out as well, which is how the outdoor panels hand
   over to the sky the game draws behind them.

   The mask is ONE pass over the whole canvas: `destination-in` clears
   everything the source does not cover, so masking a strip at a time wipes the
   rest of the panel and leaves an almost fully transparent image -- which on
   screen reads as flat colour, i.e. exactly like the art having failed to load. */
function loadPanels(SET){
  SET.imgs = []; SET.ready = 0;
  SET.srcs.forEach((src, i) => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas');
      c.width = im.naturalWidth; c.height = im.naturalHeight;
      const g = c.getContext('2d');
      g.drawImage(im, 0, 0);
      g.globalCompositeOperation = 'destination-in';
      const grad = g.createLinearGradient(0, 0, c.width, 0);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(Math.min(0.5, SET.blend/c.width), 'rgba(0,0,0,1)');
      grad.addColorStop(1, 'rgba(0,0,0,1)');
      g.fillStyle = grad; g.fillRect(0, 0, c.width, c.height);
      if(SET.haze){
        // Aerial perspective. The hazards are painted in the same style and at
        // the same saturation as the map, so on the farm a hay bale in front of
        // a hay field is camouflage. Washing the DISTANCE out is what separates
        // them -- source-atop tints only the art, never the keyed-out sky.
        g.globalCompositeOperation = 'source-atop';
        g.fillStyle = SET.haze; g.fillRect(0, 0, c.width, c.height);
        g.globalCompositeOperation = 'destination-in';
      }
      if(SET.topFade){
        const vg = g.createLinearGradient(0, 0, 0, c.height*SET.topFade);
        vg.addColorStop(0, 'rgba(0,0,0,0)');
        vg.addColorStop(1, 'rgba(0,0,0,1)');
        g.fillStyle = vg; g.fillRect(0, 0, c.width, c.height*SET.topFade);
      }
      SET.imgs[i] = c; SET.ready++;
      if(SET.onReady) SET.onReady();
    };
    im.onerror = () => { SET.imgs[i] = null; };
    im.src = src;
  });
  return SET;
}
/* `marks` is TWO landmarks: the painted ground line, and the top of the
   fence's top rail, both as fractions of the image's height. Two landmarks
   give two equations, and the image has two unknowns -- its scale and where
   its top sits -- so both are solved rather than guessed, which is what puts
   the grass line on GROUND and the fence rail where the game expects it.

   They used to be three panels with three pairs of marks, and the three ground
   lines really were painted at 0.785, 0.802 and 0.820. tools/farm_strip.py
   levels that offline now, by sliding each panel rather than scaling it, so
   there is one pair of marks left. */
/* THE BACKGROUND: four things at four speeds, and one sky behind all of them.

   It used to be a single painting at a single speed, which is why it read as a
   sticker rather than a place. Now: hills a long way off, the farm in the
   middle distance, the neighbours walking through the field, and the fence you
   run past. Each is generated on its own (tools/gen_bg.py) and cut to loop
   (tools/bg_layers.py) with the sky keyed out, so no layer has to agree with
   another about what colour the sky is -- the game draws that once, behind
   everything.

   The speeds are deliberately gentle and deliberately close together. Depth
   here is meant to be felt rather than noticed: open the gap between the far
   and near layers and the eye starts tracking the parallax instead of the
   chicken, which at this pace is exhausting to look at.

     f     how much of the camera each layer takes -- 1 is the road
     hf    drawn height, as a fraction of GROUND
     base  where the bottom of the layer sits relative to GROUND; further away
           means higher up the screen */
const BG = [
  { key:'far',  f:0.10, hf:0.138, base:-214 },
  { key:'mid',  f:0.26, hf:0.412, base:-158 },
  { key:'near', f:0.60, hf:0.214, base:   8 },
];
/* Loaded directly rather than through IMQ: three requests, and they are the
   three that decide whether the game looks like anything at all. */
BG.forEach(L => {
  L.img = new Image();
  L.img.onload = () => { L.ready = true; if(SCALE) buildLayers(); };
  L.img.onerror = () => { L.ready = false; };
  L.img.src = 'art/bg/' + L.key + '.webp';
});
function bgReady(){ return BG.every(L => L.ready); }
function bgGeom(L){
  const H = GROUND*L.hf;
  return { H, W: H*(L.img.naturalWidth/L.img.naturalHeight), y: GROUND + L.base - H };
}
const FARM_RAIL = 0.148;                  // fence rail height above GROUND, as a fraction of it

/* The title poster. The menu is this same file as a CSS background, and the
   canvas picks it up on the frame the menu hides -- `cover` here is the same
   arithmetic as `background-size:cover` there, so the handover is invisible and
   the poster can then be blown off the screen by the first press. */
/* Two title screens were built for the same key art, and this picks one.
   false -- the menu is the live scene and he is visible in the cage before you
   press, which is the reason the menu is laid out on the right half at all.
   true  -- the painted poster fills the screen and the first press blows it off,
   which frames the art better but hides him until it clears. */
const POSTER_TITLE = false;
const TITLE = { img: new Image(), ready: false };
TITLE.img.onload = () => { TITLE.ready = true; };
TITLE.img.src = 'art/title.webp';
function titleRect(){
  const iw = TITLE.img.naturalWidth || 1080, ih = TITLE.img.naturalHeight || 1920;
  const s = Math.max(VW/iw, VH/ih);
  return { w: iw*s, h: ih*s, x: (VW - iw*s)/2, y: (VH - ih*s)/2 };
}

/* The painted farm: one image, one scale, tiled. Sizing it against the play
   band instead of GROUND magnifies a 572px source about fourfold and puts the
   silo tops off the frame, which is the trap the prison wall hit. */
/* THE LOOKOUTS. Three pigeons in sunglasses on the watchtower's balcony rail.
   The tower is painted into the strip, so they are drawn at fractions measured
   off it and ride with it wherever it repeats -- which is also why they are in
   here rather than in the props pass. The fractions are of the whole strip now,
   not of the panel the tower came from; tools/farm_strip.py is where the panel
   ended up in it. */
const SPY = { x0:0.742, x1:0.800, y:0.395, h:0.105 };
function drawSpyPigeons(x, y0, W, H){
  const y = y0 + SPY.y*H;
  const px = player.x - cam.x;                       // where he is on screen
  for(let i=0;i<3;i++){
    const fx = SPY.x0 + (SPY.x1-SPY.x0)*(i/2);
    const bx = x + fx*W;
    /* Two loops. Idle they shuffle and preen slowly; once he is close they run
       the alert cycle -- head up, wing to the earpiece, talking into it. The
       test is screen distance rather than world distance because the tower
       rides the parallax, so its world x is not where it looks. */
    const near = NPC_REACT && game.mode === 'play' && Math.abs(bx - px) < 620;
    const list = FRAME_DATA[near && FRAME_DATA.spyalert ? 'spyalert' : 'spy'];
    if(!list || !list.length) continue;
    const fr = list[Math.floor(game.t*(near ? 9 : 2.6) + i*2.7) % list.length];
    const im = FR.img[fr.f]; if(!im || !im.complete || !im.naturalWidth) continue;
    const h = SPY.h*H, w = h*(fr.w/fr.h);
    ctx.drawImage(im, bx - w*0.5, y - h, w, h);
  }
}
/* The field the farm stands in.

   The layers are cut-outs with the sky keyed out, which is what makes them one
   scene -- but it also means the ground between the fence and the buildings is
   sky until something puts grass there. Without this the barns stand on a strip
   of blue, which reads as a row of stickers pasted over the horizon, and no
   amount of fiddling with the parallax fixes it because the problem is that
   there is nothing underneath them.

   One flat band, from the far hills' feet down to the near grass, graded
   between the two so it belongs to both: hazy sage where it meets the hills,
   the near layer's own green where it meets the fence. */
function drawField(){
  /* Starts at the FAR layer's feet, not the mid layer's. Anchor it to the
     buildings and the strip between the hills and the field stays sky -- a
     blue band across the middle of the farm. */
  const top = GROUND + BG[0].base + 10;
  const h = GROUND + 10 - top;
  ctx.drawImage(surface('field|' + Math.round(top) + '|' + Math.round(h), VW, h, true, (g) => {
    const gd = g.createLinearGradient(0, 0, 0, h);
    gd.addColorStop(0,    '#93B77E');       // where the hills stop
    gd.addColorStop(0.38, '#79AC55');
    gd.addColorStop(1,    '#5C9A28');       // where the near grass starts
    g.fillStyle = gd; g.fillRect(0, 0, VW, h);
  }), 0, top, VW, h);
}
/* Draws the named layers and only those. It used to take the layer to stop
   AFTER, which meant the second call -- the one for the fence -- started at the
   beginning again and redrew the hills and the farm over the top of the
   neighbours who had just been drawn between them. They were on screen the
   whole time, painted over a frame later, which looks exactly like not being
   drawn at all. It also paid for the two big layers twice a frame. */
function drawBgLayers(keys){
  for(const L of BG){
    if(!L.ready || keys.indexOf(L.key) < 0) continue;
    if(L.key === 'mid') drawField();        // the buildings need somewhere to stand
    const g = bgGeom(L);
    const off = ((cam.x*L.f) % g.W + g.W) % g.W;
    for(let x = -off; x < VW + 1; x += g.W){
      ctx.drawImage(L.img, x, g.y, g.W, g.H);
      if(L.key === 'mid') drawSpyPigeons(x, g.y, g.W, g.H);
    }
  }
}
/* The code-drawn fallback, for the moment before the panels load. */

      ctx.fillStyle=C.prop; ctx.beginPath(); ctx.arc(0,-196,26,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-30,-214); ctx.lineTo(30,-214); ctx.lineTo(0,-246); ctx.closePath(); ctx.fill();

      ctx.beginPath(); ctx.roundRect(-58,-44,116,44,7); ctx.fill();
      ctx.fillStyle='rgba(107,209,255,.34)'; ctx.beginPath(); ctx.roundRect(-50,-38,100,14,5); ctx.fill();
    }

/* one small chicken, in silhouette */
function drawLilChicken(cheer, bob){
  ctx.save();
  ctx.translate(0, bob);
  // C.prop alone is within a shade of the background, so they vanished.
  // Lifted toward the cream, but nowhere near the player's own colour.
  ctx.fillStyle = lerpHex(C.prop, '#FFF2DE', 0.34);
  ctx.beginPath(); ctx.ellipse(0, -26, 26, 21, 0, 0, TAU); ctx.fill();     // body
  ctx.beginPath(); ctx.ellipse(17, -44, 14, 13, 0, 0, TAU); ctx.fill();    // head
  ctx.beginPath();                                                          // comb
  ctx.arc(14,-55,4.5,0,TAU); ctx.arc(20,-57,4.5,0,TAU); ctx.arc(26,-55,4,0,TAU); ctx.fill();

  ctx.moveTo(30,-45); ctx.lineTo(42,-41); ctx.lineTo(30,-38); ctx.closePath(); ctx.fill();
