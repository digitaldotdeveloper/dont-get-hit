function drawHead(p){
  const R = CK.headR;
  const useRef = !Loadout.head && !Loadout.face && partReady('headref');
  if(useRef){ drawPart('headref'); return; }
  if(partReady('head')){
    drawPart('head');
    // the painted head has its own skull and eye, so the cosmetics shift onto them
    // measured off the part: skull centre sits at (-2,-8) from the pivot, eye at (+9,-12)
    drawSlot('head', R);                       // pivot = the art's skull centre
    ctx.save(); ctx.translate(-1,-2); drawSlot('face', R); ctx.restore();
    if(p.shockT>0.02){
      ctx.save(); ctx.globalAlpha=clamp(p.shockT*2,0,1);
      ctx.strokeStyle=CKC.edge; ctx.lineWidth=3; ctx.lineCap='round';
      for(let i=0;i<3;i++){ const a=-0.9+i*0.5;
        ctx.beginPath();
        ctx.moveTo(-R*1.5+Math.sin(a)*8, -R*1.4+Math.cos(a)*8);
        ctx.lineTo(-R*1.5+Math.sin(a)*20,-R*1.4+Math.cos(a)*20); ctx.stroke(); }
      ctx.restore();
    }
    return;
  }
  // wattle
  ctx.beginPath(); ctx.ellipse(R*0.56,R*0.70,R*0.17,R*0.32,0.22,0,TAU); cp(CKC.comb,4);
  // skull
  ctx.beginPath(); ctx.ellipse(0,0,R*0.98,R*0.94,0,0,TAU); cp(CKC.body,5);
  ctx.save(); ctx.clip();
  const hg = ctx.createLinearGradient(-R,-R*0.5,R,R*0.5);
  hg.addColorStop(0, CKC.shade); hg.addColorStop(0.45, CKC.body); hg.addColorStop(1, '#FFEDCC');
  ctx.fillStyle=hg; ctx.fillRect(-R-2,-R-2,R*2+4,R*2+4); ctx.restore();
  // beak
  ctx.beginPath();
  ctx.moveTo(R*0.66,-R*0.20); ctx.lineTo(R*1.92,R*0.18); ctx.lineTo(R*0.66,R*0.54);
  ctx.closePath(); cp(CKC.beak,4.6);
  ctx.beginPath(); ctx.moveTo(R*0.70,R*0.18); ctx.lineTo(R*1.78,R*0.19);
  ctx.strokeStyle=CKC.edge; ctx.lineWidth=2.6; ctx.stroke();
  // eye: half lidded, one raised brow. That is the whole personality.
  const open = clamp(0.42 + p.shockT*1.5, 0, 1.25);
  ctx.beginPath(); ctx.ellipse(R*0.34,-R*0.16,R*0.30,R*0.30,0,0,TAU);
  ctx.fillStyle='#FFFFFF'; ctx.fill(); ctx.lineWidth=3.4; ctx.strokeStyle=CKC.edge; ctx.stroke();
  ctx.save();
  ctx.beginPath(); ctx.ellipse(R*0.34,-R*0.16,R*0.30,R*0.30,0,0,TAU); ctx.clip();
  ctx.beginPath(); ctx.arc(R*0.40,-R*0.10,R*0.155,0,TAU); ctx.fillStyle=CKC.edge; ctx.fill();
  ctx.beginPath(); ctx.arc(R*0.46,-R*0.17,R*0.055,0,TAU); ctx.fillStyle='#fff'; ctx.fill();
  ctx.beginPath();                                    // the lid
  ctx.rect(R*0.02,-R*0.50,R*0.66,R*0.34*(1-open));
  ctx.fillStyle=CKC.body; ctx.fill();
  ctx.restore();
  ctx.beginPath();
  ctx.moveTo(R*0.06,-R*0.46-R*0.20*p.shockT); ctx.lineTo(R*0.66,-R*0.58-R*0.26*p.shockT);
  ctx.strokeStyle=CKC.edge; ctx.lineWidth=R*0.115; ctx.lineCap='round'; ctx.stroke();
  // hat, then the comb bursting up in front of it
  drawSlot('head', R);
  ctx.beginPath();
  ctx.moveTo(R*0.24,-R*1.00);
  ctx.quadraticCurveTo(R*0.34,-R*1.42, R*0.56,-R*1.12);
  ctx.quadraticCurveTo(R*0.72,-R*1.50, R*0.86,-R*1.06);
  ctx.quadraticCurveTo(R*1.00,-R*1.26, R*0.96,-R*0.78);
  ctx.quadraticCurveTo(R*0.60,-R*0.84, R*0.24,-R*1.00);
  ctx.closePath(); cp(CKC.comb,4.4);
  drawSlot('face', R);
}

function drawChicken(x, y, p){
  if(FR.ready && !game.align && drawChickenFrames(x, y, p)) return;
  ctx.save();
  ctx.translate(x, y);                              // y = ground contact point
  ctx.translate(p.x, -CK.standH + p.y);             // -> body core
  ctx.rotate(p.rot);
  ctx.scale(p.sx, p.sy);

  // far leg
  drawBone(CK.hipX,CK.hipY, CK.hipX+p.kFx,CK.hipY+p.kFy, 6, CKC.legDark, true);
  drawBone(CK.hipX+p.kFx,CK.hipY+p.kFy, CK.hipX+p.fFx,CK.hipY+p.fFy, 5, CKC.legDark, true);
  drawShoePart(CK.hipX+p.kFx,CK.hipY+p.kFy, CK.hipX+p.fFx,CK.hipY+p.fFy, CKC.shoeDark, true);

  // far wing
  drawWingPart(-CK.wingX, CK.wingY, p.wingF, p.tipF, p.wingOpen, CKC.shade, true);

  // tail — one swept cream shape that grows out of the body
  ctx.save();
  ctx.translate(-70, -14);
  ctx.rotate(p.tail*0.6 + spring.tail*0.18);
  ctx.rotate(-0.10);
  if(drawPart('tail')){ ctx.restore(); } else {
  ctx.beginPath();
  ctx.moveTo( 14,-20);
  ctx.quadraticCurveTo(-20,-38,-50,-26);
  ctx.quadraticCurveTo(-34,-10,-42,  4);
  ctx.quadraticCurveTo(-14, -2, 14, 14);
  ctx.closePath(); cp(CKC.body,5);
  ctx.strokeStyle='rgba(11,21,38,.24)'; ctx.lineWidth=2.6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-6,-18); ctx.lineTo(-34,-22); ctx.stroke();
  ctx.restore(); }

  drawSlot('back', CK.bodyRX);            // capes/packs sit behind the body

  // body
  if(partReady('body')){
    ctx.save(); ctx.rotate(CK.bodyTilt); drawPart('body'); ctx.restore();
  } else {
    ctx.beginPath(); ctx.ellipse(0,0,CK.bodyRX,CK.bodyRY,CK.bodyTilt,0,TAU); cp(CKC.body,5);
    ctx.save(); ctx.clip();
    const bg = ctx.createLinearGradient(-CK.bodyRX,-CK.bodyRY*0.6, CK.bodyRX,CK.bodyRY*0.6);
    bg.addColorStop(0, CKC.shade); bg.addColorStop(0.42, CKC.body); bg.addColorStop(1, '#FFEDCC');
    ctx.fillStyle=bg; ctx.fillRect(-CK.bodyRX-2,-CK.bodyRY-2,CK.bodyRX*2+4,CK.bodyRY*2+4);
    ctx.restore();
  }
  drawSlot('body', CK.bodyRX);            // outfit rides the body pivot
  // neck: joins body to head so the silhouette is one animal
  if(!partReady('body')){
    const hx=CK.headX+p.headDX, hy=CK.headY+p.headDY;
    ctx.beginPath(); ctx.moveTo(hx-4, hy+6); ctx.lineTo(hx+14, hy+10);
    ctx.lineTo(CK.bodyRX*0.44, -CK.bodyRY*0.30); ctx.lineTo(CK.bodyRX*0.10, -CK.bodyRY*0.42);
    ctx.closePath(); cp(CKC.body,5);
  }
  drawSlot('neck', CK.bodyRX);            // scarf etc.

  // head (painted sprite carries hat + face)
  ctx.save();
  ctx.translate(CK.headX+p.headDX, CK.headY+p.headDY);
  ctx.rotate(p.headR);
  drawHead(p);
  if(p.shockT>0){                                   // cartoon shock marks beat a face change at this size
    ctx.save(); ctx.globalAlpha=clamp(p.shockT*2,0,1);
    ctx.fillStyle='#FFF2DE'; ctx.strokeStyle=CKC.edge; ctx.lineWidth=3;
    for(const dx of [-6,12]){
      ctx.save(); ctx.translate(dx-38,-52); ctx.rotate(dx>0?0.22:-0.22);
      ctx.beginPath(); ctx.roundRect(-3.5,-16,7,19,3); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,8,4,0,TAU); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }
  ctx.restore();

  // near wing
  drawWingPart(CK.wingX, CK.wingY, p.wingN, p.tipN, p.wingOpen, CKC.wing, false);

  // near leg
  drawBone(CK.hipX,CK.hipY, CK.hipX+p.kNx,CK.hipY+p.kNy, 7, CKC.leg, false);
  drawBone(CK.hipX+p.kNx,CK.hipY+p.kNy, CK.hipX+p.fNx,CK.hipY+p.fNy, 6, CKC.leg, false);
  drawShoePart(CK.hipX+p.kNx,CK.hipY+p.kNy, CK.hipX+p.fNx,CK.hipY+p.fNy, CKC.shoe, false);

  if(game.rig){                                   // pivot overlay for aligning parts
    const mark=(x,y,c,lbl)=>{
      ctx.strokeStyle=c; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(x-9,y); ctx.lineTo(x+9,y);
      ctx.moveTo(x,y-9); ctx.lineTo(x,y+9); ctx.stroke();
      ctx.beginPath(); ctx.arc(x,y,4,0,TAU); ctx.stroke();
      ctx.fillStyle=c; ctx.font='700 11px Archivo, sans-serif'; ctx.fillText(lbl,x+11,y-4);
    };
    ctx.strokeStyle='rgba(63,224,176,.45)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(-160,CK.standH); ctx.lineTo(160,CK.standH); ctx.stroke();  // ground
    mark(0,0,'#FF456E','core');
    mark(CK.headX+p.headDX, CK.headY+p.headDY, '#6BD1FF', 'head');
    mark(CK.wingX, CK.wingY, '#FFD54A', 'wing');
    mark(-70, -14, '#3FE0B0', 'tail');
    mark(CK.hipX, CK.hipY, '#F2684F', 'hip');
    mark(CK.hipX+p.fNx, CK.hipY+p.fNy, '#FFF2DE', 'ankle');
  }

  ctx.restore();
}

/* ============================================================
   TUMBLE — the death. Body physics with the legs and wings
   trailing, plus the gag that sells it: he lays an egg.
   ============================================================ */
const rag = {
  alive:false, x:0, y:0, vx:0, vy:0, rot:0, vrot:0, energy:99,
  pose:newPose(),
  build(p, x, y, vx, vy, spin){
    this.alive=true;
    this.x=x; this.y=y-CK.standH; this.vx=vx; this.vy=vy;
    this.rot=p.rot; this.vrot=spin; this.energy=99; this.rest=0;
    for(const k of POSE_KEYS) this.pose[k]=p[k];
  },
  step(dt, groundY){
    if(!this.alive) return;
    this.vy += 3000*dt;
    this.x += this.vx*dt; this.y += this.vy*dt;
    this.rot += this.vrot*dt;
    const floor = groundY - CK.bodyRY*0.9;
    if(this.y > floor){
      this.y = floor;
      this.vy *= -0.42;
      this.vx *= 0.62; this.vrot *= 0.52;
      if(Math.abs(this.vy) < 90){ this.vy = 0; this.vrot *= 0.3; }
      if(Math.abs(this.vy)>140) spark(this.x, groundY, 5,
        {col:'rgba(255,242,222,.55)', a0:Math.PI, a1:TAU, s0:80,s1:260, l0:0.2,l1:0.5, r0:3,r1:8, g:700});
    }
    this.vx *= Math.pow(0.55,dt);
    this.energy = Math.abs(this.vx)+Math.abs(this.vy)+Math.abs(this.vrot)*40;
    // limbs and wings flail loosely behind the tumble
    const p=this.pose, t=game.t;
    p.wingN = damp(p.wingN, -2.2+Math.sin(t*17)*0.5, 9, dt);
    p.wingF = damp(p.wingF, -2.1-Math.sin(t*17)*0.5, 9, dt);
    p.tipN = damp(p.tipN, -0.4, 6, dt); p.tipF = p.tipN;
    p.wingOpen = damp(p.wingOpen, 1, 8, dt);
    p.tail = damp(p.tail, 0.5, 5, dt);
    setLegs(p, -4+Math.sin(t*13)*11, 24, -9+Math.sin(t*13+1.6)*11, 21);
    p.headR = damp(p.headR, 0.5*Math.sin(t*9), 7, dt);
    p.sx = damp(p.sx,1,8,dt); p.sy = damp(p.sy,1,8,dt);
    p.x=0; p.y=0;
  },
  draw(){
    ctx.save();
    ctx.translate(this.x, this.y + CK.standH);
    ctx.rotate(FR.ready ? this.rot*0.25 : this.rot);   // drawn frames already tumble
    ctx.translate(0, -CK.standH);
    const p=this.pose, keep=p.rot; p.rot=0;
    ctx.translate(0, CK.standH);
    drawChicken(0, 0, p);
    p.rot=keep;
    ctx.restore();
  }
};

/* ============================================================
   THE CAGE — the intro. Cluck County Farm Correctional Facility: a barred
   door in the side of a red barn, and a chicken who is not remotely worried
   about any of it.

   The scene is PAINTED (`sheets/v2/cage_scene.webp`), not drawn out of
   rectangles, and the door is its own sprite so it can buckle and then leave.
   Every number below is a fraction MEASURED off the art rather than guessed —
   which is what puts his feet on the straw instead of near it.

   Timeline, all of it after the player presses. Two seconds, then he is
   running, and nothing loads at the handover:
     0.00  standing in the cage, unimpressed
     0.42  coils, rocking back into it — the frame and the title start to rattle
     1.15  THE KICK. Door, lock, splinters, boom, everything on this frame.
     1.52  through the doorway, still airborne
     2.00  control returns mid-stride
   ============================================================ */
/* ============================================================
   THE BASKET -- the vehicle.

   Jetpack Joyride's contract, and it is worth stating because every part of it
   earns its place: a vehicle is picked up mid-run, it REPLACES the control you
   already know with a different one, the level changes to suit it, and a hit
   takes the vehicle rather than the run. That last one is the whole reason
   vehicles feel like a reward instead of a handicap -- riding one is strictly
   safer, so you chase it.

   Here it is a wicker basket under a bunch of balloons:

     control   the flap is gone. Hold to rise, release to sink, and both are
               gentle -- the model is the same one, with gravity and thrust cut
               to a third and the drag nearly doubled, so it floats where the
               bird darts. That contrast IS the vehicle.
     level     `RIDE_PAT` replaces the pattern table: gates and wires only, no
               corn. Corn is ankle-high clutter that a floating basket sails
               over, and a hazard you cannot fail is worse than no hazard.
     clearance CLEAR_RIDE, because the basket is over twice the bird's height
               and an opening that was generous is suddenly a squeeze.
     ending    fourteen seconds, or one hit. Either way the balloons pop, the
               basket drops away, and there is a moment of grace before the
               bird is solid again.
   ============================================================ */
const RIDE_TIME = 14, RIDE_GRACE = 0.85, RIDE_EVERY = [17, 26];
const RIDE_G = 0.34, RIDE_T = 0.38, RIDE_D = 1.85;   // gravity, thrust, drag
/* Measured, not picked: basket plus balloons stands about 410 units tall, so
   an opening of 430 left twenty units of slack and the ride was a punishment.
   The vehicle is supposed to be the safe part of the run. */
const CLEAR_RIDE = 560;
const BASKET = { img: new Image(), ready:false };
const BALLOONS = { img: new Image(), ready:false };
BASKET.img.onload   = () => { BASKET.ready = true; };
BALLOONS.img.onload = () => { BALLOONS.ready = true; };
BASKET.img.src   = 'art/basket.webp';
BALLOONS.img.src = 'art/balloons.webp';
/* Drawn from the bird's feet: the basket he sits in, and the balloons over it.
   Sized off GROUND so the whole rig scales with the play area. */
function basketGeom(){
  const bw = GROUND*0.30, bh = bw*(952/980);
  const lw = GROUND*0.26, lh = lw*(884/732);
  return { bw, bh, lw, lh, lift: bh*0.62 };
}
const riding = () => game.ride > 0;

const CAGE = {
  ready:false, img:null, door:null,
  floorFrac:0.985,                     // where the barn meets the ground
  dx0:0.250, dx1:0.755,                // the doorway, as fractions of the image
  dy0:0.455, dy1:0.930,                // its floor is the straw he stands on
  roof:[0.500, 0.000],                 // the roof apex, where the neighbours are
  doorH:250,                           /* the doorway's height in WORLD units, and
                                          the one number that sizes the barn: the
                                          chicken is a fixed 175 tall, so this is
                                          really "how big is he next to it". */
  w:0, h:0, x:0, y:0                   // filled in by cageGeom, in world units
};
(function loadCage(){
  const im = new Image();
  im.onload  = ()=>{
    const c = document.createElement('canvas');
    c.width = im.naturalWidth; c.height = im.naturalHeight;
    const g = c.getContext('2d');
    g.drawImage(im, 0, 0);
    /* No fade any more, in either direction. The old barn was painted with its
       own farm behind it -- a windmill, a fence, a line of hills -- so its right
       edge had to dissolve into the map's, and that hand-over ghosted one
       picture through the other. This barn is cut out of its sky, so the
       parallax layers simply show behind it and there is nothing to blend. */
    CAGE.img = c; CAGE.ready = true;
  };
  im.onerror = ()=>{ CAGE.ready = false; };
  im.src = 'sheets/v2/cage_scene.webp';
  const dr = new Image();
  dr.onload = ()=>{ CAGE.door = dr; };
  dr.src = 'art/cage_door.webp';
})();

const T_WIND = 0.42, T_KICK = 1.15, T_BURST = 1.52, T_OUT = 2.00;
/* How far he travels between the kick and control coming back, in world units.
   The cage is parked exactly this far BEHIND the play position (`game.cageX =
   -CAGE_RUNOUT`, with the camera at -PX), so the pose's last frame and the
   run's first frame land on the same pixel. Park the cage anywhere else and he
   teleports at the handover -- which is what the doorway being drawn at 2*PX
   used to do, half a screen in one frame. */
const CAGE_RUNOUT = 300;
/* The camera is pulled back this far while he is still in the cage, and pans
   forward onto the play mark as he comes out. Without it the cage has to be
   parked CAGE_RUNOUT behind PX to avoid a teleport, and PX is only 27% of the
   width -- which shoves the barn half off the left edge and hides the one
   thing the menu is meant to show. */
const CAGE_CAM = 430;
const camIntroX = () => -(PX + CAGE_CAM);

/* The scene in world units, anchored so the painted ground line lands exactly
   on GROUND and the doorway centre lands on game.cageX. Sized against GROUND,
   not the play band: the play band magnifies a 572px source about fourfold and
   puts the barn roof off the top of the frame. */
function cageGeom(){
  /* Anchored on the DOORWAY, not on GROUND. The barn art gained its roof and
     got 26% taller, and sizing off the canvas would have shrunk the doorway
     with it and taken Nugget down with the doorway. The doorway is the one
     measurement that has to hold still, because he stands in it. */
  const H = CAGE.doorH / (CAGE.dy1 - CAGE.dy0);
  const W = H * (CAGE.img ? CAGE.img.width/CAGE.img.height : 1024/722);
  CAGE.h = H; CAGE.w = W;
  CAGE.y = GROUND - CAGE.floorFrac*H;          // top of the painted scene
  CAGE.x = -((CAGE.dx0+CAGE.dx1)*0.5)*W;       // offset from game.cageX
  return CAGE;
}
/* the straw floor of the cage, a little above the dirt outside */
function cageFloor(){ return (CAGE.floorFrac - CAGE.dy1) * CAGE.h; }
function cageShake(){
  if(game.mode !== 'intro') return 0;
  const t = game.introT;
  if(t < T_WIND || t > T_KICK) return 0;
  return (t - T_WIND)/(T_KICK - T_WIND);       // rattles as he winds up
}
/* the barn, the doorway and the farm beyond it — everything he stands in front of */
function drawCageBack(sx){
  const g = cageGeom();
  const j = cageShake()*cageShake()*4;
  if(!CAGE.ready){                              // art missing: a plain dark mouth
    ctx.fillStyle = '#8E3B2C';
    ctx.fillRect(sx + g.x, g.y, g.w, GROUND - g.y);
    ctx.fillStyle = '#1A1410';
    ctx.fillRect(sx + g.x + g.dx0*g.w, g.y + g.dy0*g.h,
                 (g.dx1-g.dx0)*g.w, (g.dy1-g.dy0)*g.h);
    return;
  }
  const im = CAGE.img;
  // crop off the painted dirt below the ground line and let drawGround's road
  // carry on underneath, so the two can never disagree about where the floor is
  const sh = im.height * CAGE.floorFrac;
  const x0 = sx + g.x + rnd(-j,j), y0 = g.y + rnd(-j,j)*0.5, dh = CAGE.floorFrac*g.h;
  /* No wall stretched out to the screen edge either. That existed because the
     old barn ended in a hard vertical cut with nothing behind it; this one is a
     whole barn standing in a field, and the field is drawn. Stretching its
     leftmost columns now would smear the roof's diagonal across the sky. */
  ctx.drawImage(im, 0, 0, im.width, sh, x0, y0, g.w, dh);
  drawRoofHens(sx);
}
/* THE NEIGHBOURS. Three hens in a crate on the barn roof. They are desperate
   the whole time Nugget is still in the cage, and they lose their minds the
   moment he is not -- which is the only reaction in the game to the thing the
   player just did, so it is worth the forty lines.

   They are drawn BEFORE the crate, so the wire mesh reads as being in front of
   them; the mesh is keyed transparent, so that is all it takes. */
const ROOF = { crate:new Image(), ready:false };
ROOF.crate.onload = ()=>{ ROOF.ready = true; };
ROOF.crate.src = 'art/roof_crate.webp';
function henSet(){
  // free from the frame the kick lands, and they never calm down again
  const out = (game.mode !== 'menu' && game.mode !== 'intro') ||
              (game.introT !== undefined && game.introT >= T_KICK);
  return out ? 'henjoy' : 'hensad';
}
function drawRoofHens(sx){
  const g = cageGeom();
  const cw = g.w*0.195, ch = cw*(532/516);
  const cx = sx + g.x + CAGE.roof[0]*g.w;
  const apex = g.y + CAGE.roof[1]*g.h;
  /* Sunk a third into the ridge so it is sitting on the roof rather than
     hovering over it, and clamped so it never climbs off the top of the frame
     -- on a short landscape phone there is only about 70px of sky above the
     apex, and an unclamped crate loses its own roof to the bezel. */
  const cy = Math.max(48, apex + ch*0.30 - ch);
  const set = henSet(), list = FRAME_DATA[set];
  const joy = set === 'henjoy';
  if(list && list.length){
    const hw = cw*0.21;                              // three across the inside
    for(let i=0;i<3;i++){
      const ph = i*2.1;
      const fr = list[Math.floor(game.t*(joy?9:3.4) + ph) % list.length];
      const im = FR.img[fr.f];
      if(!im || !im.complete || !im.naturalWidth) continue;
      const w = hw, h = w*(fr.h/fr.w);
      const hop = joy ? Math.max(0, Math.sin(game.t*8 + ph))*ch*0.10
                      : Math.sin(game.t*2.4 + ph)*ch*0.012;
      ctx.drawImage(im, cx - cw*0.285 + i*cw*0.285 - w*0.5,
                    cy + ch*0.775 - h - hop, w, h);
    }
  }
  if(ROOF.ready) ctx.drawImage(ROOF.crate, cx - cw*0.5, cy, cw, ch);
}
/* the barred door, in front of him, until he removes it */
function drawCageFront(sx){
  if(game.doorGone) return;
  drawCageDoor(sx);
}
/* The door is its own object so it can buckle, then leave. It is drawn to fill
   the doorway measured out of the painted scene, so it sits in the hole rather
   than near it. */
function drawCageDoor(sx){
  const g = cageGeom(), d = game.door;
  const x = sx + g.x + g.dx0*g.w, y = g.y + g.dy0*g.h;
  const w = (g.dx1-g.dx0)*g.w, h = (g.dy1-g.dy0)*g.h;
  ctx.save();
  ctx.translate(x + w*0.5 + (d ? d.x : 0), y + h*0.5 + (d ? d.y : 0));
  if(d) ctx.rotate(d.rot);
  const bow = d ? 0 : (game.doorBow||0);        // iron giving way
  ctx.transform(1 + bow*0.26, 0, bow*0.42, 1 - bow*0.10, 0, 0);
  if(CAGE.door && CAGE.door.complete && CAGE.door.naturalWidth){
    ctx.drawImage(CAGE.door, -w*0.5, -h*0.5, w, h);
  } else {
    ctx.strokeStyle='#08131A'; ctx.lineWidth=15; ctx.strokeRect(-w*0.5,-h*0.5,w,h);
    ctx.strokeStyle='#48626E'; ctx.lineWidth=10; ctx.lineCap='round';
    for(let i=1;i<7;i++){
      const bx = -w*0.5 + w*i/7;
      ctx.beginPath(); ctx.moveTo(bx,-h*0.5+10); ctx.lineTo(bx,h*0.5-10); ctx.stroke();
    }
  }
  ctx.restore();
}
/* the padlock, drawn on its own so the one that spins away can be a particle */
function drawCageLock(sx, ox, oy, rot){
  ctx.save();
  ctx.translate(sx + (ox||0), (oy||0));
  ctx.rotate(rot||0);
  ctx.strokeStyle='#241043'; ctx.lineWidth=8;                 // shackle
  ctx.beginPath(); ctx.arc(0,-13,11,Math.PI,0); ctx.stroke();
  ctx.strokeStyle='#C9C9D6'; ctx.lineWidth=4.5;
  ctx.beginPath(); ctx.arc(0,-13,11,Math.PI,0); ctx.stroke();
  ctx.beginPath();                                            // body
  if(ctx.roundRect) ctx.roundRect(-17,-8,34,30,7); else ctx.rect(-17,-8,34,30);
  ctx.fillStyle='#FFD54A'; ctx.fill();
  ctx.lineWidth=5; ctx.strokeStyle='#241043'; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,6,4,0,TAU); ctx.fillStyle='#241043'; ctx.fill();
  ctx.restore();
}
/* the kick lands: the lock goes first, then the door, then the shrapnel */
function breakCage(sx){
  const g = cageGeom();
  const dw = (g.dx1-g.dx0)*g.w, dh = (g.dy1-g.dy0)*g.h;
  const wx = cam.x + sx + g.x + g.dx0*g.w + dw*0.5;   // world x of the doorway centre
  const wy = g.y + g.dy0*g.h + dh*0.5;
  game.lockGone = true;
  game.door = { x:0, y:0, rot:0, vx:1150, vy:-560, vr:7.5 };
  game.parts.push({ x: wx, y: wy, vx: 1500, vy: -820,
    life: 2.0, t:0, r: 26, col:'#FFD54A', g: 1700, kind:'lock', rot:0, vr: 15, drag: 0.999 });
  for(let i=0;i<26;i++){
    const near = i < 16;
    game.parts.push({
      x: wx + rnd(-dw*0.30, dw*0.20),
      y: wy + rnd(-dh*0.45, dh*0.45),
      vx: (near ? rnd(500,1250) : rnd(120,520)),
      vy: -rnd(120, 780),
      life: rnd(0.7,1.6), t:0, r: rnd(12,36),
      col: pick(['#6B5540','#8E6534','#C79A5E','#3D3A36']),   // splintered wood + iron
      g: 1600, kind:'plank', rot: rnd(0,TAU), vr: rnd(-15,15), drag:0.996 });
  }
  spark(wx, wy, 30, {col:C.gold, s0:280,s1:900, l0:0.3,l1:0.8, r0:4,r1:13});
  spark(wx, wy, 16, {col:'#FFF2DE', s0:200,s1:640, l0:0.25,l1:0.6, r0:3,r1:9});
}

/* THE BOOM. Five painted frames over the doorway on the frame the kick lands,
   drawn in front of everything, including the door that is already leaving. */
const BOOM_T = 0.52;
function drawBoom(sx){
  if(!game.boomT || game.boomT >= BOOM_T) return;
  const list = FRAME_DATA.boom; if(!list || !list.length) return;
  const k = game.boomT / BOOM_T;
  const fr = list[Math.min(list.length-1, Math.floor(k*list.length))];
  const im = FR.img[fr.f]; if(!im || !im.complete || !im.naturalWidth) return;
  const g = cageGeom();
  const dw = (g.dx1-g.dx0)*g.w, dh = (g.dy1-g.dy0)*g.h;
  const cx = sx + g.x + g.dx0*g.w + dw*0.5, cy = g.y + g.dy0*g.h + dh*0.5;
  const sc = (dw*1.5) / fr.w * (0.72 + k*0.55);      // grows as it goes
  ctx.save();
  ctx.globalAlpha = k > 0.72 ? (1 - (k-0.72)/0.28) : 1;
  ctx.translate(cx, cy);
  ctx.drawImage(im, -fr.w*sc*0.5, -fr.h*sc*0.5, fr.w*sc, fr.h*sc);
  ctx.restore();
}

/* feathers and the egg — the two things that make a hit read as funny */
/* feathers and the egg — the two things that make a hit read as funny */
function featherBurst(x, y, n, power){
  for(let i=0;i<n;i++){
    const a=rnd(0,TAU), s=rnd(60,power||300);
    game.parts.push({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-rnd(20,140),
      life:rnd(0.9,1.9), t:0, r:rnd(9,17),
      col: Math.random()<0.22 ? CKC.shade : '#FFF6E4',
      g:150, kind:'feather', rot:rnd(0,TAU), vr:rnd(-5,5), drag:0.90, sway:rnd(2,5) });
  }
}
function layEgg(x, y, vx){
  game.parts.push({ x, y, vx: vx||-160, vy:-260, life:2.6, t:0, r:16,
    col:'#FFFDF6', g:1500, kind:'egg', rot:0, vr:rnd(-7,7), drag:0.999 });
}

function segDist(px,py, x0,y0,x1,y1){
  const dx=x1-x0, dy=y1-y0, L=dx*dx+dy*dy;
  let u = L ? ((px-x0)*dx + (py-y0)*dy)/L : 0;
  u = u<0?0:u>1?1:u;
  const qx=x0+dx*u, qy=y0+dy*u;
  return Math.hypot(px-qx, py-qy);
}
/* Do two segments cross? Only the sign of the two parameters matters, so this
   is the cheap form: no intersection point is ever wanted. */
function segSeg(ax,ay,bx,by, cx,cy,dx,dy){
  const rx=bx-ax, ry=by-ay, sx=dx-cx, sy=dy-cy;
  const den = rx*sy - ry*sx;
  if(!den) return false;                       // parallel; the endpoint tests catch it
  const u = ((cx-ax)*sy - (cy-ay)*sx)/den;
  const v = ((cx-ax)*ry - (cy-ay)*rx)/den;
  return u>=0 && u<=1 && v>=0 && v<=1;
}
/* Gap between a segment and an axis-aligned box, 0 when they touch.

   One function rather than a boolean and a separate metric, because the
   collision wants the sign and the near-miss meter wants the number, and two
   implementations of the same geometry is how a hitbox drifts away from what
   is drawn. The closest pair is a box corner against the segment OR a segment
   end against the box -- a vertical wire above the middle of the box is the
   case that needs the second test, and it is the common one here. */
function segBoxDist(x0,y0,x1,y1, l,b,r,t){
  const inside = (x,y)=> x>=l && x<=r && y>=b && y<=t;
  if(inside(x0,y0) || inside(x1,y1)) return 0;
  if(segSeg(x0,y0,x1,y1, l,b,r,b) || segSeg(x0,y0,x1,y1, r,b,r,t) ||
     segSeg(x0,y0,x1,y1, r,t,l,t) || segSeg(x0,y0,x1,y1, l,t,l,b)) return 0;
  const ptBox = (x,y)=> Math.hypot(Math.max(l-x, 0, x-r), Math.max(b-y, 0, y-t));
  return Math.min(segDist(l,b,x0,y0,x1,y1), segDist(r,b,x0,y0,x1,y1),
                  segDist(r,t,x0,y0,x1,y1), segDist(l,t,x0,y0,x1,y1),
                  ptBox(x0,y0), ptBox(x1,y1));
}
function boxBoxDist(x0,y0,x1,y1, l,b,r,t){
  return Math.hypot(Math.max(x0-r, 0, l-x1), Math.max(y0-t, 0, b-y1));
}
function discBoxDist(cx,cy,rad, l,b,r,t){
  return Math.max(0, Math.hypot(Math.max(l-cx, 0, cx-r),
                                Math.max(b-cy, 0, cy-t)) - rad);
}

/* ============================================================
   OBSTACLES — all cartoon, all readable in silhouette
   ============================================================ */
let SHADOW_OFF = false;
function shadowEllipse(w, alpha){
  if(SHADOW_OFF) return;
  ctx.beginPath(); ctx.ellipse(0, 4, w, w*0.20, 0, 0, TAU);
  ctx.fillStyle='rgba(21,8,39,'+(alpha||0.34)+')'; ctx.fill();
}
/* Every obstacle in this game is electric. There is no jumping half any
   more: the farmyard props, the crate columns and the crows are gone, and
   what is left is wire -- strung between two posts, hung on its own in the
   middle of the air, or run along the top of a row of corn.

   That puts the whole burden of variety on the wire, because the wire is all
   there is. A fence at two heights is the same fence twice. A wire at two
   ANGLES is two obstacles, and one you must go under is a different question
   from one you must go over. Hence the zappers: their angle, length, height
   and drift are rolled per spawn, not fixed per type. */
const OB = {};
/* The painted hardware the electric pieces are assembled from: posts,
   insulators, the gate frame, the bar, and the corn. Cut off a Gemini Studio
   sheet by tools/cut_obstacles.py and keyed off flat green.

   Every piece falls back to a plain drawn shape when its image has not
   arrived -- the same bargain the character frames make: art can never make a
   hazard invisible. Art the set no longer uses is left in art/farm; nothing
   requests it, so it costs nothing, and it is there if the farmyard props are
   ever wanted back. */
const PROPS = {};
/* Through IMQ like everything else. The farm went from fourteen props to
   thirty-three when the electric set landed, and thirty-three more requests
   fired at once is the same pile-up the frame queue exists to stop. The image
   goes into PROPS immediately, unloaded: naturalWidth 0 is already what every
   draw call tests for. */
function loadProp(n){
  if(PROPS[n]) return;                        // several pieces share a post
  const im = new Image();
  PROPS[n] = im;
  imqLoad(im, 'art/farm/' + n + '.webp', ()=>{}, ()=>{ delete PROPS[n]; }, 'gp');
}
/* ============================================================
   THE ELECTRIC FARM — the flying half of the obstacle set
   ============================================================
   Somebody has wired the place up out of insulators, warning signs and a car
   battery, and the wire is the hazard. These are the pieces you fly at; the
   painted farmyard props above are the pieces you jump.

   ONE rule holds the whole family together and every piece below obeys it:

       AN ELECTRIC PIECE IS LETHAL EVERYWHERE IT IS SOLID,
       AND ITS OPENING IS EMPTY AIR.

   There is no safe-looking post you are meant to fly through. In a side view
   a lethal upright is a wall for its whole height, so a hazard with a gap in
   the middle CANNOT be one tall frame -- it has to be a piece standing off the
   floor and a piece hanging off the roof with nothing whatever between them.
   That is what elecLadder builds, and it is why nothing here ever draws a
   post across its own opening. Get that wrong and you have a hazard whose
   safe passage is blocked by the thing framing it, which is the definition of
   randomly unavoidable.

   Geometry is in world units with y measured UP from the ground -- the frame
   the collision code already uses. The flip into screen coordinates happens
   once, inside drawElec. So the wire you can see and the segment you die on
   are literally the same two numbers.

   Every piece also declares free(o, band): the clear spans it leaves.
   spawnElec will not place one that leaves less than CLEAR, and ?obtest=1
   re-checks it a few hundred times per tier -- "always leave a clear path" is
   not something to leave to eyeballing. */

const WIRE_R = 9;     // lethal half-thickness of a wire: the drawn core, no more
/* The narrowest opening any electric piece may leave. The bird's box is 142
   tall, so 250 was a shade under two of him -- legal, checkable, and still
   the kind of gap you thread rather than fly through. 330 is nearer two and a
   half, which is the difference between aiming and committing. Raise this
   rather than widening the pieces one at a time: every ladder's gap range is
   clamped to it, so it is the single number that says how tight this game is
   willing to be. */
const CLEAR  = 330;
const RUNG   = 66;    // wire spacing in a ladder. Well under the bird's 142 of
                      // height, so a rung gap can never read as a way through.

/* A live wire down a post that is lethal.

   Bare timber reads as scenery -- it is the fence you have been flying over
   all game -- so an upright that kills while looking like a fence post is the
   game lying to the player, however honest the hitbox is. Every post that
   appears in `solids` gets one of these running its full height, which puts
   the crackle on the whole lethal shape instead of only the bit strung
   between two posts.

   It costs nothing in collision: each of these sits inside the post's own
   solid box, wire radius included, so it changes what you SEE and never what
   you hit. Inset from both ends so it terminates on the insulators rather
   than running off into the ground. */
function postWire(x, y0, y1){ return [x, y0+6, x, y1-6, 1]; }

/* --- a live wire ---------------------------------------------------------
   A glow, a core that will not hold still, and a charge running along it.
   The jitter is hashed off (seed, quantised t) rather than random, so it
   flickers at a fixed 24Hz instead of shimmering at whatever the frame rate
   is -- which is the difference between reading as electricity and reading as
   noise. Endpoints are pinned so the wire never leaves its insulators.

   `thin` is the version that runs UP A POST rather than between two of them.
   It exists because the full-fat wire is 26 units of glow and `e_posttall` is
   34 units wide: drawn at full strength the post disappeared inside its own
   electricity and every upright became a featureless blue tube. The point of
   marking a post live is that you can see it is a POST and that it will kill
   you -- lose the timber and the farm goes with it. So the post version is a
   thread with the same colour, the same flicker and the same arcs, at about a
   third the weight. */
function drawWire(x0,y0,x1,y1, t, seed, thin){
  const dx=x1-x0, dy=y1-y0, L=Math.hypot(dx,dy)||1;
  const nx=-dy/L, ny=dx/L, ux=dx/L, uy=dy/L;
  const n = Math.max(3, Math.min(20, Math.round(L/28)));
  const k = Math.floor(t*24);
  const g1 = thin ? 11 : 26, g2 = thin ? 5.5 : 13;
  const c1 = thin ? 3.4 : 7, c2 = thin ? 1.5 : 3, amp = thin ? 3.0 : 7.5;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(x0,-y0); ctx.lineTo(x1,-y1);
  ctx.strokeStyle='rgba(110,222,255,0.13)'; ctx.lineWidth=g1; ctx.stroke();
  ctx.strokeStyle='rgba(150,240,255,0.28)'; ctx.lineWidth=g2; ctx.stroke();
  ctx.beginPath();
  for(let i=0;i<=n;i++){
    const u=i/n, live=(i===0||i===n)?0:1;
    const j=(hash(seed + i*7.13 + k*3.71)-0.5)*amp*live;
    const x=x0+dx*u+nx*j, y=y0+dy*u+ny*j;
    if(i) ctx.lineTo(x,-y); else ctx.moveTo(x,-y);
  }
  /* An ink rim under the core, because a zapper IS its wire and cyan on a
     bright blue sky is the lowest-contrast pairing in the game. Everything
     else here is drawn with the same dark outline, so this both reads at
     speed and stops the wire looking like a different game's asset. The glow
     is already down, so the rim goes over it and under the core. */
  ctx.strokeStyle=C.ink; ctx.lineWidth=c1+4.5; ctx.stroke();
  ctx.strokeStyle='#4CCFFF'; ctx.lineWidth=c1; ctx.stroke();
  ctx.strokeStyle='#EDFCFF'; ctx.lineWidth=c2; ctx.stroke();
  // forks, on and off at the same 24Hz, so the wire looks like it is arcing
  for(let f=0; f<(thin?1:2); f++){
    if(hash(seed + f*31.7 + k*1.93) > (thin?0.30:0.42)) continue;
    const u=hash(seed + f*11.3 + k*5.11), side=hash(seed + f*17.9 + k*2.31)<0.5?-1:1;
    const bx=x0+dx*u, by=y0+dy*u, a=side*((thin?6:10)+hash(seed+f*3.3+k)*(thin?7:13));
    ctx.beginPath(); ctx.moveTo(bx,-by);
    ctx.lineTo(bx+nx*a*0.55-ux*6, -(by+ny*a*0.55));
    ctx.lineTo(bx+nx*a+ux*9,      -(by+ny*a));
    ctx.strokeStyle='#EDFCFF'; ctx.lineWidth=thin?1.7:2.6; ctx.stroke();
  }
  // the charge itself, so the wire is obviously live even standing still
  const u=(t*0.55 + hash(seed)) % 1, bx=x0+dx*u, by=y0+dy*u;
  ctx.beginPath(); ctx.arc(bx,-by,thin?6:12,0,TAU); ctx.fillStyle='rgba(160,244,255,.30)'; ctx.fill();
  ctx.beginPath(); ctx.arc(bx,-by,thin?2.6:5,0,TAU);  ctx.fillStyle='#FFFFFF'; ctx.fill();
}

/* Painted hardware. y is the foot and h the height; the width comes from the
   art's own aspect so a post is never stretched to fit. flip hangs the piece
   downward from y instead, which is how the gate frame ends up over the
   opening. Missing art falls back to a plain post -- an electric piece with no
   image still has to show where it stands. */
function drawHW(name, x, y, h, flip){
  const im = PROPS[name];
  ctx.save(); ctx.translate(x, -y);
  if(flip) ctx.scale(1,-1);
  if(im && im.complete && im.naturalWidth){
    const w = h*(im.naturalWidth/im.naturalHeight);
    ctx.drawImage(im, -w/2, -h, w, h);
  } else {
    ctx.beginPath(); ctx.rect(-13,-h,26,h); paint('#8E6534',5);
  }
  ctx.restore();
}

/* An electric piece describes itself once, in build(), and everything else
   reads that: the drawing, the collision and the near-miss meter. Three kinds
   of lethal thing come out of it --
     wires   [x0,y0,x1,y1]   the glowing segments
     solids  [x0,y0,x1,y1]   the painted hardware's own boxes
     discs   [cx,cy,r]       a rotor, collided as the circle it sweeps
   -- and hw is the painted hardware to draw, which is decoration only: it is
   listed in solids when it is meant to kill, and never otherwise. */
function elecSpec(def){
  (def.art||[]).forEach(loadProp);
  return {
    kind:'elec', elec:true, tier:def.tier, hw:def.hw, w:def.hw*2, h:def.h||200,
    ladder:def.ladder||null, zap:def.zap||null, top:def.top||0,
    build:def.build, free:def.free,
    draw(o,t){ drawElec(o,t); },
    hit(o,l,r,b,t){ return elecDist(o,l,r,b,t) <= 0; },
    gapTo(o,l,r,b,t){ return elecDist(o,l,r,b,t); }
  };
}
/* Distance from the bird's box to the nearest lethal part, negative on a hit.
   The box arrives in world coordinates; everything a piece builds is relative
   to o.x, so the box is what moves into the piece's frame, not the other way
   round -- one subtraction instead of one per segment. */
function elecDist(o, l, r, b, t){
  const p = o.spec.build(o, game.t);
  const L=l-o.x, R=r-o.x;
  let d = 1e9;
  for(const w of p.wires)  d = Math.min(d, segBoxDist(w[0],w[1],w[2],w[3], L,b,R,t) - WIRE_R);
  if(p.solids) for(const q of p.solids) d = Math.min(d, boxBoxDist(q[0],q[1],q[2],q[3], L,b,R,t));
  if(p.discs)  for(const c of p.discs)  d = Math.min(d, discBoxDist(c[0],c[1],c[2], L,b,R,t));
  return d;
}
function drawElec(o, t){
  const p = o.spec.build(o, t);
  if(p.shadow) shadowEllipse(p.shadow, 0.40);   // only the pieces that stand on it
  for(const h of p.hw) drawHW(h.a, h.x, h.y, h.h, h.flip);
  /* `d` is the piece's length ALONG ITS OWN AXIS, and the other dimension
     follows from the art. Scaling d by the aspect ratio instead drew the
     260x60 bar 1057 units long -- four times the hitbox it turns inside, which
     is the one failure this obstacle set is not allowed to have. */
  if(p.spin) for(const sp of p.spin){
    ctx.save(); ctx.translate(sp.x, -sp.y); ctx.rotate(sp.rot);
    const im = PROPS[sp.a];
    if(im && im.complete && im.naturalWidth){
      const h = sp.d*(im.naturalHeight/im.naturalWidth);
      ctx.drawImage(im, -sp.d/2, -h/2, sp.d, h);
    } else { ctx.beginPath(); ctx.rect(-sp.d/2,-9,sp.d,18); paint('#B9C4CE',5); }
    ctx.restore();
  }
  for(let i=0;i<p.wires.length;i++){
    const w = p.wires[i];
    drawWire(w[0],w[1],w[2],w[3], t, (o.seed||0) + i*13.7, w[4]);
  }
  /* The swept circle, drawn as hard as the wires are. A rotor kills over its
     whole disc, so a faint ring next to a wire that crackles would be telling
     the player the blades are the safer of the two. Same palette, same arcing,
     read at a glance as the same kind of death. */
  if(p.discs) for(const c of p.discs){
    const k = Math.floor(t*24);
    ctx.beginPath(); ctx.arc(c[0],-c[1],c[2],0,TAU);
    ctx.strokeStyle='rgba(110,222,255,0.16)'; ctx.lineWidth=20; ctx.stroke();
    ctx.strokeStyle='rgba(150,240,255,0.42)'; ctx.lineWidth=9;  ctx.stroke();
    ctx.strokeStyle='#7FE6FF'; ctx.lineWidth=3.5; ctx.stroke();
    for(let f=0; f<3; f++){                    // sparks running round the rim
      const a = hash((o.seed||0) + f*23.1 + k*1.7)*TAU;
      const x = c[0]+Math.cos(a)*c[2], y = c[1]+Math.sin(a)*c[2];
      ctx.beginPath(); ctx.arc(x,-y,4.5,0,TAU); ctx.fillStyle='#FFFFFF'; ctx.fill();
    }
  }
}

/* --- the pieces you go OVER ---------------------------------------------
   Solid from the floor up with a live wire across the top. The corridor is
   everything above them, so they are the ones that make you climb. */
/* --- the zapper: a wire, and nothing else --------------------------------
   Jetpack Joyride's one great obstacle, and the answer to a set that had
   started to read as one fence at different heights. A length of live wire
   with an insulator at each end, hung anywhere in the column at any angle,
   with clear air on both sides of it.

   Nothing about a zapper is fixed by its type. The angle, the length, the
   height and the drift are rolled at spawn and then CHECKED: a roll that does
   not leave a real corridor is thrown away and rolled again rather than
   placed. "Anywhere in the column" and "always a way past" both have to be
   true, and only one of them survives being assumed.

   The check also refuses the in-between. A side is either a corridor you can
   fly or it is plainly shut -- never the 200 units that look flyable and are
   not, which is the shape of every unfair obstacle ever shipped. */
function zapper(tier, z){
  return elecSpec({ tier, hw:z.len[1]*0.5 + 26, h:0, art:['e_bar'], zap:z,
    build(o, t){
      const cy = o.cy + (o.amp ? Math.sin(t*o.spd + o.phase)*o.amp : 0);
      const hx = Math.cos(o.ang)*o.len*0.5, hy = Math.sin(o.ang)*o.len*0.5;
      return {
        hw: [],
        spin: [{ a:'e_bar', x:0, y:cy, rot:-o.ang, d:o.len }],
        /* The insulators are drawn fat and drawn at the ends, so they are
           lethal at the ends. A cap you can fly through is the same lie as a
           post that does not kill. */
        solids: [[-hx-15, cy-hy-15, -hx+15, cy-hy+15],
                 [ hx-15, cy+hy-15,  hx+15, cy+hy+15]],
        wires: [[-hx, cy-hy, hx, cy+hy]]
      };
    },
    /* Measured at the ENDS of the drift, never the middle: a corridor that is
       only open half the time is not a corridor. */
    free(o, band){
      const hy = Math.abs(Math.sin(o.ang))*o.len*0.5 + WIRE_R + 22;
      const lo = o.cy - (o.amp||0) - hy, hi = o.cy + (o.amp||0) + hy;
      return [[0, Math.max(0, lo)], [Math.min(band, hi), band]];
    } });
}
Object.assign(OB, {
  /* Flat and across your path: the one you go over, or under. */
  zap_h: zapper(1, { ang:[0, 0.12],    len:[210, 360] }),
  /* Stood on its end. The same wire asking a completely different question --
     this one is about which side of the column you want to be on. */
  zap_v: zapper(2, { ang:[1.45, 1.57], len:[190, 280] }),
  /* On the diagonal, which reads as a trap and is not one. */
  zap_d: zapper(3, { ang:[0.45, 1.05], len:[220, 340] }),
  /* And one that will not hold still. Fixed rate through a fixed range, so it
     is learnable on sight, and the corridor holds at both ends of the sweep. */
  zap_m: zapper(4, { ang:[0, 0.10],    len:[200, 320], amp:[70, 120] }),
});

/* --- electric corn -------------------------------------------------------
   The crop, wired. Stalks standing on the ground with the current run along
   their tops and up their stems: the one hazard you meet at ground level, and
   the one that says out loud what has happened to this farm.

   Three widths, and the width is the whole of the difference. A single stalk
   drops between two zappers without turning the pattern into a wall; the row
   is 419 units of commitment, a hold rather than a flick. */
/* Electrified corn: the stalks themselves are live, and that is all. There
   used to be a horizontal wire strung across the top of them as well, which
   made every corn hazard read as a fence someone had planted corn behind --
   the one silhouette this obstacle must not have, because the fence pieces are
   a different hazard with a different rule. The crop is the hazard here. */
function cornHazard(tier, art, w, h, stalks){
  const clear = h + 36;
  return elecSpec({ tier, hw:w*0.5 + 14, top:clear, h:clear, art:[art],
    build(){
      const wires = [];
      for(const x of stalks) wires.push(postWire(x, 0, h));
      return { hw:[{ a:art, x:0, y:0, h:h }], shadow:w*0.5,
               solids:[[-w*0.5, 0, w*0.5, h]], wires };
    },
    free(o, band){ return [[clear, band]]; } });
}

/* --- the pieces you go THROUGH -------------------------------------------
   A ladder of wires up from the floor to o.lo, a ladder of wires down from
   the roof to o.hi, and one clear opening between them. The rungs are 66
   apart -- far too tight for a 142-tall bird -- so the one gap that IS big
   enough is the only thing on the piece that looks like a way through, and it
   is. spawnElec picks lo and the gap, and refuses anything under CLEAR.

   This is the one shape the farm had lost. The crate gates that used to be
   here were two independent objects that randomly landed at the same x and
   left whatever slot they happened to leave, which is Flappy Bird; a ladder
   is one object that owns both halves and therefore owns the gap as well. */
function elecLadder(tier, o){
  /* The art list is what registers a piece's images for loading, so a ladder
     that does not declare its own posts and cap gets neither. e_gateframe is
     used by nothing else, so the gate's painted frame was never requested at
     all and quietly fell back to a plain post -- silently, because a missing
     image is a fallback here and not an error. If you add a `cap`, it belongs
     in this list too. */
  return elecSpec({ tier, hw:o.hw,
    art: ['e_posttall'].concat(o.cap ? [o.cap] : []),
    ladder:{ lo:o.lo, gap:o.gap, rung:o.rung||RUNG, cap:o.cap||null },
    build(ob){
      const px=o.hw-26, lo=ob.lo||160, hi=ob.hi||(lo+CLEAR), band=ob.band||700;
      const rung=o.rung||RUNG, wires=[], solids=[], parts=[];
      parts.push({a:'e_posttall',x:-px,y:0,h:lo},{a:'e_posttall',x:px,y:0,h:lo});
      solids.push([-px-17,0,-px+17,lo],[px-17,0,px+17,lo]);
      wires.push(postWire(-px, 0, lo), postWire(px, 0, lo));
      for(let y=lo-16; y>14; y-=rung) wires.push([-px,y, px,y]);
      const uh = band-hi;
      if(o.cap) parts.push({a:o.cap,x:0,y:band,h:Math.min(uh,214),flip:true});
      parts.push({a:'e_posttall',x:-px,y:band,h:uh,flip:true},
                 {a:'e_posttall',x:px,y:band,h:uh,flip:true});
      solids.push([-px-17,hi,-px+17,band],[px-17,hi,px+17,band]);
      wires.push(postWire(-px, hi, band), postWire(px, hi, band));
      for(let y=hi+16; y<band-14; y+=rung) wires.push([-px,y, px,y]);
      return { hw:parts, wires, solids };
    },
    free(ob,band){ return [[ob.lo||0, ob.hi||band]]; } });
}

  e_gate:   elecLadder(3, { hw:132, lo:[140,300], gap:[350,410], cap:'e_gateframe' }),
  /* Multi-level: every rung filled, so the one gap is the only read. */

/* Four families, and every one of them is wire. */
const ZAP_KEYS   = ['zap_h','zap_v','zap_d','zap_m'];
const CORN_KEYS  = ['corn_one','corn_clump','corn_row'];
const FENCE_KEYS = ['e_fence','e_wire'];
const LAD_KEYS   = ['e_double','e_gate','e_multi','e_g2a'];

/* ============================================================
   PARALLAX LAYERS — baked once per resize
   ============================================================ */
const layers = [];
/* Full-screen gradients are shaded per pixel every single time they are
   filled, and the sky, the wall's top fade and the vignette are all
   full-screen and identical frame to frame. Paint each once into a bitmap and
   blit it after that. Turning the vignette off alone was worth 18% of the
   frame, which is roughly what the blit saves. Cleared by resize(). */
const SURF = new Map();
function surface(key, w, h, opaque, drawFn){
  const q = SCALE*DPR;
  const k = key+'|'+Math.round(w)+'x'+Math.round(h)+'|'+q.toFixed(3);
  let s = SURF.get(k);
  if(!s){
    if(SURF.size > 10) SURF.clear();
    const c = document.createElement('canvas');
    c.width  = Math.max(1, Math.round(w*q));
    c.height = Math.max(1, Math.round(h*q));
    const g = c.getContext('2d', { alpha: !opaque });
    g.scale(q, q);
    drawFn(g, w, h);
    s = c; SURF.set(k, s);
  }
  return s;
}
function makeLayer(w, h, drawFn){
  const c = document.createElement('canvas');
  c.width = Math.round(w*SCALE*DPR); c.height = Math.round(h*SCALE*DPR);
  const g = c.getContext('2d');
  g.scale(SCALE*DPR, SCALE*DPR); g.translate(0, h);   // y=0 at the layer's baseline
  drawFn(g, w, h);
  return { canvas:c, w, h };
}
function buildLayers(){
  layers.length = 0;
  buildFarmLayers(2400);
}
function buildFarmLayers(TW){
  // The painted panels are the farm's middle distance. These coloured layers
  // are the fallback for when the art has not loaded -- drawn as well, they
  // stack a second farm behind the first and its hills show through the fade.
  if(bgReady()) return;
  // far: rolling hills
  layers.push({ f:0.10, y:0, tile: makeLayer(TW, 620, (g)=>{
    g.fillStyle=C.far; g.beginPath(); g.moveTo(0,0);
    for(let x=0;x<=TW;x+=20){
      const h = 150 + Math.sin(x*0.0042)*70 + Math.sin(x*0.0011+1.3)*95;
      g.lineTo(x,-h);
    }
    g.lineTo(TW,0); g.closePath(); g.fill();
  })});
  // mid: fields with a barn, a silo and lit windows
  layers.push({ f:0.28, y:0, tile: makeLayer(TW, 620, (g)=>{
    g.fillStyle=C.mid; g.beginPath(); g.moveTo(0,0);
    for(let x=0;x<=TW;x+=20){
      const h = 96 + Math.sin(x*0.0075+2.1)*46 + Math.sin(x*0.0019)*40;
      g.lineTo(x,-h);
    }
    g.lineTo(TW,0); g.closePath(); g.fill();
    for(let i=0;i<3;i++){
      const x = 240 + i*760 + hash(i*5.1)*180;
      g.fillStyle='#3A2A22';
      g.beginPath(); g.rect(x,-150,150,150); g.fill();
      g.beginPath(); g.moveTo(x-16,-150); g.lineTo(x+75,-216); g.lineTo(x+166,-150); g.closePath(); g.fill();
      g.fillStyle='rgba(255,196,107,.34)'; g.fillRect(x+54,-96,42,58);
      g.fillStyle='#3A2A22';
      g.beginPath(); g.rect(x+196,-190,58,190); g.fill();
      g.beginPath(); g.arc(x+225,-190,29,Math.PI,0); g.fill();
    }
  })});
  // near: hedgerow and a post fence
  layers.push({ f:0.54, y:0, tile: makeLayer(TW, 620, (g)=>{
    g.fillStyle=C.near;
    let x=0,i=300;
    while(x<TW){
      const w=150+hash(i)*120, h=110+hash(i*1.7)*90;
      g.beginPath(); g.ellipse(x+w/2,-h*0.4,w*0.56,h*0.62,0,0,TAU); g.fill();
      x += w*0.82; i++;
    }
    g.fillStyle='rgba(27,44,34,.9)';
    for(let fx=0; fx<TW; fx+=104){
      g.fillRect(fx,-70,11,70);
      g.fillRect(fx,-58,104,9); g.fillRect(fx,-32,104,9);
    }
  })});
}

/* physics */
/* Hold to flap. Gravity always pulls; a held wing beats it. Nothing here is a
   jetpack — the lift comes in pulses on the downstroke, so altitude is something
   you keep working at rather than something you switch on. */
/* Jetpack Joyride flight, and nothing else layered on top:
     hold  -> continuous upward thrust, for as long as it is held
     release -> thrust stops at once, gravity takes over
   No jump impulse, no fixed jump height, no tap-to-jump. Altitude is controlled
   purely by how long you hold. Smoothness comes from acceleration plus drag,
   never from an impulse. */
/* How fast the whole game runs. Jetpack Joyride pace: the world has to whip
   past, not drift. Raising the scroll speed on its own would only shorten the
   time you get to react, so the vertical model is scaled with it -- speeds by
   PACE, accelerations by PACE^2 -- which leaves every arc, gap and corridor
   exactly the same shape in space and simply plays it faster. Hazard spacing
   is in seconds, so the cadence stays put too. ?pace=N to try another. */
const PACE = (() => { const m = /[?&]pace=([0-9.]+)/.exec(location.search);
                      return m ? clamp(parseFloat(m[1]), 0.4, 4) : 1.85; })();
const GRAV = 2500*PACE*PACE, FLAP_HZ = 4.6*PACE;
/* Air drag is what makes flight feel smooth: velocity eases toward a terminal
   value instead of ramping linearly into a hard clamp. Terminal speeds land at
   about +/-1000, reached over ~0.4s. */
const DRAG = 2.6*PACE;
/* Jetpack Joyride mechanics: holding applies CONSTANT lift, not pulses.
   Pulsed lift made a hold feel like it was not registering, so players tapped
   instead of holding. The wingbeat is now purely visual. */
const THRUST = 5200*PACE*PACE;             // continuous while held, vs gravity
const VY_UP = -1500*PACE, VY_DOWN = 1500*PACE;   // rails only; drag sets the real terminal
/* Every press also lands an instant impulse, so a quick tap lifts even if the
   finger is gone before the downstroke completes. */

function spark(x,y,n,opt){
  opt=opt||{};
  for(let i=0;i<n;i++){
    const a = opt.a0!==undefined ? rnd(opt.a0,opt.a1) : rnd(0,TAU);
    const sp = rnd(opt.s0||60, opt.s1||260);
    game.parts.push({
      x,y, vx:Math.cos(a)*sp + (opt.vx||0), vy:Math.sin(a)*sp + (opt.vy||0),
      life:rnd(opt.l0||0.25,opt.l1||0.7), t:0,
      r:rnd(opt.r0||3,opt.r1||8), col:opt.col||C.cream,
      g:opt.g===undefined?900:opt.g, kind:opt.kind||'dot',
      rot:rnd(0,TAU), vr:rnd(-9,9), drag:opt.drag||0.86
    });
  }
}

function tierNow(){
  const t = game.runT;
  if(t<9)  return 0;      // learn the one control
  if(t<22) return 1;      // the whole cast, spaced out
  if(t<40) return 2;      // the big props and the falling ones
  if(t<64) return 3;      // two hazards at a time
  return 4;
}
/* Difficulty is speed, spacing and how many hazards share a screen -- never
   withholding the art. */
/* Every hazard is a single kind now -- an electric piece standing on the
   ground, describing its own geometry. The rolling props, the flock that
   floated at a height of its own, and the things that fell out of the sky
   were three more kinds, and each had a branch here, one in the update loop
   and one in the draw. They went with the props. */
function spawnOne(key, aheadTime){
  const spec = OB[key];
  const closure = game.speed;
  const lead = Math.max(aheadTime||0, (VW - PX + 160)/closure);
  const o = {
    key, spec, x: player.x + closure*lead,
    kind: spec.kind, w: spec.w, h: spec.h, base:0,
    y:0, rot:0, passed:false, minGap:1e9, counted:false
  };
  game.obstacles.push(o);
  return o;
}

/* Placing an electric piece is the one spawn that gets checked rather than
   just done. The ladders choose their own opening, and an opening under CLEAR
   is a hazard with no way through it -- so the gap is picked first, the floor
   of the opening is then clamped into whatever room that leaves, and the band
   is stashed on the object because build() needs to know where the roof is.
   Doing it the other way round (floor first, gap into the remainder) is what
   produces a legal-looking piece with a 90px slot on a short screen. */
function spawnElec(key, aheadTime){
  const spec = OB[key], band = GROUND - CEIL;
  const o = spawnOne(key, aheadTime);
  o.band  = band;
  o.seed  = hash(o.x*0.017)*97;      // per-piece, so two on screen do not flicker as one
  o.phase = hash(o.x*0.031)*TAU;     // and two rotors are never in step
  if(spec.ladder){
    const d   = spec.ladder;
    /* The opening has to clear whatever is flying through it, and the basket
       is over twice the bird's height -- an opening that was generous on foot
       is a squeeze in it. */
    const clr = riding() ? CLEAR_RIDE : CLEAR;
    const gap = clamp(rnd(d.gap[0], d.gap[1]), clr, Math.max(clr, band-180));
    o.lo = clamp(rnd(d.lo[0], d.lo[1]), 80, Math.max(80, band-gap-80));
    o.hi = o.lo + gap;
    o.h  = band;                     // eggs keep out of the whole column
  } else if(spec.zap){
    rollZap(o, spec.zap, band);
    o.h = band;
  } else {
    o.h = spec.top;
  }
  return o;
}
/* Roll a zapper until it leaves somewhere to fly, then stop.

   Rejection sampling rather than arithmetic, because the constraint is not a
   range you can solve for: the angle changes how much vertical room the wire
   eats, the drift changes it again, and both are rolled. Twenty tries is far
   more than enough -- most rolls pass first time -- and the last of them is a
   guaranteed-legal flat wire low in the column, so this cannot fail to place
   something even on a screen too short for the fun ones.

   The rule it enforces is the one the whole set runs on: a side is either a
   corridor of at least CLEAR, or it is under SHUT and reads as no way through
   at all. In between is the gap that looks flyable and is not. */
const SHUT = 150;
function rollZap(o, z, band){
  for(let n=0; n<20; n++){
    const ang = rnd(z.ang[0], z.ang[1]) * (Math.random()<0.5 ? -1 : 1);
    const len = rnd(z.len[0], z.len[1]);
    const amp = z.amp ? rnd(z.amp[0], z.amp[1]) : 0;
    const hy  = Math.abs(Math.sin(ang))*len*0.5 + WIRE_R + 22 + amp;
    if(hy*2 + CLEAR + 40 > band) continue;             // no room for this one at all
    const cy  = rnd(hy + 30, band - hy - 30);
    const below = cy - hy, above = band - (cy + hy);
    const big = Math.max(below, above), small = Math.min(below, above);
    if(big < CLEAR || (small >= SHUT && small < CLEAR)) continue;
    o.ang = ang; o.len = len; o.amp = amp; o.cy = cy;
    o.spd = amp ? rnd(0.7, 1.15) : 0;
    return o;
  }
  o.ang = 0; o.len = Math.min(z.len[0], 240); o.amp = 0; o.spd = 0;
  o.cy = Math.min(150, band*0.22);
  return o;
}

/* Eggs are laid out in runs you can follow with one held press: a flat line, a
   climb, or an arc. Each candidate is dropped if it lands inside a hazard --
   better a short run than a run that baits you into one. */
const EGG_R = 26;
function eggFree(x, y){
  for(const o of game.obstacles){
    const ow = (o.spec.hw!=null ? o.spec.hw : o.w*0.42) + 54;
    if(Math.abs(o.x - x) > ow) continue;
    /* An electric piece reports its full column height, so this keeps eggs
       out of the whole width of one rather than trying to thread them through
       an opening -- an egg that baits you into a wire is worse than no egg. */
    if(y > -54 && y < o.h + 54) return false;
  }
  return true;
}
function spawnEggs(){
  const band = GROUND - CEIL;
  const n = 5 + (Math.random()*5 | 0);
  const gap = 78;
  const x0 = player.x + game.speed * 1.9;
  const shape = Math.random();
  const lo = 70, hi = band - 140;
  const base = rnd(lo, hi);
  for(let i=0;i<n;i++){
    const t = i/(n-1 || 1);
    let y;
    if(shape < 0.42)      y = base;                                  // a flat line
    else if(shape < 0.72) y = base + Math.sin(t*Math.PI) * 190;      // an arc over
    else                  y = base + t * 190;                        // a climb
    y = clamp(y, lo, hi);
    const x = x0 + i*gap;
    if(!eggFree(x, y)) continue;
    game.eggs.push({ x, y, t: rnd(0,TAU), got:0 });
  }
  game.eggT = rnd(1.5, 2.6);
}
function updateEggs(dt){
  const p = player;
  game.eggT -= dt;
  if(game.eggT <= 0) spawnEggs();
  game.eggStreakT = Math.max(0, game.eggStreakT - dt);
  if(game.eggStreakT <= 0) game.eggStreak = 0;
  for(let i=game.eggs.length-1;i>=0;i--){
    const e = game.eggs[i];
    e.t += dt*3.4;
    if(e.got){                                   // flying to the counter
      e.got += dt*3.2;
      if(e.got >= 1){ game.eggs.splice(i,1); continue; }
      continue;
    }
    if(Math.abs(e.x - p.x) < EGG_R+46 && Math.abs(e.y - (p.y+74)) < EGG_R+62){
      e.got = 0.001;
      game.runEggs++; game.eggBank++;
      game.eggStreak = Math.min(12, game.eggStreak+1); game.eggStreakT = 0.9;
      S.egg(game.eggStreak);
      if(game.eggStreak === 5 || game.eggStreak === 10) S.eggrun(game.eggStreak);
      elEggCount.textContent = game.eggBank;
      elEggCount.classList.remove('pop'); void elEggCount.offsetWidth;
      elEggCount.classList.add('pop');
      spark(e.x, GROUND - e.y, 6, {col:C.gold, s0:90,s1:260, l0:0.2,l1:0.45, r0:2,r1:6, g:220});
      try{ localStorage.setItem('dgh_eggs', String(game.eggBank)); }catch(err){}
      continue;
    }
    if(e.x < cam.x - 200) game.eggs.splice(i,1);
  }
}
/* Turns a second. The painted frames took the spin from a squash to something
   with a lit face and a dark reverse, and at 0.30 -- one turn every three and a
   half seconds -- you never saw it: an egg drifted past having barely moved off
   the frame it entered on. Fast enough to read as spinning is the point of
   having painted it. */
const EGG_SPIN = 1.15;
function drawEggs(){
  const list = FRAME_DATA.egg;
  for(const e of game.eggs){
    const sx = e.x - cam.x;
    if(sx < -80 || sx > VW+80) continue;
    let x = sx, y = GROUND - e.y, sc = 1, a = 1;
    if(e.got){                                   // slides up to the counter
      const k = e.got;
      x = lerp(sx, 34, k*k); y = lerp(y, 34, k*k);
      sc = 1 - k*0.45; a = 1 - k*0.75;
    }
    ctx.save(); ctx.globalAlpha = a;
    ctx.translate(x, y + Math.sin(e.t*0.9)*4);
    let drew = false;
    if(list && FR.ready){
      const fr = list[Math.floor((((e.t*EGG_SPIN) % 1)+1)%1 * list.length) % list.length];
      const im = FR.img[fr.f];
      if(im && im.complete && im.naturalWidth){
        const w = fr.w*SPR*sc, h = fr.h*SPR*sc;
        ctx.drawImage(im, -w/2, -h/2, w, h);
        drew = true;
      }
    }
    if(!drew){
      const wob = Math.abs(Math.cos(e.t*EGG_SPIN*Math.PI));   // same rate as the frames
      ctx.beginPath();
      ctx.ellipse(0, 0, (10+16*wob)*sc, 26*sc, 0, 0, TAU);
      const g2 = ctx.createLinearGradient(-18*sc,-24*sc, 14*sc, 24*sc);
      g2.addColorStop(0,'#FFF0BE'); g2.addColorStop(0.45,'#FFD54A'); g2.addColorStop(1,'#D9901C');
      ctx.fillStyle = g2; ctx.fill();
      ctx.lineWidth = 4*sc; ctx.strokeStyle = '#241043'; ctx.stroke();
    }
    ctx.restore();
  }
}


/* ============================================================
   THE ANGRY CROWS — the game's one homing threat
   ============================================================
   Jetpack Joyride's missiles, in feathers. The point of them is the ALERT and
   not the bird: a hazard that comes at you HORIZONTALLY, faster than the world
   scrolls, is simply unfair unless you are told about it first. So every crow
   spends CROW_WARN seconds as a badge pinned to the right edge of the screen,
   at the height it is going to come in at.

   The badge does two different jobs and looks different doing each:

     TRACKING  amber, slow blink, soft beep -- it is still following your
               altitude, so climbing now only takes the problem with you.
     LOCKED    red, fast blink, a dashed sight-line down the lane and a red
               wash on the right edge -- the height is settled, and the only
               thing that saves you is getting out of that lane.

   The lock is what turns it into a skill: CROW_LOCK seconds of "it is decided,
   now MOVE". Without it the bird would follow you into the floor; with a much
   longer one you would step out of the lane before it ever launched.

   A crow is never in game.obstacles. Obstacles are placed ahead in world x and
   stand still while the player runs onto them; a crow is the opposite of that
   in every respect -- it launches off the right edge of the CAMERA, flies left
   at CROW_SPEED on top of the world's own scroll, and dies off the left. */

const CROW_T0    = 24;      // no crows in the first learning half-minute
const CROW_WARN  = 1.30;    // badge on screen before it launches
const CROW_LOCK  = 0.46;    // ...of which this much has the height already fixed
const CROW_SPEED = 1080*PACE;  // leftward, ON TOP OF the world scroll -- and it
                            // scales with PACE, or ?pace=1.4 makes it the one
                            // slow thing on a fast screen
const CROW_FPS   = 17;      // the four painted frames, as a flap
const CROW_BOB   = 7;       // and the bob is inside the hitbox, so what you see
                            // is exactly what kills you
/* The art overhangs the hitbox on purpose. A wingtip and a tail feather are
   not a hit -- the lethal part is the head and the body, which is the part of
   the bird that reads as solid. CROW_AX/AY are where that lethal centre sits
   inside the frame, measured off the registered sheet, so the box and the
   painted bird cannot drift apart if the art is recut. */
const CROW_DW = 240, CROW_AX = 0.31, CROW_AY = 0.59;
const CROW_HW = 70, CROW_HH = 37;
['crow1','crow2','crow3','crow4','crowhead'].forEach(loadProp);

/* The alert is drawn in SCREEN space -- it is pinned to the edge of the
   display, not to anything in the world -- but the height it points at is a
   world altitude, so it has to go through the same camera the bird does. */
function screenYOf(worldY){
  const Z  = game.zoomOverride || game.zoom;
  const zy = game.zoomOverride ? (GROUND - player.y - 70) : VH*0.55;
  return (GROUND - worldY - zy)*Z + zy + cam.shakeY + game.camY;
}
/* The heights a crow may take. Both ends are deliberately past where the
   player can actually get to: a lane that stopped 120 short of the ceiling
   meant a bird aiming at a ceiling-hugging chicken got clamped to a height
   that missed him by a body, so camping the roof was a free pass through
   every volley -- and the volley suppresses the pattern spawner, so the sky
   he was camping in was empty too. Clamped to these, the crow's box still
   overlaps his at either extreme, which is the property that matters. */
const crowLane = () => [40, (GROUND-CEIL) - 10];

/* A crow is only fair in clear air. It is the one horizontal hazard in a game
   made of vertical ones, and overlapping the two asks for a dodge that may not
   exist -- thread the wire AND leave the lane at the same instant.

   But "clear air" is NOT the field ahead. The first version of this asked for
   an empty horizon and so the crows never flew once: the pattern spawner
   always has something out there, by design. What has to be clear is the
   stretch of field the player will be standing in when the birds ARRIVE,
   which is two and a half seconds away and moving away at game.speed. That is
   a window of about a second and a half, it opens and closes as the run goes
   on, and looking for it every 0.3s finds one within a few seconds. */
function crowFlightTime(){ return (VW - PX + 260)/(CROW_SPEED + game.speed); }
function crowSpan(){ return CROW_WARN + crowFlightTime(); }
/* Past this far into a run a volley is never a single bird again.

   Distance and not game.diff, which is what every other difficulty decision
   here keys off. The two are close cousins -- diff climbs with runT and the
   speed climbs with diff -- but they answer different questions. game.diff is
   "how fast is this going", and it saturates: a player who is still alive at
   three minutes is at the same diff as one at two. Distance is "how long have
   you been getting away with this", and it never stops climbing, which is the
   right shape for the one hazard that is meant to eventually outnumber you.
   It is also the number on the score card, so a player can see the threshold
   coming rather than just feeling the game get worse. */
const CROW_FLOCK_M = 1500;
const crowFloor = () => game.dist >= CROW_FLOCK_M*10 ? 2 : 1;
function crowVolleySize(){
  /* One bird is a dodge. Two is a dodge you have to hold, because the second
     badge locks onto wherever the first one chased you. Three is the same
     trick again with nowhere left to have gone. */
  if(game.dist >= CROW_FLOCK_M*10) return Math.random() < 0.40 ? 3 : 2;
  return (game.diff > 0.82 && Math.random() < 0.20) ? 3
       : (game.diff > 0.50 && Math.random() < 0.42) ? 2 : 1;
}
function crowWindowClear(n){
  const span = crowSpan();
  const lo = player.x + game.speed*(span - 0.75);
  const hi = player.x + game.speed*(span + (n-1)*0.70 + 0.60);
  for(const o of game.obstacles) if(o.x > lo && o.x < hi) return false;
  return true;
}

function launchCrows(n){
  n = n || crowVolleySize();
  for(let i=0;i<n;i++){
    game.crows.push({
      state:'wait', wait: i*0.70, warnT: CROW_WARN, beepT: 0,
      ty: clamp(player.y + 72, crowLane()[0], crowLane()[1]),
      x: 0, y: 0, t: rnd(0,10), seed: (Math.random()*4)|0,
      spec:{}, kind:'air', base:0, minGap:1e9, counted:false, hitBy:false,
      crow:true                        // die() plays a different death for these
    });
  }
  /* And hold the pattern spawner off long enough that it cannot drop a new
     hazard into the window that was just measured as clear. */
  const span = (n-1)*0.70 + crowSpan();
  game.spawnT = Math.max(game.spawnT, span + 0.30);
  game.crowT  = span + rnd(6.5, 11.0) * lerp(1, 0.60, game.diff) * CROW_GAP;
}

function updateCrows(dt){
  const p = player, lane = crowLane();
  if(game.mode === 'play'){
    game.crowT -= dt;
    if(game.crowT <= 0){
      /* The size is chosen ONCE and then kept until it can be flown, because
         re-rolling it every retry quietly selects for whichever size happens
         to fit -- and a three-bird volley needs the widest window of all. */
      if(!game.crowN){ game.crowN = crowVolleySize(); game.crowWait = 0; }
      /* The size is chosen when the timer comes up and then held while it
         waits for a window, which can be seconds -- long enough to cross the
         threshold in between. Re-floor it here, BEFORE the window is measured,
         or a single bird chosen at 1490m flies at 1520m and the rule is not
         the rule. Raising it after the check would be worse: the window would
         have been measured for a volley smaller than the one that flew. */
      if(game.crowN < crowFloor()) game.crowN = crowFloor();
      if(game.runT >= CROW_T0*CROW_GAP && !game.crows.length &&
         crowWindowClear(game.crowN)){ launchCrows(game.crowN); game.crowN = 0; }
      else {
        game.crowT = 0.30;                     // not yet -- ask again in a moment
        /* The window a volley needs grows with the volley, so the big ones can
           sit here waiting while a single bird would have flown long ago. Once
           every volley past 1500m is at least two, that wait is no longer an
           edge case -- so a size that cannot find its window gives up a bird
           rather than letting the flock never arrive. Never below the floor
           the distance has set: the point of the rule is that it holds. */
        game.crowWait += 0.30;
        if(game.crowWait > 4 && game.crowN > crowFloor()){
          game.crowN--; game.crowWait = 0;
        }
      }
    }
  }
  for(let i=game.crows.length-1;i>=0;i--){
    const c = game.crows[i];
    c.t += dt;
    if(c.state === 'wait'){                    // its turn in the volley
      c.wait -= dt;
      if(c.wait <= 0) c.state = 'warn';
      continue;
    }
    if(c.state === 'warn'){
      /* A bird that has launched flies on through the death animation, but one
         still winding up is dropped: a siren counting down over the score card
         is a promise the run cannot keep. */
      if(game.mode !== 'play'){ game.crows.splice(i,1); continue; }
      c.warnT -= dt;
      const locked = c.warnT <= CROW_LOCK;
      if(!locked && game.mode === 'play')      // still following your altitude
        c.ty = damp(c.ty, clamp(p.y + 72, lane[0], lane[1]), 5.5, dt);
      c.beepT -= dt;
      if(c.beepT <= 0){ S.alert(locked); c.beepT = locked ? 0.13 : 0.27; }
      if(c.warnT <= 0){
        c.state = 'fly';
        c.x = cam.x + VW + 190;                // off the right edge of the CAMERA
        c.y = c.ty;
        S.caw();
        if(navigator.vibrate) try{ navigator.vibrate(18); }catch(e){}
      }
      continue;
    }
    // ---- flying ----
    c.x -= CROW_SPEED*dt;
    if(c.hitBy){                               // it got him, and it is not sorry
      c.spin = (c.spin||0) + dt*2.4;
      c.y += Math.sin(c.t*9)*60*dt;
    } else {
      c.y = c.ty + Math.sin(c.t*13)*CROW_BOB;
    }
    c.base = c.y;                              // nearMiss reads this
    if(Math.random() < dt*24)
      featherBurst(c.x + 60, GROUND - c.y + rnd(-16,16), 1, 70);
    // collision -- the same forgiving 8px the block hazards get
    const pl=p.x-48, pr=p.x+48, pb=p.y+8, pt=p.y+150;
    const overlapX = pr > c.x-CROW_HW && pl < c.x+CROW_HW;
    if(overlapX && !c.hitBy && game.mode === 'play'
       && pt > c.y-CROW_HH+8 && pb < c.y+CROW_HH-8) die(c);
    if(overlapX){
      const gap = (pb > c.y) ? (pb - (c.y+CROW_HH)) : ((c.y-CROW_HH) - pt);
      if(gap > 0) c.minGap = Math.min(c.minGap, gap);
    }
    if(!c.counted && c.x < p.x-30){
      c.counted = true;
      const near = c.minGap < 78 && c.minGap > 0;
      S.crowpass(near);                // doppler: it sounds different once it is past
      if(near && game.mode === 'play') nearMiss(c);
    }
    if(c.x < cam.x - 340) game.crows.splice(i,1);
  }
}

/* The bird. Four painted frames off the Gemini sheet, registered on the beak
   so the head holds still and only the wings beat -- and a drawn one under it
   in case the art has not landed yet, which is the bargain every hazard in
   this game makes: art can never be the reason you did not see one coming. */
function drawCrowBody(c){
  const k  = (Math.floor(c.t*CROW_FPS) + c.seed) & 3;
  const im = PROPS['crow'+(k+1)];
  if(im && im.complete && im.naturalWidth){
    const w = CROW_DW, h = w*im.naturalHeight/im.naturalWidth;
    ctx.drawImage(im, -w*CROW_AX, -h*CROW_AY, w, h);
    return;
  }
  const flap = Math.sin(c.t*CROW_FPS*1.6);
  ctx.save(); ctx.scale(-1,1);               // the flock faces right; this one is inbound
  ctx.beginPath(); ctx.moveTo(-42,-4); ctx.quadraticCurveTo(-20,-34-flap*26, 8,-8);
  ctx.quadraticCurveTo(-14,-2,-42,-4); ctx.closePath(); paint('#2E3340',4.6);
  ctx.beginPath(); ctx.moveTo(-42,-2); ctx.lineTo(-78,-14); ctx.lineTo(-76,8);
  ctx.closePath(); paint('#2E3340',4.4);
  ctx.beginPath(); ctx.ellipse(0,0,46,28,0.05,0,TAU); paint('#414A5C',5);
  ctx.beginPath(); ctx.ellipse(36,-20,22,21,0,0,TAU); paint('#414A5C',5);
  ctx.beginPath(); ctx.moveTo(54,-22); ctx.lineTo(84,-14); ctx.lineTo(54,-6);
  ctx.closePath(); paint('#FF8A3D',3.6);                    // beak, open and shouting
  ctx.beginPath(); ctx.arc(42,-26,6.5,0,TAU); paint('#FFFFFF',2.6);
  ctx.beginPath(); ctx.arc(43.5,-26,3.4,0,TAU); ctx.fillStyle='#E01F3D'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(32,-36); ctx.lineTo(52,-30); ctx.lineTo(50,-25);
  ctx.lineTo(31,-31); ctx.closePath(); paint(C.ink,0);      // the eyebrow does the anger
  ctx.beginPath(); ctx.moveTo(-34,4); ctx.quadraticCurveTo(-10,30+flap*22, 16,6);
  ctx.quadraticCurveTo(-8,12,-34,4); ctx.closePath(); paint('#A8BBD8',4.6);
  ctx.restore();
}
function drawCrows(){
  for(const c of game.crows){
    if(c.state !== 'fly') continue;
    const sx = c.x - cam.x;
    if(sx < -320 || sx > VW+340) continue;
    ctx.save();
    ctx.translate(sx, GROUND - c.y);
    // speed lines off the tail, so it reads as fast even in a screenshot
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = 'rgba(255,242,222,.85)'; ctx.lineWidth = 5; ctx.lineCap='round';
    for(let n=0;n<3;n++){
      const o = (n-1)*30, len = 90 + Math.sin(c.t*20+n)*34;
      ctx.beginPath(); ctx.moveTo(180, o); ctx.lineTo(180+len, o); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.rotate(c.hitBy ? c.spin : Math.sin(c.t*13)*0.05);
    drawCrowBody(c);
    if(HITDBG){
      ctx.strokeStyle='rgba(255,0,220,0.9)'; ctx.lineWidth=2.5;
      ctx.strokeRect(-CROW_HW, -CROW_HH, CROW_HW*2, CROW_HH*2);
    }
    ctx.restore();
  }
}

/* The alert, in screen space, so it sits on the true edge of the display
   however the camera is zoomed, raised or shaken. */
function drawCrowAlerts(){
  /* R is the badge's half-height and everything else is measured off it, so
     the alert can be retuned with one number. It is a share of VH rather than
     a pixel size because VH is the one dimension the layout pins (~980 units
     in any landscape window) while VW stretches from 1450 to well past 2100 --
     a badge in raw pixels reads on a laptop and disappears on a phone. */
  const R = VH*0.086;
  for(const c of game.crows){
    if(c.state !== 'warn') continue;
    const locked = c.warnT <= CROW_LOCK;
    const blink  = 0.55 + 0.45*Math.sin(game.t*(locked?30:15));
    const col    = locked ? C.danger : '#FFB03A';
    const y      = clamp(screenYOf(c.ty), R+16, VH-R-16);
    const x      = VW - R*1.62;
    ctx.save();
    // the edge wash: the side it is coming from goes red
    const w = locked ? VW*0.20 : VW*0.13;
    const g = ctx.createLinearGradient(VW-w, 0, VW, 0);
    g.addColorStop(0, 'rgba(255,69,110,0)');
    g.addColorStop(1, locked ? 'rgba(255,69,110,'+(0.42*blink).toFixed(3)+')'
                             : 'rgba(255,176,58,'+(0.20*blink).toFixed(3)+')');
    ctx.fillStyle = g; ctx.fillRect(VW-w, 0, w, VH);
    // the lane it owns, once the height has stopped moving
    if(locked){
      ctx.globalAlpha = 0.35 + 0.40*blink;
      ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.setLineDash([22,18]);
      ctx.lineDashOffset = -game.t*300;
      ctx.beginPath(); ctx.moveTo(x-R*1.5, y); ctx.lineTo(VW*0.26, y); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    // chevrons walking the way it will come
    for(let n=0;n<3;n++){
      const k  = ((game.t*1.7 + n*0.33) % 1);
      const cx = x - R*1.6 - k*R*1.5;
      ctx.globalAlpha = 0.8*(1-k);
      ctx.strokeStyle = col; ctx.lineWidth = 8; ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(cx+R*0.36, y-R*0.36); ctx.lineTo(cx, y);
      ctx.lineTo(cx+R*0.36, y+R*0.36); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // the badge itself
    ctx.translate(x, y);
    const sc = locked ? 1 + 0.06*Math.sin(game.t*30) : 1;
    ctx.scale(sc, sc);
    ctx.beginPath(); ctx.moveTo(-R*0.92,-R); ctx.lineTo(R, -R); ctx.lineTo(R, R);
    ctx.lineTo(-R*0.92, R); ctx.lineTo(-R*1.44, 0); ctx.closePath();  // a plate with a point
    ctx.fillStyle = 'rgba(21,8,39,.86)'; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 7; ctx.lineJoin='round';
    ctx.globalAlpha = blink; ctx.stroke(); ctx.globalAlpha = 1;
    const head = PROPS.crowhead;
    if(head && head.complete && head.naturalWidth){
      const hw = R*2.05, hh = hw*head.naturalHeight/head.naturalWidth;
      ctx.globalAlpha = 0.6 + 0.4*blink;
      ctx.drawImage(head, -hw*0.48, -hh*0.5, hw, hh);
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = blink;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font = '400 '+Math.round(R*1.25)+'px Bungee, sans-serif';
      ctx.lineWidth = 9; ctx.strokeStyle = C.ink; ctx.lineJoin='round';
      ctx.strokeText('!', 0, 2); ctx.fillStyle = col; ctx.fillText('!', 0, 2);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
}

/* ============================================================
   PATTERNS — sequences, not dice
   ============================================================
   A pattern is a short SEQUENCE of hazards with its spacing written in
   SECONDS, followed by a safe section. Seconds and not pixels, because the
   world speeds up as a run goes on: pixel spacing would quietly tighten every
   pattern into a different pattern, where a second of air is a second of air
   at any speed.

   Difficulty is which patterns have unlocked and how much shorter the safe
   tail has become. It is never a hazard that got harder to see, and never a
   hazard dropped closer than its sequence says -- so a run gets harder in a
   way you can learn rather than in a way you can only be surprised by.

   Reading the table: a string is a token, a number is the seconds of clear
   air before the next one, and `tail` is the safe section after the last one.
   Every pattern is written in tokens rather than keys, so it says what SHAPE
   of hazard it wants and the tier decides which one that is -- which is why
   the table did not have to be rewritten when the roster was. */
const inTier = (keys, tier) => keys.filter(k => OB[k].tier <= tier);

function mkPat(tier, tail, spec){
  const seq=[]; let dt=0;
  for(const it of spec){
    if(typeof it === 'number') dt = it;
    else { seq.push({k:it, dt}); dt = 0; }
  }
  return { tier, tail, seq, corn: spec.indexOf('#corn') >= 0 };
}
