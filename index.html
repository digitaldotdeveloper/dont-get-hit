<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#241043">
<meta name="description" content="One tap. Don't get hit. A fast arcade runner.">
<title>Don't Get Hit</title>
<link rel="preload" as="image" href="art/title.webp">
<!-- Inline, because the only console error on a clean load was the browser
     asking for a favicon.ico nobody had made. An egg, in the game's gold. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='18' rx='10' ry='13' fill='%23FFD54A' stroke='%23241043' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Archivo:wght@500;700;900&display=swap">
<style>
  :root{
    --ink:#241043;
    --ink-2:#150827;
    --plum:#3D1F55;
    --grape:#6E2A6B;
    --coral:#F2684F;
    --amber:#FFB447;
    --gold:#FFD54A;
    --cream:#FFF2DE;
    --mint:#3FE0B0;
    --danger:#FF456E;
    --shadow:0 10px 30px rgba(21,8,39,.55);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--ink-2);overflow:hidden}
  body{
    font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:var(--cream);
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    overscroll-behavior:none;touch-action:none;
  }
  #stage{position:fixed;inset:0;overflow:hidden}
  #game{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;
       padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0}
  #scoreWrap{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);
             transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .25s}
  #hud.on #scoreWrap{opacity:1}
  #scoreLabel{font-size:11px;font-weight:900;letter-spacing:.22em;color:rgba(255,242,222,.62)}
  #score{font-size:clamp(34px,8.5vw,54px);font-weight:900;line-height:.98;
         font-variant-numeric:tabular-nums;letter-spacing:.02em;
         color:var(--cream);text-shadow:0 3px 0 rgba(36,16,67,.85),0 0 26px rgba(255,180,71,.35)}
  #score.pop{animation:pop .18s ease-out}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.13)}100%{transform:scale(1)}}
  #eggWrap{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;
    display:flex;align-items:center;gap:7px;opacity:0;transition:opacity .3s}
  #hud.on #eggWrap{opacity:1}
  /* the same painted egg the pickups are, so the counter and the thing you
     collected are obviously the same object */
  #eggIcon{width:18px;height:23px;
    background:url(art/egg_icon.webp) center/contain no-repeat;
    filter:drop-shadow(0 0 8px rgba(255,213,74,.5))}
  #eggCount{font-family:'Bungee',cursive;font-size:19px;color:#FFD54A;
    text-shadow:0 2px 0 #241043;font-variant-numeric:tabular-nums}
  #eggCount.pop{animation:pop .2s ease-out}
  #bestLine{font-size:11px;font-weight:700;letter-spacing:.18em;color:rgba(255,242,222,.5);
            font-variant-numeric:tabular-nums;margin-top:2px}

  #combo{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 104px);
         transform:translateX(-50%) scale(.6);opacity:0;
         font-family:'Bungee',cursive;font-size:26px;color:var(--mint);
         text-shadow:0 3px 0 rgba(36,16,67,.9);transition:opacity .12s}
  #combo.on{opacity:1;transform:translateX(-50%) scale(1);
            transition:transform .16s cubic-bezier(.2,1.8,.4,1),opacity .12s}

  #mute{position:absolute;right:calc(env(safe-area-inset-right,0px) + 14px);
        top:calc(env(safe-area-inset-top,0px) + 14px);
        pointer-events:auto;width:42px;height:42px;border-radius:14px;
        border:2px solid rgba(255,242,222,.24);background:rgba(36,16,67,.42);
        color:var(--cream);display:grid;place-items:center;cursor:pointer;
        backdrop-filter:blur(6px);padding:0}
  #mute svg{width:20px;height:20px;fill:currentColor}
  #mute:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  #mute .off{display:none}
  #mute.muted .on{display:none}
  #mute.muted .off{display:block}
  #mute.muted{color:rgba(255,242,222,.45)}

  /* ---------- Screens ---------- */
  .screen{position:absolute;inset:0;display:none;flex-direction:column;
          align-items:center;justify-content:center;gap:0;
          padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);
          text-align:center}
  .screen.show{display:flex}

  /* Menu. TWO designs exist, and `POSTER_TITLE` in the script picks one.
     Default (false): the menu is the LIVE SCENE. It sits on the right half and
     leaves the left clear, because that is where he is standing in the cage,
     and watching him wait there is the hook. */
  #menu{justify-content:center;align-items:flex-end;
        padding:calc(env(safe-area-inset-top,0px) + 12px) max(4vw,18px) calc(env(safe-area-inset-bottom,0px) + 12px) 46vw;
        text-align:right}
  /* POSTER_TITLE = true: the painted key art fills the screen instead, with the
     buttons sat in its foreground, and the first press blows it off. */
  body.poster #menu{justify-content:flex-start;align-items:center;text-align:center;
        padding:calc(env(safe-area-inset-top,0px) + 7vh) 24px calc(env(safe-area-inset-bottom,0px) + 24px);
        background:var(--ink-2) url(art/title.webp) center/cover no-repeat}
  /* the poster carries the logo and the line under it, so these stand down */
  body.poster #menu .logo, body.poster #menu .tag{display:none}
  body.poster #menu::after{content:'';position:absolute;left:0;right:0;bottom:0;height:46%;
        pointer-events:none;
        background:linear-gradient(180deg,rgba(21,8,39,0) 0%,rgba(21,8,39,.55) 40%,
                                          rgba(21,8,39,.90) 78%,rgba(21,8,39,.97) 100%)}
  body.poster #menu .menuFoot{position:relative;z-index:1;align-items:center}
  .logo{font-family:'Bungee',cursive;line-height:.86;transform:rotate(-2.5deg);
        filter:drop-shadow(0 8px 0 rgba(36,16,67,.9))}
  .logo .l1{display:block;font-size:clamp(24px,6.8vmin,58px);
            background:linear-gradient(178deg,var(--cream) 12%,var(--gold) 58%,var(--amber) 100%);
            -webkit-background-clip:text;background-clip:text;color:transparent}
  .logo .l2{display:block;font-size:clamp(34px,10vmin,90px);margin-top:.02em;
            background:linear-gradient(178deg,var(--gold) 6%,var(--coral) 62%,var(--danger) 100%);
            -webkit-background-clip:text;background-clip:text;color:transparent}
  /* The menu now sits over the painted farm rather than a flat gradient, so
     every line needs its own contrast -- a scrim would hide the map. */
  .tag{margin:14px 0 0;font-size:11px;font-weight:900;letter-spacing:.16em;
       color:var(--cream);text-shadow:0 2px 0 rgba(21,8,39,.85),0 0 12px rgba(21,8,39,.8)}
  .spacer{flex:0 0 4px}
  .menuFoot{display:flex;flex-direction:column;align-items:flex-end;gap:10px;
            margin-top:14px;padding-bottom:0}
  .hint{margin:0;font-size:11px;font-weight:700;letter-spacing:.24em;color:rgba(255,242,222,.82);
        text-shadow:0 2px 0 rgba(21,8,39,.85),0 0 10px rgba(21,8,39,.75)}
  .rules{display:flex;gap:10px;margin:0 0 2px;flex-wrap:wrap;justify-content:flex-end}
  .rule{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;
        letter-spacing:.04em;color:rgba(255,242,222,.88);
        background:rgba(21,8,39,.72);border:1.5px solid rgba(255,242,222,.18);
        border-radius:999px;padding:5px 10px;backdrop-filter:blur(4px);
        box-shadow:0 3px 10px rgba(21,8,39,.5)}
  .rule b{color:var(--gold);font-weight:900}
  .rule.no b{color:var(--danger)}

  /* ---------- Landscape gate ----------
     The whole game is framed for landscape: a flying game wants lead time in
     front of the bird, and the cage intro is a wide painted scene. Rather than
     re-lay everything out for a tall window, portrait asks for a turn and the
     run is frozen behind it, so rotating mid-run never costs a life. */
  #rotate{position:fixed;inset:0;z-index:60;display:none;
          flex-direction:column;align-items:center;justify-content:center;gap:18px;
          background:linear-gradient(170deg,#13284C,#3D1F55 60%,#150827);
          text-align:center;padding:24px}
  body.portrait #rotate{display:flex}
  #rotate .phone{width:72px;height:118px;border-radius:14px;
                 border:5px solid var(--cream);position:relative;
                 animation:turnit 2.2s ease-in-out infinite}
  #rotate .phone::after{content:"";position:absolute;left:50%;bottom:7px;
                 transform:translateX(-50%);width:26px;height:4px;border-radius:3px;
                 background:var(--cream);opacity:.7}
  @keyframes turnit{0%,22%{transform:rotate(0)}
                    52%,78%{transform:rotate(-90deg)}
                    100%{transform:rotate(-90deg)}}
  #rotate h2{font-family:'Bungee',cursive;font-size:clamp(20px,6vw,30px);margin:0;
             color:var(--gold);text-shadow:0 3px 0 rgba(36,16,67,.9)}
  #rotate p{margin:0;font-size:12px;font-weight:800;letter-spacing:.2em;
            color:rgba(255,242,222,.6)}

  /* Big physical button */
  .big{font-family:'Bungee',cursive;font-size:clamp(20px,5.2vmin,32px);letter-spacing:.05em;
       color:#2A1206;border:0;cursor:pointer;pointer-events:auto;
       padding:18px 54px 20px;border-radius:22px;
       background:linear-gradient(180deg,#FFE27A 0%,var(--gold) 46%,#F5A93A 100%);
       box-shadow:0 8px 0 #B8681B,0 16px 28px rgba(21,8,39,.5);
       transition:transform .07s ease,box-shadow .07s ease}
  .big:active{transform:translateY(7px);box-shadow:0 1px 0 #B8681B,0 6px 14px rgba(21,8,39,.45)}
  .big:focus-visible{outline:3px solid var(--mint);outline-offset:5px}
  .big.pulse{animation:btnPulse 2.2s ease-in-out infinite}
  @keyframes btnPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .ghost{font-family:'Archivo',sans-serif;font-weight:900;font-size:12px;letter-spacing:.22em;
         background:none;border:0;color:rgba(255,242,222,.5);cursor:pointer;pointer-events:auto;
         padding:12px 18px}
  .ghost:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}

  /* Game over card */
  #over{background:radial-gradient(120% 80% at 50% 45%,rgba(36,16,67,.34) 0%,rgba(21,8,39,.78) 70%)}
  .card{width:min(420px,92vw);border-radius:28px;padding:26px 24px 20px;
        background:linear-gradient(180deg,rgba(61,31,85,.94),rgba(29,13,52,.96));
        border:2px solid rgba(255,242,222,.14);box-shadow:var(--shadow);
        display:flex;flex-direction:column;align-items:center;gap:2px;
        animation:cardIn .34s cubic-bezier(.16,1.2,.3,1) both}
  @keyframes cardIn{from{transform:translateY(38px) scale(.94);opacity:0}to{transform:none;opacity:1}}
  .ribbon{display:none;font-family:'Bungee',cursive;font-size:15px;letter-spacing:.06em;
          color:#2A1206;background:linear-gradient(180deg,#FFE27A,var(--gold));
          padding:7px 20px 8px;border-radius:999px;margin-bottom:10px;
          box-shadow:0 5px 0 #B8681B;transform:rotate(-2deg)}
  .card.best .ribbon{display:block;animation:ribbonIn .45s .1s cubic-bezier(.2,1.7,.4,1) both}
  @keyframes ribbonIn{from{transform:rotate(-2deg) scale(.4);opacity:0}to{transform:rotate(-2deg) scale(1);opacity:1}}
  .cardLabel{font-size:11px;font-weight:900;letter-spacing:.28em;color:rgba(255,242,222,.55)}
  .cardScore{font-size:clamp(46px,13vw,66px);font-weight:900;line-height:1;
             font-variant-numeric:tabular-nums;color:var(--gold);
             text-shadow:0 4px 0 rgba(21,8,39,.6)}
  .cardBest{font-size:12px;font-weight:800;letter-spacing:.18em;color:rgba(255,242,222,.6);
            font-variant-numeric:tabular-nums;margin-top:6px}
  .stats{display:flex;gap:0;width:100%;margin:16px 0 18px;
         border-top:1.5px solid rgba(255,242,222,.12);border-bottom:1.5px solid rgba(255,242,222,.12)}
  .stat{flex:1;padding:11px 4px;display:flex;flex-direction:column;align-items:center;gap:3px}
  .stat + .stat{border-left:1.5px solid rgba(255,242,222,.12)}
  .stat .v{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--cream)}
  .stat .k{font-size:9px;font-weight:800;letter-spacing:.14em;color:rgba(255,242,222,.48)}
  .stat.mint .v{color:var(--mint)}

  /* Tutorial */
  #tut{position:absolute;left:50%;bottom:30%;transform:translateX(-50%);
       font-size:12px;font-weight:900;letter-spacing:.26em;color:rgba(255,242,222,.8);
       display:none;align-items:center;gap:10px;pointer-events:none;
       text-shadow:0 2px 6px rgba(21,8,39,.9)}
  #tut.show{display:flex;animation:tutBob 1.15s ease-in-out infinite}
  @keyframes tutBob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-7px)}}
  #tut svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;
           stroke-linecap:round;stroke-linejoin:round}

  #flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}
  body.solo #hud, body.solo #tut, body.solo .screen, body.solo #flash{display:none!important}

  @media (prefers-reduced-motion:reduce){
    .big.pulse,#tut.show{animation:none}
    .card,.ribbon{animation-duration:.01ms}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="flash"></div>

  <div id="hud">
    <div id="scoreWrap">
      <div id="scoreLabel">SCORE</div>
      <div id="score">000000</div>
      <div id="bestLine">BEST 000000</div>
    </div>
    <div id="eggWrap"><span id="eggIcon"></span><span id="eggCount">0</span></div>
    <div id="combo"><span id="comboTxt">x2</span></div>
    <button id="mute" aria-label="Toggle sound">
      <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 2.2v2.1a7.8 7.8 0 0 1 0 15.4v2.1a9.9 9.9 0 0 0 0-19.6z"/></svg>
      <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm17.3-2.3-1.4-1.4L17 8.2l-2.9-2.9v3l1.5 1.5-1.5 1.5v3l2.9-2.9 2.9 2.9 1.4-1.4-2.9-2.9 2.9-2.9z"/></svg>
    </button>
  </div>

  <div id="menu" class="screen show">
    <div class="logo"><span class="l1">DON'T GET</span><span class="l2">HIT</span></div>
    <p class="tag">ONE BUTTON. ONE CHICKEN.</p>
    <div class="spacer"></div>
    <div class="menuFoot">
      <div class="rules">
        <span class="rule"><b>HOLD</b> TO FLAP AND FLY</span>
        <span class="rule no"><b>DON'T</b> HIT ANYTHING</span>
      </div>
      <button id="play" class="big pulse">PLAY</button>
      <p class="hint">HOLD ANYWHERE &nbsp;•&nbsp; SPACE</p>
    </div>
  </div>

  <div id="over" class="screen">
    <div class="card" id="card">
      <div class="ribbon">NEW BEST!</div>
      <div class="cardLabel">SCORE</div>
      <div class="cardScore" id="finalScore">000000</div>
      <div class="cardBest" id="finalBest">BEST 000000</div>
      <div class="stats">
        <div class="stat mint"><span class="v" id="stNear">0</span><span class="k">NEAR MISSES</span></div>
        <div class="stat"><span class="v" id="stCombo">x0</span><span class="k">BEST COMBO</span></div>
        <div class="stat"><span class="v" id="stDist">0m</span><span class="k">DISTANCE</span></div>
      </div>
      <button id="retry" class="big">RETRY</button>
      <button id="tomenu" class="ghost">MAIN MENU</button>
    </div>
  </div>

  <div id="rotate">
    <div class="phone"></div>
    <h2>TURN YOUR PHONE</h2>
    <p>DON'T GET HIT PLAYS IN LANDSCAPE</p>
  </div>

  <pre id="selftest" style="position:fixed;left:0;top:0;z-index:99;color:#0f0;font:11px monospace;background:#000;margin:0;display:none"></pre>
  <div id="tut">
    <svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="m8.5 6.5 3.5-3.5 3.5 3.5"/><circle cx="12" cy="17" r="4"/></svg>
    HOLD TO FLY
  </div>
</div>

<script>
(() => {
'use strict';

/* ============================================================
   DON'T GET HIT — one-tap arcade runner
   Everything is drawn procedurally: no image assets.
   The character is a real skeletal rig (IK legs, FK arms,
   spring-driven hair/jacket) so every animation is a pose,
   not a sprite.
   ============================================================ */

/* ---------- tiny utils ---------- */
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const damp  = (a,b,l,dt)=> a+(b-a)*(1-Math.exp(-l*dt));
const rnd   = (a,b)=> a+Math.random()*(b-a);
const rndi  = (a,b)=> Math.floor(rnd(a,b+1));
const pick  = a => a[(Math.random()*a.length)|0];
const TAU   = Math.PI*2;
const smooth= t => t*t*(3-2*t);
const easeOutBack = t => { const c=1.70158+1; return 1+c*Math.pow(t-1,3)+1.70158*Math.pow(t-1,2); };
const easeOutCubic= t => 1-Math.pow(1-t,3);
const easeInCubic = t => t*t*t;
function hash(n){ const s=Math.sin(n*127.1+311.7)*43758.5453; return s-Math.floor(s); }
function pad6(n){ n=Math.max(0,Math.floor(n)); return String(n).padStart(6,'0'); }

const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ?crow=1 pulls the crow attack forward to the first few seconds and sends
   them back to back, because otherwise every look at one costs half a minute
   of run. It scales the unlock AND the gap and nothing else, so what you are
   looking at is the real thing, sooner. */
const CROW_GAP = /[?&]crow=1/.test(location.search) ? 0.10 : 1;

/* ---------- palette ---------- */
let C = {
  ink:'#241043', ink2:'#150827',
  skyA:'#241043', skyB:'#5E2569', skyC:'#C4485E', skyD:'#F2794A', skyE:'#FFC46B',
  sun:'#FFE9A8',
  far:'#7B4287', mid:'#4E265F', near:'#301648', prop:'#1F0E33',
  road:'#2A1445', roadLine:'#3E2160', curb:'#3A1C57',
  rim:'#FFB447',
  cream:'#FFF2DE', gold:'#FFD54A', coral:'#F2684F', mint:'#3FE0B0', danger:'#FF456E',
  skin:'#F0B183', skinSh:'#D18C60',
  hair:'#1E1426',
  jacket:'#2BC3AD', jacketLit:'#4BEBD2', jacketDark:'#17897A', jacketTrim:'#0F6E63',
  tee:'#FFF2DE',
  pants:'#324B7A', pantsDark:'#22355A',
  shoe:'#FF5E7A', shoeSole:'#FFF2DE'
};

/* ---------- environments ----------
   Two hand-built themes. Everything is drawn in code so the layers tile
   perfectly and nothing extra has to be downloaded. */
/* ONE MAP. The run used to travel -- a leg every 26s, farm -> city -> block,
   crossfaded rather than cut -- and the two other palettes, their layer
   builders, their props, the prison's painted wall and the whole crossfade
   machinery went with it. There is one place now, Cluck County, and the run
   stays in it. If a second map ever comes back, it comes back as its own
   THEME object plus a builder, not as a timer that swaps the world out from
   under the player.

   The sky colours are sampled off the painted panels so the sky the game draws
   and the sky in the art are the same blue -- the panels fade into it rather
   than sitting on it. */
const THEME = {
  id:'farm', name:'CLUCK COUNTY', sunR:0.42, sunGlow:0.34, vig:0.42,
  skyA:'#0B7CF5', skyB:'#1C87F2', skyC:'#3C9BEC', skyD:'#79C2F6', skyE:'#BEE6FF',
  sun:'#FFF3A8', far:'#7FB463', mid:'#5C9A48', near:'#3E7A34', prop:'#2F5A28',
  road:'#BB7D33', roadLine:'#9A6528', curb:'#8E5C24', rim:'#8CC24E'
};
/* Blend two #rrggbb values. Nothing morphs between themes any more; this is
   still what lifts the distant chickens off the background they stand on. */
function lerpHex(a, b, k){
  const A = parseInt(a.slice(1),16), B = parseInt(b.slice(1),16);
  const r = Math.round(((A>>16)&255) + (((B>>16)&255)-((A>>16)&255))*k);
  const g = Math.round(((A>>8)&255)  + (((B>>8)&255) -((A>>8)&255)) *k);
  const bl= Math.round((A&255)       + ((B&255)      -(A&255))      *k);
  return '#' + ((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1);
}
function applyTheme(){
  const t = THEME;
  C.skyA=t.skyA; C.skyB=t.skyB; C.skyC=t.skyC; C.skyD=t.skyD; C.skyE=t.skyE;
  C.sun=t.sun; C.far=t.far; C.mid=t.mid; C.near=t.near; C.prop=t.prop;
  C.road=t.road; C.roadLine=t.roadLine; C.curb=t.curb; C.rim=t.rim;
  if(SCALE) buildLayers();
}

/* ---------- canvas ---------- */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha:false });
if(!ctx.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if(typeof r === 'number') r=[r,r,r,r];
    const [a,b,c2,d]=r;
    this.moveTo(x+a,y); this.lineTo(x+w-b,y); this.quadraticCurveTo(x+w,y,x+w,y+b);
    this.lineTo(x+w,y+h-c2); this.quadraticCurveTo(x+w,y+h,x+w-c2,y+h);
    this.lineTo(x+d,y+h); this.quadraticCurveTo(x,y+h,x,y+h-d);
    this.lineTo(x,y+a); this.quadraticCurveTo(x,y,x+a,y); return this;
  };
}

let DPR=1, CW=0, CH=0, SCALE=1, VW=1300, VH=880, GROUND=0, CEIL=0, PX=0, PORTRAIT=false;
/* The backing store is the only real performance dial in this game. Profiled
   under a 6x CPU throttle the entire script cost 4ms a frame while the frames
   took 120ms -- it is all rasterising, and rasterising is priced in pixels.
   Halving the backing store roughly halves the frame. So render at a modest
   scale and let the measured frame time move it, floor 1x, ceiling 1.75x. */
const DPR_MAX = 1.75, DPR_MIN = 1;
let dprCap = DPR_MAX, perfAcc = 0, perfN = 0, perfCool = 2.5, perfDropped = false;
function perfWatch(raw){
  if(perfCool > 0){ perfCool -= raw; return; }
  perfAcc += Math.min(raw, 0.25); perfN++;
  if(perfN < 48) return;
  const avg = perfAcc/perfN; perfAcc = 0; perfN = 0;
  if(avg > 0.0235 && dprCap > DPR_MIN){          // below ~43fps: give up pixels
    dprCap = Math.max(DPR_MIN, dprCap - 0.25); perfDropped = true; perfCool = 3; resize();
  } else if(avg < 0.0172 && dprCap < DPR_MAX && !perfDropped){
    dprCap = Math.min(DPR_MAX, dprCap + 0.25); perfCool = 3; resize();
  }
}
function resize(){
  CW = cv.clientWidth || window.innerWidth;
  CH = cv.clientHeight || window.innerHeight;
  DPR = Math.min(window.devicePixelRatio||1, dprCap);
  cv.width  = Math.round(CW*DPR);
  cv.height = Math.round(CH*DPR);
  // Keep at least 1450 world-units wide and 980 tall visible -> constant difficulty.
  // LANDSCAPE ONLY. There is one framing, and a portrait window is asked to
  // turn rather than laid out again: the escape is a wide painted scene and the
  // run wants lead time in front of the bird, neither of which survives a tall
  // window. PORTRAIT is now only "should we ask for a turn", never a layout.
  PORTRAIT = CH > CW*1.02;
  document.body.classList.toggle('portrait', PORTRAIT);
  SCALE = Math.min(CH/980, CW/1450);
  VW = CW/SCALE; VH = CH/SCALE;
  const roadH = clamp(VH*0.16, 150, 260);
  GROUND = VH - roadH;
  CEIL = Math.max(40, GROUND - clamp(VH*0.80, 620, 1120));
  PX = VW*0.27;
  SURF.clear();
  buildLayers();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=> setTimeout(resize,120));
/* A phone will only honour an orientation lock from inside fullscreen, and only
   off a user gesture, so this is best-effort and every failure is ignored: the
   #rotate gate is what actually guarantees landscape. Desktop is left alone. */
let orientTried = false;
function lockLandscape(){
  if(orientTried || !TOUCH) return; orientTried = true;
  try{
    const el = document.documentElement;
    const go = () => { try{ screen.orientation.lock('landscape').catch(()=>{}); }catch(e){} };
    if(screen.orientation && screen.orientation.lock){
      if(document.fullscreenElement) go();
      else if(el.requestFullscreen) el.requestFullscreen().then(go).catch(go);
      else go();
    }
  }catch(e){}
}

/* ============================================================
   AUDIO — everything synthesised, no files
   ============================================================ */
const A = {
  ctx:null, master:null, musicGain:null, sfxGain:null,
  on:true, started:false, nextNote:0, step:0
};
function audioInit(){
  lockLandscape();          // first gesture: ask the phone to stay landscape
  setTimeout(windStart, 0); // the flight's air layer, once A.ctx exists
  initTrack();
  if(A.started) return;
  const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
  A.ctx = new AC();
  A.master = A.ctx.createGain(); A.master.gain.value = A.on?0.9:0; A.master.connect(A.ctx.destination);
  A.sfxGain = A.ctx.createGain(); A.sfxGain.gain.value = 0.85; A.sfxGain.connect(A.master);
  A.musicGain = A.ctx.createGain(); A.musicGain.gain.value = 0.0; A.musicGain.connect(A.master);
  A.started = true; A.nextNote = A.ctx.currentTime + 0.1;
}
function actx(){ try{ if(A.ctx && A.ctx.state==='suspended') A.ctx.resume(); }
                 catch(e){}                       // an offline context refuses, and that is fine
                 return A.ctx; }
function tone(freq, dur, type, vol, slide, dest, at){
  if(!A.started||!A.on) return; const c = actx(); if(!c) return;
  try{
  const t = c.currentTime + (at||0);
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(freq, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide), t+dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol||0.2, t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(dest||A.sfxGain); o.start(t); o.stop(t+dur+0.02);
  }catch(e){ A.err = e.message; }        // audio is never worth breaking gameplay for
}
/* A tone whose pitch is bent by a second oscillator. That wobble is the whole
   difference between a beep and a cartoon boing, and between a tone and a
   squawk -- every comic sound below is built on it. */
function wob(f0, f1, dur, opt){
  if(!A.started||!A.on) return; const c = actx(); if(!c) return;
  try{
  const O = opt||{}, t = c.currentTime + (O.at||0);
  const o=c.createOscillator(), g=c.createGain();
  o.type = O.type||'triangle';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t+dur);
  if(O.depth){
    const lfo=c.createOscillator(), la=c.createGain();
    lfo.type='sine'; lfo.frequency.setValueAtTime(O.rate||14, t);
    la.gain.setValueAtTime(O.depth, t);
    lfo.connect(la); la.connect(o.frequency);
    lfo.start(t); lfo.stop(t+dur+0.02);
  }
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(O.vol||0.14, t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(A.sfxGain); o.start(t); o.stop(t+dur+0.02);
  }catch(e){ A.err = e.message; }
}
let noiseBuf=null;
function noiseBuffer(c){                  // one second of hiss, shared by everything
  if(!noiseBuf){
    noiseBuf = c.createBuffer(1, c.sampleRate*1.2, c.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  }
  return noiseBuf;
}
function noise(dur, f0, f1, vol, q, at){
  if(!A.started||!A.on) return; const c = actx(); if(!c) return;
  try{
  const t0 = c.currentTime + (at||0);
  const s=c.createBufferSource(); s.buffer=noiseBuffer(c); s.loop=true;
  const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=q||1.1;
  bp.frequency.setValueAtTime(f0, t0);
  bp.frequency.exponentialRampToValueAtTime(Math.max(40,f1||f0), t0+dur);
  const g=c.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.25, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  s.connect(bp); bp.connect(g); g.connect(A.sfxGain); s.start(t0); s.stop(t0+dur+0.02);
  }catch(e){ A.err = e.message; }
}
let stepFoot = 0;
/* Everything else in here is a one-shot. Flying needs the opposite, and it is
   the single biggest thing missing from the flight: the sound of speed is not
   an event, it is a LAYER that is always there and only changes level. Wing
   beats on their own read as a bird flapping in a quiet room -- the wind is
   what says the room is moving past at 700 a second.

   One looping noise source through a bandpass, built once and never rebuilt.
   Level and brightness are pushed from updatePlay every frame, both through
   setTargetAtTime so nothing ever steps. Mute still works for free: it lives
   under A.sfxGain -> A.master, and mute takes A.master to zero. */
const WIND = { src:null, bp:null, g:null };
function windStart(){
  if(WIND.src || !A.started || !A.ctx) return;
  try{
    const c = A.ctx;
    WIND.src = c.createBufferSource(); WIND.src.buffer = noiseBuffer(c); WIND.src.loop = true;
    WIND.bp  = c.createBiquadFilter(); WIND.bp.type = 'bandpass';
    WIND.bp.Q.value = 0.55; WIND.bp.frequency.value = 400;
    WIND.g   = c.createGain(); WIND.g.gain.value = 0;
    WIND.src.connect(WIND.bp); WIND.bp.connect(WIND.g); WIND.g.connect(A.sfxGain);
    WIND.src.start();
  }catch(e){ A.err = e.message; }
}
function windSet(level, bright){
  if(!WIND.g || !A.ctx) return;
  const t = A.ctx.currentTime;
  try{
    WIND.g.gain.setTargetAtTime(A.on ? level : 0, t, 0.10);
    WIND.bp.frequency.setTargetAtTime(bright, t, 0.16);
  }catch(e){}
}
/* One cartoon voice for the whole game. Everything HE does is a short bright
   shape with a bend in it; everything the world does TO him is blunt and low.
   All of it kept deliberately quiet apart from the hit, so that the hit lands. */
const S = {
  /* ---- the chicken ------------------------------------------------- */
  /* A footstep is three things that all have to move, or a run at 45 steps a
     minute turns into a rattle: which foot it is, how hard it lands, and what
     it lands ON. k is 0..1 of the run's speed, so the whole set tightens and
     brightens as he winds up rather than looping one sound faster. */
  step(k){
    k = k === undefined ? 0.4 : k;
    stepFoot ^= 1;
    const j = 1 + (Math.random()-0.5)*0.13;
    const bright = 1 + k*0.55;                             // faster = higher and thinner
    noise(0.030 - k*0.008, 2400*j*bright, 900, 0.032 + k*0.020, 3.0);
    tone((stepFoot ? 342 : 288)*j*bright, 0.045 - k*0.010, 'triangle',
         0.044 + k*0.018, 208*j);
    // and one step in six lands somewhere looser -- dust, a dry clod, grit
    const r = Math.random();
    if(r < 0.17) noise(0.075, 1500*j, 380, 0.030 + k*0.012, 1.1, 0.012);
    else if(r < 0.29) tone(1560*j, 0.028, 'square', 0.016, 2200*j);   // a claw tick
  },
  /* Touching down at speed and running it off, as opposed to land()'s bounce. */
  scuff(k){
    noise(0.20*(0.6+k), 900, 190, 0.05 + k*0.05, 0.8);
    tone(210, 0.09, 'triangle', 0.05, 130);
  },
  takeoff(){
    // leaving the ground: goofy, and RISING -- the opposite shape to land()
    wob(240, 780, 0.20, {type:'square', vol:0.10, depth:26, rate:19});
    noise(0.16, 480, 1700, 0.06, 1.3);
    tone(180, 0.10, 'sine', 0.06, 300);
  },
  /* A wingbeat is a PUSH, not a swish: the air over the feathers is the top
     of it, but the part you feel is the low thump of the downstroke shoving
     against the air. Without that body it sounds like a page turning. */
  flap(){
    const j = 1 + (Math.random()-0.5)*0.17;
    noise(0.18*j, 330, 1450, 0.058, 1.5);                  // air over the feathers
    noise(0.09, 880, 175, 0.045, 1.1);                     // the closing swish
    tone(148*j, 0.10, 'sine', 0.038, 95);
    tone(74*j,  0.13, 'sine', 0.055, 44, null, 0.012);     // the shove underneath it
    if(Math.random() < 0.35)                               // primaries clattering
      noise(0.05, 3400*j, 1800, 0.016, 4.0, 0.02);
  },
  /* Wings out, not beating. Played on a cooldown while he falls, so a long
     drop is not silence between flaps. */
  glide(){
    noise(0.42, 620, 300, 0.075, 0.5);
    noise(0.22, 2600, 1400, 0.030, 1.6, 0.10);
  },
  /* The sky is a ceiling and he can hit it. Soft, feathery, no impact. */
  ceiling(){
    noise(0.16, 700, 240, 0.05, 1.0);
    tone(200, 0.10, 'triangle', 0.05, 120);
    noise(0.10, 3000, 1600, 0.020, 3.4, 0.03);
  },
  land(){
    // bouncy and comedic, and FALLING in pitch where takeoff rose
    wob(520, 150, 0.20, {type:'triangle', vol:0.12, depth:18, rate:11});
    tone(132, 0.15, 'sine', 0.19, 46);                     // the weight
    noise(0.13, 260, 70, 0.14, 0.9);
    noise(0.055, 2700, 1600, 0.04, 3.2, 0.02);             // sneaker squeak
  },
  land_soft(){ noise(0.075,240,120,0.055,1.4); tone(120,0.06,'sine',0.045,80); },
  jump(){ S.takeoff(); },
  /* ---- getting hit: the whole gag, in four beats -------------------- */
  hit(){
    tone(150, 0.34, 'sawtooth', 0.20, 38);                                        // impact
    noise(0.30, 800, 60, 0.30, 0.8);
    tone(770, 0.09, 'square', 0.15, 150);                                         // bonk
    wob(840, 280, 0.28, {type:'sawtooth', vol:0.13, depth:85, rate:23, at:0.03}); // squawk
    wob(1750, 250, 0.44, {type:'sine', vol:0.09, depth:9, rate:6, at:0.14});      // slide whistle
    tone(160, 0.13, 'square', 0.10, 92, null, 0.46);                              // and he lands
  },
  /* ---- the world --------------------------------------------------- */
  warn(){                                   // something above is about to drop
    tone(920, 0.075, 'square', 0.06, 920);
    tone(920, 0.075, 'square', 0.06, 920, null, 0.12);
  },
  whoosh(){ noise(0.17, 260, 1400, 0.045, 1.25); },
  /* ---- the crow attack --------------------------------------------- */
  /* The alert, and then the bird. Two different jobs: the alert has to be a
     MACHINE -- nothing on a farm makes this noise -- and the launch has to be
     an animal, so the instant the machine stops you know what is coming.

     The two states of the badge get two different machines rather than the
     same beep at two pitches, which is what it was and which reads as one
     sound speeding up. Tracking is a rounded radar bip: a fifth, in tune,
     unbothered. Locked is a klaxon: a semitone apart so it BEATS against
     itself, square, with a tick of noise on the front. Dissonance is doing
     the work -- you do not have to be told the second one is worse. */
  alert(locked){
    if(!locked){
      tone(760, 0.06, 'triangle', 0.050, 760);
      tone(1140, 0.05, 'sine', 0.028, 1140, null, 0.070);
      return;
    }
    noise(0.03, 3000, 1400, 0.030, 3.0);                  // the contact tick
    tone(1050, 0.085, 'square', 0.060, 1050);
    tone(1113, 0.085, 'square', 0.045, 1113);             // a semitone up: it beats
    tone(525,  0.10,  'square', 0.030, 525, null, 0.010); // an octave under, for weight
  },
  /* The launch. A dive, and the moment the siren stops. */
  caw(){
    wob(760, 300, 0.30, {type:'sawtooth', vol:0.14, depth:120, rate:19});
    wob(980, 420, 0.24, {type:'square',   vol:0.07, depth:70,  rate:26, at:0.16});
    noise(0.26, 1800, 500, 0.05, 1.6);                    // the air off the wings
    tone(300, 0.34, 'sawtooth', 0.05, 120, null, 0.02);   // and the drop into the dive
  },
  /* It goes past. Doppler is the whole gag: the pitch falls THROUGH the
     player, so a bird that missed sounds different from one still coming.
     Cheap version -- one rising swish into one falling one -- but the ear
     only wants the turn, not the physics. */
  crowpass(near){
    const v = near ? 0.17 : 0.10;
    noise(0.13, 500, 2200, v, 0.7);
    noise(0.20, 2200, 380, v, 0.7, 0.11);
    tone(520, 0.22, 'triangle', v*0.45, 210, null, 0.08);
    if(near) tone(1300, 0.10, 'sine', 0.045, 700, null, 0.10);
  },
  /* Hit BY a crow, played under hit(). Everything else in the game that kills
     him is wood or wire and sounds like it -- this one has to sound like an
     animal winning: feathers, a beak, and the thing screaming as it goes. */
  crowhit(){
    noise(0.34, 1900, 420, 0.16, 1.2);                     // the collision, all feather
    tone(940, 0.07, 'square', 0.13, 380);                  // beak
    wob(880, 240, 0.40, {type:'sawtooth', vol:0.15, depth:150, rate:17, at:0.04});
    wob(1150, 300, 0.34, {type:'square', vol:0.08, depth:90, rate:24, at:0.20});
    noise(0.30, 900, 2600, 0.05, 1.4, 0.16);               // and off it goes
  },
  /* Picking one up, and a run of them going somewhere. The old version drifted
     the pitch by a fixed 5.5% a step, which is a quarter-tone ladder -- it goes
     UP but it never lands anywhere, so a streak sounded like a slide whistle
     rather than a tune. This walks a MAJOR PENTATONIC instead: five notes that
     cannot form a bad interval, so any run of them is musical and the twelfth
     egg is an octave and a half above the first by arriving there, not by
     sliding. The shell tick on the front is what makes it an egg and not a
     coin -- a hard little transient, then the body. */
  egg(streak){
    const PENT = [0,2,4,7,9], k = Math.min((streak||1)-1, 11);
    const semi = PENT[k % 5] + 12*Math.floor(k/5);
    const f = 784 * Math.pow(2, semi/12);                  // G5 up
    noise(0.022, 5200, 2600, 0.030, 5.0);                  // the shell, tapped
    tone(f,     0.085, 'triangle', 0.085, f*1.01);
    tone(f*2,   0.055, 'sine',     0.038, f*2);            // the ring on top
    tone(f*3,   0.035, 'sine',     0.014, f*3, null, 0.012);
    if(k >= 4)                                             // it is a run now
      tone(f*1.5, 0.06, 'sine', 0.028, f*1.5, null, 0.055);
  },
  /* Five, ten: a little flourish so a streak has somewhere to arrive. */
  eggrun(n){
    const root = 784 * Math.pow(2, (n>=10?7:4)/12);
    [0,4,7,12].forEach((sm,i)=>
      tone(root*Math.pow(2,sm/12), 0.13, 'triangle', 0.055, null, null, i*0.055));
  },
  cagerattle(){ noise(0.06, 1800, 900, 0.05, 4.0); tone(300,0.05,'square',0.035,240); },
  bedcreak(){ wob(420, 180, 0.22, {type:'sawtooth', vol:0.055, depth:22, rate:9});
              noise(0.10, 900, 380, 0.035, 2.2); },
  doorbreak(){                              // a steel door losing an argument
    tone(90,  0.44, 'sawtooth', 0.30, 32);                     // the weight of it
    noise(0.40, 1100, 70, 0.34, 0.6);                          // the tear
    tone(1400, 0.09, 'square', 0.16, 240);                     // the clang
    wob(240, 70, 0.36, {type:'square', vol:0.19, depth:70, rate:13});
    noise(0.22, 3200, 1200, 0.13, 2.6, 0.03);                  // shrapnel
    tone(1800, 0.07, 'sine', 0.10, 2600, null, 0.02);          // the lock pings off
    tone(120, 0.16, 'square', 0.11, 70, null, 0.30);           // it lands
  },
  cagebreak(){                              // the door leaves the building
    tone(120, 0.30, 'sawtooth', 0.24, 40);
    noise(0.34, 1500, 120, 0.30, 0.7);                       // splintering
    wob(300, 90, 0.30, {type:'square', vol:0.16, depth:60, rate:15});
    noise(0.16, 3000, 1400, 0.10, 2.4, 0.02);                // shrapnel
    tone(700, 0.10, 'square', 0.10, 1200, null, 0.05);
  },
  thud(){ noise(0.18,170,45,0.2,1.0); tone(96,0.16,'sine',0.15,44); },
  near(){ noise(0.24,2000,320,0.095,1.8); tone(1040,0.08,'sine',0.045,1560); },
  /* Electrocution, played UNDER hit() rather than instead of it: a hard AC
     buzz, so dying on a wire never sounds like dying on a hay bale. */
  zap(){
    wob(92, 60, 0.42, {type:'square', vol:0.15, depth:46, rate:34});
    noise(0.26, 3200, 900, 0.10, 2.4);
    tone(2400, 0.07, 'square', 0.065, 380);
  },
  stumble(){ tone(200,0.1,'triangle',0.09,140); noise(0.16,320,140,0.08,1.2); },
  /* ---- score and UI ------------------------------------------------ */
  combo(n){ const k=Math.min(n,8); tone(520*Math.pow(1.16,k),0.11,'triangle',0.12,780*Math.pow(1.1,k)); },
  tick(){ tone(1180,0.04,'square',0.03); },
  best(){ [0,1,2,3].forEach(i=> tone([523,659,784,1047][i],0.22,'triangle',0.15,null,null,i*0.095)); },
  click(){ tone(660,0.06,'square',0.11,880); },
  cluck(){ wob(720,430,0.09,{type:'square',vol:0.09,depth:40,rate:26});
           wob(520,300,0.07,{type:'square',vol:0.07,depth:30,rate:26,at:0.075}); },
  slide(){ wob(900,110,0.45,{type:'sine',vol:0.13,depth:8,rate:5}); },
  boing(){ wob(520,90,0.34,{type:'square',vol:0.15,depth:70,rate:17});
           tone(260,0.30,'triangle',0.09,70); },
  splat(){ noise(0.22,420,60,0.28,0.8); tone(90,0.22,'sine',0.18,40); },
  bonk(){ tone(760,0.13,'square',0.18,180); noise(0.1,1400,300,0.09,1.4); },
  timber(){ wob(300,70,0.6,{type:'triangle',vol:0.11,depth:14,rate:5}); },
  cheer(){ [0,1,2].forEach(i=> tone([784,988,1175][i],0.16,'triangle',0.14,null,null,i*0.07)); }
};
/* music: a light 8-step groove that speeds up with the run */
const BASS=[0,0,3,7, 0,-2,-4,7];
function midi(n){ return 440*Math.pow(2,(n-69)/12); }
function musicTick(){
  if(TRACK) return;                       // the real track is playing instead
  if(!A.started||!A.on||!A.ctx) return;
  const c=A.ctx, now=c.currentTime;
  const bpm = 118 + 30*game.diff;
  const spb = 60/bpm/2;
  if(A.nextNote < now) A.nextNote = now+0.05;
  while(A.nextNote < now+0.28){
    const t=A.nextNote, s=A.step%8;
    // kick
    if(s===0||s===3||s===6){
      const o=c.createOscillator(),g=c.createGain();
      o.type='sine'; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+0.11);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.5,t+0.006);

const MOVEMENTS = ['spy_long', 'spy_long_b'];
function initTrack(){
  if(TRACKS.length) return;
  const alt = /[?&]track=(\w+)/.exec(location.search);
  const names = alt ? [alt[1]] : MOVEMENTS;
  names.forEach((n, i) => {
    const a = new Audio('audio/music_' + n + '.mp3');
    a.preload = i === 0 ? 'auto' : 'none';       // only the first one up front
    a.loop = names.length === 1;                 // one movement? then it repeats
    a.volume = 0;
    a.addEventListener('ended', nextTrack);
    a.addEventListener('error', () => { a.dead = true; });
    TRACKS.push(a);
  });
  TRACK = TRACKS[0];
  // the title screen, the escape and the score card all sit on this one
  MENU_TRACK = new Audio('audio/music_menu.mp3');
  MENU_TRACK.loop = true; MENU_TRACK.volume = 0; MENU_TRACK.preload = 'auto';
  MENU_TRACK.addEventListener('error', () => { MENU_TRACK = null; });

  else if(which === 'duck'){   menuWanted = 0;    trackVol(0.18); musicVol(0.12); }
  else {                       menuWanted = 0.40; trackVol(0);    musicVol(0);    }
  if(menuWanted > 0 && MENU_TRACK && MENU_TRACK.paused){
    const pr = MENU_TRACK.play(); if(pr && pr.catch) pr.catch(()=>{});
  }
}
function nextTrack(){
  if(!TRACKS.length) return;
  const vol = TRACK ? TRACK.volume : 0;
  if(TRACK){ TRACK.pause(); try{ TRACK.currentTime = 0; }catch(e){} }
  for(let n = 1; n <= TRACKS.length; n++){       // skip any that failed to load
    const i = (trackIdx + n) % TRACKS.length;
    if(!TRACKS[i].dead){ trackIdx = i; break; }
    if(n === TRACKS.length){ TRACK = null; return; }   // none of them work
  }
  TRACK = TRACKS[trackIdx];
  TRACK.volume = vol;
  const pr = TRACK.play(); if(pr && pr.catch) pr.catch(()=>{});
  const nx = TRACKS[(trackIdx + 1) % TRACKS.length];   // buffer the next one now
  if(nx && nx !== TRACK && nx.preload === 'none'){ nx.preload = 'auto'; nx.load(); }
}
function trackVol(v){
  trackWanted = v;
  if(!TRACK) return false;
  if(TRACK.dead){ nextTrack(); if(!TRACK) return false; }
  if(v > 0){
    if(TRACK.paused){ const pr = TRACK.play(); if(pr && pr.catch) pr.catch(()=>{}); }
    const nx = TRACKS[(trackIdx + 1) % TRACKS.length];
    if(nx && nx !== TRACK && nx.preload === 'none'){ nx.preload = 'auto'; nx.load(); }
  }

}
function trackTick(dt){
  if(MENU_TRACK){
    const mt = A.on ? menuWanted : 0;
    MENU_TRACK.volume = clamp(MENU_TRACK.volume + (mt - MENU_TRACK.volume) * Math.min(1, dt*2.2), 0, 1);
    if(MENU_TRACK.volume < 0.001 && !MENU_TRACK.paused && mt === 0) MENU_TRACK.pause();
  }
  if(!TRACK) return;
  const target = A.on ? trackWanted : 0;
  TRACK.volume = clamp(TRACK.volume + (target - TRACK.volume) * Math.min(1, dt*2.2), 0, 1);

function hatSnapback(R){
  ctx.beginPath();
  ctx.moveTo(-R*0.94,-R*0.26);
  ctx.quadraticCurveTo(-R*1.02,-R*1.26, R*0.10,-R*1.24);
  ctx.quadraticCurveTo(R*1.04,-R*1.20, R*1.00,-R*0.30);
  ctx.quadraticCurveTo(R*0.30,-R*0.60,-R*0.94,-R*0.26);
  ctx.closePath(); cp(CKC.cap,4.8);
  ctx.beginPath();                                   // brim, worn backwards
  ctx.moveTo(-R*0.90,-R*0.38);
  ctx.quadraticCurveTo(-R*1.80,-R*0.66,-R*2.02,-R*0.14);
  ctx.quadraticCurveTo(-R*1.42, R*0.10,-R*0.86,-R*0.06);
  ctx.closePath(); cp(CKC.capDark,4.6);
  ctx.beginPath(); ctx.arc(R*0.08,-R*1.24,R*0.13,0,TAU); cp(CKC.capDark,3);
  ctx.beginPath(); ctx.roundRect(R*0.56,-R*0.92,R*0.44,R*0.32,4); cp(CKC.capDark,3);
}
function hatBucket(R){
  ctx.beginPath();
  ctx.moveTo(-R*0.80,-R*0.30); ctx.lineTo(-R*0.62,-R*1.24);
  ctx.lineTo(R*0.72,-R*1.24);  ctx.lineTo(R*0.94,-R*0.30);
  ctx.closePath(); cp(CKC.cap,4.8);
  ctx.save(); ctx.clip();
  ctx.beginPath(); ctx.rect(-R*1.1,-R*0.86,R*2.2,R*0.26);
  ctx.fillStyle=CKC.capBand; ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.ellipse(R*0.05,-R*0.26,R*1.36,R*0.32,0.02,0,TAU); cp(CKC.capDark,4.8);
}
