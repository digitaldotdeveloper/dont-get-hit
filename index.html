<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#241043">
<meta name="description" content="One tap. Don't get hit. A fast arcade runner.">
<title>Don't Get Hit</title>
<link rel="preload" as="image" href="art/title.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Archivo:wght@500;700;900&display=swap">
<style>
  :root{
    --ink:#241043;
    --ink-2:#150827;
    --plum:#3D1F55;
    --grape:#6E2A6B;
    --coral:#F2684F;
    --amber:#FFB447;
    --gold:#FFD54A;
    --cream:#FFF2DE;
    --mint:#3FE0B0;
    --danger:#FF456E;
    --shadow:0 10px 30px rgba(21,8,39,.55);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--ink-2);overflow:hidden}
  body{
    font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:var(--cream);
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    overscroll-behavior:none;touch-action:none;
  }
  #stage{position:fixed;inset:0;overflow:hidden}
  #game{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;
       padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0}
  #scoreWrap{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);
             transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .25s}
  #hud.on #scoreWrap{opacity:1}
  #scoreLabel{font-size:11px;font-weight:900;letter-spacing:.22em;color:rgba(255,242,222,.62)}
  #score{font-size:clamp(34px,8.5vw,54px);font-weight:900;line-height:.98;
         font-variant-numeric:tabular-nums;letter-spacing:.02em;
         color:var(--cream);text-shadow:0 3px 0 rgba(36,16,67,.85),0 0 26px rgba(255,180,71,.35)}
  #score.pop{animation:pop .18s ease-out}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.13)}100%{transform:scale(1)}}
  #eggWrap{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;
    display:flex;align-items:center;gap:7px;opacity:0;transition:opacity .3s}
  #hud.on #eggWrap{opacity:1}
  #eggIcon{width:17px;height:22px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    background:linear-gradient(150deg,#FFE9A8,#FFD54A 45%,#E09A22);
    box-shadow:0 0 0 2.5px #241043, 0 0 12px rgba(255,213,74,.45)}
  #eggCount{font-family:'Bungee',cursive;font-size:19px;color:#FFD54A;
    text-shadow:0 2px 0 #241043;font-variant-numeric:tabular-nums}
  #eggCount.pop{animation:pop .2s ease-out}
  #bestLine{font-size:11px;font-weight:700;letter-spacing:.18em;color:rgba(255,242,222,.5);
            font-variant-numeric:tabular-nums;margin-top:2px}

  #combo{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 104px);
         transform:translateX(-50%) scale(.6);opacity:0;
         font-family:'Bungee',cursive;font-size:26px;color:var(--mint);
         text-shadow:0 3px 0 rgba(36,16,67,.9);transition:opacity .12s}
  #combo.on{opacity:1;transform:translateX(-50%) scale(1);
            transition:transform .16s cubic-bezier(.2,1.8,.4,1),opacity .12s}

  #mute{position:absolute;right:calc(env(safe-area-inset-right,0px) + 14px);
        top:calc(env(safe-area-inset-top,0px) + 14px);
        pointer-events:auto;width:42px;height:42px;border-radius:14px;
        border:2px solid rgba(255,242,222,.24);background:rgba(36,16,67,.42);
        color:var(--cream);display:grid;place-items:center;cursor:pointer;
        backdrop-filter:blur(6px);padding:0}
  #mute svg{width:20px;height:20px;fill:currentColor}
  #mute:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  #mute .off{display:none}
  #mute.muted .on{display:none}
  #mute.muted .off{display:block}
  #mute.muted{color:rgba(255,242,222,.45)}

  /* ---------- Screens ---------- */
  .screen{position:absolute;inset:0;display:none;flex-direction:column;
          align-items:center;justify-content:center;gap:0;
          padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);
          text-align:center}
  .screen.show{display:flex}

  /* Menu. TWO designs exist, and `POSTER_TITLE` in the script picks one.
     Default (false): the menu is the LIVE SCENE. It sits on the right half and
     leaves the left clear, because that is where he is standing in the cage,
     and watching him wait there is the hook. */
  #menu{justify-content:center;align-items:flex-end;
        padding:calc(env(safe-area-inset-top,0px) + 12px) max(4vw,18px) calc(env(safe-area-inset-bottom,0px) + 12px) 46vw;
        text-align:right}
  /* POSTER_TITLE = true: the painted key art fills the screen instead, with the
     buttons sat in its foreground, and the first press blows it off. */
  body.poster #menu{justify-content:flex-start;align-items:center;text-align:center;
        padding:calc(env(safe-area-inset-top,0px) + 7vh) 24px calc(env(safe-area-inset-bottom,0px) + 24px);
        background:var(--ink-2) url(art/title.webp) center/cover no-repeat}
  /* the poster carries the logo and the line under it, so these stand down */
  body.poster #menu .logo, body.poster #menu .tag{display:none}
  body.poster #menu::after{content:'';position:absolute;left:0;right:0;bottom:0;height:46%;
        pointer-events:none;
        background:linear-gradient(180deg,rgba(21,8,39,0) 0%,rgba(21,8,39,.55) 40%,
                                          rgba(21,8,39,.90) 78%,rgba(21,8,39,.97) 100%)}
  body.poster #menu .menuFoot{position:relative;z-index:1;align-items:center}
  .logo{font-family:'Bungee',cursive;line-height:.86;transform:rotate(-2.5deg);
        filter:drop-shadow(0 8px 0 rgba(36,16,67,.9))}
  .logo .l1{display:block;font-size:clamp(24px,6.8vmin,58px);
            background:linear-gradient(178deg,var(--cream) 12%,var(--gold) 58%,var(--amber) 100%);
            -webkit-background-clip:text;background-clip:text;color:transparent}
  .logo .l2{display:block;font-size:clamp(34px,10vmin,90px);margin-top:.02em;
            background:linear-gradient(178deg,var(--gold) 6%,var(--coral) 62%,var(--danger) 100%);
            -webkit-background-clip:text;background-clip:text;color:transparent}
  /* The menu now sits over the painted farm rather than a flat gradient, so
     every line needs its own contrast -- a scrim would hide the map. */
  .tag{margin:14px 0 0;font-size:11px;font-weight:900;letter-spacing:.16em;
       color:var(--cream);text-shadow:0 2px 0 rgba(21,8,39,.85),0 0 12px rgba(21,8,39,.8)}
  .spacer{flex:0 0 4px}
  .menuFoot{display:flex;flex-direction:column;align-items:flex-end;gap:10px;
            margin-top:14px;padding-bottom:0}
  .hint{margin:0;font-size:11px;font-weight:700;letter-spacing:.24em;color:rgba(255,242,222,.82);
        text-shadow:0 2px 0 rgba(21,8,39,.85),0 0 10px rgba(21,8,39,.75)}
  .rules{display:flex;gap:10px;margin:0 0 2px;flex-wrap:wrap;justify-content:flex-end}
  .rule{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;
        letter-spacing:.04em;color:rgba(255,242,222,.88);
        background:rgba(21,8,39,.72);border:1.5px solid rgba(255,242,222,.18);
        border-radius:999px;padding:5px 10px;backdrop-filter:blur(4px);
        box-shadow:0 3px 10px rgba(21,8,39,.5)}
  .rule b{color:var(--gold);font-weight:900}
  .rule.no b{color:var(--danger)}

  /* ---------- Landscape gate ----------
     The whole game is framed for landscape: a flying game wants lead time in
     front of the bird, and the cage intro is a wide painted scene. Rather than
     re-lay everything out for a tall window, portrait asks for a turn and the
     run is frozen behind it, so rotating mid-run never costs a life. */
  #rotate{position:fixed;inset:0;z-index:60;display:none;
          flex-direction:column;align-items:center;justify-content:center;gap:18px;
          background:linear-gradient(170deg,#13284C,#3D1F55 60%,#150827);
          text-align:center;padding:24px}
  body.portrait #rotate{display:flex}
  #rotate .phone{width:72px;height:118px;border-radius:14px;
                 border:5px solid var(--cream);position:relative;
                 animation:turnit 2.2s ease-in-out infinite}
  #rotate .phone::after{content:"";position:absolute;left:50%;bottom:7px;
                 transform:translateX(-50%);width:26px;height:4px;border-radius:3px;
                 background:var(--cream);opacity:.7}
  @keyframes turnit{0%,22%{transform:rotate(0)}
                    52%,78%{transform:rotate(-90deg)}
                    100%{transform:rotate(-90deg)}}
  #rotate h2{font-family:'Bungee',cursive;font-size:clamp(20px,6vw,30px);margin:0;
             color:var(--gold);text-shadow:0 3px 0 rgba(36,16,67,.9)}
  #rotate p{margin:0;font-size:12px;font-weight:800;letter-spacing:.2em;
            color:rgba(255,242,222,.6)}

  /* Big physical button */
  .big{font-family:'Bungee',cursive;font-size:clamp(20px,5.2vmin,32px);letter-spacing:.05em;
       color:#2A1206;border:0;cursor:pointer;pointer-events:auto;
       padding:18px 54px 20px;border-radius:22px;
       background:linear-gradient(180deg,#FFE27A 0%,var(--gold) 46%,#F5A93A 100%);
       box-shadow:0 8px 0 #B8681B,0 16px 28px rgba(21,8,39,.5);
       transition:transform .07s ease,box-shadow .07s ease}
  .big:active{transform:translateY(7px);box-shadow:0 1px 0 #B8681B,0 6px 14px rgba(21,8,39,.45)}
  .big:focus-visible{outline:3px solid var(--mint);outline-offset:5px}
  .big.pulse{animation:btnPulse 2.2s ease-in-out infinite}
  @keyframes btnPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .ghost{font-family:'Archivo',sans-serif;font-weight:900;font-size:12px;letter-spacing:.22em;
         background:none;border:0;color:rgba(255,242,222,.5);cursor:pointer;pointer-events:auto;
         padding:12px 18px}
  .ghost:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}

  /* Game over card */
  #over{background:radial-gradient(120% 80% at 50% 45%,rgba(36,16,67,.34) 0%,rgba(21,8,39,.78) 70%)}
  .card{width:min(420px,92vw);border-radius:28px;padding:26px 24px 20px;
        background:linear-gradient(180deg,rgba(61,31,85,.94),rgba(29,13,52,.96));
        border:2px solid rgba(255,242,222,.14);box-shadow:var(--shadow);
        display:flex;flex-direction:column;align-items:center;gap:2px;
        animation:cardIn .34s cubic-bezier(.16,1.2,.3,1) both}
  @keyframes cardIn{from{transform:translateY(38px) scale(.94);opacity:0}to{transform:none;opacity:1}}
  .ribbon{display:none;font-family:'Bungee',cursive;font-size:15px;letter-spacing:.06em;
          color:#2A1206;background:linear-gradient(180deg,#FFE27A,var(--gold));
          padding:7px 20px 8px;border-radius:999px;margin-bottom:10px;
          box-shadow:0 5px 0 #B8681B;transform:rotate(-2deg)}
  .card.best .ribbon{display:block;animation:ribbonIn .45s .1s cubic-bezier(.2,1.7,.4,1) both}
  @keyframes ribbonIn{from{transform:rotate(-2deg) scale(.4);opacity:0}to{transform:rotate(-2deg) scale(1);opacity:1}}
  .cardLabel{font-size:11px;font-weight:900;letter-spacing:.28em;color:rgba(255,242,222,.55)}
  .cardScore{font-size:clamp(46px,13vw,66px);font-weight:900;line-height:1;
             font-variant-numeric:tabular-nums;color:var(--gold);
             text-shadow:0 4px 0 rgba(21,8,39,.6)}
  .cardBest{font-size:12px;font-weight:800;letter-spacing:.18em;color:rgba(255,242,222,.6);
            font-variant-numeric:tabular-nums;margin-top:6px}
  .stats{display:flex;gap:0;width:100%;margin:16px 0 18px;
         border-top:1.5px solid rgba(255,242,222,.12);border-bottom:1.5px solid rgba(255,242,222,.12)}
  .stat{flex:1;padding:11px 4px;display:flex;flex-direction:column;align-items:center;gap:3px}
  .stat + .stat{border-left:1.5px solid rgba(255,242,222,.12)}
  .stat .v{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--cream)}
  .stat .k{font-size:9px;font-weight:800;letter-spacing:.14em;color:rgba(255,242,222,.48)}
  .stat.mint .v{color:var(--mint)}

  /* Tutorial */
  #tut{position:absolute;left:50%;bottom:30%;transform:translateX(-50%);
       font-size:12px;font-weight:900;letter-spacing:.26em;color:rgba(255,242,222,.8);
       display:none;align-items:center;gap:10px;pointer-events:none;
       text-shadow:0 2px 6px rgba(21,8,39,.9)}
  #tut.show{display:flex;animation:tutBob 1.15s ease-in-out infinite}
  @keyframes tutBob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-7px)}}
  #tut svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;
           stroke-linecap:round;stroke-linejoin:round}

  #flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}
  body.solo #hud, body.solo #tut, body.solo .screen, body.solo #flash{display:none!important}

  @media (prefers-reduced-motion:reduce){
    .big.pulse,#tut.show{animation:none}
    .card,.ribbon{animation-duration:.01ms}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="flash"></div>

  <div id="hud">
    <div id="scoreWrap">
      <div id="scoreLabel">SCORE</div>
      <div id="score">000000</div>
      <div id="bestLine">BEST 000000</div>
    </div>
    <div id="eggWrap"><span id="eggIcon"></span><span id="eggCount">0</span></div>
    <div id="combo"><span id="comboTxt">x2</span></div>
    <button id="mute" aria-label="Toggle sound">
      <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 2.2v2.1a7.8 7.8 0 0 1 0 15.4v2.1a9.9 9.9 0 0 0 0-19.6z"/></svg>
      <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm17.3-2.3-1.4-1.4L17 8.2l-2.9-2.9v3l1.5 1.5-1.5 1.5v3l2.9-2.9 2.9 2.9 1.4-1.4-2.9-2.9 2.9-2.9z"/></svg>
    </button>
  </div>

  <div id="menu" class="screen show">
    <div class="logo"><span class="l1">DON'T GET</span><span class="l2">HIT</span></div>
    <p class="tag">ONE BUTTON. ONE CHICKEN.</p>
    <div class="spacer"></div>
    <div class="menuFoot">
      <div class="rules">
        <span class="rule"><b>HOLD</b> TO FLAP AND FLY</span>
        <span class="rule no"><b>DON'T</b> HIT ANYTHING</span>
      </div>
      <button id="play" class="big pulse">PLAY</button>
      <p class="hint">HOLD ANYWHERE &nbsp;•&nbsp; SPACE</p>
    </div>
  </div>

  <div id="over" class="screen">
    <div class="card" id="card">
      <div class="ribbon">NEW BEST!</div>
      <div class="cardLabel">SCORE</div>
      <div class="cardScore" id="finalScore">000000</div>
      <div class="cardBest" id="finalBest">BEST 000000</div>
      <div class="stats">
        <div class="stat mint"><span class="v" id="stNear">0</span><span class="k">NEAR MISSES</span></div>
        <div class="stat"><span class="v" id="stCombo">x0</span><span class="k">BEST COMBO</span></div>
        <div class="stat"><span class="v" id="stDist">0m</span><span class="k">DISTANCE</span></div>
      </div>
      <button id="retry" class="big">RETRY</button>
      <button id="tomenu" class="ghost">MAIN MENU</button>
    </div>
  </div>

  <div id="rotate">
    <div class="phone"></div>
    <h2>TURN YOUR PHONE</h2>
    <p>DON'T GET HIT PLAYS IN LANDSCAPE</p>
  </div>

  <pre id="selftest" style="position:fixed;left:0;top:0;z-index:99;color:#0f0;font:11px monospace;background:#000;margin:0;display:none"></pre>
  <div id="tut">
    <svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="m8.5 6.5 3.5-3.5 3.5 3.5"/><circle cx="12" cy="17" r="4"/></svg>
    HOLD TO FLY
  </div>
</div>

<script>
(() => {
'use strict';

/* ============================================================
   DON'T GET HIT — one-tap arcade runner
   Everything is drawn procedurally: no image assets.
   The character is a real skeletal rig (IK legs, FK arms,
   spring-driven hair/jacket) so every animation is a pose,
   not a sprite.
   ============================================================ */

/* ---------- tiny utils ---------- */
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const damp  = (a,b,l,dt)=> a+(b-a)*(1-Math.exp(-l*dt));
const rnd   = (a,b)=> a+Math.random()*(b-a);
const rndi  = (a,b)=> Math.floor(rnd(a,b+1));
const pick  = a => a[(Math.random()*a.length)|0];
const TAU   = Math.PI*2;
const smooth= t => t*t*(3-2*t);
const easeOutBack = t => { const c=1.70158+1; return 1+c*Math.pow(t-1,3)+1.70158*Math.pow(t-1,2); };
const easeOutCubic= t => 1-Math.pow(1-t,3);
const easeInCubic = t => t*t*t;
function hash(n){ const s=Math.sin(n*127.1+311.7)*43758.5453; return s-Math.floor(s); }
function pad6(n){ n=Math.max(0,Math.floor(n)); return String(n).padStart(6,'0'); }

const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- palette ---------- */
let C = {
  ink:'#241043', ink2:'#150827',
  skyA:'#241043', skyB:'#5E2569', skyC:'#C4485E', skyD:'#F2794A', skyE:'#FFC46B',
  sun:'#FFE9A8',
  far:'#7B4287', mid:'#4E265F', near:'#301648', prop:'#1F0E33',
  road:'#2A1445', roadLine:'#3E2160', curb:'#3A1C57',
  rim:'#FFB447',
  cream:'#FFF2DE', gold:'#FFD54A', coral:'#F2684F', mint:'#3FE0B0', danger:'#FF456E',
  skin:'#F0B183', skinSh:'#D18C60',
  hair:'#1E1426',
  jacket:'#2BC3AD', jacketLit:'#4BEBD2', jacketDark:'#17897A', jacketTrim:'#0F6E63',
  tee:'#FFF2DE',
  pants:'#324B7A', pantsDark:'#22355A',
  shoe:'#FF5E7A', shoeSole:'#FFF2DE'
};

/* ---------- environments ----------
   Two hand-built themes. Everything is drawn in code so the layers tile
   perfectly and nothing extra has to be downloaded. */
/* ONE MAP. The run used to travel -- a leg every 26s, farm -> city -> block,
   crossfaded rather than cut -- and the two other palettes, their layer
   builders, their props, the prison's painted wall and the whole crossfade
   machinery went with it. There is one place now, Cluck County, and the run
   stays in it. If a second map ever comes back, it comes back as its own
   THEME object plus a builder, not as a timer that swaps the world out from
   under the player.

   The sky colours are sampled off the painted panels so the sky the game draws
   and the sky in the art are the same blue -- the panels fade into it rather
   than sitting on it. */
const THEME = {
  id:'farm', name:'CLUCK COUNTY', sunR:0.42, sunGlow:0.34, vig:0.42,
  skyA:'#0B7CF5', skyB:'#1C87F2', skyC:'#3C9BEC', skyD:'#79C2F6', skyE:'#BEE6FF',
  sun:'#FFF3A8', far:'#7FB463', mid:'#5C9A48', near:'#3E7A34', prop:'#2F5A28',
  road:'#BB7D33', roadLine:'#9A6528', curb:'#8E5C24', rim:'#8CC24E'
};
/* Blend two #rrggbb values. Nothing morphs between themes any more; this is
   still what lifts the distant chickens off the background they stand on. */
function lerpHex(a, b, k){
  const A = parseInt(a.slice(1),16), B = parseInt(b.slice(1),16);
  const r = Math.round(((A>>16)&255) + (((B>>16)&255)-((A>>16)&255))*k);
  const g = Math.round(((A>>8)&255)  + (((B>>8)&255) -((A>>8)&255)) *k);
  const bl= Math.round((A&255)       + ((B&255)      -(A&255))      *k);
  return '#' + ((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1);
}
function applyTheme(){
  const t = THEME;
  C.skyA=t.skyA; C.skyB=t.skyB; C.skyC=t.skyC; C.skyD=t.skyD; C.skyE=t.skyE;
  C.sun=t.sun; C.far=t.far; C.mid=t.mid; C.near=t.near; C.prop=t.prop;
  C.road=t.road; C.roadLine=t.roadLine; C.curb=t.curb; C.rim=t.rim;
  if(SCALE) buildLayers();
}

/* ---------- canvas ---------- */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha:false });
if(!ctx.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if(typeof r === 'number') r=[r,r,r,r];
    const [a,b,c2,d]=r;
    this.moveTo(x+a,y); this.lineTo(x+w-b,y); this.quadraticCurveTo(x+w,y,x+w,y+b);
    this.lineTo(x+w,y+h-c2); this.quadraticCurveTo(x+w,y+h,x+w-c2,y+h);
    this.lineTo(x+d,y+h); this.quadraticCurveTo(x,y+h,x,y+h-d);
    this.lineTo(x,y+a); this.quadraticCurveTo(x,y,x+a,y); return this;
  };
}

/* The backing store is the only real performance dial in this game. Profiled
   under a 6x CPU throttle the entire script cost 4ms a frame while the frames
   took 120ms -- it is all rasterising, and rasterising is priced in pixels.
   Halving the backing store roughly halves the frame. So render at a modest
   scale and let the measured frame time move it, floor 1x, ceiling 1.75x. */
const DPR_MAX = 1.75, DPR_MIN = 1;

function perfWatch(raw){
  if(perfCool > 0){ perfCool -= raw; return; }
  perfAcc += Math.min(raw, 0.25); perfN++;
  if(perfN < 48) return;
  const avg = perfAcc/perfN; perfAcc = 0; perfN = 0;
  if(avg > 0.0235 && dprCap > DPR_MIN){          // below ~43fps: give up pixels
    dprCap = Math.max(DPR_MIN, dprCap - 0.25); perfDropped = true; perfCool = 3; resize();
  } else if(avg < 0.0172 && dprCap < DPR_MAX && !perfDropped){

  }
}
function resize(){
  CW = cv.clientWidth || window.innerWidth;
  CH = cv.clientHeight || window.innerHeight;
  DPR = Math.min(window.devicePixelRatio||1, dprCap);
  cv.width  = Math.round(CW*DPR);
  cv.height = Math.round(CH*DPR);
  // Keep at least 1450 world-units wide and 980 tall visible -> constant difficulty.
  // LANDSCAPE ONLY. There is one framing, and a portrait window is asked to
  // turn rather than laid out again: the escape is a wide painted scene and the
  // run wants lead time in front of the bird, neither of which survives a tall
  // window. PORTRAIT is now only "should we ask for a turn", never a layout.
  PORTRAIT = CH > CW*1.02;
  document.body.classList.toggle('portrait', PORTRAIT);
  SCALE = Math.min(CH/980, CW/1450);
  VW = CW/SCALE; VH = CH/SCALE;

  GROUND = VH - roadH;

   #rotate gate is what actually guarantees landscape. Desktop is left alone. */
let orientTried = false;
function lockLandscape(){
  if(orientTried || !TOUCH) return; orientTried = true;
  try{
    const el = document.documentElement;
    const go = () => { try{ screen.orientation.lock('landscape').catch(()=>{}); }catch(e){} };
    if(screen.orientation && screen.orientation.lock){

  const spb = 60/bpm/2;
  if(A.nextNote < now) A.nextNote = now+0.05;
  while(A.nextNote < now+0.28){

      o.type='sine'; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+0.11);

  if(d>mx){ const s=mx/d; tx*=s; ty*=s; d=mx; }
  if(d<mn){ const s=mn/(d||0.001); tx*=s; ty*=s; d=mn; }

  p.kNx=_ik1.kx; p.kNy=_ik1.ky; p.fNx=_ik1.fx; p.fNy=_ik1.fy;
  p.kFx=_ik2.kx; p.kFy=_ik2.ky; p.fFx=_ik2.fx; p.fFy=_ik2.fy;
}

/* ---- the poses ---- */
/* wing angles: 0 = straight down, more negative = further up */
function poseRun(ph, speedT, p){
  const stride=lerp(40,48,speedT), lift=lerp(22,30,speedT), bob=lerp(9,13,speedT);
  p.y = bob*Math.cos(4*Math.PI*(ph-0.12));
  p.x = 3.5*Math.sin(4*Math.PI*ph);
  p.rot = lerp(0.10,0.28,speedT) + 0.055*Math.sin(4*Math.PI*ph);
  // the head stays locked in space while the body pumps under it — real chickens do this
  // the head stays locked in space while the body pumps under it, then thrusts
  p.headDY = -p.y*1.30 + 1.4*Math.sin(2*Math.PI*ph+0.6);
  p.headDX = -p.x*0.55 + 4.0*Math.sin(2*Math.PI*ph+2.2);
  p.headR = -p.rot*0.9 + 0.05*Math.sin(4*Math.PI*ph+1.2);
  const gy = CK.standH - CK.hipY - CK.ANKLE - p.y;
  footPath(ph, stride, lift, gy, _fp1);
  footPath(ph+0.5, stride, lift, gy, _fp2);
  setLegs(p, _fp1.x-CK.hipX, _fp1.y, _fp2.x-CK.hipX, _fp2.y);
  // a running chicken pumps its wings for balance — out of phase with the legs
  const w = Math.sin(ph*TAU), w2 = Math.sin(ph*TAU + 1.15);
  p.wingN = -1.42 + w*0.52; p.wingF = -1.32 - w*0.46;   // wings shuffle for balance
  p.tipN  = 0.34 + w2*0.55; p.tipF = 0.30 - w2*0.48;
  p.wingOpen = 0.24 + 0.22*Math.max(0,w);
  p.tail = 0.26*w - 0.04;
  p.sx = 1 - 0.045*w; p.sy = 1 + 0.045*w;               // squash and stretch on the bounce
  return p;
}
/* Periodic Catmull-Rom through hand-placed keys. Non-uniform timing is the
   whole point: the power stroke is fast and the recovery is slow, which is what
   a sine cannot give you and what makes a flap read as effort. */
function sampleTrack(keys, t){
  t = t - Math.floor(t);
  const n = keys.length;
  let i = 0;
  while(i < n-1 && keys[i+1][0] <= t) i++;
  const k1=keys[i], k2=keys[(i+1)%n], k0=keys[(i-1+n)%n], k3=keys[(i+2)%n];
  let t1=k1[0], t2=k2[0]; if(t2<=t1) t2+=1;
  const u=(t-t1)/(t2-t1), u2=u*u, u3=u2*u;
  const out=[];
  for(let j=1;j<k1.length;j++){
    const p0=k0[j],p1=k1[j],p2=k2[j],p3=k3[j];
    out.push(0.5*((2*p1)+(-p0+p2)*u+(2*p0-5*p1+4*p2-p3)*u2+(-p0+3*p1-3*p2+p3)*u3));
  }
  return out;
}
/*      t     wing    tip   bodyY   rot    head   tail  */
const FLAP_TRACK = [
  [0.00, -3.05, -0.34,   9, -0.06,  0.21, -0.34],   // wings cocked high, held a beat
  [0.08, -2.85, -0.10,   8, -0.09,  0.19, -0.31],   // anticipation before the drive
  [0.16, -2.05,  0.55,   4, -0.16,  0.13, -0.22],   // snap into the power stroke
  [0.26, -0.85,  1.00,  -8, -0.27,  0.04, -0.06],   // through the middle, max lift
  [0.36,  0.10,  0.72, -16, -0.25, -0.02,  0.06],   // bottom, body punched upward
  [0.48, -0.55, -0.18,  -9, -0.16,  0.06, -0.06],   // wing folds, recovery begins
  [0.68, -1.85, -0.50,   1, -0.09,  0.15, -0.24],   // slow sweep back up
  [0.86, -2.70, -0.44,   6, -0.07,  0.19, -0.31]    // easing into the hold
];
function poseFly(ph, power, vy, p){
  const [wing, tip, by, rot, hr, tail] = sampleTrack(FLAP_TRACK, ph);
  const amp = 1 + power*0.30;                       // the catch stroke swings wider
  p.y = by*amp; p.x = 2 + by*0.06;
  p.rot = rot + clamp(vy/2800, -0.10, 0.26);        // banks nose-down as he drops
  p.headDX = 1; p.headDY = -by*0.55;                // head hangs back off the body pump
  p.headR = hr - clamp(vy/3200, -0.08, 0.20);
  p.wingN = -1.55 + (wing + 1.55)*amp;
  p.wingF = p.wingN + 0.18;
  p.tipN = tip*amp; p.tipF = tip*0.88*amp;
  p.wingOpen = 1;
  setLegs(p, -18, 16, -24, 10);                     // feet tucked
  p.tail = tail;
  p.sx = 1 - by*0.009; p.sy = 1 + by*0.009;         // stretches on the upbeat
  return p;
}
function poseGlide(t, vy, p){
  const k = clamp(vy/1300,0,1);
  p.y = 0; p.x = 0;
  p.rot = 0.06 + 0.42*k;
  p.headDY = 0; p.headR = -0.10 - 0.20*k;
  const tr = Math.sin(t*16)*0.09*k;
  p.wingN = -1.70 + tr; p.wingF = -1.56 - tr;      // wings held out, trembling in the dive
  p.tipN = 0.16; p.tipF = 0.16; p.wingOpen = 1;
  setLegs(p, lerp(-13,-19,k), lerp(20,15,k), lerp(-19,-25,k), lerp(16,11,k));
  p.tail = 0.24*k;
  p.sx = 1+0.04*k; p.sy = 1-0.04*k;
  return p;
}
function poseLand(k, p){
  p.y = 16*k; p.x = 3*k; p.rot = 0.30*k;
  p.headDY = -8*k; p.headR = -0.24*k;
  const gy = CK.standH - CK.hipY - CK.ANKLE - p.y;
  setLegs(p, 12-CK.hipX, gy, -11-CK.hipX, gy);
  p.wingN = -1.25-0.5*k; p.wingF = -1.15-0.5*k;
  p.tipN = 0.5; p.tipF = 0.5; p.wingOpen = lerp(0.5,1,k);
  p.tail = -0.2*k;
  p.sx = 1+0.24*k; p.sy = 1-0.26*k;                // proper landing squash
  return p;
}
function poseIdle(t, p){
  const br = Math.sin(t*2.1);
  p.y = 1.6*br; p.x = 0; p.rot = 0.02;
  p.headDY = -p.y*1.1 + 0.6*Math.sin(t*1.3);
  p.headR = 0.03*Math.sin(t*1.1);
  const gy = CK.standH - CK.hipY - CK.ANKLE - p.y;
  setLegs(p, 12-CK.hipX, gy, -11-CK.hipX, gy-1);
  p.wingN = -0.52; p.wingF = -0.46; p.tipN = 0.34; p.tipF = 0.34;
  p.wingOpen = 0.34; p.tail = 0.06*br; p.sx=1; p.sy=1;
  return p;
}
function posePeck(u, p){                            // menu beat: he pecks the ground
  const k = Math.sin(clamp(u,0,1)*Math.PI);
  p.y = 5*k; p.x = 4*k; p.rot = 0.24*k;          // a horizontal body needs far less pitch
  p.headDY = 26*k; p.headDX = 14*k; p.headR = 0.75*k;
  const gy = CK.standH - CK.hipY - CK.ANKLE - p.y;
  setLegs(p, 12-CK.hipX, gy, -11-CK.hipX, gy);
  p.wingN = -0.50-0.3*k; p.wingF = -0.44-0.3*k; p.tipN=0.34; p.tipF=0.34;
  p.wingOpen = 0.36; p.tail = 0.4*k; p.sx=1+0.04*k; p.sy=1-0.04*k;
  return p;
}
function poseStrut(t, u, p){                        // menu beat: cocky little strut
  const k = Math.sin(clamp(u,0,1)*Math.PI);
  const s = Math.sin(t*7);
  p.y = 3*k*s; p.x = 2*k; p.rot = -0.06*k;
  p.headDY = -4*k - 3*k*s; p.headR = 0.16*k;
  const gy = CK.standH - CK.hipY - CK.ANKLE - p.y;
  setLegs(p, (12+6*s)-CK.hipX, gy, (-11-6*s)-CK.hipX, gy);
  p.wingN = -0.66-0.2*k; p.wingF = -0.60-0.2*k; p.tipN=0.4; p.tipF=0.4;
  p.wingOpen = 0.5; p.tail = -0.2*k; p.sx=1; p.sy=1;
  return p;
}
function poseHurt(k, p){                            // the instant of impact
  p.y = -6*k; p.x = -14*k; p.rot = -0.55*k;
  p.headDY = 6*k; p.headDX = -10*k; p.headR = -0.5*k;
  p.wingN = -2.5*k-0.4; p.wingF = -2.6*k-0.4;
  p.tipN = -0.5*k; p.tipF = -0.5*k; p.wingOpen = 1;
  setLegs(p, 17*k-7, 21, 22*k-11, 17);
  p.tail = 0.5*k;
  p.sx = 1+0.26*k; p.sy = 1-0.20*k;
  return p;
}
function poseSit(k, t, p){                          // dazed on the ground afterwards
  const wob = Math.sin(t*3.4)*k;
  p.y = 22*k; p.x = 0; p.rot = -0.10*k + 0.05*wob;
  p.headDY = 4*k; p.headR = 0.12*k + 0.14*wob;
  const gy = CK.standH - CK.hipY - CK.ANKLE - p.y;
  setLegs(p, lerp(12,24,k)-CK.hipX, gy, lerp(-11,18,k)-CK.hipX, gy);
  p.wingN = lerp(-0.5,-0.16,k); p.wingF = lerp(-0.44,-0.10,k);
  p.tipN = 0.3; p.tipF = 0.3; p.wingOpen = lerp(0.36,0.62,k);
  p.tail = 0.3*k; p.sx = 1+0.10*k; p.sy = 1-0.12*k;
  return p;
}
function poseCheer(t, p){                           // beat your own record
  const b = Math.abs(Math.sin(t*5.4));
  p.y = -12*b; p.x = 0; p.rot = -0.12-0.06*b;
  p.headDY = -3*b; p.headR = 0.18+0.08*b;
  const gy = CK.standH - CK.hipY - CK.ANKLE - p.y;
  setLegs(p, 10-CK.hipX, gy-9*b, -9-CK.hipX, gy-5*b);
  p.wingN = -2.5-0.25*b; p.wingF = -2.6+0.25*b;
  p.tipN = 0.2; p.tipF = 0.2; p.wingOpen = 1;
  p.tail = -0.35; p.sx = 1-0.05*b; p.sy = 1+0.07*b;
  return p;
}

/* springs give the tail and the comb free follow-through */
const spring = { tail:0, tailV:0 };
function springUpdate(dt, ax, ay){
  const k=150, d=13;
  spring.tailV += (-k*spring.tail - d*spring.tailV + ax*0.8 - ay*0.5)*dt;
  spring.tail  += spring.tailV*dt;
  spring.tail   = clamp(spring.tail,-1.1,1.1);
}

/* ---- drawing ---- */
let CKC = {
  body:'#F7E6CE', shade:'#DCC0A0', wing:'#FCEEDA', edge:'#0B1526',
  comb:'#E8443A', beak:'#F5A623',
  cap:'#2FA898', capDark:'#1B7A70', capBand:'#FFD54A',
  leg:'#F5A623', legDark:'#C97F14',
  shoe:'#FCFCFC', shoeDark:'#D8D8D8', lace:'#F2684F',
  tail:['#F2684F','#FFD54A','#34D9C0']
};
function cp(fill, lw){                       // chicken outline (matches the painted head)
  ctx.fillStyle=fill; ctx.fill();
  if(lw!==0){ ctx.lineWidth=lw||5; ctx.strokeStyle=CKC.edge; ctx.lineJoin='round'; ctx.stroke(); }
}
function paint(fill, lw){                    // everything else keeps the game's ink
  ctx.fillStyle=fill; ctx.fill();
  if(lw!==0){ ctx.lineWidth=lw||5; ctx.strokeStyle=C.ink; ctx.lineJoin='round'; ctx.stroke(); }
}
/* the face lives in the painted head now — these keep the old call sites happy */
function newFace(){ return {}; }
function faceTo(){}
function updateBlink(){}
function capsule(x1,y1,x2,y2,w,col){
  ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
  ctx.strokeStyle=CKC.edge; ctx.lineWidth=w+8; ctx.stroke();
  ctx.strokeStyle=col;     ctx.lineWidth=w;   ctx.stroke();
}
function drawJoint(x,y,r,col,far){
  ctx.save(); if(far) ctx.globalAlpha=0.9;
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU); cp(col,4.4);
  ctx.restore();
}
function drawBone(x1,y1,x2,y2,w,col,far){
  if(!partReady('leg')) return capsule(x1,y1,x2,y2,w,col);
  const q=PARTS['leg'];
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1;
  const ang=Math.atan2(dx,dy);                    // 0 = straight down
  const iw=q.w*(w/11), ih=iw*(q.img.naturalHeight/q.img.naturalWidth);
  ctx.save();
  ctx.translate(x1,y1); ctx.rotate(-ang);         // same convention fix as the wing
  ctx.scale(1, len/ih*1.10);                      // stretch the tube to the bone length
  if(far) ctx.globalAlpha=0.9;
  ctx.drawImage(q.img, -iw*q.ax, -ih*0.06, iw, ih);
  ctx.restore();
}
function drawWingPart(px, py, ang, tip, open, col, far){
  ctx.save(); ctx.translate(px, py);
  // a folded wing is a different shape, not a squashed spread wing
  const id = (open < 0.55 && partReady('wingfold')) ? 'wingfold' : 'wing';
  if(partReady(id)){
    ctx.rotate(-ang);                           // canvas rotate(t) sends dir(a) to dir(a-t)
    ctx.save();
    if(far){ ctx.globalAlpha = 0.92; }
    drawPart(id, 1, id==='wingfold' ? 1 : lerp(0.42, 1, open));
    ctx.restore();
  } else {
    drawWing(ang, tip, open, col);
  }
  ctx.restore();
}
function drawShoePart(kx,ky,fx,fy,col,far){
  if(!partReady('shoe')) return drawSneaker(kx,ky,fx,fy,col);
  // the shoe ART already points toe-forward, so it needs no quarter turn; the
  // +PI/2 was left over from the procedural shoe, which drew inside a rotated frame
  const tilt = -Math.atan2(fx-kx, fy-ky) * 0.18;
  ctx.save(); ctx.translate(fx,fy); ctx.rotate(tilt);
  ctx.save(); if(far) ctx.globalAlpha=0.9;
  drawPart('shoe'); ctx.restore();
  ctx.restore();
}
function drawSneaker(kx,ky,fx,fy,col){
  const a=Math.atan2(fx-kx,fy-ky)*0.18;     // the sole stays nearly flat, as it does when planted
  ctx.save(); ctx.translate(fx,fy); ctx.rotate(-a+Math.PI/2);
  ctx.beginPath(); ctx.roundRect(-15,-15,48,22,[11,15,5,11]); cp(col,5);
  ctx.beginPath(); ctx.roundRect(-17,2,53,13,6.5); cp(CKC.shoe,4.2);
  ctx.beginPath(); ctx.moveTo(-4,-12); ctx.quadraticCurveTo(9,-5,20,-9);
  ctx.strokeStyle=CKC.lace; ctx.lineWidth=5; ctx.lineCap='round'; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-2,-4); ctx.lineTo(16,-1);
  ctx.strokeStyle='rgba(11,21,38,.30)'; ctx.lineWidth=2.6; ctx.stroke();
  ctx.restore();
}
function drawWing(a, tip, open, col){
  // a blade, not a tube: leading edge bulges, trailing edge cuts back
  const L1=CK.wingA*lerp(0.38,1,open), L2=CK.wingB*lerp(0.26,1,open);
  const ex=dirX(a)*L1, ey=dirY(a)*L1;
  const b=a+tip;
  const tx=ex+dirX(b)*L2, ty=ey+dirY(b)*L2;
  let nx=-(ty), ny=(tx); const nl=Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
  const wIn=30*lerp(0.8,1,open), wOut=9;
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.quadraticCurveTo(ex+nx*wIn*1.5, ey+ny*wIn*1.5, tx+nx*wOut, ty+ny*wOut);
  ctx.quadraticCurveTo(ex-nx*wIn*0.55, ey-ny*wIn*0.55, 0,0);
  ctx.closePath(); cp(col,5);
  for(let i=0;i<3;i++){                                  // feather tips
    const f=0.62+i*0.14;
    ctx.beginPath();
    ctx.moveTo(lerp(ex,tx,f)+nx*wIn*0.30, lerp(ey,ty,f)+ny*wIn*0.30);
    ctx.lineTo(lerp(ex,tx,f+0.30)+nx*wOut*1.5, lerp(ey,ty,f+0.30)+ny*wOut*1.5);
    ctx.strokeStyle=CKC.edge; ctx.lineWidth=3; ctx.lineCap='round'; ctx.stroke();
  }
  ctx.strokeStyle='rgba(11,21,38,.28)'; ctx.lineWidth=2.6; ctx.lineCap='round';
  for(let i=1;i<=2;i++){
    const f=i/3;
    ctx.beginPath();
    ctx.moveTo(ex*f*0.7+nx*4, ey*f*0.7+ny*4);
    ctx.lineTo(lerp(ex,tx,f)+nx*wIn*0.5, lerp(ey,ty,f)+ny*wIn*0.5);
    ctx.stroke();
  }
}
/* ============================================================
   COSMETIC LAYERS
   The base chicken owns every animation. A cosmetic is just a
   drawable parented to a named pivot, so it inherits the motion
   for free and adding one never touches the animation code.
   ============================================================ */
const SLOTS = ['back','body','neck','head','face']; // also the z-order
const COSMETICS = {};
function defineCosmetic(def){ COSMETICS[def.id] = def; return def.id; }
const Loadout = { back:null, body:null, neck:null, head:null, face:null };
function equip(slot, id){
  if(!(slot in Loadout)) return false;              // unknown slot: ignored
  if(id && !COSMETICS[id]) return false;            // missing asset: ignored
  Loadout[slot] = id || null; return true;
}
function unequip(slot){ return equip(slot, null); }
function equipped(slot){ return Loadout[slot]; }

/* pivots are handed to cosmetics as {R} in an already-transformed context,
   so a cosmetic only ever draws in its own local space */
function drawSlot(slot, R){
  const id = Loadout[slot]; if(!id) return;
  const c = COSMETICS[id];  if(!c) return;          // never break the character
  ctx.save();
  ctx.translate(c.ox||0, c.oy||0);
  if(c.rot) ctx.rotate(c.rot);
  const sc = c.scale||1; if(sc!==1) ctx.scale(sc,sc);
  if(c.draw) c.draw(R, ctx);
  else if(c.img && c.img.complete && c.img.naturalWidth){
    const w = (c.w||1)*R, h = w*(c.img.naturalHeight/c.img.naturalWidth);
    ctx.drawImage(c.img, -w*(c.ax!==undefined?c.ax:0.5), -h*(c.ay!==undefined?c.ay:0.5), w, h);
  }
  ctx.restore();
}
/* a cosmetic can be pure code or a PNG dropped in later — same slot, same pivot */
function cosmeticImage(id, slot, src, opt){
  const im = new Image(); im.src = src;
  defineCosmetic(Object.assign({id, slot, img:im}, opt||{}));
}

const FR = { ready:false, n:0, need:0, img:{} };
const SPR = 175/190;                       // world units per frame pixel
/* The roadside animals are scenery. They are loaded like everything else but
   they are deliberately left out of the readiness count -- 36 frames of cow,
   pig and goat gating FR.ready would keep the chicken a puppet for the first
   seconds of a cold load, to decorate a verge he has not reached yet. drawNPC
   checks each image itself, so one that has not arrived costs a frame of
   scenery and nothing else. */
const NPC_SETS = ['cow','cowrun','pig','pigrun','goat','goatrun'];
(function loadFrames(){
  for(const set in FRAME_DATA){
    if(NPC_SETS.indexOf(set) < 0) FR.need += FRAME_DATA[set].length;
  }
  for(const set in FRAME_DATA){
    const scenery = NPC_SETS.indexOf(set) >= 0;
    FRAME_DATA[set].forEach(fr=>{
      const im = new Image();
      im.onload = ()=>{ if(scenery) return;
                        FR.n++; if(FR.n >= FR.need) FR.ready = true; };
      im.onerror = ()=>{ if(!scenery) FR.need--; };   // missing: stay on the puppet
      im.src = 'anim/' + fr.f;
      FR.img[fr.f] = im;
    });
  }
})();
const cyc = (set, ph) => {                              // wrap a 0..1 phase onto a cycle
  const n = FRAME_DATA[set].length;
  return [set, Math.min(n-1, Math.floor(((ph % 1) + 1) % 1 * n))];
};
function pickFrame(p){
  const pl = player;
  if(game.mode === 'intro' || game.mode === 'menu'){
    const cp = cagePose();
    const set = FRAME_DATA[cp.set] ? cp.set : 'run';
    return [set, Math.min(cp.i, FRAME_DATA[set].length-1)];
  }
  if(pl.kickT > 0 && FRAME_DATA.kick) return ['kick', 4]; // still running out of it
  /* getting hit runs its own six-frame sequence: impact, launched, two tumbles,
     face down, then sitting up dazed while the score card is on screen. */
  if(game.mode === 'dying'){
    const n = FRAME_DATA.hit.length - 1;                 // last frame is the sit-up
    return ['hit', Math.min(n-1, Math.floor(clamp(game.dyingT/1.15,0,1) * n))];
  }
  if(game.mode === 'dead') return ['hit', FRAME_DATA.hit.length - 1];
  if(pl.state === 'land'){
    const k = clamp(1 - pl.stateT/0.26, 0, 1);          // 1 at touchdown -> 0 recovered
    return ['land', k > 0.66 ? 1 : (k > 0.28 ? 2 : 3)];
  }
  if(pl.onGround){
    if(game.mode !== 'play') return ['land', 3];        // standing, for the menu
    return cyc('run', pl.phase);
  }
  if(pl.thrusting) return cyc('fly', pl.flapT);
  if(pl.vy < -120){                                      // climbing: wind-up -> apex
    const j = FRAME_DATA.jump;
    const i = pl.vy < -900 ? 1 : pl.vy < -500 ? 2 : pl.vy < -220 ? 3 : 4;
    return ['jump', Math.min(i, j.length-1)];
  }
  const fl = FRAME_DATA.fall;                            // dropping: get ready to land
  if(fl && fl.length){
    const k = 1 - clamp(pl.y/300, 0, 1);                 // 0 high up, 1 about to touch
    return ['fall', Math.min(fl.length-1, Math.floor(k*fl.length))];
  }
  return ['land', 0];
}
function drawChickenFrames(x, y, p){
  const [set, idx] = pickFrame(p);
  const list = FRAME_DATA[set]; if(!list) return false;
  const fr = list[Math.min(idx, list.length-1)];
  const im = FR.img[fr.f]; if(!im || !im.complete || !im.naturalWidth) return false;
  const w = fr.w * SPR, h = fr.h * SPR;
  const ay = (fr.ay !== undefined ? fr.ay : fr.h + (fr.lift||0)) * SPR;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(p.rot);
  ctx.scale(p.sx, p.sy);
  ctx.drawImage(im, -w*0.46, -ay, w, h);
  ctx.restore();
  return true;
}

/* ============================================================
   PARTS
   Painted pieces cut from the reference art, hung on the same rig.
   Every part is optional: if its image is missing the procedural
   version draws instead, so the character can never disappear.
   `w` is the part's width in world units; ax/ay are its anchor as a
   fraction of the image, i.e. the point the pivot holds it by.
   ============================================================ */
const PARTS = {};
function loadPart(id, src, opt){
  const im = new Image(); im.src = src;
  PARTS[id] = Object.assign({ img:im, w:100, ax:0.5, ay:0.5, rot:0, tint:null }, opt||{});
}
let PARTS_ON = true;                      // align mode flips this to draw the rig underneath
function partReady(id){
  if(!PARTS_ON) return false;
  const q = PARTS[id];
  return !!(q && q.img.complete && q.img.naturalWidth > 0);
}
/* draws at the current origin; returns false so callers can fall back */
function drawPart(id, scaleX, scaleY){
  if(!partReady(id)) return false;
  const q = PARTS[id];
  const w = q.w, h = w*(q.img.naturalHeight/q.img.naturalWidth);
  ctx.save();
  if(q.rot) ctx.rotate(q.rot);
  if(scaleX!==undefined || scaleY!==undefined) ctx.scale(scaleX===undefined?1:scaleX, scaleY===undefined?1:scaleY);
  if(q.dark){ ctx.globalAlpha = 1; }
  ctx.drawImage(q.img, -w*q.ax, -h*q.ay, w, h);
  if(q.dark){                                   // far-side limbs read as shadow
    ctx.globalCompositeOperation='source-atop';
    ctx.fillStyle='rgba(70,40,20,.30)';
    ctx.fillRect(-w*q.ax, -h*q.ay, w, h);
    ctx.globalCompositeOperation='source-over';
  }
  ctx.restore();
  return true;
}

    // measured off the part: skull centre sits at (-2,-8) from the pivot, eye at (+9,-12)

  ctx.beginPath(); ctx.arc(R*0.46,-R*0.17,R*0.055,0,TAU); ctx.fillStyle='#fff'; ctx.fill();
  ctx.beginPath();                                    // the lid
  ctx.rect(R*0.02,-R*0.50,R*0.66,R*0.34*(1-open));
  ctx.fillStyle=CKC.body; ctx.fill();
  ctx.restore();
  ctx.beginPath();
  ctx.moveTo(R*0.06,-R*0.46-R*0.20*p.shockT); ctx.lineTo(R*0.66,-R*0.58-R*0.26*p.shockT);
  ctx.strokeStyle=CKC.edge; ctx.lineWidth=R*0.115; ctx.lineCap='round'; ctx.stroke();
  // hat, then the comb bursting up in front of it
  drawSlot('head', R);
  ctx.beginPath();
  ctx.moveTo(R*0.24,-R*1.00);
  ctx.quadraticCurveTo(R*0.34,-R*1.42, R*0.56,-R*1.12);
  ctx.quadraticCurveTo(R*0.72,-R*1.50, R*0.86,-R*1.06);
  ctx.quadraticCurveTo(R*1.00,-R*1.26, R*0.96,-R*0.78);
  ctx.quadraticCurveTo(R*0.60,-R*0.84, R*0.24,-R*1.00);
  ctx.closePath(); cp(CKC.comb,4.4);
  drawSlot('face', R);
}

function drawChicken(x, y, p){
  if(FR.ready && !game.align && drawChickenFrames(x, y, p)) return;
  ctx.save();
  ctx.translate(x, y);                              // y = ground contact point
  ctx.translate(p.x, -CK.standH + p.y);             // -> body core
  ctx.rotate(p.rot);
  ctx.scale(p.sx, p.sy);

  // far leg
  drawBone(CK.hipX,CK.hipY, CK.hipX+p.kFx,CK.hipY+p.kFy, 6, CKC.legDark, true);
  drawBone(CK.hipX+p.kFx,CK.hipY+p.kFy, CK.hipX+p.fFx,CK.hipY+p.fFy, 5, CKC.legDark, true);
  drawShoePart(CK.hipX+p.kFx,CK.hipY+p.kFy, CK.hipX+p.fFx,CK.hipY+p.fFy, CKC.shoeDark, true);

  // far wing
  drawWingPart(-CK.wingX, CK.wingY, p.wingF, p.tipF, p.wingOpen, CKC.shade, true);

  // tail — one swept cream shape that grows out of the body
  ctx.save();
  ctx.translate(-70, -14);
  ctx.rotate(p.tail*0.6 + spring.tail*0.18);
  ctx.rotate(-0.10);
  if(drawPart('tail')){ ctx.restore(); } else {
  ctx.beginPath();
  ctx.moveTo( 14,-20);
  ctx.quadraticCurveTo(-20,-38,-50,-26);
  ctx.quadraticCurveTo(-34,-10,-42,  4);
  ctx.quadraticCurveTo(-14, -2, 14, 14);
  ctx.closePath(); cp(CKC.body,5);
  ctx.strokeStyle='rgba(11,21,38,.24)'; ctx.lineWidth=2.6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-6,-18); ctx.lineTo(-34,-22); ctx.stroke();
  ctx.restore(); }

  drawSlot('back', CK.bodyRX);            // capes/packs sit behind the body

  // body
  if(partReady('body')){
    ctx.save(); ctx.rotate(CK.bodyTilt); drawPart('body'); ctx.restore();
  } else {
    ctx.beginPath(); ctx.ellipse(0,0,CK.bodyRX,CK.bodyRY,CK.bodyTilt,0,TAU); cp(CKC.body,5);
    ctx.save(); ctx.clip();
    const bg = ctx.createLinearGradient(-CK.bodyRX,-CK.bodyRY*0.6, CK.bodyRX,CK.bodyRY*0.6);
    bg.addColorStop(0, CKC.shade); bg.addColorStop(0.42, CKC.body); bg.addColorStop(1, '#FFEDCC');
    ctx.fillStyle=bg; ctx.fillRect(-CK.bodyRX-2,-CK.bodyRY-2,CK.bodyRX*2+4,CK.bodyRY*2+4);
    ctx.restore();
  }
  drawSlot('body', CK.bodyRX);            // outfit rides the body pivot
  // neck: joins body to head so the silhouette is one animal
  if(!partReady('body')){
    const hx=CK.headX+p.headDX, hy=CK.headY+p.headDY;
    ctx.beginPath(); ctx.moveTo(hx-4, hy+6); ctx.lineTo(hx+14, hy+10);
    ctx.lineTo(CK.bodyRX*0.44, -CK.bodyRY*0.30); ctx.lineTo(CK.bodyRX*0.10, -CK.bodyRY*0.42);
    ctx.closePath(); cp(CKC.body,5);
  }
  drawSlot('neck', CK.bodyRX);            // scarf etc.

  // head (painted sprite carries hat + face)
  ctx.save();
  ctx.translate(CK.headX+p.headDX, CK.headY+p.headDY);
  ctx.rotate(p.headR);
  drawHead(p);
  if(p.shockT>0){                                   // cartoon shock marks beat a face change at this size
    ctx.save(); ctx.globalAlpha=clamp(p.shockT*2,0,1);
    ctx.fillStyle='#FFF2DE'; ctx.strokeStyle=CKC.edge; ctx.lineWidth=3;
    for(const dx of [-6,12]){
      ctx.save(); ctx.translate(dx-38,-52); ctx.rotate(dx>0?0.22:-0.22);
      ctx.beginPath(); ctx.roundRect(-3.5,-16,7,19,3); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,8,4,0,TAU); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }
  ctx.restore();

  // near wing
  drawWingPart(CK.wingX, CK.wingY, p.wingN, p.tipN, p.wingOpen, CKC.wing, false);

  // near leg
  drawBone(CK.hipX,CK.hipY, CK.hipX+p.kNx,CK.hipY+p.kNy, 7, CKC.leg, false);
  drawBone(CK.hipX+p.kNx,CK.hipY+p.kNy, CK.hipX+p.fNx,CK.hipY+p.fNy, 6, CKC.leg, false);
  drawShoePart(CK.hipX+p.kNx,CK.hipY+p.kNy, CK.hipX+p.fNx,CK.hipY+p.fNy, CKC.shoe, false);

  if(game.rig){                                   // pivot overlay for aligning parts
    const mark=(x,y,c,lbl)=>{
      ctx.strokeStyle=c; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(x-9,y); ctx.lineTo(x+9,y);
      ctx.moveTo(x,y-9); ctx.lineTo(x,y+9); ctx.stroke();
      ctx.beginPath(); ctx.arc(x,y,4,0,TAU); ctx.stroke();
      ctx.fillStyle=c; ctx.font='700 11px Archivo, sans-serif'; ctx.fillText(lbl,x+11,y-4);
    };
    ctx.strokeStyle='rgba(63,224,176,.45)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(-160,CK.standH); ctx.lineTo(160,CK.standH); ctx.stroke();  // ground
    mark(0,0,'#FF456E','core');
    mark(CK.headX+p.headDX, CK.headY+p.headDY, '#6BD1FF', 'head');
    mark(CK.wingX, CK.wingY, '#FFD54A', 'wing');
    mark(-70, -14, '#3FE0B0', 'tail');
    mark(CK.hipX, CK.hipY, '#F2684F', 'hip');
    mark(CK.hipX+p.fNx, CK.hipY+p.fNy, '#FFF2DE', 'ankle');
  }

  ctx.restore();
}

/* ============================================================
   TUMBLE — the death. Body physics with the legs and wings
   trailing, plus the gag that sells it: he lays an egg.
   ============================================================ */
const rag = {
  alive:false, x:0, y:0, vx:0, vy:0, rot:0, vrot:0, energy:99,
  pose:newPose(),
  build(p, x, y, vx, vy, spin){
    this.alive=true;
    this.x=x; this.y=y-CK.standH; this.vx=vx; this.vy=vy;
    this.rot=p.rot; this.vrot=spin; this.energy=99; this.rest=0;
    for(const k of POSE_KEYS) this.pose[k]=p[k];
  },
  step(dt, groundY){
    if(!this.alive) return;
    this.vy += 3000*dt;
    this.x += this.vx*dt; this.y += this.vy*dt;
    this.rot += this.vrot*dt;
    const floor = groundY - CK.bodyRY*0.9;
    if(this.y > floor){
      this.y = floor;
      this.vy *= -0.42;
      this.vx *= 0.62; this.vrot *= 0.52;
      if(Math.abs(this.vy) < 90){ this.vy = 0; this.vrot *= 0.3; }
      if(Math.abs(this.vy)>140) spark(this.x, groundY, 5,
        {col:'rgba(255,242,222,.55)', a0:Math.PI, a1:TAU, s0:80,s1:260, l0:0.2,l1:0.5, r0:3,r1:8, g:700});
    }
    this.vx *= Math.pow(0.55,dt);
    this.energy = Math.abs(this.vx)+Math.abs(this.vy)+Math.abs(this.vrot)*40;
    // limbs and wings flail loosely behind the tumble
    const p=this.pose, t=game.t;
    p.wingN = damp(p.wingN, -2.2+Math.sin(t*17)*0.5, 9, dt);
    p.wingF = damp(p.wingF, -2.1-Math.sin(t*17)*0.5, 9, dt);
    p.tipN = damp(p.tipN, -0.4, 6, dt); p.tipF = p.tipN;
    p.wingOpen = damp(p.wingOpen, 1, 8, dt);
    p.tail = damp(p.tail, 0.5, 5, dt);
    setLegs(p, -4+Math.sin(t*13)*11, 24, -9+Math.sin(t*13+1.6)*11, 21);
    p.headR = damp(p.headR, 0.5*Math.sin(t*9), 7, dt);
    p.sx = damp(p.sx,1,8,dt); p.sy = damp(p.sy,1,8,dt);
    p.x=0; p.y=0;
  },
  draw(){
    ctx.save();
    ctx.translate(this.x, this.y + CK.standH);
    ctx.rotate(FR.ready ? this.rot*0.25 : this.rot);   // drawn frames already tumble
    ctx.translate(0, -CK.standH);
    const p=this.pose, keep=p.rot; p.rot=0;
    ctx.translate(0, CK.standH);
    drawChicken(0, 0, p);
    p.rot=keep;
    ctx.restore();
  }
};

/* ============================================================
   THE CAGE — the intro. Cluck County Farm Correctional Facility: a barred
   door in the side of a red barn, and a chicken who is not remotely worried
   about any of it.

   The scene is PAINTED (`sheets/v2/cage_scene.webp`), not drawn out of
   rectangles, and the door is its own sprite so it can buckle and then leave.
   Every number below is a fraction MEASURED off the art rather than guessed —
   which is what puts his feet on the straw instead of near it.

   Timeline, all of it after the player presses. Two seconds, then he is
   running, and nothing loads at the handover:
     0.00  standing in the cage, unimpressed
     0.42  coils, rocking back into it — the frame and the title start to rattle
     1.15  THE KICK. Door, lock, splinters, boom, everything on this frame.
     1.52  through the doorway, still airborne
     2.00  control returns mid-stride
   ============================================================ */
const CAGE = {
  ready:false, img:null, door:null,
  floorFrac:0.9058,                    // where the outdoor ground line sits
  dx0:0.3613, dx1:0.7129,              // the doorway, as fractions of the image
  dy0:0.4377, dy1:0.8726,              // its floor is the straw he stands on
  roof:[0.5637, 0.0443],               // the roof apex, where the neighbours are
  doorH:325,                           // the doorway's height in WORLD units
  w:0, h:0, x:0, y:0                   // filled in by cageGeom, in world units
};
(function loadCage(){
  const im = new Image();
  im.onload  = ()=>{
    const c = document.createElement('canvas');
    c.width = im.naturalWidth; c.height = im.naturalHeight;
    const g = c.getContext('2d');
    g.drawImage(im, 0, 0);
    /* Fade the RIGHT edge only, where the painted farm behind the barn has to
       hand over to the map's own panels. The LEFT edge is the barn wall, and
       fading that turned the planks half transparent with a field showing
       through them -- a ghost, not a blend. drawCageBack extends the wall to
       the screen edge instead.
       One pass over the whole canvas: destination-in clears everything the
       source does not cover, so masking a strip at a time wipes the rest. */
    g.globalCompositeOperation = 'destination-in';
    const f = 0.10, grad = g.createLinearGradient(0, 0, c.width, 0);
    grad.addColorStop(0, 'rgba(0,0,0,1)');
    grad.addColorStop(1-f, 'rgba(0,0,0,1)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad; g.fillRect(0, 0, c.width, c.height);
    CAGE.img = c; CAGE.ready = true;
  };
  im.onerror = ()=>{ CAGE.ready = false; };
  im.src = 'sheets/v2/cage_scene.webp';
  const dr = new Image();
  dr.onload = ()=>{ CAGE.door = dr; };
  dr.src = 'art/cage_door.webp';
})();

const T_WIND = 0.42, T_KICK = 1.15, T_BURST = 1.52, T_OUT = 2.00;
/* How far he travels between the kick and control coming back, in world units.
   The cage is parked exactly this far BEHIND the play position (`game.cageX =
   -CAGE_RUNOUT`, with the camera at -PX), so the pose's last frame and the
   run's first frame land on the same pixel. Park the cage anywhere else and he
   teleports at the handover -- which is what the doorway being drawn at 2*PX
   used to do, half a screen in one frame. */
const CAGE_RUNOUT = 300;
/* The camera is pulled back this far while he is still in the cage, and pans
   forward onto the play mark as he comes out. Without it the cage has to be
   parked CAGE_RUNOUT behind PX to avoid a teleport, and PX is only 27% of the
   width -- which shoves the barn half off the left edge and hides the one
   thing the menu is meant to show. */
const CAGE_CAM = 430;
const camIntroX = () => -(PX + CAGE_CAM);

/* The scene in world units, anchored so the painted ground line lands exactly
   on GROUND and the doorway centre lands on game.cageX. Sized against GROUND,
   not the play band: the play band magnifies a 572px source about fourfold and
   puts the barn roof off the top of the frame. */
function cageGeom(){
  /* Anchored on the DOORWAY, not on GROUND. The barn art gained its roof and
     got 26% taller, and sizing off the canvas would have shrunk the doorway
     with it and taken Nugget down with the doorway. The doorway is the one
     measurement that has to hold still, because he stands in it. */
  const H = CAGE.doorH / (CAGE.dy1 - CAGE.dy0);
  const W = H * (CAGE.img ? CAGE.img.width/CAGE.img.height : 1024/722);
  CAGE.h = H; CAGE.w = W;
  CAGE.y = GROUND - CAGE.floorFrac*H;          // top of the painted scene
  CAGE.x = -((CAGE.dx0+CAGE.dx1)*0.5)*W;       // offset from game.cageX
  return CAGE;
}
/* the straw floor of the cage, a little above the dirt outside */
function cageFloor(){ return (CAGE.floorFrac - CAGE.dy1) * CAGE.h; }
function cageShake(){
  if(game.mode !== 'intro') return 0;
  const t = game.introT;
  if(t < T_WIND || t > T_KICK) return 0;
  return (t - T_WIND)/(T_KICK - T_WIND);       // rattles as he winds up
}
/* the barn, the doorway and the farm beyond it — everything he stands in front of */
function drawCageBack(sx){
  const g = cageGeom();
  const j = cageShake()*cageShake()*4;
  if(!CAGE.ready){                              // art missing: a plain dark mouth
    ctx.fillStyle = '#8E3B2C';
    ctx.fillRect(sx + g.x, g.y, g.w, GROUND - g.y);
    ctx.fillStyle = '#1A1410';
    ctx.fillRect(sx + g.x + g.dx0*g.w, g.y + g.dy0*g.h,
                 (g.dx1-g.dx0)*g.w, (g.dy1-g.dy0)*g.h);
    return;
  }
  const im = CAGE.img;
  // crop off the painted dirt below the ground line and let drawGround's road
  // carry on underneath, so the two can never disagree about where the floor is
  const sh = im.height * CAGE.floorFrac;
  const x0 = sx + g.x + rnd(-j,j), y0 = g.y + rnd(-j,j)*0.5, dh = CAGE.floorFrac*g.h;
  /* The barn continues past the left of the screen. Its leftmost couple of
     source columns are a vertical run of plank colour, so stretching them out
     to the edge reads as more wall -- which is what a wall does. The picture
     simply ending, or fading out, is what made it look half deleted. */
  if(x0 > 0) ctx.drawImage(im, 0, 0, 2, sh, 0, y0, x0 + 1, dh);
  ctx.drawImage(im, 0, 0, im.width, sh, x0, y0, g.w, dh);
  drawRoofHens(sx);
}
/* THE NEIGHBOURS. Three hens in a crate on the barn roof. They are desperate
   the whole time Nugget is still in the cage, and they lose their minds the
   moment he is not -- which is the only reaction in the game to the thing the
   player just did, so it is worth the forty lines.

   They are drawn BEFORE the crate, so the wire mesh reads as being in front of
   them; the mesh is keyed transparent, so that is all it takes. */
const ROOF = { crate:new Image(), ready:false };
ROOF.crate.onload = ()=>{ ROOF.ready = true; };
ROOF.crate.src = 'art/roof_crate.webp';
function henSet(){
  // free from the frame the kick lands, and they never calm down again
  const out = (game.mode !== 'menu' && game.mode !== 'intro') ||
              (game.introT !== undefined && game.introT >= T_KICK);
  return out ? 'henjoy' : 'hensad';
}
function drawRoofHens(sx){
  const g = cageGeom();
  const cw = g.w*0.195, ch = cw*(532/516);
  const cx = sx + g.x + CAGE.roof[0]*g.w;
  const apex = g.y + CAGE.roof[1]*g.h;
  /* Sunk a third into the ridge so it is sitting on the roof rather than
     hovering over it, and clamped so it never climbs off the top of the frame
     -- on a short landscape phone there is only about 70px of sky above the
     apex, and an unclamped crate loses its own roof to the bezel. */
  const cy = Math.max(48, apex + ch*0.30 - ch);
  const set = henSet(), list = FRAME_DATA[set];
  const joy = set === 'henjoy';
  if(list && list.length){
    const hw = cw*0.21;                              // three across the inside
    for(let i=0;i<3;i++){
      const ph = i*2.1;
      const fr = list[Math.floor(game.t*(joy?9:3.4) + ph) % list.length];
      const im = FR.img[fr.f];
      if(!im || !im.complete || !im.naturalWidth) continue;
      const w = hw, h = w*(fr.h/fr.w);
      const hop = joy ? Math.max(0, Math.sin(game.t*8 + ph))*ch*0.10
                      : Math.sin(game.t*2.4 + ph)*ch*0.012;
      ctx.drawImage(im, cx - cw*0.285 + i*cw*0.285 - w*0.5,
                    cy + ch*0.775 - h - hop, w, h);
    }
  }
  if(ROOF.ready) ctx.drawImage(ROOF.crate, cx - cw*0.5, cy, cw, ch);
}
/* the barred door, in front of him, until he removes it */
function drawCageFront(sx){
  if(game.doorGone) return;
  drawCageDoor(sx);
}
/* The door is its own object so it can buckle, then leave. It is drawn to fill
   the doorway measured out of the painted scene, so it sits in the hole rather
   than near it. */
function drawCageDoor(sx){
  const g = cageGeom(), d = game.door;
  const x = sx + g.x + g.dx0*g.w, y = g.y + g.dy0*g.h;
  const w = (g.dx1-g.dx0)*g.w, h = (g.dy1-g.dy0)*g.h;
  ctx.save();
  ctx.translate(x + w*0.5 + (d ? d.x : 0), y + h*0.5 + (d ? d.y : 0));
  if(d) ctx.rotate(d.rot);
  const bow = d ? 0 : (game.doorBow||0);        // iron giving way
  ctx.transform(1 + bow*0.26, 0, bow*0.42, 1 - bow*0.10, 0, 0);
  if(CAGE.door && CAGE.door.complete && CAGE.door.naturalWidth){
    ctx.drawImage(CAGE.door, -w*0.5, -h*0.5, w, h);
  } else {
    ctx.strokeStyle='#08131A'; ctx.lineWidth=15; ctx.strokeRect(-w*0.5,-h*0.5,w,h);
    ctx.strokeStyle='#48626E'; ctx.lineWidth=10; ctx.lineCap='round';
    for(let i=1;i<7;i++){
      const bx = -w*0.5 + w*i/7;
      ctx.beginPath(); ctx.moveTo(bx,-h*0.5+10); ctx.lineTo(bx,h*0.5-10); ctx.stroke();
    }
  }
  ctx.restore();
}
/* the padlock, drawn on its own so the one that spins away can be a particle */
function drawCageLock(sx, ox, oy, rot){
  ctx.save();
  ctx.translate(sx + (ox||0), (oy||0));
  ctx.rotate(rot||0);
  ctx.strokeStyle='#241043'; ctx.lineWidth=8;                 // shackle
  ctx.beginPath(); ctx.arc(0,-13,11,Math.PI,0); ctx.stroke();
  ctx.strokeStyle='#C9C9D6'; ctx.lineWidth=4.5;
  ctx.beginPath(); ctx.arc(0,-13,11,Math.PI,0); ctx.stroke();
  ctx.beginPath();                                            // body
  if(ctx.roundRect) ctx.roundRect(-17,-8,34,30,7); else ctx.rect(-17,-8,34,30);
  ctx.fillStyle='#FFD54A'; ctx.fill();
  ctx.lineWidth=5; ctx.strokeStyle='#241043'; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,6,4,0,TAU); ctx.fillStyle='#241043'; ctx.fill();
  ctx.restore();
}
/* the kick lands: the lock goes first, then the door, then the shrapnel */
function breakCage(sx){
  const g = cageGeom();
  const dw = (g.dx1-g.dx0)*g.w, dh = (g.dy1-g.dy0)*g.h;
  const wx = cam.x + sx + g.x + g.dx0*g.w + dw*0.5;   // world x of the doorway centre
  const wy = g.y + g.dy0*g.h + dh*0.5;
  game.lockGone = true;
  game.door = { x:0, y:0, rot:0, vx:1150, vy:-560, vr:7.5 };
  game.parts.push({ x: wx, y: wy, vx: 1500, vy: -820,
    life: 2.0, t:0, r: 26, col:'#FFD54A', g: 1700, kind:'lock', rot:0, vr: 15, drag: 0.999 });
  for(let i=0;i<26;i++){
    const near = i < 16;
    game.parts.push({
      x: wx + rnd(-dw*0.30, dw*0.20),
      y: wy + rnd(-dh*0.45, dh*0.45),
      vx: (near ? rnd(500,1250) : rnd(120,520)),
      vy: -rnd(120, 780),
      life: rnd(0.7,1.6), t:0, r: rnd(12,36),
      col: pick(['#6B5540','#8E6534','#C79A5E','#3D3A36']),   // splintered wood + iron
      g: 1600, kind:'plank', rot: rnd(0,TAU), vr: rnd(-15,15), drag:0.996 });
  }
  spark(wx, wy, 30, {col:C.gold, s0:280,s1:900, l0:0.3,l1:0.8, r0:4,r1:13});
  spark(wx, wy, 16, {col:'#FFF2DE', s0:200,s1:640, l0:0.25,l1:0.6, r0:3,r1:9});
}

/* THE BOOM. Five painted frames over the doorway on the frame the kick lands,
   drawn in front of everything, including the door that is already leaving. */
const BOOM_T = 0.52;
function drawBoom(sx){
  if(!game.boomT || game.boomT >= BOOM_T) return;
  const list = FRAME_DATA.boom; if(!list || !list.length) return;
  const k = game.boomT / BOOM_T;
  const fr = list[Math.min(list.length-1, Math.floor(k*list.length))];
  const im = FR.img[fr.f]; if(!im || !im.complete || !im.naturalWidth) return;
  const g = cageGeom();
  const dw = (g.dx1-g.dx0)*g.w, dh = (g.dy1-g.dy0)*g.h;
  const cx = sx + g.x + g.dx0*g.w + dw*0.5, cy = g.y + g.dy0*g.h + dh*0.5;

function segDist(px,py, x0,y0,x1,y1){
  const dx=x1-x0, dy=y1-y0, L=dx*dx+dy*dy;

const CAP_H = 118;
function crateStack(y0, len, dir){

  for(let i=0;i<n;i++){

    ctx.beginPath(); ctx.moveTo(wob, top+3); ctx.lineTo(wob, top+ch-5); ctx.stroke();
  }

   so the SPRITE FILLS ITS HITBOX -- `w` and `h` are what spawnOne collides
   with, so anything drawn outside them would be a hit you cannot see coming.
   Every one falls back to a flat block if its image has not loaded, the same
   bargain the character frames make: art can never make a hazard invisible. */
const PROPS = {};
function loadProp(n){
  const im = new Image();
  im.onload = ()=>{ PROPS[n] = im; };
  im.onerror = ()=>{};
  im.src = 'art/farm/' + n + '.webp';
}
function farmProp(name, w, h, opt){
  opt = opt || {};

    draw(o, t){

      const im = PROPS[name];

      else if(opt.sway) ctx.rotate(Math.sin(t*1.6 + o.x*0.011)*opt.sway);
      if(im && im.complete && im.naturalWidth){
        const y = opt.roll ? -oh*0.5 : (spec.kind==='ground' ? -oh : -oh*0.5);
        ctx.drawImage(im, -ow*0.5, y, ow, oh);
      } else {
        ctx.beginPath();

        if(ctx.roundRect) ctx.roundRect(-ow*0.5, y, ow, oh, 8); else ctx.rect(-ow*0.5, y, ow, oh);

const layers = [];
/* Full-screen gradients are shaded per pixel every single time they are
   filled, and the sky, the wall's top fade and the vignette are all
   full-screen and identical frame to frame. Paint each once into a bitmap and
   blit it after that. Turning the vignette off alone was worth 18% of the
   frame, which is roughly what the blit saves. Cleared by resize(). */
const SURF = new Map();
function surface(key, w, h, opaque, drawFn){
  const q = SCALE*DPR;
  const k = key+'|'+Math.round(w)+'x'+Math.round(h)+'|'+q.toFixed(3);
  let s = SURF.get(k);
  if(!s){
    if(SURF.size > 10) SURF.clear();
    const c = document.createElement('canvas');
    c.width  = Math.max(1, Math.round(w*q));
    c.height = Math.max(1, Math.round(h*q));
    const g = c.getContext('2d', { alpha: !opaque });
    g.scale(q, q);
    drawFn(g, w, h);
    s = c; SURF.set(k, s);
  }
  return s;
}
function makeLayer(w, h, drawFn){
  const c = document.createElement('canvas');
  c.width = Math.round(w*SCALE*DPR); c.height = Math.round(h*SCALE*DPR);
  const g = c.getContext('2d');
  g.scale(SCALE*DPR, SCALE*DPR); g.translate(0, h);   // y=0 at the layer's baseline
  drawFn(g, w, h);
  return { canvas:c, w, h };
}
function buildLayers(){
  layers.length = 0;
  buildFarmLayers(2400);
}
function buildFarmLayers(TW){
  // The painted panels are the farm's middle distance. These coloured layers
  // are the fallback for when the art has not loaded -- drawn as well, they
  // stack a second farm behind the first and its hills show through the fade.
  if(FARM.ready) return;
  // far: rolling hills
  layers.push({ f:0.10, y:0, tile: makeLayer(TW, 620, (g)=>{
    g.fillStyle=C.far; g.beginPath(); g.moveTo(0,0);
    for(let x=0;x<=TW;x+=20){
      const h = 150 + Math.sin(x*0.0042)*70 + Math.sin(x*0.0011+1.3)*95;
      g.lineTo(x,-h);
    }
    g.lineTo(TW,0); g.closePath(); g.fill();
  })});
  // mid: fields with a barn, a silo and lit windows
  layers.push({ f:0.28, y:0, tile: makeLayer(TW, 620, (g)=>{
    g.fillStyle=C.mid; g.beginPath(); g.moveTo(0,0);
    for(let x=0;x<=TW;x+=20){
      const h = 96 + Math.sin(x*0.0075+2.1)*46 + Math.sin(x*0.0019)*40;
      g.lineTo(x,-h);
    }
    g.lineTo(TW,0); g.closePath(); g.fill();
    for(let i=0;i<3;i++){
      const x = 240 + i*760 + hash(i*5.1)*180;
      g.fillStyle='#3A2A22';
      g.beginPath(); g.rect(x,-150,150,150); g.fill();
      g.beginPath(); g.moveTo(x-16,-150); g.lineTo(x+75,-216); g.lineTo(x+166,-150); g.closePath(); g.fill();
      g.fillStyle='rgba(255,196,107,.34)'; g.fillRect(x+54,-96,42,58);
      g.fillStyle='#3A2A22';
      g.beginPath(); g.rect(x+196,-190,58,190); g.fill();
      g.beginPath(); g.arc(x+225,-190,29,Math.PI,0); g.fill();
    }
  })});
  // near: hedgerow and a post fence
  layers.push({ f:0.54, y:0, tile: makeLayer(TW, 620, (g)=>{
    g.fillStyle=C.near;
    let x=0,i=300;
    while(x<TW){
      const w=150+hash(i)*120, h=110+hash(i*1.7)*90;

    for(let fx=0; fx<TW; fx+=104){
      g.fillRect(fx,-70,11,70);
      g.fillRect(fx,-58,104,9); g.fillRect(fx,-32,104,9);

/* physics */
/* Hold to flap. Gravity always pulls; a held wing beats it. Nothing here is a
   jetpack — the lift comes in pulses on the downstroke, so altitude is something
   you keep working at rather than something you switch on. */
/* Jetpack Joyride flight, and nothing else layered on top:
     hold  -> continuous upward thrust, for as long as it is held
     release -> thrust stops at once, gravity takes over
   No jump impulse, no fixed jump height, no tap-to-jump. Altitude is controlled
   purely by how long you hold. Smoothness comes from acceleration plus drag,
   never from an impulse. */
/* How fast the whole game runs. Jetpack Joyride pace: the world has to whip
   past, not drift. Raising the scroll speed on its own would only shorten the
   time you get to react, so the vertical model is scaled with it -- speeds by
   PACE, accelerations by PACE^2 -- which leaves every arc, gap and corridor
   exactly the same shape in space and simply plays it faster. Hazard spacing
   is in seconds, so the cadence stays put too. ?pace=N to try another. */
const PACE = (() => { const m = /[?&]pace=([0-9.]+)/.exec(location.search);
                      return m ? clamp(parseFloat(m[1]), 0.4, 4) : 1.85; })();
const GRAV = 2500*PACE*PACE, FLAP_HZ = 4.6*PACE;
/* Air drag is what makes flight feel smooth: velocity eases toward a terminal
   value instead of ramping linearly into a hard clamp. Terminal speeds land at
   about +/-1000, reached over ~0.4s. */
const DRAG = 2.6*PACE;
/* Jetpack Joyride mechanics: holding applies CONSTANT lift, not pulses.
   Pulsed lift made a hold feel like it was not registering, so players tapped
   instead of holding. The wingbeat is now purely visual. */
const THRUST = 5200*PACE*PACE;             // continuous while held, vs gravity
const VY_UP = -1500*PACE, VY_DOWN = 1500*PACE;   // rails only; drag sets the real terminal
/* Every press also lands an instant impulse, so a quick tap lifts even if the
   finger is gone before the downstroke completes. */

  const amp  = moving ? rnd(50, 110) : 0;
  const margin = 80 + amp;
  const lo = gap/2 + margin, hi = band - gap/2 - margin;
  const c  = hi>lo ? rnd(lo,hi) : band/2;
  const g  = { c, gap, band, amp, spd:rnd(0.8,1.5), phase:rnd(0,TAU) };
  const closure = game.speed;
  const x = player.x + closure*Math.max(1.5, (VW - PX + 180)/closure + 0.2);
  const mk = (spec, hang, h, cap) => {
    if(h < 46) return;                                   // too short to bother drawing

      warn:0, passed:false, minGap:1e9, counted:false, gate:g });
  };

  mk(OB.hanger, true,  band - (c + gap/2),   pick(gateHangs()));

const EGG_R = 26;
function eggFree(x, y){

    if(Math.abs(o.x - x) > ow) continue;

    else if(o.kind === 'air'){ obot = o.base; otop = o.base + o.h; }
    else { obot = o.y||0; otop = (o.y||0) + o.h; }
    if(y > obot-54 && y < otop+54) return false;
  }
