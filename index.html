  const band = GROUND - CEIL;
  const n = 5 + (Math.random()*5 | 0);
  const gap = 78;
  const x0 = player.x + game.speed * 1.9;
  const shape = Math.random();
  const lo = 70, hi = band - 140;
  const base = rnd(lo, hi);
  for(let i=0;i<n;i++){
    const t = i/(n-1 || 1);
    let y;
    if(shape < 0.42)      y = base;                                  // a flat line
    else if(shape < 0.72) y = base + Math.sin(t*Math.PI) * 190;      // an arc over
    else                  y = base + t * 190;                        // a climb
    y = clamp(y, lo, hi);
    const x = x0 + i*gap;
    if(!eggFree(x, y)) continue;
    game.eggs.push({ x, y, t: rnd(0,TAU), got:0 });
  }
  game.eggT = rnd(1.5, 2.6);
}
function updateEggs(dt){
  const p = player;
  game.eggT -= dt;
  if(game.eggT <= 0) spawnEggs();
  game.eggStreakT = Math.max(0, game.eggStreakT - dt);
  if(game.eggStreakT <= 0) game.eggStreak = 0;
  for(let i=game.eggs.length-1;i>=0;i--){
    const e = game.eggs[i];
    e.t += dt*3.4;
    if(e.got){                                   // flying to the counter
      e.got += dt*3.2;
      if(e.got >= 1){ game.eggs.splice(i,1); continue; }
      continue;
    }
    if(Math.abs(e.x - p.x) < EGG_R+46 && Math.abs(e.y - (p.y+74)) < EGG_R+62){
      e.got = 0.001;
      game.runEggs++; game.eggBank++;
      game.eggStreak = Math.min(12, game.eggStreak+1); game.eggStreakT = 0.9;
      S.egg(game.eggStreak);
      elEggCount.textContent = game.eggBank;
      elEggCount.classList.remove('pop'); void elEggCount.offsetWidth;
      elEggCount.classList.add('pop');
      spark(e.x, GROUND - e.y, 6, {col:C.gold, s0:90,s1:260, l0:0.2,l1:0.45, r0:2,r1:6, g:220});
      try{ localStorage.setItem('dgh_eggs', String(game.eggBank)); }catch(err){}
      continue;
    }
    if(e.x < cam.x - 200) game.eggs.splice(i,1);
  }
}
function drawEggs(){
  const list = FRAME_DATA.egg;
  for(const e of game.eggs){
    const sx = e.x - cam.x;
    if(sx < -80 || sx > VW+80) continue;
    let x = sx, y = GROUND - e.y, sc = 1, a = 1;
    if(e.got){                                   // slides up to the counter
      const k = e.got;
      x = lerp(sx, 34, k*k); y = lerp(y, 34, k*k);
      sc = 1 - k*0.45; a = 1 - k*0.75;
    }
    ctx.save(); ctx.globalAlpha = a;
    ctx.translate(x, y + Math.sin(e.t*0.9)*4);
    let drew = false;
    if(list && FR.ready){
      const fr = list[Math.floor((((e.t*0.30) % 1)+1)%1 * list.length) % list.length];
      const im = FR.img[fr.f];
      if(im && im.complete && im.naturalWidth){
        const w = fr.w*SPR*sc, h = fr.h*SPR*sc;
        ctx.drawImage(im, -w/2, -h/2, w, h);
        drew = true;
      }
    }
    if(!drew){
      const wob = Math.abs(Math.cos(e.t*0.9));
      ctx.beginPath();
      ctx.ellipse(0, 0, (10+16*wob)*sc, 26*sc, 0, 0, TAU);
      const g2 = ctx.createLinearGradient(-18*sc,-24*sc, 14*sc, 24*sc);
      g2.addColorStop(0,'#FFF0BE'); g2.addColorStop(0.45,'#FFD54A'); g2.addColorStop(1,'#D9901C');
      ctx.fillStyle = g2; ctx.fill();
      ctx.lineWidth = 4*sc; ctx.strokeStyle = '#241043'; ctx.stroke();
    }
    ctx.restore();
  }
}

/* Jetpack Joyride spacing. One hazard at a time, dropped anywhere in the
   column with clear air all round it -- never a floor piece and a ceiling
   piece stacked into a narrow slot. That stacking is Flappy Bird, and it is
   what made this feel like threading a needle instead of flying. */
function spawnStandalone(hang){
  const band = GROUND - CEIL;
  const spec = hang ? OB.hanger : OB.tower;
  const h = hang ? rnd(110, Math.min(300, band*0.40))
                 : rnd(90,  Math.min(280, band*0.38));
  const closure = game.speed;
  const x = player.x + closure*Math.max(1.6, (VW - PX + 200)/closure + 0.25);
  game.obstacles.push({ key: hang?'hanger':'tower', spec, x, kind:'ground', hang,
    w:spec.w, h, cap: pick(hang?gateHangs():gateTops()), base:0, vx:0, rot:0,
    bz:0, y:0, vy:0, landed:true, warn:0, passed:false, minGap:1e9, counted:false });
}
/* The zapper used to take 22-26% of every tier above 0, and it was the one
   hazard that could sit anywhere in the column. With it gone that share goes to
   the standalone columns and the air, which are the only other things that make
   you choose a height -- otherwise every tier collapses into "fly over the
   ground props" and the ceiling stops mattering. */
function spawnPattern(){
  const tier = tierNow();
  const pool = poolFor(tier);
  const air  = pool.filter(k=>OB[k].kind==='air');
  const gnd  = pool.filter(k=>OB[k].kind==='ground' && k!=='tower' && k!=='hanger');
  const fall = pool.filter(k=>OB[k].kind==='fall');
  const r = Math.random();
  let gap;
  if(tier===0){                                   // just objects on the floor
    spawnOne(pick(gnd), 0);
    gap = rnd(2.20, 2.70);
  } else if(tier===1){                            // the whole cast, well spaced
    if(r<0.46) spawnOne(pick(gnd),0);
    else if(r<0.74) spawnOne(pick(air),0);
    else spawnStandalone(Math.random()<0.5);
    gap = rnd(1.75, 2.20);
  } else if(tier===2){                            // things start falling
    if(r<0.36) spawnOne(pick(gnd),0);
    else if(r<0.60) spawnOne(pick(air),0);
    else if(r<0.84) spawnStandalone(Math.random()<0.55);
    else if(fall.length) spawnOne(pick(fall),0);
    else spawnStandalone(true);
    gap = rnd(1.50, 1.90);
  } else if(tier===3){                            // two things at once
    if(r<0.26) spawnOne(pick(gnd),0);
    else if(r<0.48) spawnOne(pick(air),0);
    else if(r<0.72) spawnStandalone(Math.random()<0.55);
    else if(r<0.86 && fall.length) spawnOne(pick(fall),0);
    else { spawnStandalone(Math.random()<0.55); spawnOne(pick(air), 0.9); }
    gap = rnd(1.30, 1.65);
  } else {
    if(r<0.20) spawnOne(pick(gnd),0);
    else if(r<0.40) spawnOne(pick(air),0);
    else if(r<0.66) spawnStandalone(Math.random()<0.55);
    else if(r<0.80 && fall.length) spawnOne(pick(fall),0);
    else { spawnStandalone(Math.random()<0.55); spawnOne(pick(gnd.concat(air)), 0.85); }
    gap = rnd(1.10, 1.42);
  }
  game.spawnT = gap;
}

/* ============================================================
   INPUT
   ============================================================ */
/* thrustOn / thrustOff are the ONLY movement inputs. They set a flag; all
   motion happens in one place in updatePlay. */
let inputDown = false;
function thrustOn(){
  inputDown = true;
  game.tapCount = (game.tapCount||0) + 1;        // counted at entry, for ?dbg=1
  if(game.mode==='menu'){ startIntro(); return; }
  if(game.mode==='intro'){                       // pressing skips ahead to the kick
    if(game.introT < T_KICK-0.05) game.introT = T_KICK-0.05;
    return;
  }
  if(game.mode==='dead'){
    if(game.deadT>0.35) startIntro(); return;
  }
  if(game.mode!=='play') return;
  const wasOff = !player.thrusting;
  player.thrusting = true;                     // FIRST. Nothing below may block it.
  if(wasOff){
    player.flapT = 0.13;                       // start the wingbeat animation
    player.powerT = 1;
    try{
      if(!player.onGround) featherBurst(player.x-24, GROUND-player.y-30, 3, 180);
      S.flap();
    }catch(e){ game.fxErr = e.message; }
  }
  if(game.tut){ game.tut=false; elTut.classList.remove('show'); }
}
function thrustOff(){ inputDown = false; player.thrusting = false; }
const pressJump = thrustOn, releaseJump = thrustOff;   // old names, one system
/* Input, made unmissable.
   taps=0 on device meant no press was reaching pressJump at all. So: listen in
   the CAPTURE phase (nothing downstream can swallow it), bind to the canvas as
   well as window, and register touch AND pointer AND mouse rather than choosing.
   pressJump/releaseJump are idempotent, so overlapping families are harmless.
   Every raw down is counted before any filtering, so the readout can tell
   "no event arrived" apart from "event arrived and was filtered". */
const BUILD = 'b0903-1608';   // shown in ?dbg=1 so a cached build is obvious
const TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints||0) > 0;
/* Only the mute button may swallow a press. Filtering on any <button> was the
   bug: on device every tap reported lastEv=start with taps=0, because the target
   resolved to a button and downFrom returned before pressJump ever ran.
   Tapping PLAY or RETRY should fly as well as start the run - that is the
   behaviour we want anyway. */
function onBtn(e){
  const t = e.target;
  return !!(t && t.closest && t.closest('#mute'));
}
function downFrom(e){
  game.rawDown = (game.rawDown||0) + 1;
  if(onBtn(e)) { game.lastEv = 'btn'; return; }
  pressJump();
  try{ audioInit(); }catch(err){}
}
const CAP = {passive:true, capture:true};
const ACT = {passive:false, capture:true};      // active: may preventDefault
function touchDown(e){
  game.lastEv = 'start';
  const btn = e.target && e.target.closest ? e.target.closest('button') : null;
  // Keeping the touch alive is the whole point: without preventDefault the
  // browser's long-press handling ends it and sends touchend by itself.
  // Buttons are left alone so their click still works.
  if(!btn && e.cancelable) e.preventDefault();
  if(btn && btn.id === 'mute') return;
  downFrom(e);
}
function bindDown(el){
  if(!el) return;
  el.addEventListener('touchstart', touchDown, ACT);
  if(!TOUCH){
    el.addEventListener('pointerdown', e=>{ game.lastEv='pdown'; downFrom(e); }, CAP);
    el.addEventListener('mousedown',  e=>{ game.lastEv='mdown'; downFrom(e); }, CAP);
  }
}
bindDown(window); bindDown(cv);

/* touchmove only keeps the gesture alive; it must never start or stop thrust */
window.addEventListener('touchmove', e=>{ if(e.cancelable) e.preventDefault(); }, ACT);

if(TOUCH){
  /* On a touch device ONLY touch events may stop thrust. blur, mouseleave and
     the pointer family all fire spuriously on phones - a blur listener alone
     killed every hold once already. Keep this branch minimal. */
  window.addEventListener('touchend', e=>{
    game.lastEv='end';
    if(!e.touches || e.touches.length === 0) thrustOff();
  }, CAP);
  window.addEventListener('touchcancel', e=>{
    game.lastEv='cancel';
    if(!e.touches || e.touches.length === 0) thrustOff();
  }, CAP);
} else {
  window.addEventListener('pointerup',    ()=>{ game.lastEv='pup';  thrustOff(); }, CAP);
  window.addEventListener('pointercancel',()=>{ game.lastEv='pcan'; thrustOff(); }, CAP);
  window.addEventListener('mouseup',      ()=>{ game.lastEv='mup';  thrustOff(); }, CAP);
  window.addEventListener('mouseleave',   ()=>{ game.lastEv='mlv';  thrustOff(); }, CAP);
  document.documentElement.addEventListener('mouseleave', ()=>{ game.lastEv='mlv'; thrustOff(); }, CAP);
  window.addEventListener('blur', ()=>{ game.lastEv='blur'; thrustOff(); });
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) thrustOff(); });

window.addEventListener('keydown', e => {
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){
    e.preventDefault(); audioInit(); if(!e.repeat) pressJump();
  }
});
window.addEventListener('keyup', e => {
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') releaseJump();
});
document.addEventListener('contextmenu', e=> e.preventDefault());
/* The buttons go through the escape, exactly like a tap anywhere does. They
   used to call startRun() and drop you straight into a run with the cell still
   around you -- so the one thing a player is most likely to press was the one
   thing that skipped the opening. A real press also fires pointerdown first,
   which has already started the intro by the time the click lands, hence the
   mode check rather than a second startIntro(). */
$('#play').addEventListener('click', ()=>{
  audioInit(); S.click(); if(game.mode==='menu') startIntro(); });
$('#retry').addEventListener('click', ()=>{
  S.click(); if(game.mode!=='intro') startIntro(); });
$('#tomenu').addEventListener('click', ()=>{ S.click(); toMenu(); });
elMute.addEventListener('click', ()=>{
  audioInit(); A.on = !A.on;
  elMute.classList.toggle('muted', !A.on);
  if(A.started) A.master.gain.setTargetAtTime(A.on?0.9:0, A.ctx.currentTime, 0.05);
  if(!A.on){ if(TRACK) TRACK.pause(); if(MENU_TRACK) MENU_TRACK.pause(); }
});
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && A.ctx) A.ctx.suspend();
  else if(A.ctx) A.ctx.resume();
});

   FLOW
   ============================================================ */
function toMenu(){

  game.mode='menu'; game.obstacles.length=0; game.parts.length=0; game.pops.length=0;
  game.cageX = -CAGE_RUNOUT;             // parked so the escape ends on the play mark
  game.door=null; game.doorGone=false; game.lockGone=false; game.doorBow=0;
  player.state='idle'; player.stateT=0; player.beat=''; player.beatT=1.2;

  elHud.classList.remove('on'); elTut.classList.remove('show');

}
function startRun(){
  game.runCount = (game.runCount||0) + 1;
  applyTheme();
  game.mode='play'; game.runT=game.presetRunT||0; game.score=0; game.dist=0;
  game.near=0; game.combo=0; game.comboBest=0; game.comboT=0;
  game.speed=340*PACE; game.diff=0; game.spawnT=2.6;
  game.obstacles.length=0; game.parts.length=0; game.pops.length=0; game.ui.length=0;
  game.eggs.length=0; game.eggT=1.6; game.runEggs=0; game.eggStreak=0;
  game.freeze=0; game.timeScale=1; game.tsTarget=1; game.shake=0; game.zoom=1; game.zoomT=1;
  game.camY=0; game.camYT=0; game.deadT=0; game.newBest=false;
  game.door=null; game.doorGone=false; game.lockGone=false; game.doorBow=0;
  game.cageX = -CAGE_RUNOUT;             // the barn stays put and the world leaves it
  player.x=0; player.y=0; player.vy=0; player.onGround=true; player.phase=0;
  player.flapT=0; player.flapBeat=-1; player.flapLag=0;

  player.state='run'; player.stateT=0; player.landT=0; player.stumbleT=0;

    player.thrusting=true; player.flapT = (game.demoFlap!==undefined?game.demoFlap:0.2); }
  if(game.stage){                                   // drop gates straight in front, for inspection
    game.spawnT = 1e9;
    const band = GROUND-CEIL;
    [[0.34,470],[0.60,380],[0.44,320]].forEach(([f,gp],i)=>{
      const g = spawnGate(i===2);
      g.c = band*f; g.gap = gp; g.amp = i===2?90:0;
      game.obstacles.filter(o=>o.gate===g).forEach(o=>{
        o.x = player.x + 260 + i*430;
        o.h = Math.max(0, o.hang ? g.band-(g.c+g.gap/2) : g.c-g.gap/2);

function die(o){

  spark(player.x, gy - player.y - 90, 14, {col:C.coral, s0:120,s1:420, l0:0.4,l1:0.8, r0:5,r1:13});

function finish(){

function confettiBurst(){

    game.ui.push({ x:rnd(0,VW), y:rnd(-VH*0.3,VH*0.1), vx:rnd(-90,90), vy:rnd(60,240),

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt, rawDt){
  game.t += rawDt;
  // slow-mo easing
  if(game.smT>0){ game.smT-=rawDt; if(game.smT<=0) game.tsTarget=1; }
  game.timeScale = damp(game.timeScale, game.tsTarget, 12, rawDt);

  game.shake = Math.max(0, game.shake - game.shake*6*rawDt - 12*rawDt);
  const sh = game.shake;
  cam.shakeX = (Math.random()*2-1)*sh; cam.shakeY = (Math.random()*2-1)*sh;
  game.flash = Math.max(0, game.flash - rawDt*3.2);
  elFlash.style.opacity = (game.flash*0.55).toFixed(3);

  if(game.mode==='menu')       updateMenu(dt);
  else if(game.mode==='intro') updateIntro(dt);
  else if(game.mode==='play')  updatePlay(dt);
  else if(game.mode==='dying') updateDying(dt);
  else if(game.mode==='dead')  updateDead(dt, rawDt);
  if(game.door) updateDoor(dt);        // outside the chain: it flies on into play

  updateParticles(dt);
  musicTick(); trackTick(rawDt);
}

/* The escape. It waits on the menu for the first press, then runs 1.52s and
   hands straight over to a normal run -- no cinematic, no pause, and he is
   already moving when control returns. Deadpan the whole way through: the joke
   is that breaking out of prison is not worth reacting to. */
function cagePose(){
  const g = cageGeom();
  const floor = cageFloor();                    // the straw is above the dirt outside
  const standX = g.x + ((g.dx0+g.dx1)*0.5)*g.w; // dead centre of the doorway
  const t = game.introT;
  // Waiting. He is visible through the bars from the moment the menu appears —
  // that is the whole hook, so the menu is laid out to leave this half clear.
  if(game.mode === 'menu' || t < T_WIND) return { set:'kick', i:0, x:standX, y:floor };
  if(t < T_KICK){                               // coils, rocking back into it
    const k = (t-T_WIND)/(T_KICK-T_WIND);
    return { set:'kick', i:1, x:standX - 30*Math.sin(k*Math.PI*0.9), y:floor };
  }
  if(t < T_BURST){                              // THE KICK, straight through it
    const k = (t-T_KICK)/(T_BURST-T_KICK);
    return { set:'kick', i:2, x:standX + CAGE_RUNOUT*0.55*k, y:floor + k*30 };
  }
  const k = (t-T_BURST)/(T_OUT-T_BURST);        // out, still airborne, then down
  return { set:'kick', i:3, x:standX + CAGE_RUNOUT*(0.55 + 0.45*k),
           y: (floor + 30) * (1 - k*k) };         // and back onto the road
}
/* Where the pose leaves him, in world units. Read by the handover so the run
   picks him up from exactly there. */
function cageExitX(){
  return game.cageX + CAGE_RUNOUT;
}
function startIntro(){
  startRun();
  elHud.classList.remove('on');
  elTut.classList.remove('show');
  game.mode = 'intro';
  game.introT = 0;
  /* The poster goes on the press, over about a third of a second, so the cell
     is uncovered well before he swings off the bunk at T_UP. It used to hang
     around until the kick, which is fine for a word of text sitting over the
     scene and hopeless for a full-screen picture covering it. */
  game.titleT = (POSTER_TITLE && TITLE.ready) ? -0.001 : 1;
  game.rattleT = 0;
  game.stepT = 0;
  game.doorBow = 0;
  game.boomT = undefined;
  game.introHeld = false;
  game.cheerT = undefined; game.cheerN = 0;
  cam.x = camIntroX();
  player.kickT = 0;
}
function updateIntro(dt){
  /* ?introt=N holds the intro at a moment. It used to assign introT directly,
     which meant `was` and `t` were equal and every one-shot -- the kick, the
     door, the blast -- was skipped: the flag could show the poses and nothing
     that actually happens. It now takes ONE step of the whole remaining time,
     firing each edge on the way, and holds after that. */
  if(game.holdIntro !== undefined){
    if(game.introHeld) dt = 0;
    else { dt = Math.max(0, game.holdIntro - game.introT); game.introHeld = true; }
  }
  if(game.introSlow) dt /= game.introSlow;
  const was = game.introT;
  game.introT += dt;
  const t = game.introT;
  if(game.boomT !== undefined && game.boomT < BOOM_T)
    game.boomT += (game.rawDt||dt) / (game.introSlow||1);

  if(was < T_WIND && t >= T_WIND) S.cluck();            // he clocks the door
  if(t > T_WIND && t < T_KICK){                         // winds up against the bars
    game.rattleT -= dt;
    if(game.rattleT <= 0){ game.rattleT = 0.10; S.cagerattle(); }
  }
  if(game.cheerT !== undefined && game.cheerT > 0){     // three clucks, staggered
    game.cheerT -= dt;
    if(game.cheerT <= 0){
      S.cluck();
      game.cheerN = (game.cheerN||0) + 1;
      if(game.cheerN < 3) game.cheerT = 0.17;
    }
  }
  // The camera rides out with him: pulled back on the cage until the kick,
  // then eased onto the play mark, so the last frame of the escape and the
  // first frame of the run are the same pixel.
  const pk = clamp((t - T_KICK)/(T_OUT - T_KICK), 0, 1);
  cam.x = -(PX + CAGE_CAM*(1 - pk*pk*(3-2*pk)));
  // the iron gives just before it goes
  game.doorBow = (t > T_KICK-0.15 && t < T_KICK) ? (t-(T_KICK-0.15))/0.15 : 0;
  // he compresses into the last stride, then snaps out through the door
  const q = player.pose;
  if(game.doorBow > 0){ q.sx = 1 - game.doorBow*0.13; q.sy = 1 + game.doorBow*0.15; }
  else { q.sx = damp(q.sx, 1, 9, dt); q.sy = damp(q.sy, 1, 9, dt); }

  if(was < T_KICK && t >= T_KICK){                       // THE KICK
    S.doorbreak();
    breakCage(game.cageX - cam.x);
    game.boomT = 0;                                     // and the blast over the doorway
    game.doorBow = 0;
    addShake(46); game.flash = 0.95; game.freeze = 0.13;
    slowmo(0.34, 0.34);
    if(navigator.vibrate) try{ navigator.vibrate([40,30,70]); }catch(e){}
    featherBurst(cam.x + game.cageX, GROUND-cageGeom().h*0.34, 14, 420);
    game.cheerT = 0.12;                                  // the roof joins in
    game.titleT = -1;                                    // and the title goes with it
    player.pose.sx = 1.38; player.pose.sy = 0.72;        // stretched through the doorway
  }
  if(was < T_OUT && t >= T_OUT){                         // straight into the run
    elHud.classList.add('on');
    elEggCount.textContent = game.eggBank;
    musicScene('play');            // through the door, and the chase starts
    if(game.tut) elTut.classList.add('show');
    player.x = cageExitX();          // exactly where the last pose left him
    player.y = 0; player.vy = 0; player.onGround = true;
    player.kickT = 0.14;
    player.thrusting = inputDown;                        // still holding? then fly
    game.mode = 'play';
  }
}
/* the door keeps tumbling long after control is handed back */
function updateDoor(dt){
  const d = game.door; if(!d) return;
  d.vy += 2600*dt;
  d.x += d.vx*dt; d.y += d.vy*dt; d.rot += d.vr*dt;
  d.vx *= Math.pow(0.72, dt);
  if(d.y > 260){ game.door = null; game.doorGone = true; }
}

/* --- menu: he idles with personality beats --- */
function updateMenu(dt){
  const p = player;
  p.stateT += dt;
  p.beatT -= dt;
  if(p.beatT<=0){
    p.beat = pick(['','','peck','strut','peck']);
    p.beatT = p.beat==='' ? rnd(1.4,2.4) : rnd(1.5,2.2);
    p.beatStart = p.stateT;
    if(p.beat==='strut') S.cluck();
  }
  const target = newPose();
  const bt = p.stateT - (p.beatStart||0);
  if(p.beat==='peck'){
    posePeck(clamp(bt/0.7,0,1), target);
    if(bt>0.30 && bt<0.36) spark(player.x-10, GROUND, 3,
      {col:'rgba(255,242,222,.5)', a0:Math.PI,a1:TAU, s0:40,s1:130, l0:0.2,l1:0.45, r0:2,r1:5, g:500});
  }
  else if(p.beat==='strut') poseStrut(p.stateT, clamp(bt/1.4,0,1), target);
  else poseIdle(p.stateT, target);
  blendPose(p.pose, target, dt, 14);
  springUpdate(dt, 0, 0);
  cam.x = damp(cam.x, camIntroX(), 6, dt);   // framed on the cage, not the road
  game.camY = damp(game.camY, -40, 6, dt);
  game.zoom = damp(game.zoom, 1, 6, dt);
}

function updateBlink(p, dt){
  p.blinkT -= dt;
  if(p.blinkT<=0){ p.blinkT = rnd(1.8,5.2); p.blinkPhase = 0.14; }
  if(p.blinkPhase>0){ p.blinkPhase -= dt; p.blink = Math.sin((1-p.blinkPhase/0.14)*Math.PI); }
  else p.blink = 0;
  p.face.blink = p.blink;
}

/* --- the run --- */
function updatePlay(dt){
  const p = player;
  game.runT += dt;
  game.diff = clamp(game.runT/95, 0, 1);
  game.speed = (340 + 400*game.diff)*PACE;
  const speedT = game.diff;

  p.x += game.speed*dt;
  game.dist += game.speed*dt;
  const before = game.score;
  game.score += dt*game.speed*0.25;
  if(Math.floor(game.score/50) !== Math.floor(before/50)) S.tick();

  if(game.demoRun!==undefined){                    // freeze one frame of the run cycle
    p.onGround=true; p.y=0; p.vy=0; p.state='run'; p.thrusting=false;
    p.phase=game.demoRun; buildPlayerPose(dt,speedT); return;
  }
  // ---- flight ----
  p.powerT = Math.max(0, (p.powerT||0) - dt*3.2);
  if(game.demo){
    p.thrusting = game.holdOff ? false : (game.demoFlap!==undefined ? true : Math.sin(game.runT*2.3) > -0.15);
    if(game.demoFlap!==undefined) p.flapT = game.demoFlap;
  }
  p.nearCool = Math.max(0, p.nearCool-dt);
  p.kickT = Math.max(0, (p.kickT||0)-dt);
  whooshCool = Math.max(0, whooshCool-dt);
  const ceilH = GROUND - CEIL;                       // usable altitude, in world units

  /* THE movement model. Gravity always pulls; holding adds constant upward
     thrust; releasing removes it that same frame. Drag makes velocity ease
     toward a terminal speed instead of ramping forever, which is what gives
     smooth acceleration and deceleration without any impulse. */
  p.vy += GRAV*dt;
  if(p.thrusting) p.vy -= THRUST*dt;
  p.vy -= p.vy * DRAG * dt;
  p.vy = clamp(p.vy, VY_UP, VY_DOWN);                // safety rails only
  p.y -= p.vy*dt;

  if(p.thrusting){                                   // wingbeat is animation only
    p.flapT += dt*FLAP_HZ;
    const beat = Math.floor(p.flapT);
    if(beat !== p.flapBeat){
      p.flapBeat = beat;
      S.flap();
      if(!p.onGround) featherBurst(p.x-30, GROUND-p.y-40, 1, 90);
      spark(p.x-34, GROUND-p.y-30, 3, {col:'rgba(255,242,222,.5)', a0:Math.PI*0.85,a1:Math.PI*1.25,
        s0:70,s1:190, l0:0.18,l1:0.45, r0:3,r1:7, g:120});
    }
  } else {
    p.flapT += dt*1.4;                               // wings glide, barely moving
  }

  if(p.y >= ceilH){ p.y = ceilH; if(p.vy<0){ p.vy *= -0.25; addShake(3);
    featherBurst(p.x, GROUND-p.y+10, 3, 150); } }

  if(p.y <= 0){
    const impact = p.vy;
    p.y = 0; p.vy = 0;
    if(!p.onGround){
      p.onGround = true; p.state='land'; p.stateT=0;
      p.landT = clamp(impact/(1200*PACE), 0.35, 1);
      S.land(); addShake(clamp(impact/(220*PACE), 2, 9)); game.camYT = 14;
      spark(p.x-6, GROUND, 14, {col:'rgba(255,242,222,.7)', a0:Math.PI*1.05,a1:Math.PI*1.95, s0:110,s1:330, l0:0.22,l1:0.55, r0:3,r1:9, g:520});
      if(impact>700*PACE) featherBurst(p.x, GROUND-24, 3, 190);
    }
  } else if(p.y > 2){
    if(p.onGround){ p.onGround=false; p.state='fly'; p.stateT=0; S.takeoff(); }
  }
  if(p.onGround){
    if(p.state!=='land') p.state='run';
  } else if(p.state!=='fly'){ p.state='fly'; }

  // ---- run cycle phase & footsteps ----
  if(p.onGround){
    const strideLen = lerp(300, 420, speedT);
    const prev = p.phase;
    p.phase += game.speed*dt/strideLen;
    const a = prev - Math.floor(prev), b = p.phase - Math.floor(p.phase);
    const crossed = (x)=> (a < x && (b > x || b < a));
    if(crossed(0.0) || crossed(0.5)){
      S.step();
      spark(p.x-24, GROUND, 3, {col:'rgba(255,242,222,.45)', a0:Math.PI*1.1,a1:Math.PI*1.85, s0:50,s1:150, l0:0.18,l1:0.4, r0:2,r1:5, g:420});
    }
  }

  updateEggs(dt);

  // ---- spawn ----
  game.spawnT -= dt;
  if(game.spawnT<=0) spawnPattern();

  // ---- obstacles ----
  const pl = p.x-48, pr = p.x+48, pb = p.y+8, pt = p.y+150;
  for(let i=game.obstacles.length-1;i>=0;i--){
    const o = game.obstacles[i];
    o.x += (o.vx||0)*dt;
    if(o.gate){
      const g=o.gate;
      const c = g.c + (g.amp ? Math.sin(game.t*g.spd+g.phase)*g.amp : 0);
      o.h = Math.max(0, o.hang ? g.band - (c + g.gap/2) : c - g.gap/2);
    }
    if(o.spec.roll) o.rot = (o.rot||0) + (o.vx - game.speed)*dt/ (o.w*0.5) * -1;
    if(o.spec.bounce){
      o.bvz -= 3000*dt; o.bz += o.bvz*dt;
      if(o.bz<0){ o.bz=0; o.bvz=900; }
    }
    if(o.kind==='fall' && !o.landed){
      o.vy += 2600*dt; o.y -= o.vy*dt;
      if(o.y<=0){
        o.y=0; o.landed=true; o.vy=0;
        addShake(6); S.thud();
        spark(o.x, GROUND, 14, {col:'rgba(255,242,222,.6)', a0:Math.PI,a1:TAU, s0:120,s1:340, l0:0.25,l1:0.6, r0:4,r1:11, g:600});
      }
    }
    if(!o.wooshed && Math.abs((o.spec && o.spec.roll)||0) > 100 && o.x < p.x - 30){
      o.wooshed = true;                    // one whoosh as a fast one goes past
      if(whooshCool <= 0){ S.whoosh(); whooshCool = 0.4; }
    }
    // collision
    const ow = o.w*0.42;
    let obot, otop;
    if(o.hang){ otop = (GROUND-CEIL); obot = otop - o.h; }
    else if(o.kind==='air'){ obot=o.base; otop=o.base+o.h; }
    else { obot=o.y||0; otop=(o.y||0)+o.h; }
    const ol=o.x-ow, or=o.x+ow;
    const overlapX = pr>ol && pl<or;
    if(overlapX && !o.hitBy){
      if(pt>obot+8 && pb<otop-8){ die(o); }
    }
    // near-miss tracking
    if(overlapX){
      const gap = (o.kind==='air'||o.hang) ? (obot - pt) : (pb - otop);
      if(gap>0) o.minGap = Math.min(o.minGap, gap);
    }
    if(!o.counted && o.x < p.x-30){
      o.counted = true;
      const thr = (o.kind==='air'||o.hang) ? 74 : 62;
      if(o.minGap < thr && o.minGap > 0 && game.mode==='play') nearMiss(o);
    }
    if(o.x < cam.x - 420) game.obstacles.splice(i,1);
  }

  // ---- combo decay ----
  if(game.combo>0){
    game.comboT -= dt;
    if(game.comboT<=0){ game.combo=0; elCombo.classList.remove('on'); }
  }

  // ---- pose ----
  buildPlayerPose(dt, speedT);

  // ---- camera ----
  cam.x = damp(cam.x, p.x - PX, 14, dt);
  game.camYT = damp(game.camYT, clamp((p.y-240)*0.16, 0, 90), 5, dt);
  game.camY  = damp(game.camY, game.camYT, 9, dt);
  game.zoomT = 1 - speedT*0.045 - (p.nearT>0?0.03:0);
  game.zoom  = damp(game.zoom, game.zoomT, 7, dt);

  // speed lines when running fast
  if(speedT>0.35 && Math.random() < speedT*dt*32){
    game.parts.push({ x: cam.x+VW+40, y: GROUND - rnd(30, VH*0.55), vx:-game.speed*1.6, vy:0,
      life:0.45, t:0, r:rnd(20,70), col:'rgba(255,242,222,.24)', g:0, kind:'line', rot:0, vr:0, drag:1 });
  }
  // HUD
  elScore.textContent = pad6(game.score);
  if(game.dbg){
    const el=document.getElementById('selftest');
    if(el){ el.style.display='block';
      el.textContent =
        BUILD+'  held='+(p.thrusting?1:0)+'  taps='+(game.tapCount||0)+'  raw='+(game.rawDown||0)+
        '  ev='+(game.lastEv||'-')+'  touch='+(TOUCH?1:0)+String.fromCharCode(10)+
        'y='+Math.round(p.y)+'  vy='+Math.round(p.vy)+'  thrust='+(p.thrusting?1:0)+
        '  ground='+(p.onGround?1:0)+'  mode='+game.mode;
    }
  }
}

function nearMiss(o){
  const p = player;
  game.near++;
  game.combo++; game.comboT = 3.4;
  game.comboBest = Math.max(game.comboBest, game.combo);
  const bonus = 60*game.combo;
  game.score += bonus;
  S.near(); if(game.combo>1) S.combo(game.combo);
  addShake(4); slowmo(0.42, 0.13);
  const y = GROUND - p.y - 150;
  pop(p.x+40, y, (game.combo>1? 'x'+game.combo+' ' : '')+pick(['PHEW!','CLOSE!','NICE!','WOW!']), C.mint, 34, -150);
  pop(p.x+40, y+46, '+'+bonus, C.gold, 24, -110);
  spark(o.x, GROUND - (o.kind==='air'? o.base : o.h) , 10, {col:C.mint, s0:80,s1:300, l0:0.25,l1:0.6, r0:3,r1:8, g:200});
  elScore.classList.remove('pop'); void elScore.offsetWidth; elScore.classList.add('pop');
  if(game.combo>1){ elComboTxt.textContent='x'+game.combo; elCombo.classList.add('on');
    elCombo.style.transform='translateX(-50%) scale(1.25)';
    setTimeout(()=>{ elCombo.style.transform='translateX(-50%) scale(1)'; },90); }
  // SIGNATURE: snap a look back at what nearly got him
  if(p.nearCool<=0){ p.nearT = 0.52; p.nearCool = 0.62; }
}

/* build the player's target pose from the state machine */
function buildPlayerPose(dt, speedT){
  const p = player;
  p.stateT += dt;
  const target = newPose();

  if(game.demoPose){                                 // freeze any single state for review
    const k = game.demoPoseK, t = game.t;
    const P = game.demoPose;
    if(P==='idle')       poseIdle(t, target);
    else if(P==='peck')  posePeck(k, target);
    else if(P==='strut') poseStrut(t, k, target);
    else if(P==='glide') poseGlide(t, 1200*k, target);
    else if(P==='land')  poseLand(k, target);
    else if(P==='hurt')  poseHurt(k, target);
    else if(P==='sit')   poseSit(k, t, target);
    else if(P==='cheer') poseCheer(t, target);
    else                 poseIdle(t, target);
    for(let i=0;i<POSE_KEYS.length;i++) p.pose[POSE_KEYS[i]] = target[POSE_KEYS[i]];
    return;
  }

  if(p.state==='run'){
    poseRun(p.phase, speedT, target);
  } else if(p.state==='land'){
    const k = clamp(1 - p.stateT/0.22, 0, 1) * p.landT;
    poseLand(k, target);
    if(p.stateT>0.24 && p.onGround) p.state='run';
  } else {
    if(p.thrusting){
      poseFly(p.flapT, p.powerT||0, p.vy, target);
    } else {
      poseGlide(game.t, p.vy, target);
    }
  }

  // near miss: he flinches away from it and pops a shock mark, then carries on
  if(p.nearT>0){
    p.nearT -= dt;
    const u = 1 - p.nearT/0.50;
    const k = u<0.24 ? easeOutBack(u/0.24) : 1 - easeOutCubic((u-0.24)/0.76);
    target.headR  += -0.55*k;
    target.headDX += -11*k;
    target.headDY += -4*k;
    target.rot    += -0.13*k;
    target.sx *= 1+0.08*k; target.sy *= 1-0.06*k;
    target.shockT = clamp(k,0,1);
  }

  if(game.demoFlap!==undefined || game.demoRun!==undefined){   // inspection: show the exact key
    for(let i=0;i<POSE_KEYS.length;i++) p.pose[POSE_KEYS[i]] = target[POSE_KEYS[i]];
  } else blendPose(p.pose, target, dt, p.state==='run' ? 46 : 38);
  p.pose.shockT = target.shockT;                     // the pop must not be smoothed away
  springUpdate(dt, 0, -p.vy*0.02);
}

/* --- death: ragdoll, then he picks himself up --- */
function updateDying(dt){
  game.dyingT += dt;
  // world keeps sliding, then stops
  game.speed = damp(game.speed, 0, 2.4, dt);
  player.x += game.speed*dt;
  for(const o of game.obstacles){
    o.x += (o.vx||0)*dt;
    if(o.hitBy){ o.vy += 2200*dt; o.y = (o.y||0) - o.vy*dt; o.rot=(o.rot||0)+(o.spin||0)*dt;
      if(o.y<0){ o.y=0; o.vy*=-0.4; if(Math.abs(o.vy)<80) o.vy=0; } }
  }
  rag.step(dt, GROUND);
  if(game.dyingT<0.35 && Math.random()<dt*14) featherBurst(rag.x, rag.y, 1, 150);

  cam.x = damp(cam.x, rag.x - VW*0.42, 4, dt);
  game.camY = damp(game.camY, -20, 3, dt);
  game.zoom = damp(game.zoom, 1.06, 2.4, dt);

  if(game.dyingT>0.95 && (rag.energy||0) < 40){ startRecovery(); }
  else if(game.dyingT>2.2) startRecovery();
}
function startRecovery(){
  game.mode='dead'; game.deadT=0; game.recover=0;
  player.recX = rag.x;
  player.state = 'sit';
  finish();
}
function updateDead(dt, rawDt){
  game.deadT += rawDt;
  game.speed = damp(game.speed, 0, 3, dt);
  game.recover = Math.min(1, (game.recover||0) + dt*2.4);
  const p = player;
  const target = newPose();
  if(game.newBest && game.deadT>0.8) poseCheer(game.t, target);
  else poseSit(clamp(game.deadT*1.6,0,1), game.t, target);
  blendPose(p.pose, target, dt, 10);
  springUpdate(dt,0,0);
  cam.x = damp(cam.x, player.recX - VW*0.5, 3.2, dt);
  game.camY = damp(game.camY, 0, 3, dt);
  game.zoom = damp(game.zoom, 1.0, 3, dt);
  // confetti
  for(let i=game.ui.length-1;i>=0;i--){
    const c=game.ui[i]; c.t+=rawDt;
    c.x+=c.vx*rawDt; c.y+=c.vy*rawDt; c.vy+=420*rawDt; c.rot+=c.vr*rawDt;
    if(c.t>c.life) game.ui.splice(i,1);
  }
}

function updateParticles(dt){
  for(let i=game.parts.length-1;i>=0;i--){
    const q=game.parts[i]; q.t+=dt;
    if(q.t>=q.life){ game.parts.splice(i,1); continue; }
    q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=q.g*dt; q.rot+=q.vr*dt;
    q.vx*=Math.pow(q.drag,dt*60); q.vy*=Math.pow(q.drag,dt*60);
    if(q.kind==='feather'){
      q.vx += Math.sin(q.t*3.4+q.sway)*46*dt;          // feathers wander on the way down
      q.vy = Math.min(q.vy, 120);
      q.rot += Math.sin(q.t*3.4+q.sway)*1.6*dt;
    } else if(q.kind==='egg' && q.y>GROUND){
      q.y=GROUND; q.vy*=-0.42; q.vx*=0.66; q.vr*=0.5;
      if(Math.abs(q.vy)<70){ q.vy=0; q.vr=0; }
    }
  }
  for(let i=game.pops.length-1;i>=0;i--){
    const q=game.pops[i]; q.t+=dt;
    if(q.t>=q.life){ game.pops.splice(i,1); continue; }
    q.y += q.vy*dt; q.vy *= Math.pow(0.9,dt*60);
  }
}

/* ============================================================
   RENDER
   ============================================================ */
/* The painted clouds, cut out of the panel art. Every one is optional: a
   missing image falls back to the old drawn blob rather than a hole. */
const SKY_CLOUDS = [{f:'cloud0.webp',w:210,h:94},{f:'cloud1.webp',w:178,h:89},{f:'cloud2.webp',w:184,h:78},{f:'cloud3.webp',w:141,h:65},{f:'cloud4.webp',w:125,h:66}];
const CLOUD_IMG = {};
SKY_CLOUDS.forEach(d => { const im = new Image(); im.src = 'art/' + d.f; CLOUD_IMG[d.f] = im; });
function drawSky(){
  const T = THEME;
  const top = Math.max(0, GROUND - 1150);
  const skyH = GROUND + 40;
  // sky band and sun: two gradients that never change -> one cached blit
  ctx.drawImage(surface('sky|'+T.id+'|'+Math.round(GROUND), VW, skyH, true, (g) => {
    g.fillStyle=T.skyA; g.fillRect(0,0,VW,top+2);
    const gd = g.createLinearGradient(0,top,0,GROUND+40);
    gd.addColorStop(0, T.skyA); gd.addColorStop(0.30, T.skyB);
    gd.addColorStop(0.56, T.skyC); gd.addColorStop(0.80, T.skyD); gd.addColorStop(1, T.skyE);
    g.fillStyle=gd; g.fillRect(0,top,VW,GROUND+40-top);
    // sun, sinking behind the skyline
    // A low sinking sun suits the city. On the farm the same disc reads as a
    // moon hanging in a bright blue midday sky, so the theme scales it down.
    const R = 96*(T.sunR||1), sx = VW*0.76, sy = GROUND - 500;
    const gr = g.createRadialGradient(sx,sy,10,sx,sy,420);
    const gl = T.sunGlow===undefined ? 1 : T.sunGlow;

/* A set of painted background panels. Each is redrawn into an offscreen canvas

   hard seam through brickwork or a fence line is glaring. `top` optionally
   fades the top of the art out as well, which is how the outdoor panels hand
   over to the sky the game draws behind them.

   The mask is ONE pass over the whole canvas: `destination-in` clears
   everything the source does not cover, so masking a strip at a time wipes the
   rest of the panel and leaves an almost fully transparent image -- which on
   screen reads as flat colour, i.e. exactly like the art having failed to load. */
function loadPanels(SET){
  SET.imgs = []; SET.ready = 0;
  SET.srcs.forEach((src, i) => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas');
      c.width = im.naturalWidth; c.height = im.naturalHeight;
      const g = c.getContext('2d');
      g.drawImage(im, 0, 0);
      g.globalCompositeOperation = 'destination-in';
      const grad = g.createLinearGradient(0, 0, c.width, 0);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(Math.min(0.5, SET.blend/c.width), 'rgba(0,0,0,1)');
      grad.addColorStop(1, 'rgba(0,0,0,1)');
      g.fillStyle = grad; g.fillRect(0, 0, c.width, c.height);

        // the same saturation as the map, so on the farm a hay bale in front of
        // a hay field is camouflage. Washing the DISTANCE out is what separates
        // them -- source-atop tints only the art, never the keyed-out sky.
        g.globalCompositeOperation = 'source-atop';

        g.globalCompositeOperation = 'destination-in';

        vg.addColorStop(1, 'rgba(0,0,0,1)');

}

    if(sx < -300 || sx > VW+340) continue;
    // falling telegraph
    if(o.kind==='fall' && !o.landed){
      const k = clamp(1 - o.y/700, 0, 1);
      ctx.save(); ctx.translate(sx, GROUND);
      ctx.globalAlpha=0.25+0.4*k;
      ctx.beginPath(); ctx.ellipse(0,4, o.w*0.42*(0.5+0.5*k), o.w*0.42*0.18*(0.5+0.5*k), 0,0,TAU);
      ctx.fillStyle=C.ink2; ctx.fill();
      ctx.globalAlpha=0.5+0.5*Math.sin(game.t*16);
      ctx.strokeStyle=C.danger; ctx.lineWidth=4;
      ctx.beginPath(); ctx.ellipse(0,4, o.w*0.44, o.w*0.44*0.2, 0,0,TAU); ctx.stroke();
      ctx.globalAlpha=1; ctx.restore();
    }
    ctx.save();
    ctx.translate(sx, o.hang ? CEIL : GROUND - (o.kind==='air'? o.base : (o.y||0)));
    if(o.hitBy) ctx.rotate(o.rot||0);
    o.spec.draw(o, game.t);
    ctx.restore();
  }
}
/* The title lives in the scene rather than on a screen in front of it: it sits
   over the cage, shakes as he winds up, and the kick blows it out of frame. */
function drawTitle(){
  if(game.titleT === undefined || game.titleT === 0) return;
  /* titleT > 0 holds it; negative runs the blast, -0.001 to -1 in a third of a
     second. It used to add to titleT and clamp with Math.min(-0.001, ...),
     which walks the wrong way and then sticks, so the blast never actually
     animated -- the kick set -1 and the title vanished between two frames. */
  let k, blast = 0;
  if(game.titleT > 0){ k = 1; }
  else { blast = Math.min(1, -game.titleT);
         game.titleT -= (game.rawDt||0.016)*3.0;
         if(blast >= 1){ game.titleT = 0; return; }
         k = 1 - blast; }
  if(game.mode !== 'intro' && game.titleT > 0) return;
  if(POSTER_TITLE && TITLE.ready){
    // the poster, going: it lifts and grows out of frame as he starts moving
    const r = titleRect();
    ctx.save();
    ctx.globalAlpha = Math.max(0, k);
    ctx.translate(VW*0.5, VH*0.5);
    ctx.scale(1 + blast*0.30, 1 + blast*0.30);
    ctx.translate(-VW*0.5, -VH*0.5 - blast*VH*0.10);
    ctx.drawImage(TITLE.img, r.x, r.y, r.w, r.h);
    ctx.restore();
    return;
  }
  const sh = cageShake();
  const cx = VW*0.5 + (blast?0:rnd(-sh*4, sh*4));
  const cy = VH*0.24 - blast*VH*0.16;
  ctx.save();
  ctx.globalAlpha = Math.max(0, k);
  ctx.translate(cx, cy);
  ctx.scale(1 + blast*0.9, 1 + blast*0.9);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const size = Math.min(VW*0.13, 96);
  ctx.font = '400 '+size+'px Bungee, sans-serif';
  ctx.lineWidth = size*0.16; ctx.strokeStyle = '#241043'; ctx.lineJoin='round';
  ctx.strokeText("DON'T GET", 0, -size*0.52);
  ctx.strokeText('HIT',       0,  size*0.52);
  ctx.fillStyle = '#FFD54A'; ctx.fillText("DON'T GET", 0, -size*0.52);
  ctx.fillStyle = '#F2684F'; ctx.fillText('HIT',       0,  size*0.52);
  ctx.restore();
}
function drawParticles(){
  for(const q of game.parts){
    const a = 1 - q.t/q.life;
    ctx.globalAlpha = a;
    if(q.kind==='line'){
      ctx.strokeStyle=q.col; ctx.lineWidth=3; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(q.x-cam.x, q.y); ctx.lineTo(q.x-cam.x-q.r, q.y); ctx.stroke();
    } else if(q.kind==='feather'){
      ctx.save(); ctx.translate(q.x-cam.x, q.y); ctx.rotate(q.rot);
      ctx.beginPath(); ctx.ellipse(0,0,q.r*0.34,q.r,0,0,TAU);
      ctx.fillStyle=q.col; ctx.fill();
      ctx.strokeStyle='rgba(11,21,38,.45)'; ctx.lineWidth=1.6; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,-q.r*0.85); ctx.lineTo(0,q.r*0.85);
      ctx.strokeStyle='rgba(11,21,38,.30)'; ctx.lineWidth=1.4; ctx.stroke();
      ctx.restore();
    } else if(q.kind==='lock'){
      ctx.save(); ctx.translate(q.x-cam.x, q.y); ctx.rotate(q.rot); ctx.scale(0.85,0.85);
      drawCageLock(0, 0, 0, 0);
      ctx.restore();
    } else if(q.kind==='plank'){
      ctx.save(); ctx.translate(q.x-cam.x, q.y); ctx.rotate(q.rot);
      const L=q.r, W=Math.max(4, q.r*0.26);
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(-L*0.5,-W*0.5,L,W,W*0.5);
      else ctx.rect(-L*0.5,-W*0.5,L,W);
      ctx.fillStyle=q.col; ctx.fill();
      ctx.lineWidth=2.5; ctx.strokeStyle='rgba(21,8,39,.55)'; ctx.stroke();
      ctx.restore();
    } else if(q.kind==='egg'){
      ctx.save(); ctx.translate(q.x-cam.x, q.y-q.r); ctx.rotate(q.rot);
      ctx.beginPath(); ctx.ellipse(0,0,q.r*0.78,q.r,0,0,TAU);
      ctx.fillStyle=q.col; ctx.fill();
      ctx.lineWidth=3.4; ctx.strokeStyle='#0B1526'; ctx.stroke();
      ctx.beginPath(); ctx.ellipse(-q.r*0.24,-q.r*0.3,q.r*0.2,q.r*0.3,-0.4,0,TAU);
      ctx.fillStyle='rgba(255,255,255,.75)'; ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle=q.col;
      ctx.save(); ctx.translate(q.x-cam.x, q.y); ctx.rotate(q.rot);
      ctx.beginPath(); ctx.roundRect(-q.r*0.5,-q.r*0.5,q.r,q.r,q.r*0.35); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha=1;
  }
}
function drawPops(){
  ctx.textAlign='center';
  for(const q of game.pops){
    const u = q.t/q.life;
    const s = u<0.18 ? easeOutBack(u/0.18) : 1;
    ctx.globalAlpha = u>0.7 ? (1-(u-0.7)/0.3) : 1;
    ctx.save(); ctx.translate(q.x-cam.x, q.y); ctx.scale(s,s);
    ctx.font = '900 '+q.size+'px Archivo, sans-serif';
    ctx.lineJoin='round'; ctx.lineWidth=8; ctx.strokeStyle='rgba(21,8,39,.85)';
    ctx.strokeText(q.text,0,0);
    ctx.fillStyle=q.col; ctx.fillText(q.text,0,0);
    ctx.restore(); ctx.globalAlpha=1;
  }
}
function drawPlayerShadow(x, h){
  const k = clamp(1 - h/420, 0.22, 1);
  ctx.beginPath();
  ctx.ellipse(x, GROUND+5, 46*k, 12*k, 0,0,TAU);
  ctx.fillStyle='rgba(21,8,39,'+(0.36*k).toFixed(3)+')'; ctx.fill();
}
function render(){
  if(game.solo){                                   // clean character frame, no world
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle='#2A1445'; ctx.fillRect(0,0,CW,CH);
    ctx.save(); ctx.scale(SCALE,SCALE);
    const z = game.soloZoom||2.4;
    ctx.translate(VW/2, VH*0.60); ctx.scale(z,z);
    if(game.align){
      // the rig underneath in flat magenta, the painted parts over it
      const keep = Object.assign({}, CKC);
      Object.assign(CKC, { body:'#FF2D8F', shade:'#C21E६C'.replace('६','6'), wing:'#FF6FB4',
        edge:'#5A0B33', comb:'#FF2D8F', beak:'#FF2D8F',
        leg:'#FF2D8F', legDark:'#C21E6C', shoe:'#FFB3D8', shoeDark:'#E087B4', lace:'#5A0B33' });
      PARTS_ON = false; drawChicken(0, 0, player.pose);
      Object.assign(CKC, keep);
      PARTS_ON = true; ctx.globalAlpha = 0.70;
      drawChicken(0, 0, player.pose);
      ctx.globalAlpha = 1;
    } else drawChicken(0, 0, player.pose);
    ctx.restore(); return;
  }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  /* Clear to the top of the sky, not to the ink. The camera rises with the bird
     and a zoom punch shrinks the world by a fraction, and both expose canvas
     outside the drawn band -- against the ink that reads as a black letterbox
     round a bright farm. Indoors the ink is still right. */
  ctx.fillStyle = C.skyA; ctx.fillRect(0,0,CW,CH);
  ctx.save();
  ctx.scale(SCALE,SCALE);

  // camera transform
  ctx.save();
  const Z = game.zoomOverride || game.zoom;
  const zx = game.zoomOverride ? (player.x-cam.x) : VW/2;
  const zy = game.zoomOverride ? (GROUND - player.y - 70) : VH*0.55;
  ctx.translate(zx, zy); ctx.scale(Z, Z); ctx.translate(-zx, -zy);
  ctx.translate(cam.shakeX, cam.shakeY + game.camY);

  drawSky(); drawLayers(layers); drawProps();
  drawGround();
  drawObstacles();
  drawEggs();

  // character
  let px = (game.mode==='menu') ? PX : player.x - cam.x;
  let py = player.y;
  const inCage = (game.mode==='menu' || game.mode==='intro');
  const cageSX = game.cageX - cam.x;
  if(inCage){
    const cp = cagePose();
    px = cageSX + cp.x; py = cp.y;
  }
  if(inCage || cageSX > -VW*1.3) drawCageBack(cageSX);
  if(game.mode==='dying'){
    drawPlayerShadow(rag.x - cam.x, Math.max(0, GROUND - rag.y - CK.standH));
    ctx.save(); ctx.translate(-cam.x, 0);
    rag.draw();
    ctx.restore();
  } else if(game.mode==='dead'){
    const x = player.recX - cam.x;
    drawPlayerShadow(x, 0);
    drawChicken(x, GROUND, player.pose);
  } else {
    drawPlayerShadow(px, py);
    drawChicken(px, GROUND - py, player.pose);
  }

  if(inCage || cageSX > -VW*1.3) drawCageFront(cageSX);
  drawParticles();
  if(inCage || cageSX > -VW*1.3) drawBoom(cageSX);
  drawTitle();
  drawPops();
  ctx.restore();

  // screen-space confetti
  for(const c of game.ui){
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.globalAlpha = clamp(1-(c.t/c.life),0,1);
    ctx.fillStyle=c.col; ctx.beginPath(); ctx.roundRect(-c.r*0.5,-c.r*0.35,c.r,c.r*0.7,2); ctx.fill();
    ctx.restore(); ctx.globalAlpha=1;
  }

  // vignette + warm bloom
  // The prison wants the corners crushed. A bright farm under a blue sky does
  // not -- at 0.5 it looked like the sun had gone in.
  const vigK = THEME.vig === undefined ? 0.5 : THEME.vig;
  ctx.drawImage(surface('vignette|'+vigK, VW, VH, false, (g) => {
    const vg = g.createRadialGradient(VW*0.5,VH*0.5,VH*0.30, VW*0.5,VH*0.5,VH*0.85);
    vg.addColorStop(0,'rgba(21,8,39,0)'); vg.addColorStop(1,'rgba(21,8,39,'+vigK+')');
    g.fillStyle=vg; g.fillRect(0,0,VW,VH);
  }), 0, 0, VW, VH);
  ctx.restore();
}

/* ============================================================
   LOOP
   ============================================================ */
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let raw = (now-last)/1000; last = now;
  perfWatch(raw);
  raw = Math.min(raw, 0.05);
  let dt = raw*game.timeScale;
  if(game.freeze>0){ game.freeze -= raw; dt = raw*0.06; }
  game.rawDt = raw;
  if(PORTRAIT){ render(); return; }      // held, not lost, behind the turn prompt
  update(dt, raw);
  render();
}

/* boot */
function boot(){
  document.body.classList.toggle('poster', POSTER_TITLE);
  resize();
  toMenu();
  requestAnimationFrame(frame);
  // dev helper: index.html?auto=1 drops you straight into a run
  if(/[?&]auto/.test(location.search)) setTimeout(startIntro, 60);
  if(/[?&]demo/.test(location.search)) game.demo = true;
  if(/[?&]dbg/.test(location.search)) game.dbg = true;
  if(/[?&]stage/.test(location.search)) game.stage = true;
  const it=/[?&]introt=([0-9.]+)/.exec(location.search);
  if(it){ game.holdIntro = parseFloat(it[1]); }   // freeze the intro to look at a beat
  const sl=/[?&]slow=([0-9.]+)/.exec(location.search);
  if(sl) game.introSlow = Math.max(1, parseFloat(sl[1]));  // run the escape in slow motion
  const rt=/[?&]runt=([0-9.]+)/.exec(location.search);
  if(rt) game.presetRunT = parseFloat(rt[1]);   // jump to a difficulty tier
  if(/[?&]rig/.test(location.search)) game.rig = true;
  if(/[?&]align/.test(location.search)) game.align = true;
  if(/[?&]selftest/.test(location.search)){
    setTimeout(()=>{
      const dt=1/60, out=[];
      function run(name, script, n){
        releaseJump(); startRun(); const log=[];
        for(let i=0;i<n;i++){
          script(i);
          updatePlay(dt);
          log.push({i, y:Math.round(player.y), h:player.thrusting?1:0});
        }
        const apex = Math.max.apply(null, log.map(r=>r.y));
        out.push(name+' apex='+apex+'  '+
          log.filter((_,i)=>i%5===0).map(r=>'y'+r.y+(r.h?'H':'')).join(' '));
      }
      // hold length must map to altitude: short < medium < long
      run('SHORT  ', i=>{ if(i===2) thrustOn(); if(i===14) thrustOff(); }, 120);
      run('MEDIUM ', i=>{ if(i===2) thrustOn(); if(i===32) thrustOff(); }, 120);
      run('LONG   ', i=>{ if(i===2) thrustOn(); if(i===70) thrustOff(); }, 120);
      run('PULSED ', i=>{ if(i%16===2) thrustOn(); if(i%16===8) thrustOff(); }, 120);
      document.getElementById('selftest').textContent = out.join(String.fromCharCode(10));
    }, 40);
  }
  /* Every sound, actually played. A throwing WebAudio call used to abort
     thrustOn() halfway and take the flight controls with it, so sound is now
     exercised in the same way gameplay exercises it. */
  /* Spawn every tier a few hundred times and look at what comes out: nothing
     may stack into a gate, and none of it
     may throw. */
  if(/[?&]obtest/.test(location.search)){
    setTimeout(()=>{
      const out=[]; let bad=0;
      const band = GROUND - CEIL;
      for(let tier=0; tier<=4; tier++){
        // These must map through tierNow(): <9=0 <22=1 <40=2 <64=3 else 4.
        // They used to be [0,30,55,80,120], which lands on tiers 0,2,3,4,4 --
        // so tier 1 was never tested at all and tier 4 was tested twice.
        game.runT = [0,15,30,50,80][tier];
        const kinds={}; let worst=1e9, pairs=0;
        for(let n=0;n<240;n++){
          game.obstacles.length = 0;
          try{ spawnPattern(); }catch(e){ out.push('tier'+tier+' THREW '+e.message); bad++; break; }
          const os = game.obstacles;
          for(const o of os) kinds[o.key]=(kinds[o.key]||0)+1;
          // a floor piece and a ceiling piece at the same x is the thing we removed
          for(const o of os) for(const q of os)
            if(o!==q && o.hang!==q.hang && Math.abs(o.x-q.x)<160) pairs++;
          for(const o of os){
            if(o.hang){ worst=Math.min(worst, band-o.h); }
            else if(o.kind!=='air' && o.kind!=='fall'){ worst=Math.min(worst, band-o.h); }
            if(!isFinite(worst)){ out.push('tier'+tier+' BAD '+o.key+' kind='+o.kind+
              ' h='+o.h+' cy='+o.cy+' len='+o.len); bad++; worst=1e9; }
          }
        }
        if(pairs){ bad++; out.push('tier'+tier+' STACKED PAIRS: '+pairs); }
        if(worst<170){ bad++; out.push('tier'+tier+' corridor only '+Math.round(worst)); }
        out.push('tier'+tier+' corridor>='+Math.round(worst)+'  '+
          Object.keys(kinds).sort().map(k=>k+':'+kinds[k]).join(' '));
      }
      out.unshift(bad ? ('OBSTACLES: '+bad+' PROBLEMS') : 'OBSTACLES: ok, no stacked gates');
      const el=document.getElementById('selftest');
      el.style.display='block'; el.style.color = bad ? '#FF456E' : '#0f0';
      el.textContent = out.join(String.fromCharCode(10));
    }, 60);
  }
  /* Which piece of music each state asks for. The failure this catches is the
     two overlapping, or the chase theme carrying on into the menu after a
     death -- neither of which shows up as an error. */
  if(/[?&]musictest/.test(location.search)){
    setTimeout(()=>{
      const out=[]; let bad=0;
      audioInit(); initTrack();
      out.push('menu file  : ' + (MENU_TRACK ? MENU_TRACK.src.split('/').pop() : 'MISSING'));
      out.push('play files : ' + TRACKS.map(t=>t.src.split('/').pop()).join(' '));
      if(!MENU_TRACK){ out.push('no menu track'); bad++; }
      const want = [['menu',0.40,0],['play',0,0.55],['duck',0,0.18],['menu',0.40,0]];
      for(const [scene,m,t] of want){
        musicScene(scene);
        const ok = Math.abs(menuWanted-m)<0.001 && Math.abs(trackWanted-t)<0.001;
        if(!ok) bad++;
        out.push((ok?'ok   ':'FAIL ') + scene + ' -> menu '+menuWanted.toFixed(2)+
                 ' chase '+trackWanted.toFixed(2));
        if(menuWanted>0 && trackWanted>0){ out.push('  BOTH PLAYING AT ONCE'); bad++; }
      }
      out.unshift(bad ? ('MUSIC: '+bad+' PROBLEMS') : 'MUSIC: scenes ok, never both at once');
      const el=document.getElementById('selftest');
      el.style.display='block'; el.style.color = bad ? '#FF456E' : '#0f0';
      el.textContent = out.join(String.fromCharCode(10));
    }, 80);
  }
  if(/[?&]audiotest/.test(location.search)){
    setTimeout(()=>{
      const out=[]; let bad=0;
      try{ audioInit(); }catch(e){ out.push('audioInit THREW: '+e.message); bad++; }
      A.on = true;
      out.push('ctx=' + (A.ctx ? A.ctx.state : 'none') + ' started=' + (A.started?1:0));
      for(const k of Object.keys(S)){
        A.err = null;
        try{ S[k](1); }catch(e){ A.err = 'THREW ' + e.message; }
        if(A.err){ out.push('FAIL ' + k + ': ' + A.err); bad++; }
      }
      A.err = null;
      try{ musicTick(); }catch(e){ A.err='THREW '+e.message; }
      if(A.err){ out.push('FAIL musicTick: '+A.err); bad++; }
      out.unshift(bad ? ('AUDIO: ' + bad + ' FAILING') : 'AUDIO: all ' + Object.keys(S).length + ' sounds OK');
      const el=document.getElementById('selftest');
      el.style.display='block'; el.style.color = bad ? '#FF456E' : '#0f0';
      el.textContent = out.join(String.fromCharCode(10));
    }, 60);
  }
  if(/[?&]solo/.test(location.search)){ game.solo = true; document.body.classList.add('solo'); }
  const rmv=/[?&]run=([0-9.]+)/.exec(location.search); if(rmv) game.demoRun=parseFloat(rmv[1]);
  const sz=/[?&]sz=([0-9.]+)/.exec(location.search); if(sz) game.soloZoom=parseFloat(sz[1]);
  const pm=/[?&]pose=([a-z]+)(?::([0-9.]+))?/.exec(location.search);
  if(pm){ game.demoPose=pm[1]; game.demoPoseK = pm[2]!==undefined?parseFloat(pm[2]):1; }
  if(/[?&]hold=0/.test(location.search)) game.holdOff = true;
  const wm=/[?&]wear=([^&]+)/.exec(location.search);
  if(wm) decodeURIComponent(wm[1]).split(',').forEach(pair=>{
    const [slot,id]=pair.split(':'); equip(slot, id==='none'?null:id);
  });
  const zm=/[?&]zoom=([0-9.]+)/.exec(location.search); if(zm) game.zoomOverride=parseFloat(zm[1]);
  const fm=/[?&]flap=([0-9.]+)/.exec(location.search); if(fm) game.demoFlap=parseFloat(fm[1]);
}
/* Surface runtime errors on screen. A device-only exception is invisible
   otherwise, and it will break the game no matter what the input code says. */
window.addEventListener('error', e => {
  document.title = 'ERR: ' + e.message;
  const el = document.getElementById('selftest');
  if(el){
    el.style.display = 'block';
    el.style.color = '#FF456E';
    el.style.whiteSpace = 'pre-wrap';
    el.textContent = 'ERROR: ' + e.message +
      String.fromCharCode(10) + 'at line ' + e.lineno + ':' + e.colno +
      String.fromCharCode(10) + (e.filename||'').slice(-60);
  }
});
window.addEventListener('unhandledrejection', e => {
  document.title = 'ERR: promise';
  const el = document.getElementById('selftest');
  if(el){ el.style.display='block'; el.style.color='#FF456E';
    el.textContent = 'PROMISE REJECTED: ' + (e.reason && e.reason.message || e.reason); }
});
if(document.fonts && document.fonts.ready){
  const t = setTimeout(boot, 1400);
  document.fonts.ready.then(()=>{ clearTimeout(t); boot(); }).catch(boot);
} else boot();

})();
</script>
