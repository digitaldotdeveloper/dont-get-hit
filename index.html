<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#241043">
<meta name="description" content="One tap. Don't get hit. A fast arcade runner.">
<title>Don't Get Hit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Archivo:wght@500;700;900&display=swap">
<style>
  :root{
    --ink:#241043;
    --ink-2:#150827;
    --plum:#3D1F55;
    --grape:#6E2A6B;
    --coral:#F2684F;
    --amber:#FFB447;
    --gold:#FFD54A;
    --cream:#FFF2DE;
    --mint:#3FE0B0;
    --danger:#FF456E;
    --shadow:0 10px 30px rgba(21,8,39,.55);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--ink-2);overflow:hidden}
  body{
    font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:var(--cream);
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    overscroll-behavior:none;touch-action:none;
  }
  #stage{position:fixed;inset:0;overflow:hidden}
  #game{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;
       padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0}
  #scoreWrap{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);
             transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .25s}
  #hud.on #scoreWrap{opacity:1}
  #scoreLabel{font-size:11px;font-weight:900;letter-spacing:.22em;color:rgba(255,242,222,.62)}
  #score{font-size:clamp(34px,8.5vw,54px);font-weight:900;line-height:.98;
         font-variant-numeric:tabular-nums;letter-spacing:.02em;
         color:var(--cream);text-shadow:0 3px 0 rgba(36,16,67,.85),0 0 26px rgba(255,180,71,.35)}
  #score.pop{animation:pop .18s ease-out}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.13)}100%{transform:scale(1)}}
  #bestLine{font-size:11px;font-weight:700;letter-spacing:.18em;color:rgba(255,242,222,.5);
            font-variant-numeric:tabular-nums;margin-top:2px}

  #combo{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 104px);
         transform:translateX(-50%) scale(.6);opacity:0;
         font-family:'Bungee',cursive;font-size:26px;color:var(--mint);
         text-shadow:0 3px 0 rgba(36,16,67,.9);transition:opacity .12s}
  #combo.on{opacity:1;transform:translateX(-50%) scale(1);
            transition:transform .16s cubic-bezier(.2,1.8,.4,1),opacity .12s}

  #mute{position:absolute;right:calc(env(safe-area-inset-right,0px) + 14px);
        top:calc(env(safe-area-inset-top,0px) + 14px);
        pointer-events:auto;width:42px;height:42px;border-radius:14px;
        border:2px solid rgba(255,242,222,.24);background:rgba(36,16,67,.42);
        color:var(--cream);display:grid;place-items:center;cursor:pointer;
        backdrop-filter:blur(6px);padding:0}
  #mute svg{width:20px;height:20px;fill:currentColor}
  #mute:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  #mute .off{display:none}
  #mute.muted .on{display:none}
  #mute.muted .off{display:block}
  #mute.muted{color:rgba(255,242,222,.45)}

  /* ---------- Screens ---------- */
  .screen{position:absolute;inset:0;display:none;flex-direction:column;
          align-items:center;justify-content:center;gap:0;
          padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);
          text-align:center}
  .screen.show{display:flex}

  /* Menu */
  #menu{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 7vh)}
  .logo{font-family:'Bungee',cursive;line-height:.86;transform:rotate(-2.5deg);
        filter:drop-shadow(0 8px 0 rgba(36,16,67,.9))}
  .logo .l1{display:block;font-size:clamp(38px,12vw,86px);
            background:linear-gradient(178deg,var(--cream) 12%,var(--gold) 58%,var(--amber) 100%);
            -webkit-background-clip:text;background-clip:text;color:transparent}
  .logo .l2{display:block;font-size:clamp(52px,17vw,124px);margin-top:.02em;
            background:linear-gradient(178deg,var(--gold) 6%,var(--coral) 62%,var(--danger) 100%);
            -webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{margin:14px 0 0;font-size:11px;font-weight:900;letter-spacing:.16em;
       color:rgba(255,242,222,.72)}
  .spacer{flex:1}
  .menuFoot{display:flex;flex-direction:column;align-items:center;gap:14px;
            margin-top:auto;padding-bottom:2vh}
  .hint{margin:0;font-size:11px;font-weight:700;letter-spacing:.24em;color:rgba(255,242,222,.45)}
  .rules{display:flex;gap:10px;margin:0 0 4px;flex-wrap:wrap;justify-content:center}
  .rule{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;
        letter-spacing:.04em;color:rgba(255,242,222,.62);
        background:rgba(36,16,67,.5);border:1.5px solid rgba(255,242,222,.14);
        border-radius:999px;padding:5px 10px;backdrop-filter:blur(4px)}
  .rule b{color:var(--gold);font-weight:900}
  .rule.no b{color:var(--danger)}

  /* Big physical button */
  .big{font-family:'Bungee',cursive;font-size:clamp(24px,6.5vw,34px);letter-spacing:.05em;
       color:#2A1206;border:0;cursor:pointer;pointer-events:auto;
       padding:18px 54px 20px;border-radius:22px;
       background:linear-gradient(180deg,#FFE27A 0%,var(--gold) 46%,#F5A93A 100%);
       box-shadow:0 8px 0 #B8681B,0 16px 28px rgba(21,8,39,.5);
       transition:transform .07s ease,box-shadow .07s ease}
  .big:active{transform:translateY(7px);box-shadow:0 1px 0 #B8681B,0 6px 14px rgba(21,8,39,.45)}
  .big:focus-visible{outline:3px solid var(--mint);outline-offset:5px}
  .big.pulse{animation:btnPulse 2.2s ease-in-out infinite}
  @keyframes btnPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .ghost{font-family:'Archivo',sans-serif;font-weight:900;font-size:12px;letter-spacing:.22em;
         background:none;border:0;color:rgba(255,242,222,.5);cursor:pointer;pointer-events:auto;
         padding:12px 18px}
  .ghost:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}

  /* Game over card */
  #over{background:radial-gradient(120% 80% at 50% 45%,rgba(36,16,67,.34) 0%,rgba(21,8,39,.78) 70%)}
  .card{width:min(420px,92vw);border-radius:28px;padding:26px 24px 20px;
        background:linear-gradient(180deg,rgba(61,31,85,.94),rgba(29,13,52,.96));
        border:2px solid rgba(255,242,222,.14);box-shadow:var(--shadow);
        display:flex;flex-direction:column;align-items:center;gap:2px;
        animation:cardIn .34s cubic-bezier(.16,1.2,.3,1) both}
  @keyframes cardIn{from{transform:translateY(38px) scale(.94);opacity:0}to{transform:none;opacity:1}}
  .ribbon{display:none;font-family:'Bungee',cursive;font-size:15px;letter-spacing:.06em;
          color:#2A1206;background:linear-gradient(180deg,#FFE27A,var(--gold));
          padding:7px 20px 8px;border-radius:999px;margin-bottom:10px;
          box-shadow:0 5px 0 #B8681B;transform:rotate(-2deg)}
  .card.best .ribbon{display:block;animation:ribbonIn .45s .1s cubic-bezier(.2,1.7,.4,1) both}
  @keyframes ribbonIn{from{transform:rotate(-2deg) scale(.4);opacity:0}to{transform:rotate(-2deg) scale(1);opacity:1}}
  .cardLabel{font-size:11px;font-weight:900;letter-spacing:.28em;color:rgba(255,242,222,.55)}
  .cardScore{font-size:clamp(46px,13vw,66px);font-weight:900;line-height:1;
             font-variant-numeric:tabular-nums;color:var(--gold);
             text-shadow:0 4px 0 rgba(21,8,39,.6)}
  .cardBest{font-size:12px;font-weight:800;letter-spacing:.18em;color:rgba(255,242,222,.6);
            font-variant-numeric:tabular-nums;margin-top:6px}
  .stats{display:flex;gap:0;width:100%;margin:16px 0 18px;
         border-top:1.5px solid rgba(255,242,222,.12);border-bottom:1.5px solid rgba(255,242,222,.12)}
  .stat{flex:1;padding:11px 4px;display:flex;flex-direction:column;align-items:center;gap:3px}
  .stat + .stat{border-left:1.5px solid rgba(255,242,222,.12)}
  .stat .v{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--cream)}
  .stat .k{font-size:9px;font-weight:800;letter-spacing:.14em;color:rgba(255,242,222,.48)}
  .stat.mint .v{color:var(--mint)}

  /* Tutorial */
  #tut{position:absolute;left:50%;bottom:30%;transform:translateX(-50%);
       font-size:12px;font-weight:900;letter-spacing:.26em;color:rgba(255,242,222,.8);
       display:none;align-items:center;gap:10px;pointer-events:none;
       text-shadow:0 2px 6px rgba(21,8,39,.9)}
  #tut.show{display:flex;animation:tutBob 1.15s ease-in-out infinite}
  @keyframes tutBob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-7px)}}
  #tut svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;
           stroke-linecap:round;stroke-linejoin:round}

  #flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}
  body.solo #hud, body.solo #tut, body.solo .screen, body.solo #flash{display:none!important}

  @media (prefers-reduced-motion:reduce){
    .big.pulse,#tut.show{animation:none}
    .card,.ribbon{animation-duration:.01ms}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="flash"></div>

  <div id="hud">
    <div id="scoreWrap">
      <div id="scoreLabel">SCORE</div>
      <div id="score">000000</div>
      <div id="bestLine">BEST 000000</div>
    </div>
    <div id="combo"><span id="comboTxt">x2</span></div>
    <button id="mute" aria-label="Toggle sound">
      <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 2.2v2.1a7.8 7.8 0 0 1 0 15.4v2.1a9.9 9.9 0 0 0 0-19.6z"/></svg>
      <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm17.3-2.3-1.4-1.4L17 8.2l-2.9-2.9v3l1.5 1.5-1.5 1.5v3l2.9-2.9 2.9 2.9 1.4-1.4-2.9-2.9 2.9-2.9z"/></svg>
    </button>
  </div>

  <div id="menu" class="screen show">
    <div class="logo"><span class="l1">DON'T GET</span><span class="l2">HIT</span></div>
    <p class="tag">ONE BUTTON. ONE CHICKEN.</p>
    <div class="spacer"></div>
    <div class="menuFoot">
      <div class="rules">
        <span class="rule"><b>HOLD</b> TO FLAP AND FLY</span>
        <span class="rule no"><b>DON'T</b> HIT ANYTHING</span>
      </div>
      <button id="play" class="big pulse">PLAY</button>
      <p class="hint">HOLD ANYWHERE &nbsp;•&nbsp; SPACE</p>
    </div>
  </div>

  <div id="over" class="screen">
    <div class="card" id="card">
      <div class="ribbon">NEW BEST!</div>
      <div class="cardLabel">SCORE</div>
      <div class="cardScore" id="finalScore">000000</div>
      <div class="cardBest" id="finalBest">BEST 000000</div>
      <div class="stats">
        <div class="stat mint"><span class="v" id="stNear">0</span><span class="k">NEAR MISSES</span></div>
        <div class="stat"><span class="v" id="stCombo">x0</span><span class="k">BEST COMBO</span></div>
        <div class="stat"><span class="v" id="stDist">0m</span><span class="k">DISTANCE</span></div>
      </div>
      <button id="retry" class="big">RETRY</button>
      <button id="tomenu" class="ghost">MAIN MENU</button>
    </div>
  </div>

  <pre id="selftest" style="position:fixed;left:0;top:0;z-index:99;color:#0f0;font:11px monospace;background:#000;margin:0;display:none"></pre>
  <div id="tut">
    <svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="m8.5 6.5 3.5-3.5 3.5 3.5"/><circle cx="12" cy="17" r="4"/></svg>
    HOLD TO FLY
  </div>
</div>

<script>
(() => {
'use strict';

/* ============================================================
   DON'T GET HIT — one-tap arcade runner
   Everything is drawn procedurally: no image assets.
   The character is a real skeletal rig (IK legs, FK arms,
   spring-driven hair/jacket) so every animation is a pose,
   not a sprite.
   ============================================================ */

/* ---------- tiny utils ---------- */
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const damp  = (a,b,l,dt)=> a+(b-a)*(1-Math.exp(-l*dt));
const rnd   = (a,b)=> a+Math.random()*(b-a);
const rndi  = (a,b)=> Math.floor(rnd(a,b+1));
const pick  = a => a[(Math.random()*a.length)|0];
const TAU   = Math.PI*2;
const smooth= t => t*t*(3-2*t);
const easeOutBack = t => { const c=1.70158+1; return 1+c*Math.pow(t-1,3)+1.70158*Math.pow(t-1,2); };
const easeOutCubic= t => 1-Math.pow(1-t,3);
const easeInCubic = t => t*t*t;
function hash(n){ const s=Math.sin(n*127.1+311.7)*43758.5453; return s-Math.floor(s); }
function pad6(n){ n=Math.max(0,Math.floor(n)); return String(n).padStart(6,'0'); }

const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- palette ---------- */
let C = {
  ink:'#241043', ink2:'#150827',
  skyA:'#241043', skyB:'#5E2569', skyC:'#C4485E', skyD:'#F2794A', skyE:'#FFC46B',
  sun:'#FFE9A8',
  far:'#7B4287', mid:'#4E265F', near:'#301648', prop:'#1F0E33',
  road:'#2A1445', roadLine:'#3E2160', curb:'#3A1C57',
  rim:'#FFB447',
  cream:'#FFF2DE', gold:'#FFD54A', coral:'#F2684F', mint:'#3FE0B0', danger:'#FF456E',
  skin:'#F0B183', skinSh:'#D18C60',
  hair:'#1E1426',
  jacket:'#2BC3AD', jacketLit:'#4BEBD2', jacketDark:'#17897A', jacketTrim:'#0F6E63',
  tee:'#FFF2DE',
  pants:'#324B7A', pantsDark:'#22355A',
  shoe:'#FF5E7A', shoeSole:'#FFF2DE'
};

/* ---------- environments ----------
   Two hand-built themes. Everything is drawn in code so the layers tile
   perfectly and nothing extra has to be downloaded. */
const THEMES = [
  { id:'city', name:'SUNSET CITY',
    skyA:'#241043', skyB:'#5E2569', skyC:'#C4485E', skyD:'#F2794A', skyE:'#FFC46B',
    sun:'#FFE9A8', far:'#7B4287', mid:'#4E265F', near:'#301648', prop:'#1F0E33',
    road:'#2A1445', roadLine:'#3E2160', curb:'#3A1C57', rim:'#FFB447' },
  { id:'farm', name:'DAWN FARM',
    skyA:'#13284C', skyB:'#3A5E85', skyC:'#E0805E', skyD:'#F6B25E', skyE:'#FFE7AE',
    sun:'#FFF4CC', far:'#6E8C77', mid:'#46654F', near:'#2C4535', prop:'#1B2C22',
    road:'#7C5C36', roadLine:'#9A7442', curb:'#5C4526', rim:'#FFDC96' }
];
let THEME = THEMES[0];
function applyTheme(t){
  THEME = t;
  C.skyA=t.skyA; C.skyB=t.skyB; C.skyC=t.skyC; C.skyD=t.skyD; C.skyE=t.skyE;
  C.sun=t.sun; C.far=t.far; C.mid=t.mid; C.near=t.near; C.prop=t.prop;
  C.road=t.road; C.roadLine=t.roadLine; C.curb=t.curb; C.rim=t.rim;
  if(SCALE) buildLayers();
}

/* ---------- canvas ---------- */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha:false });
if(!ctx.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if(typeof r === 'number') r=[r,r,r,r];
    const [a,b,c2,d]=r;
    this.moveTo(x+a,y); this.lineTo(x+w-b,y); this.quadraticCurveTo(x+w,y,x+w,y+b);
    this.lineTo(x+w,y+h-c2); this.quadraticCurveTo(x+w,y+h,x+w-c2,y+h);
    this.lineTo(x+d,y+h); this.quadraticCurveTo(x,y+h,x,y+h-d);
    this.lineTo(x,y+a); this.quadraticCurveTo(x,y,x+a,y); return this;
  };
}

let DPR=1, CW=0, CH=0, SCALE=1, VW=1300, VH=880, GROUND=0, CEIL=0, PX=0, PORTRAIT=false;
function resize(){
  CW = cv.clientWidth || window.innerWidth;
  CH = cv.clientHeight || window.innerHeight;
  DPR = Math.min(window.devicePixelRatio||1, 2.25);
  cv.width  = Math.round(CW*DPR);
  cv.height = Math.round(CH*DPR);
  // Keep at least 1300 world-units wide and 880 tall visible -> constant difficulty
  // Portrait is the target. Flying is a vertical game, so we trade some
  // horizontal view for a bigger bird rather than the other way round.
  PORTRAIT = CH > CW*1.15;
  SCALE = PORTRAIT ? Math.min(CH/1450, CW/790) : Math.min(CH/980, CW/1450);
  VW = CW/SCALE; VH = CH/SCALE;
  const roadH = clamp(VH*0.16, 150, 260);
  GROUND = VH - roadH;
  CEIL = Math.max(40, GROUND - clamp(VH*0.80, 620, 1120));
  PX = VW*(PORTRAIT ? 0.30 : 0.27);
  buildLayers();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=> setTimeout(resize,120));

/* ============================================================
   AUDIO — everything synthesised, no files
   ============================================================ */
const A = {
  ctx:null, master:null, musicGain:null, sfxGain:null,
  on:true, started:false, nextNote:0, step:0
};
function audioInit(){
  initTrack();
  if(A.started) return;
  const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
  A.ctx = new AC();
  A.master = A.ctx.createGain(); A.master.gain.value = A.on?0.9:0; A.master.connect(A.ctx.destination);
  A.sfxGain = A.ctx.createGain(); A.sfxGain.gain.value = 0.85; A.sfxGain.connect(A.master);
  A.musicGain = A.ctx.createGain(); A.musicGain.gain.value = 0.0; A.musicGain.connect(A.master);
  A.started = true; A.nextNote = A.ctx.currentTime + 0.1;
}
function actx(){ if(A.ctx && A.ctx.state==='suspended') A.ctx.resume(); return A.ctx; }
function tone(freq, dur, type, vol, slide, dest, at){
  if(!A.started||!A.on) return; const c = actx(); if(!c) return;
  try{
  const t = c.currentTime + (at||0);
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(freq, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide), t+dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol||0.2, t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(dest||A.sfxGain); o.start(t); o.stop(t+dur+0.02);
  }catch(e){ A.err = e.message; }        // audio is never worth breaking gameplay for
}
/* A tone whose pitch is bent by a second oscillator. That wobble is the whole
   difference between a beep and a cartoon boing, and between a tone and a
   squawk -- every comic sound below is built on it. */
function wob(f0, f1, dur, opt){
  if(!A.started||!A.on) return; const c = actx(); if(!c) return;
  try{
  const O = opt||{}, t = c.currentTime + (O.at||0);
  const o=c.createOscillator(), g=c.createGain();
  o.type = O.type||'triangle';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t+dur);
  if(O.depth){
    const lfo=c.createOscillator(), la=c.createGain();
    lfo.type='sine'; lfo.frequency.setValueAtTime(O.rate||14, t);
    la.gain.setValueAtTime(O.depth, t);
    lfo.connect(la); la.connect(o.frequency);
    lfo.start(t); lfo.stop(t+dur+0.02);
  }
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(O.vol||0.14, t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(A.sfxGain); o.start(t); o.stop(t+dur+0.02);
  }catch(e){ A.err = e.message; }
}
let noiseBuf=null;
function noise(dur, f0, f1, vol, q, at){
  if(!A.started||!A.on) return; const c = actx(); if(!c) return;
  try{
  const t0 = c.currentTime + (at||0);
  if(!noiseBuf){
    noiseBuf = c.createBuffer(1, c.sampleRate*1.2, c.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  }
  const s=c.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=q||1.1;
  bp.frequency.setValueAtTime(f0, t0);

const BASS=[0,0,3,7, 0,-2,-4,7];

function musicTick(){
  if(TRACK) return;                       // the real track is playing instead
  if(!A.started||!A.on||!A.ctx) return;
  const c=A.ctx, now=c.currentTime;
  const bpm = 118 + 30*game.diff;
  const spb = 60/bpm/2;
  if(A.nextNote < now) A.nextNote = now+0.05;
  while(A.nextNote < now+0.28){
    const t=A.nextNote, s=A.step%8;
    // kick
    if(s===0||s===3||s===6){
      const o=c.createOscillator(),g=c.createGain();
      o.type='sine'; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+0.11);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.5,t+0.006);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.connect(g); g.connect(A.musicGain); o.start(t); o.stop(t+0.18);
    }
    // hat
    if(s%2===1 && noiseBuf){
      const n=c.createBufferSource(); n.buffer=noiseBuf; n.loop=true;
      const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7000;
      const g=c.createGain(); g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.1,t+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
      n.connect(hp); hp.connect(g); g.connect(A.musicGain); n.start(t); n.stop(t+0.07);
    }
    // bass
    {
      const o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();
      lp.type='lowpass'; lp.frequency.value=760;
      o.type='sawtooth'; o.frequency.setValueAtTime(midi(33+BASS[s]),t);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.2,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+spb*0.92);
      o.connect(lp); lp.connect(g); g.connect(A.musicGain); o.start(t); o.stop(t+spb);
    }
    A.nextNote += spb; A.step++;
  }
}

   Painted head (hat + face, straight off the Gemini render) on a
   procedural body, wings, legs and tail. That split is deliberate:
   the head carries the identity, everything else is code, so wings

   one-line swap.

  wingX:-4, wingY:-4,  wingA:58, wingB:46,
  hipX:-26, hipY:33,             // = where the legs meet the body in the reference

  const mx=(L1+L2)*0.995, mn=Math.abs(L1-L2)+2;
  if(d>mx){ const s=mx/d; tx*=s; ty*=s; d=mx; }
  if(d<mn){ const s=mn/(d||0.001); tx*=s; ty*=s; d=mn; }
  const base=Math.atan2(tx,ty);

  const a=base+Math.acos(ca);            // knee forward

  else{ const u=(t-0.45)/0.55; const f=u<0.42?u*0.55:0.231+(u-0.42)*1.325;

}

   a sine cannot give you and what makes a flap read as effort. */
function sampleTrack(keys, t){

  let i = 0;
  while(i < n-1 && keys[i+1][0] <= t) i++;

  let t1=k1[0], t2=k2[0]; if(t2<=t1) t2+=1;
  const u=(t-t1)/(t2-t1), u2=u*u, u3=u2*u;
  const out=[];
  for(let j=1;j<k1.length;j++){
    const p0=k0[j],p1=k1[j],p2=k2[j],p3=k3[j];
    out.push(0.5*((2*p1)+(-p0+p2)*u+(2*p0-5*p1+4*p2-p3)*u2+(-p0+3*p1-3*p2+p3)*u3));

function springUpdate(dt, ax, ay){
  const k=150, d=13;
  spring.tailV += (-k*spring.tail - d*spring.tailV + ax*0.8 - ay*0.5)*dt;
  spring.tail  += spring.tailV*dt;
  spring.tail   = clamp(spring.tail,-1.1,1.1);
}

/* ---- drawing ---- */
let CKC = {
  body:'#F7E6CE', shade:'#DCC0A0', wing:'#FCEEDA', edge:'#0B1526',
  comb:'#E8443A', beak:'#F5A623',
  cap:'#2FA898', capDark:'#1B7A70', capBand:'#FFD54A',
  leg:'#F5A623', legDark:'#C97F14',
  shoe:'#FCFCFC', shoeDark:'#D8D8D8', lace:'#F2684F',
  tail:['#F2684F','#FFD54A','#34D9C0']
};
function cp(fill, lw){                       // chicken outline (matches the painted head)
  ctx.fillStyle=fill; ctx.fill();
  if(lw!==0){ ctx.lineWidth=lw||5; ctx.strokeStyle=CKC.edge; ctx.lineJoin='round'; ctx.stroke(); }
}
function paint(fill, lw){                    // everything else keeps the game's ink
  ctx.fillStyle=fill; ctx.fill();
  if(lw!==0){ ctx.lineWidth=lw||5; ctx.strokeStyle=C.ink; ctx.lineJoin='round'; ctx.stroke(); }
}
/* the face lives in the painted head now — these keep the old call sites happy */
function newFace(){ return {}; }
function faceTo(){}
function updateBlink(){}
function capsule(x1,y1,x2,y2,w,col){
  ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
  ctx.strokeStyle=CKC.edge; ctx.lineWidth=w+8; ctx.stroke();
  ctx.strokeStyle=col;     ctx.lineWidth=w;   ctx.stroke();
}
function drawJoint(x,y,r,col,far){
  ctx.save(); if(far) ctx.globalAlpha=0.9;
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU); cp(col,4.4);
  ctx.restore();
}
function drawBone(x1,y1,x2,y2,w,col,far){
  if(!partReady('leg')) return capsule(x1,y1,x2,y2,w,col);
  const q=PARTS['leg'];
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1;
  const ang=Math.atan2(dx,dy);                    // 0 = straight down
  const iw=q.w*(w/11), ih=iw*(q.img.naturalHeight/q.img.naturalWidth);
  ctx.save();
  ctx.translate(x1,y1); ctx.rotate(-ang);         // same convention fix as the wing
  ctx.scale(1, len/ih*1.10);                      // stretch the tube to the bone length
  if(far) ctx.globalAlpha=0.9;
  ctx.drawImage(q.img, -iw*q.ax, -ih*0.06, iw, ih);
  ctx.restore();
}
function drawWingPart(px, py, ang, tip, open, col, far){
  ctx.save(); ctx.translate(px, py);
  // a folded wing is a different shape, not a squashed spread wing
  const id = (open < 0.55 && partReady('wingfold')) ? 'wingfold' : 'wing';
  if(partReady(id)){
    ctx.rotate(-ang);                           // canvas rotate(t) sends dir(a) to dir(a-t)
    ctx.save();
    if(far){ ctx.globalAlpha = 0.92; }
    drawPart(id, 1, id==='wingfold' ? 1 : lerp(0.42, 1, open));
    ctx.restore();
  } else {
    drawWing(ang, tip, open, col);
  }
  ctx.restore();
}
function drawShoePart(kx,ky,fx,fy,col,far){
  if(!partReady('shoe')) return drawSneaker(kx,ky,fx,fy,col);
  // the shoe ART already points toe-forward, so it needs no quarter turn; the
  // +PI/2 was left over from the procedural shoe, which drew inside a rotated frame
  const tilt = -Math.atan2(fx-kx, fy-ky) * 0.18;
  ctx.save(); ctx.translate(fx,fy); ctx.rotate(tilt);
  ctx.save(); if(far) ctx.globalAlpha=0.9;
  drawPart('shoe'); ctx.restore();
  ctx.restore();
}
function drawSneaker(kx,ky,fx,fy,col){
  const a=Math.atan2(fx-kx,fy-ky)*0.18;     // the sole stays nearly flat, as it does when planted
  ctx.save(); ctx.translate(fx,fy); ctx.rotate(-a+Math.PI/2);
  ctx.beginPath(); ctx.roundRect(-15,-15,48,22,[11,15,5,11]); cp(col,5);
  ctx.beginPath(); ctx.roundRect(-17,2,53,13,6.5); cp(CKC.shoe,4.2);
  ctx.beginPath(); ctx.moveTo(-4,-12); ctx.quadraticCurveTo(9,-5,20,-9);
  ctx.strokeStyle=CKC.lace; ctx.lineWidth=5; ctx.lineCap='round'; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-2,-4); ctx.lineTo(16,-1);
  ctx.strokeStyle='rgba(11,21,38,.30)'; ctx.lineWidth=2.6; ctx.stroke();
  ctx.restore();
}
function drawWing(a, tip, open, col){
  // a blade, not a tube: leading edge bulges, trailing edge cuts back
  const L1=CK.wingA*lerp(0.38,1,open), L2=CK.wingB*lerp(0.26,1,open);
  const ex=dirX(a)*L1, ey=dirY(a)*L1;
  const b=a+tip;
  const tx=ex+dirX(b)*L2, ty=ey+dirY(b)*L2;
  let nx=-(ty), ny=(tx); const nl=Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
  const wIn=30*lerp(0.8,1,open), wOut=9;
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.quadraticCurveTo(ex+nx*wIn*1.5, ey+ny*wIn*1.5, tx+nx*wOut, ty+ny*wOut);
  ctx.quadraticCurveTo(ex-nx*wIn*0.55, ey-ny*wIn*0.55, 0,0);
  ctx.closePath(); cp(col,5);
  for(let i=0;i<3;i++){                                  // feather tips
    const f=0.62+i*0.14;
    ctx.beginPath();
    ctx.moveTo(lerp(ex,tx,f)+nx*wIn*0.30, lerp(ey,ty,f)+ny*wIn*0.30);
    ctx.lineTo(lerp(ex,tx,f+0.30)+nx*wOut*1.5, lerp(ey,ty,f+0.30)+ny*wOut*1.5);
    ctx.strokeStyle=CKC.edge; ctx.lineWidth=3; ctx.lineCap='round'; ctx.stroke();
  }
  ctx.strokeStyle='rgba(11,21,38,.28)'; ctx.lineWidth=2.6; ctx.lineCap='round';
  for(let i=1;i<=2;i++){
    const f=i/3;
    ctx.beginPath();
    ctx.moveTo(ex*f*0.7+nx*4, ey*f*0.7+ny*4);
    ctx.lineTo(lerp(ex,tx,f)+nx*wIn*0.5, lerp(ey,ty,f)+ny*wIn*0.5);
    ctx.stroke();
  }
}
/* ============================================================
   COSMETIC LAYERS
   The base chicken owns every animation. A cosmetic is just a
   drawable parented to a named pivot, so it inherits the motion
   for free and adding one never touches the animation code.
   ============================================================ */
const SLOTS = ['back','body','neck','head','face']; // also the z-order
const COSMETICS = {};
function defineCosmetic(def){ COSMETICS[def.id] = def; return def.id; }
const Loadout = { back:null, body:null, neck:null, head:null, face:null };
function equip(slot, id){
  if(!(slot in Loadout)) return false;              // unknown slot: ignored
  if(id && !COSMETICS[id]) return false;            // missing asset: ignored
  Loadout[slot] = id || null; return true;
}
function unequip(slot){ return equip(slot, null); }
function equipped(slot){ return Loadout[slot]; }

/* pivots are handed to cosmetics as {R} in an already-transformed context,
   so a cosmetic only ever draws in its own local space */
function drawSlot(slot, R){
  const id = Loadout[slot]; if(!id) return;
  const c = COSMETICS[id];  if(!c) return;          // never break the character
  ctx.save();
  ctx.translate(c.ox||0, c.oy||0);
  if(c.rot) ctx.rotate(c.rot);
  const sc = c.scale||1; if(sc!==1) ctx.scale(sc,sc);
  if(c.draw) c.draw(R, ctx);
  else if(c.img && c.img.complete && c.img.naturalWidth){
    const w = (c.w||1)*R, h = w*(c.img.naturalHeight/c.img.naturalWidth);
    ctx.drawImage(c.img, -w*(c.ax!==undefined?c.ax:0.5), -h*(c.ay!==undefined?c.ay:0.5), w, h);
  }
  ctx.restore();
}
/* a cosmetic can be pure code or a PNG dropped in later — same slot, same pivot */
function cosmeticImage(id, slot, src, opt){
  const im = new Image(); im.src = src;
  defineCosmetic(Object.assign({id, slot, img:im}, opt||{}));
}

/* ============================================================
   FRAME ANIMATION
   Hand-drawn frames generated from the reference and sliced from
   sheets. They carry the cap, shades and chain, so cosmetics are not
   swappable while frames are in use. If any image fails to load the
   procedural puppet draws instead - the character can never vanish.
   ============================================================ */
const FRAME_DATA = {"run":[{"f":"run0.webp","w":206,"h":199,"ay":199},{"f":"run1.webp","w":138,"h":182,"ay":182},{"f":"run2.webp","w":136,"h":181,"ay":181},{"f":"run3.webp","w":187,"h":196,"ay":196},{"f":"run4.webp","w":140,"h":181,"ay":181},{"f":"run5.webp","w":179,"h":195,"ay":195}],"fly":[{"f":"fly0.webp","w":110,"h":161,"ay":162.3},{"f":"fly1.webp","w":112,"h":158,"ay":163.1},{"f":"fly2.webp","w":163,"h":210,"ay":191.6},{"f":"fly3.webp","w":147,"h":158,"ay":181.3},{"f":"fly4.webp","w":148,"h":186,"ay":187.3},{"f":"fly5.webp","w":130,"h":185,"ay":179.7}],"fall":[{"f":"fall0.webp","w":122,"h":187,"ay":184.0},{"f":"fall1.webp","w":145,"h":199,"ay":186.0},{"f":"fall2.webp","w":174,"h":210,"ay":179.8},{"f":"fall3.webp","w":143,"h":198,"ay":182.3}],"jump":[{"f":"jump0.webp","w":117,"h":150,"ay":170.5},{"f":"jump1.webp","w":151,"h":149,"ay":169.0},{"f":"jump2.webp","w":121,"h":223,"ay":194.1},{"f":"jump3.webp","w":168,"h":203,"ay":183.6},{"f":"jump4.webp","w":139,"h":187,"ay":181.5}],"land":[{"f":"land0.webp","w":145,"h":183,"ay":183},{"f":"land1.webp","w":157,"h":179,"ay":179},{"f":"land2.webp","w":122,"h":121,"ay":121},{"f":"land3.webp","w":165,"h":186,"ay":186}],"hit":[{"f":"hit0.webp","w":145,"h":164,"ay":172.9},{"f":"hit1.webp","w":163,"h":186,"ay":185.1},{"f":"hit2.webp","w":122,"h":154,"ay":173.6},{"f":"hit3.webp","w":106,"h":126,"ay":166.0},{"f":"hit4.webp","w":178,"h":81,"ay":140.5},{"f":"hit5.webp","w":128,"h":146,"ay":173.4}]};
const FR = { ready:false, n:0, need:0, img:{} };
const SPR = 175/190;                       // world units per frame pixel
(function loadFrames(){
  for(const set in FRAME_DATA) FR.need += FRAME_DATA[set].length;
  for(const set in FRAME_DATA){
    FRAME_DATA[set].forEach(fr=>{
      const im = new Image();
      im.onload = ()=>{ FR.n++; if(FR.n >= FR.need) FR.ready = true; };
      im.onerror = ()=>{ FR.need--; };     // missing frame: stay on the puppet
      im.src = 'anim/' + fr.f;
      FR.img[fr.f] = im;
    });
  }
})();
const cyc = (set, ph) => {                              // wrap a 0..1 phase onto a cycle
  const n = FRAME_DATA[set].length;
  return [set, Math.min(n-1, Math.floor(((ph % 1) + 1) % 1 * n))];
};
function pickFrame(p){
  const pl = player;
  /* getting hit runs its own six-frame sequence: impact, launched, two tumbles,
     face down, then sitting up dazed while the score card is on screen. */
  if(game.mode === 'dying'){
    const n = FRAME_DATA.hit.length - 1;                 // last frame is the sit-up
    return ['hit', Math.min(n-1, Math.floor(clamp(game.dyingT/1.15,0,1) * n))];
  }
  if(game.mode === 'dead') return ['hit', FRAME_DATA.hit.length - 1];
  if(pl.state === 'land'){
    const k = clamp(1 - pl.stateT/0.26, 0, 1);          // 1 at touchdown -> 0 recovered
    return ['land', k > 0.66 ? 1 : (k > 0.28 ? 2 : 3)];
  }
  if(pl.onGround){
    if(game.mode !== 'play') return ['land', 3];        // standing, for the menu
    return cyc('run', pl.phase);
  }
  if(pl.thrusting) return cyc('fly', pl.flapT);
  if(pl.vy < -120){                                      // climbing: wind-up -> apex
    const j = FRAME_DATA.jump;
    const i = pl.vy < -900 ? 1 : pl.vy < -500 ? 2 : pl.vy < -220 ? 3 : 4;
    return ['jump', Math.min(i, j.length-1)];
  }
  const fl = FRAME_DATA.fall;                            // dropping: get ready to land
  if(fl && fl.length){
    const k = 1 - clamp(pl.y/300, 0, 1);                 // 0 high up, 1 about to touch
    return ['fall', Math.min(fl.length-1, Math.floor(k*fl.length))];
  }
  return ['land', 0];
}
function drawChickenFrames(x, y, p){
  const [set, idx] = pickFrame(p);
  const list = FRAME_DATA[set]; if(!list) return false;
  const fr = list[Math.min(idx, list.length-1)];
  const im = FR.img[fr.f]; if(!im || !im.complete || !im.naturalWidth) return false;
  const w = fr.w * SPR, h = fr.h * SPR;
  const ay = (fr.ay !== undefined ? fr.ay : fr.h + (fr.lift||0)) * SPR;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(p.rot);
  ctx.scale(p.sx, p.sy);
  ctx.drawImage(im, -w*0.46, -ay, w, h);
  ctx.restore();
  return true;
}

/* ============================================================
   PARTS
   Painted pieces cut from the reference art, hung on the same rig.
   Every part is optional: if its image is missing the procedural
   version draws instead, so the character can never disappear.
   `w` is the part's width in world units; ax/ay are its anchor as a
   fraction of the image, i.e. the point the pivot holds it by.
   ============================================================ */
const PARTS = {};
function loadPart(id, src, opt){
  const im = new Image(); im.src = src;
  PARTS[id] = Object.assign({ img:im, w:100, ax:0.5, ay:0.5, rot:0, tint:null }, opt||{});
}
let PARTS_ON = true;                      // align mode flips this to draw the rig underneath
function partReady(id){
  if(!PARTS_ON) return false;
  const q = PARTS[id];
  return !!(q && q.img.complete && q.img.naturalWidth > 0);
}
/* draws at the current origin; returns false so callers can fall back */
function drawPart(id, scaleX, scaleY){
  if(!partReady(id)) return false;
  const q = PARTS[id];
  const w = q.w, h = w*(q.img.naturalHeight/q.img.naturalWidth);
  ctx.save();
  if(q.rot) ctx.rotate(q.rot);
  if(scaleX!==undefined || scaleY!==undefined) ctx.scale(scaleX===undefined?1:scaleX, scaleY===undefined?1:scaleY);
  if(q.dark){ ctx.globalAlpha = 1; }
  ctx.drawImage(q.img, -w*q.ax, -h*q.ay, w, h);
  if(q.dark){                                   // far-side limbs read as shadow
    ctx.globalCompositeOperation='source-atop';
    ctx.fillStyle='rgba(70,40,20,.30)';
    ctx.fillRect(-w*q.ax, -h*q.ay, w, h);
    ctx.globalCompositeOperation='source-over';
  }
  ctx.restore();
  return true;
}
loadPart('body','art/part-bodyref.png', {w:150, ax:0.5000, ay:0.5000});
loadPart('headref','art/part-headref.png',{w:84, ax:0.5146, ay:0.4978});

/* the foot IK aims the ankle ANKLE units above the ground, and the shoe hangs
   (1-ay)*height below the ankle - so those two must be the same number or the
   sneakers float or sink. Read it off the art rather than guessing. */
PARTS['shoe'].img.addEventListener('load', ()=>{

  CK.ANKLE = (1-q.ay) * q.w * (q.img.naturalHeight/q.img.naturalWidth);

function hatSnapback(R){
  ctx.beginPath();
  ctx.moveTo(-R*0.94,-R*0.26);
  ctx.quadraticCurveTo(-R*1.02,-R*1.26, R*0.10,-R*1.24);
  ctx.quadraticCurveTo(R*1.04,-R*1.20, R*1.00,-R*0.30);
  ctx.quadraticCurveTo(R*0.30,-R*0.60,-R*0.94,-R*0.26);
  ctx.closePath(); cp(CKC.cap,4.8);
  ctx.beginPath();                                   // brim, worn backwards
  ctx.moveTo(-R*0.90,-R*0.38);
  ctx.quadraticCurveTo(-R*1.80,-R*0.66,-R*2.02,-R*0.14);
  ctx.quadraticCurveTo(-R*1.42, R*0.10,-R*0.86,-R*0.06);
  ctx.closePath(); cp(CKC.capDark,4.6);
  ctx.beginPath(); ctx.arc(R*0.08,-R*1.24,R*0.13,0,TAU); cp(CKC.capDark,3);
  ctx.beginPath(); ctx.roundRect(R*0.56,-R*0.92,R*0.44,R*0.32,4); cp(CKC.capDark,3);

function drawHead(p){
  const R = CK.headR;
  const useRef = !Loadout.head && !Loadout.face && partReady('headref');
  if(useRef){ drawPart('headref'); return; }
  if(partReady('head')){
    drawPart('head');
    // the painted head has its own skull and eye, so the cosmetics shift onto them
    // measured off the part: skull centre sits at (-2,-8) from the pivot, eye at (+9,-12)
    drawSlot('head', R);                       // pivot = the art's skull centre
    ctx.save(); ctx.translate(-1,-2); drawSlot('face', R); ctx.restore();
    if(p.shockT>0.02){
      ctx.save(); ctx.globalAlpha=clamp(p.shockT*2,0,1);
      ctx.strokeStyle=CKC.edge; ctx.lineWidth=3; ctx.lineCap='round';
      for(let i=0;i<3;i++){ const a=-0.9+i*0.5;
        ctx.beginPath();
        ctx.moveTo(-R*1.5+Math.sin(a)*8, -R*1.4+Math.cos(a)*8);
        ctx.lineTo(-R*1.5+Math.sin(a)*20,-R*1.4+Math.cos(a)*20); ctx.stroke(); }
      ctx.restore();
    }
    return;
  }
  // wattle
  ctx.beginPath(); ctx.ellipse(R*0.56,R*0.70,R*0.17,R*0.32,0.22,0,TAU); cp(CKC.comb,4);
  // skull
  ctx.beginPath(); ctx.ellipse(0,0,R*0.98,R*0.94,0,0,TAU); cp(CKC.body,5);
  ctx.save(); ctx.clip();
  const hg = ctx.createLinearGradient(-R,-R*0.5,R,R*0.5);
  hg.addColorStop(0, CKC.shade); hg.addColorStop(0.45, CKC.body); hg.addColorStop(1, '#FFEDCC');
  ctx.fillStyle=hg; ctx.fillRect(-R-2,-R-2,R*2+4,R*2+4); ctx.restore();
  // beak
  ctx.beginPath();
  ctx.moveTo(R*0.66,-R*0.20); ctx.lineTo(R*1.92,R*0.18); ctx.lineTo(R*0.66,R*0.54);
  ctx.closePath(); cp(CKC.beak,4.6);
  ctx.beginPath(); ctx.moveTo(R*0.70,R*0.18); ctx.lineTo(R*1.78,R*0.19);
  ctx.strokeStyle=CKC.edge; ctx.lineWidth=2.6; ctx.stroke();
  // eye: half lidded, one raised brow. That is the whole personality.
  const open = clamp(0.42 + p.shockT*1.5, 0, 1.25);
  ctx.beginPath(); ctx.ellipse(R*0.34,-R*0.16,R*0.30,R*0.30,0,0,TAU);

function drawChicken(x, y, p){
  if(FR.ready && !game.align && drawChickenFrames(x, y, p)) return;
  ctx.save();
  ctx.translate(x, y);                              // y = ground contact point
  ctx.translate(p.x, -CK.standH + p.y);             // -> body core
  ctx.rotate(p.rot);
  ctx.scale(p.sx, p.sy);

  // far leg
  drawBone(CK.hipX,CK.hipY, CK.hipX+p.kFx,CK.hipY+p.kFy, 6, CKC.legDark, true);
  drawBone(CK.hipX+p.kFx,CK.hipY+p.kFy, CK.hipX+p.fFx,CK.hipY+p.fFy, 5, CKC.legDark, true);
  drawShoePart(CK.hipX+p.kFx,CK.hipY+p.kFy, CK.hipX+p.fFx,CK.hipY+p.fFy, CKC.shoeDark, true);

  // far wing
  drawWingPart(-CK.wingX, CK.wingY, p.wingF, p.tipF, p.wingOpen, CKC.shade, true);

  // tail — one swept cream shape that grows out of the body
  ctx.save();
  ctx.translate(-70, -14);
  ctx.rotate(p.tail*0.6 + spring.tail*0.18);
  ctx.rotate(-0.10);
  if(drawPart('tail')){ ctx.restore(); } else {
  ctx.beginPath();
  ctx.moveTo( 14,-20);
  ctx.quadraticCurveTo(-20,-38,-50,-26);
  ctx.quadraticCurveTo(-34,-10,-42,  4);
  ctx.quadraticCurveTo(-14, -2, 14, 14);
  ctx.closePath(); cp(CKC.body,5);
  ctx.strokeStyle='rgba(11,21,38,.24)'; ctx.lineWidth=2.6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-6,-18); ctx.lineTo(-34,-22); ctx.stroke();
  ctx.restore(); }

  drawSlot('back', CK.bodyRX);            // capes/packs sit behind the body

  // body
  if(partReady('body')){
    ctx.save(); ctx.rotate(CK.bodyTilt); drawPart('body'); ctx.restore();
  } else {
    ctx.beginPath(); ctx.ellipse(0,0,CK.bodyRX,CK.bodyRY,CK.bodyTilt,0,TAU); cp(CKC.body,5);
    ctx.save(); ctx.clip();
    const bg = ctx.createLinearGradient(-CK.bodyRX,-CK.bodyRY*0.6, CK.bodyRX,CK.bodyRY*0.6);
    bg.addColorStop(0, CKC.shade); bg.addColorStop(0.42, CKC.body); bg.addColorStop(1, '#FFEDCC');
    ctx.fillStyle=bg; ctx.fillRect(-CK.bodyRX-2,-CK.bodyRY-2,CK.bodyRX*2+4,CK.bodyRY*2+4);
    ctx.restore();
  }
  drawSlot('body', CK.bodyRX);            // outfit rides the body pivot
  // neck: joins body to head so the silhouette is one animal
  if(!partReady('body')){
    const hx=CK.headX+p.headDX, hy=CK.headY+p.headDY;
    ctx.beginPath(); ctx.moveTo(hx-4, hy+6); ctx.lineTo(hx+14, hy+10);
    ctx.lineTo(CK.bodyRX*0.44, -CK.bodyRY*0.30); ctx.lineTo(CK.bodyRX*0.10, -CK.bodyRY*0.42);
    ctx.closePath(); cp(CKC.body,5);
  }
  drawSlot('neck', CK.bodyRX);            // scarf etc.

  // head (painted sprite carries hat + face)
  ctx.save();
  ctx.translate(CK.headX+p.headDX, CK.headY+p.headDY);
  ctx.rotate(p.headR);
  drawHead(p);
  if(p.shockT>0){                                   // cartoon shock marks beat a face change at this size
    ctx.save(); ctx.globalAlpha=clamp(p.shockT*2,0,1);
    ctx.fillStyle='#FFF2DE'; ctx.strokeStyle=CKC.edge; ctx.lineWidth=3;
    for(const dx of [-6,12]){
      ctx.save(); ctx.translate(dx-38,-52); ctx.rotate(dx>0?0.22:-0.22);
      ctx.beginPath(); ctx.roundRect(-3.5,-16,7,19,3); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,8,4,0,TAU); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }
  ctx.restore();

  // near wing
  drawWingPart(CK.wingX, CK.wingY, p.wingN, p.tipN, p.wingOpen, CKC.wing, false);

  // near leg
  drawBone(CK.hipX,CK.hipY, CK.hipX+p.kNx,CK.hipY+p.kNy, 7, CKC.leg, false);
  drawBone(CK.hipX+p.kNx,CK.hipY+p.kNy, CK.hipX+p.fNx,CK.hipY+p.fNy, 6, CKC.leg, false);
  drawShoePart(CK.hipX+p.kNx,CK.hipY+p.kNy, CK.hipX+p.fNx,CK.hipY+p.fNy, CKC.shoe, false);

  if(game.rig){                                   // pivot overlay for aligning parts
    const mark=(x,y,c,lbl)=>{
      ctx.strokeStyle=c; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(x-9,y); ctx.lineTo(x+9,y);
      ctx.moveTo(x,y-9); ctx.lineTo(x,y+9); ctx.stroke();
      ctx.beginPath(); ctx.arc(x,y,4,0,TAU); ctx.stroke();
      ctx.fillStyle=c; ctx.font='700 11px Archivo, sans-serif'; ctx.fillText(lbl,x+11,y-4);
    };
    ctx.strokeStyle='rgba(63,224,176,.45)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(-160,CK.standH); ctx.lineTo(160,CK.standH); ctx.stroke();  // ground
    mark(0,0,'#FF456E','core');
    mark(CK.headX+p.headDX, CK.headY+p.headDY, '#6BD1FF', 'head');
    mark(CK.wingX, CK.wingY, '#FFD54A', 'wing');
    mark(-70, -14, '#3FE0B0', 'tail');
    mark(CK.hipX, CK.hipY, '#F2684F', 'hip');
    mark(CK.hipX+p.fNx, CK.hipY+p.fNy, '#FFF2DE', 'ankle');
  }

  ctx.restore();
}

/* ============================================================
   TUMBLE — the death. Body physics with the legs and wings
   trailing, plus the gag that sells it: he lays an egg.
   ============================================================ */
const rag = {
  alive:false, x:0, y:0, vx:0, vy:0, rot:0, vrot:0, energy:99,
  pose:newPose(),
  build(p, x, y, vx, vy, spin){
    this.alive=true;
    this.x=x; this.y=y-CK.standH; this.vx=vx; this.vy=vy;
    this.rot=p.rot; this.vrot=spin; this.energy=99; this.rest=0;
    for(const k of POSE_KEYS) this.pose[k]=p[k];
  },
  step(dt, groundY){
    if(!this.alive) return;
    this.vy += 3000*dt;
    this.x += this.vx*dt; this.y += this.vy*dt;
    this.rot += this.vrot*dt;
    const floor = groundY - CK.bodyRY*0.9;
    if(this.y > floor){
      this.y = floor;
      this.vy *= -0.42;
      this.vx *= 0.62; this.vrot *= 0.52;
      if(Math.abs(this.vy) < 90){ this.vy = 0; this.vrot *= 0.3; }
      if(Math.abs(this.vy)>140) spark(this.x, groundY, 5,
        {col:'rgba(255,242,222,.55)', a0:Math.PI, a1:TAU, s0:80,s1:260, l0:0.2,l1:0.5, r0:3,r1:8, g:700});
    }
    this.vx *= Math.pow(0.55,dt);
    this.energy = Math.abs(this.vx)+Math.abs(this.vy)+Math.abs(this.vrot)*40;
    // limbs and wings flail loosely behind the tumble
    const p=this.pose, t=game.t;
    p.wingN = damp(p.wingN, -2.2+Math.sin(t*17)*0.5, 9, dt);
    p.wingF = damp(p.wingF, -2.1-Math.sin(t*17)*0.5, 9, dt);
    p.tipN = damp(p.tipN, -0.4, 6, dt); p.tipF = p.tipN;
    p.wingOpen = damp(p.wingOpen, 1, 8, dt);
    p.tail = damp(p.tail, 0.5, 5, dt);
    setLegs(p, -4+Math.sin(t*13)*11, 24, -9+Math.sin(t*13+1.6)*11, 21);
    p.headR = damp(p.headR, 0.5*Math.sin(t*9), 7, dt);
    p.sx = damp(p.sx,1,8,dt); p.sy = damp(p.sy,1,8,dt);
    p.x=0; p.y=0;
  },
  draw(){
    ctx.save();
    ctx.translate(this.x, this.y + CK.standH);
    ctx.rotate(FR.ready ? this.rot*0.25 : this.rot);   // drawn frames already tumble
    ctx.translate(0, -CK.standH);
    const p=this.pose, keep=p.rot; p.rot=0;
    ctx.translate(0, CK.standH);
    drawChicken(0, 0, p);
    p.rot=keep;
    ctx.restore();
  }
};

let SHADOW_OFF = false;
function shadowEllipse(w, alpha){
  if(SHADOW_OFF) return;
  ctx.beginPath(); ctx.ellipse(0, 4, w, w*0.20, 0, 0, TAU);
  ctx.fillStyle='rgba(21,8,39,'+(alpha||0.34)+')'; ctx.fill();
}
/* Both members fill their whole hitbox with drawn crates. Anything the box
   covers must look solid, or you die on empty-looking sky. */
const CAP_H = 118;
function crateStack(y0, len, dir){
  const n = Math.max(1, Math.round(len/62)), ch = len/n;
  for(let i=0;i<n;i++){
    const y = y0 + dir*i*ch, wob=(i%2?5:-5);
    const top = dir>0 ? y : y-ch;
    ctx.beginPath(); ctx.roundRect(-45+wob, top+2, 90, ch-4, 7);
    paint(i%2?'#C79A5E':'#D9AC6E',5);
    ctx.strokeStyle='#8E6534'; ctx.lineWidth=3.6;
    ctx.beginPath(); ctx.moveTo(-45+wob, top+ch*0.5); ctx.lineTo(45+wob, top+ch*0.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(wob, top+3); ctx.lineTo(wob, top+ch-5); ctx.stroke();
  }
}

const layers = [];
function makeLayer(w, h, drawFn){
  const c = document.createElement('canvas');
  c.width = Math.round(w*SCALE*DPR); c.height = Math.round(h*SCALE*DPR);
  const g = c.getContext('2d');
  g.scale(SCALE*DPR, SCALE*DPR); g.translate(0, h);   // y=0 at the layer's baseline
  drawFn(g, w, h);
  return { canvas:c, w, h };
}
function buildLayers(){

/* physics */
/* Hold to flap. Gravity always pulls; a held wing beats it. Nothing here is a
   jetpack — the lift comes in pulses on the downstroke, so altitude is something
   you keep working at rather than something you switch on. */
/* Jetpack Joyride flight, and nothing else layered on top:
     hold  -> continuous upward thrust, for as long as it is held
     release -> thrust stops at once, gravity takes over
   No jump impulse, no fixed jump height, no tap-to-jump. Altitude is controlled
   purely by how long you hold. Smoothness comes from acceleration plus drag,
   never from an impulse. */
const GRAV = 2500, FLAP_HZ = 4.6;
/* Air drag is what makes flight feel smooth: velocity eases toward a terminal
   value instead of ramping linearly into a hard clamp. Terminal speeds land at
   about +/-1000, reached over ~0.4s. */
const DRAG = 2.6;
/* Jetpack Joyride mechanics: holding applies CONSTANT lift, not pulses.
   Pulsed lift made a hold feel like it was not registering, so players tapped
   instead of holding. The wingbeat is now purely visual. */
const THRUST = 5200;                       // continuous while held, vs gravity 2500
const VY_UP = -1500, VY_DOWN = 1500;       // safety rails only; drag sets the real terminal
/* Every press also lands an instant impulse, so a quick tap lifts even if the
   finger is gone before the downstroke completes. */

/* ============================================================
   SPAWNING / DIFFICULTY
   ============================================================ */
function tierNow(){
  const t = game.runT;
  if(t<22) return 0;
  if(t<45) return 1;
  if(t<72) return 2;
  if(t<100) return 3;
  return 4;
}
function poolFor(tier){
  return OB_KEYS.filter(k => OB[k].tier <= tier);
}
function spawnOne(key, aheadTime){
  const spec = OB[key];
  const roll = spec.roll||0;
  const closure = game.speed + Math.abs(roll);
  const minAhead = (VW - PX + 160)/closure;
  const lead = Math.max(aheadTime||0, minAhead);
  const o = {
    key, spec, x: player.x + closure*lead,
    kind: spec.kind, w: spec.w, h: spec.h,
    base: spec.base||0, vx: roll, rot:0, bz:0, bvz:0,
    y:0, vy:0, landed:true, warn:0, passed:false, minGap:1e9, counted:false
  };
  if(spec.bounce){ o.bz = 0; o.bvz = 900; }
  if(spec.kind==='air'){
    // now that he flies, the flock is a wall to thread past, not a ceiling
    const band = GROUND - CEIL;
    o.base = clamp(rnd(150, band-260), 140, Math.max(160, band-200));
  }
  if(spec.kind==='fall'){
    o.landed=false; o.y = 720 + VH*0.1; o.vy = 0; o.warn = 1; S.warn();
    // aim so it lands well before the player arrives
    o.x = player.x + closure*(lead + 0.55);
  }
  game.obstacles.push(o);
  if(spec.kind==='air') game.lastAirX = o.x; else game.lastGroundX = o.x;
  return o;
}
const GATE_TOPS  = ['cone','duck','cake','ball','box','coffee'];
const GATE_HANGS = ['sofa','sign','vacuum','cart','coffee'];
function spawnGate(moving){
  const band = GROUND - CEIL;
  const gap  = clamp(lerp(430, 250, game.diff) * rnd(0.92,1.08), 230, 470);
  const amp  = moving ? rnd(50, 110) : 0;
  const margin = 80 + amp;
  const lo = gap/2 + margin, hi = band - gap/2 - margin;
  const c  = hi>lo ? rnd(lo,hi) : band/2;
  const g  = { c, gap, band, amp, spd:rnd(0.8,1.5), phase:rnd(0,TAU) };
  const closure = game.speed;
  const x = player.x + closure*Math.max(1.5, (VW - PX + 180)/closure + 0.2);
  const mk = (spec, hang, h, cap) => {
    if(h < 46) return;                                   // too short to bother drawing
    game.obstacles.push({ key:hang?'hanger':'tower', spec, x, kind:'ground', hang,
      w:spec.w, h, base:0, cap, vx:0, rot:0, bz:0, y:0, vy:0, landed:true,
      warn:0, passed:false, minGap:1e9, counted:false, gate:g });
  };
  mk(OB.tower,  false, c - gap/2,            pick(GATE_TOPS));
  mk(OB.hanger, true,  band - (c + gap/2),   pick(GATE_HANGS));
  return g;
}
function spawnPattern(){
  const tier = tierNow();
  const air  = poolFor(tier).filter(k=>OB[k].kind==='air');
  const r = Math.random();
  let gap;
  if(tier===0){                                   // learn the gate
    spawnGate(false); gap = rnd(2.50, 3.05);
  } else if(tier===1){                            // gates, occasional flock between them
    if(r<0.90) spawnGate(false); else spawnOne(pick(air),0);
    gap = rnd(2.00, 2.50);
  } else if(tier===2){                            // gates start drifting
    if(r<0.62) spawnGate(false);
    else if(r<0.86) spawnGate(true);
    else spawnOne(pick(air),0);
    gap = rnd(1.65, 2.05);
  } else if(tier===3){
    if(r<0.42) spawnGate(false);
    else if(r<0.80) spawnGate(true);
    else { spawnGate(false); spawnOne(pick(air),0.85); }
    gap = rnd(1.40, 1.75);
  } else {                                        // gates back to back
    if(r<0.34) spawnGate(true);
    else if(r<0.54){ spawnGate(false); spawnGate(true); }
    else if(r<0.78){ spawnGate(true); spawnOne(pick(air),0.8); }
    else spawnGate(false);
    gap = rnd(1.20, 1.50);
  }
  game.spawnT = gap;
}

/* ============================================================
   INPUT
   ============================================================ */
/* thrustOn / thrustOff are the ONLY movement inputs. They set a flag; all
   motion happens in one place in updatePlay. */
function thrustOn(){
  game.tapCount = (game.tapCount||0) + 1;        // counted at entry, for ?dbg=1
  if(game.mode==='menu'){ startRun(); }              // the same press also thrusts
  else if(game.mode==='dead'){
    if(game.deadT>0.35) startRun(); else return;
  }
  if(game.mode!=='play') return;
  const wasOff = !player.thrusting;
  player.thrusting = true;                     // FIRST. Nothing below may block it.
  if(wasOff){
    player.flapT = 0.13;                       // start the wingbeat animation
    player.powerT = 1;
    try{
      if(!player.onGround) featherBurst(player.x-24, GROUND-player.y-30, 3, 180);
      S.flap();
    }catch(e){ game.fxErr = e.message; }
  }
  if(game.tut){ game.tut=false; elTut.classList.remove('show'); }
}
function thrustOff(){ player.thrusting = false; }
const pressJump = thrustOn, releaseJump = thrustOff;   // old names, one system
/* Input, made unmissable.
   taps=0 on device meant no press was reaching pressJump at all. So: listen in
   the CAPTURE phase (nothing downstream can swallow it), bind to the canvas as
   well as window, and register touch AND pointer AND mouse rather than choosing.
   pressJump/releaseJump are idempotent, so overlapping families are harmless.
   Every raw down is counted before any filtering, so the readout can tell
   "no event arrived" apart from "event arrived and was filtered". */
const BUILD = 'b0903-0018';   // shown in ?dbg=1 so a cached build is obvious
const TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints||0) > 0;
/* Only the mute button may swallow a press. Filtering on any <button> was the
   bug: on device every tap reported lastEv=start with taps=0, because the target
   resolved to a button and downFrom returned before pressJump ever ran.
   Tapping PLAY or RETRY should fly as well as start the run - that is the
   behaviour we want anyway. */
function onBtn(e){
  const t = e.target;
  return !!(t && t.closest && t.closest('#mute'));
}
function downFrom(e){
  game.rawDown = (game.rawDown||0) + 1;
  if(onBtn(e)) { game.lastEv = 'btn'; return; }
  pressJump();
  try{ audioInit(); }catch(err){}
}
const CAP = {passive:true, capture:true};
const ACT = {passive:false, capture:true};      // active: may preventDefault
function touchDown(e){
  game.lastEv = 'start';
  const btn = e.target && e.target.closest ? e.target.closest('button') : null;
  // Keeping the touch alive is the whole point: without preventDefault the
  // browser's long-press handling ends it and sends touchend by itself.
  // Buttons are left alone so their click still works.
  if(!btn && e.cancelable) e.preventDefault();
  if(btn && btn.id === 'mute') return;
  downFrom(e);
}
function bindDown(el){
  if(!el) return;
  el.addEventListener('touchstart', touchDown, ACT);
  if(!TOUCH){
    el.addEventListener('pointerdown', e=>{ game.lastEv='pdown'; downFrom(e); }, CAP);
    el.addEventListener('mousedown',  e=>{ game.lastEv='mdown'; downFrom(e); }, CAP);
  }
}
bindDown(window); bindDown(cv);

/* touchmove only keeps the gesture alive; it must never start or stop thrust */
window.addEventListener('touchmove', e=>{ if(e.cancelable) e.preventDefault(); }, ACT);

if(TOUCH){
  /* On a touch device ONLY touch events may stop thrust. blur, mouseleave and
     the pointer family all fire spuriously on phones - a blur listener alone
     killed every hold once already. Keep this branch minimal. */
  window.addEventListener('touchend', e=>{
    game.lastEv='end';
    if(!e.touches || e.touches.length === 0) thrustOff();
  }, CAP);
  window.addEventListener('touchcancel', e=>{
    game.lastEv='cancel';
    if(!e.touches || e.touches.length === 0) thrustOff();
  }, CAP);
} else {
  window.addEventListener('pointerup',    ()=>{ game.lastEv='pup';  thrustOff(); }, CAP);
  window.addEventListener('pointercancel',()=>{ game.lastEv='pcan'; thrustOff(); }, CAP);
  window.addEventListener('mouseup',      ()=>{ game.lastEv='mup';  thrustOff(); }, CAP);
  window.addEventListener('mouseleave',   ()=>{ game.lastEv='mlv';  thrustOff(); }, CAP);
  document.documentElement.addEventListener('mouseleave', ()=>{ game.lastEv='mlv'; thrustOff(); }, CAP);
  window.addEventListener('blur', ()=>{ game.lastEv='blur'; thrustOff(); });
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) thrustOff(); });

window.addEventListener('keydown', e => {
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){
    e.preventDefault(); audioInit(); if(!e.repeat) pressJump();
  }
});
window.addEventListener('keyup', e => {
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') releaseJump();
});
document.addEventListener('contextmenu', e=> e.preventDefault());
$('#play').addEventListener('click', ()=>{ audioInit(); S.click(); startRun(); });
$('#retry').addEventListener('click', ()=>{ S.click(); startRun(); });
$('#tomenu').addEventListener('click', ()=>{ S.click(); toMenu(); });
elMute.addEventListener('click', ()=>{
  audioInit(); A.on = !A.on;
  elMute.classList.toggle('muted', !A.on);
  if(A.started) A.master.gain.setTargetAtTime(A.on?0.9:0, A.ctx.currentTime, 0.05);
  if(TRACK && !A.on) TRACK.pause();
});
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && A.ctx) A.ctx.suspend();
  else if(A.ctx) A.ctx.resume();
});

/* ============================================================
   FLOW
   ============================================================ */
function toMenu(){
  applyTheme(THEMES[0]);
  game.mode='menu'; game.obstacles.length=0; game.parts.length=0; game.pops.length=0;
  player.state='idle'; player.stateT=0; player.beat=''; player.beatT=1.2;
  player.y=0; player.vy=0; player.onGround=true;
  rag.alive=false;
  elMenu.classList.add('show'); elOver.classList.remove('show');
  elHud.classList.remove('on'); elTut.classList.remove('show');
  musicVol(0.0);
}
function startRun(){
  game.runCount = (game.runCount||0) + 1;
  applyTheme(game.forceTheme || THEMES[game.runCount % THEMES.length]);
  game.mode='play'; game.runT=0; game.score=0; game.dist=0;
  game.near=0; game.combo=0; game.comboBest=0; game.comboT=0;
  game.speed=340; game.diff=0; game.spawnT=2.6;
  game.obstacles.length=0; game.parts.length=0; game.pops.length=0; game.ui.length=0;
  game.freeze=0; game.timeScale=1; game.tsTarget=1; game.shake=0; game.zoom=1; game.zoomT=1;
  game.camY=0; game.camYT=0; game.deadT=0; game.newBest=false;
  player.x=0; player.y=0; player.vy=0; player.onGround=true; player.phase=0;
  player.flapT=0; player.flapBeat=-1; player.flapLag=0;
  player.thrusting=false;                                   // never start a run mid-thrust
  player.state='run'; player.stateT=0; player.landT=0; player.stumbleT=0;
  player.near=0; player.nearT=0; player.nearCool=0;
  player.beat=''; player.beatT=0;
  cam.x = -PX;
  rag.alive=false;
  elMenu.classList.remove('show'); elOver.classList.remove('show');
  elHud.classList.add('on');
  elCard.classList.remove('best');
  if(game.demo){ player.y = 430; player.onGround=false; player.state='fly';
    player.thrusting=true; player.flapT = (game.demoFlap!==undefined?game.demoFlap:0.2); }
  if(game.stage){                                   // drop gates straight in front, for inspection
    game.spawnT = 1e9;
    const band = GROUND-CEIL;
    [[0.34,470],[0.60,380],[0.44,320]].forEach(([f,gp],i)=>{
      const g = spawnGate(i===2);
      g.c = band*f; g.gap = gp; g.amp = i===2?90:0;
      game.obstacles.filter(o=>o.gate===g).forEach(o=>{
        o.x = player.x + 260 + i*430;
        o.h = Math.max(0, o.hang ? g.band-(g.c+g.gap/2) : g.c-g.gap/2);
      });
    });
  }
  game.tut = game.firstRun;
  elTut.classList.toggle('show', game.tut);
  musicVol(0.5); trackVol(0.55);
}
function die(o){
  if(game.mode!=='play') return;
  game.mode='dying'; game.dyingT=0;
  game.freeze = 0.11; addShake(30); game.flash=0.75;
  slowmo(0.32, 0.55);
  S.hit();
  if(navigator.vibrate) try{ navigator.vibrate([26,40,60]); }catch(e){}
  const gy = GROUND;
  spark(player.x, gy - player.y - 90, 26, {col:C.gold, s0:180,s1:620, l0:0.4,l1:0.9, r0:4,r1:11});
  spark(player.x, gy - player.y - 90, 14, {col:C.coral, s0:120,s1:420, l0:0.4,l1:0.8, r0:5,r1:13});
  pop(player.x, gy - player.y - 200, pick(['BAWK!','OOF!','YIKES!','NOPE!']), C.danger, 54, -70);
  // hand off to the ragdoll
  featherBurst(player.x, gy - player.y - 60, 26, 460);
  layEgg(player.x - 30, gy - player.y - 40, -240);          // hit hard enough to lay an egg
  const lifted = 300 + Math.random()*180;
  rag.build(player.pose, player.x, gy - player.y, -430 - Math.random()*220, -lifted, rnd(-10,10));
  if(o){ o.hitBy = true; o.spin = rnd(-6,6); o.vy = -420; }
  musicVol(0.12); trackVol(0.18);
}
function finish(){
  game.mode='dead'; game.deadT=0;
  game.newBest = game.score > game.best;
  if(game.newBest){
    game.best = Math.floor(game.score);
    try{ localStorage.setItem(BEST_KEY, String(game.best)); }catch(e){}
  }
  try{ localStorage.setItem('dgh.played','1'); }catch(e){}
  game.firstRun=false;
  elFinal.textContent = pad6(game.score);
  elFinalBest.textContent = 'BEST '+pad6(game.best);
  elNear.textContent = game.near;
  elCmb.textContent = 'x'+Math.max(1,game.comboBest);
  elDist.textContent = Math.floor(game.dist/10)+'m';
  elCard.classList.toggle('best', game.newBest);
  elOver.classList.add('show');
  elHud.classList.remove('on');
  if(game.newBest){ S.best(); confettiBurst(); }
  musicVol(0.0); trackVol(0);
}
function confettiBurst(){
  const cols=[C.gold,C.mint,C.coral,C.cream,'#6BD1FF'];
  for(let i=0;i<70;i++){
    game.ui.push({ x:rnd(0,VW), y:rnd(-VH*0.3,VH*0.1), vx:rnd(-90,90), vy:rnd(60,240),
      r:rnd(5,11), col:pick(cols), rot:rnd(0,TAU), vr:rnd(-8,8), t:0, life:rnd(2.2,3.6) });
  }
}

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt, rawDt){
  game.t += rawDt;
  // slow-mo easing
  if(game.smT>0){ game.smT-=rawDt; if(game.smT<=0) game.tsTarget=1; }
  game.timeScale = damp(game.timeScale, game.tsTarget, 12, rawDt);

  game.shake = Math.max(0, game.shake - game.shake*6*rawDt - 12*rawDt);
  const sh = game.shake;
  cam.shakeX = (Math.random()*2-1)*sh; cam.shakeY = (Math.random()*2-1)*sh;
  game.flash = Math.max(0, game.flash - rawDt*3.2);
  elFlash.style.opacity = (game.flash*0.55).toFixed(3);

  if(game.mode==='menu')       updateMenu(dt);
  else if(game.mode==='play')  updatePlay(dt);
  else if(game.mode==='dying') updateDying(dt);
  else if(game.mode==='dead')  updateDead(dt, rawDt);

  updateParticles(dt);
  musicTick(); trackTick(rawDt);
}

/* --- menu: he idles with personality beats --- */
function updateMenu(dt){
  const p = player;
  p.stateT += dt;
  p.beatT -= dt;
  if(p.beatT<=0){
    p.beat = pick(['','','peck','strut','peck']);
    p.beatT = p.beat==='' ? rnd(1.4,2.4) : rnd(1.5,2.2);
    p.beatStart = p.stateT;
    if(p.beat==='strut') S.cluck();
  }
  const target = newPose();
  const bt = p.stateT - (p.beatStart||0);
  if(p.beat==='peck'){
    posePeck(clamp(bt/0.7,0,1), target);
    if(bt>0.30 && bt<0.36) spark(player.x-10, GROUND, 3,
      {col:'rgba(255,242,222,.5)', a0:Math.PI,a1:TAU, s0:40,s1:130, l0:0.2,l1:0.45, r0:2,r1:5, g:500});
  }
  else if(p.beat==='strut') poseStrut(p.stateT, clamp(bt/1.4,0,1), target);
  else poseIdle(p.stateT, target);
  blendPose(p.pose, target, dt, 14);
  springUpdate(dt, 0, 0);
  cam.x = damp(cam.x, -PX, 6, dt);
  game.camY = damp(game.camY, PORTRAIT ? -215 : -40, 6, dt);
  game.zoom = damp(game.zoom, 1, 6, dt);
}

function updateBlink(p, dt){
  p.blinkT -= dt;
  if(p.blinkT<=0){ p.blinkT = rnd(1.8,5.2); p.blinkPhase = 0.14; }
  if(p.blinkPhase>0){ p.blinkPhase -= dt; p.blink = Math.sin((1-p.blinkPhase/0.14)*Math.PI); }
  else p.blink = 0;
  p.face.blink = p.blink;
}

/* --- the run --- */
function updatePlay(dt){
  const p = player;
  game.runT += dt;
  game.diff = clamp(game.runT/115, 0, 1);
  game.speed = 340 + 380*game.diff;
  const speedT = clamp((game.speed-340)/380, 0, 1);

  p.x += game.speed*dt;
  game.dist += game.speed*dt;
  const before = game.score;
  game.score += dt*game.speed*0.25;
  if(Math.floor(game.score/50) !== Math.floor(before/50)) S.tick();

  if(game.demoRun!==undefined){                    // freeze one frame of the run cycle
    p.onGround=true; p.y=0; p.vy=0; p.state='run'; p.thrusting=false;
    p.phase=game.demoRun; buildPlayerPose(dt,speedT); return;
  }
  // ---- flight ----
  p.powerT = Math.max(0, (p.powerT||0) - dt*3.2);
  if(game.demo){
    p.thrusting = game.holdOff ? false : (game.demoFlap!==undefined ? true : Math.sin(game.runT*2.3) > -0.15);
    if(game.demoFlap!==undefined) p.flapT = game.demoFlap;
  }
  p.nearCool = Math.max(0, p.nearCool-dt);
  whooshCool = Math.max(0, whooshCool-dt);
  const ceilH = GROUND - CEIL;                       // usable altitude, in world units

  /* THE movement model. Gravity always pulls; holding adds constant upward
     thrust; releasing removes it that same frame. Drag makes velocity ease
     toward a terminal speed instead of ramping forever, which is what gives
     smooth acceleration and deceleration without any impulse. */
  p.vy += GRAV*dt;
  if(p.thrusting) p.vy -= THRUST*dt;
  p.vy -= p.vy * DRAG * dt;
  p.vy = clamp(p.vy, VY_UP, VY_DOWN);                // safety rails only
  p.y -= p.vy*dt;

  if(p.thrusting){                                   // wingbeat is animation only
    p.flapT += dt*FLAP_HZ;
    const beat = Math.floor(p.flapT);
    if(beat !== p.flapBeat){
      p.flapBeat = beat;
      S.flap();
      if(!p.onGround) featherBurst(p.x-30, GROUND-p.y-40, 1, 90);
      spark(p.x-34, GROUND-p.y-30, 3, {col:'rgba(255,242,222,.5)', a0:Math.PI*0.85,a1:Math.PI*1.25,
        s0:70,s1:190, l0:0.18,l1:0.45, r0:3,r1:7, g:120});
    }
  } else {
    p.flapT += dt*1.4;                               // wings glide, barely moving
  }

  if(p.y >= ceilH){ p.y = ceilH; if(p.vy<0){ p.vy *= -0.25; addShake(3);
    featherBurst(p.x, GROUND-p.y+10, 3, 150); } }

  if(p.y <= 0){
    const impact = p.vy;
    p.y = 0; p.vy = 0;
    if(!p.onGround){
      p.onGround = true; p.state='land'; p.stateT=0;
      p.landT = clamp(impact/1200, 0.35, 1);
      S.land(); addShake(clamp(impact/220, 2, 9)); game.camYT = 14;
      spark(p.x-6, GROUND, 14, {col:'rgba(255,242,222,.7)', a0:Math.PI*1.05,a1:Math.PI*1.95, s0:110,s1:330, l0:0.22,l1:0.55, r0:3,r1:9, g:520});
      if(impact>700) featherBurst(p.x, GROUND-24, 3, 190);
    }
  } else if(p.y > 2){
    if(p.onGround){ p.onGround=false; p.state='fly'; p.stateT=0; S.takeoff(); }
  }
  if(p.onGround){
    if(p.state!=='land') p.state='run';
  } else if(p.state!=='fly'){ p.state='fly'; }

  // ---- run cycle phase & footsteps ----
  if(p.onGround){
    const strideLen = lerp(300, 420, speedT);
    const prev = p.phase;
    p.phase += game.speed*dt/strideLen;
    const a = prev - Math.floor(prev), b = p.phase - Math.floor(p.phase);
    const crossed = (x)=> (a < x && (b > x || b < a));
    if(crossed(0.0) || crossed(0.5)){
      S.step();
      spark(p.x-24, GROUND, 3, {col:'rgba(255,242,222,.45)', a0:Math.PI*1.1,a1:Math.PI*1.85, s0:50,s1:150, l0:0.18,l1:0.4, r0:2,r1:5, g:420});
    }
  }

  // ---- spawn ----
  game.spawnT -= dt;
  if(game.spawnT<=0) spawnPattern();

  // ---- obstacles ----
  const pl = p.x-48, pr = p.x+48, pb = p.y+8, pt = p.y+150;
  for(let i=game.obstacles.length-1;i>=0;i--){
    const o = game.obstacles[i];
    o.x += (o.vx||0)*dt;
    if(o.gate){
      const g=o.gate;
      const c = g.c + (g.amp ? Math.sin(game.t*g.spd+g.phase)*g.amp : 0);
      o.h = Math.max(0, o.hang ? g.band - (c + g.gap/2) : c - g.gap/2);
    }
    if(o.spec.roll) o.rot = (o.rot||0) + (o.vx - game.speed)*dt/ (o.w*0.5) * -1;
    if(o.spec.bounce){
      o.bvz -= 3000*dt; o.bz += o.bvz*dt;
      if(o.bz<0){ o.bz=0; o.bvz=900; }
    }
    if(o.kind==='fall' && !o.landed){
      o.vy += 2600*dt; o.y -= o.vy*dt;
      if(o.y<=0){
        o.y=0; o.landed=true; o.vy=0;
        addShake(6); S.thud();
        spark(o.x, GROUND, 14, {col:'rgba(255,242,222,.6)', a0:Math.PI,a1:TAU, s0:120,s1:340, l0:0.25,l1:0.6, r0:4,r1:11, g:600});
      }
    }
    if(!o.wooshed && Math.abs((o.spec && o.spec.roll)||0) > 100 && o.x < p.x - 30){
      o.wooshed = true;                    // one whoosh as a fast one goes past
      if(whooshCool <= 0){ S.whoosh(); whooshCool = 0.4; }
    }
    // collision
    const ow = o.w*0.42;
    let obot, otop;
    if(o.hang){ otop = (GROUND-CEIL); obot = otop - o.h; }
    else if(o.kind==='air'){ obot=o.base; otop=o.base+o.h; }
    else { obot=o.y||0; otop=(o.y||0)+o.h; }
    const ol=o.x-ow, or=o.x+ow;
    const overlapX = pr>ol && pl<or;
    if(overlapX && !o.hitBy){
      if(pt>obot+8 && pb<otop-8){ die(o); }
    }
    // near-miss tracking
    if(overlapX){
      const gap = (o.kind==='air'||o.hang) ? (obot - pt) : (pb - otop);
      if(gap>0) o.minGap = Math.min(o.minGap, gap);
    }
    if(!o.counted && o.x < p.x-30){
      o.counted = true;
      const thr = (o.kind==='air'||o.hang) ? 74 : 62;
      if(o.minGap < thr && o.minGap > 0 && game.mode==='play') nearMiss(o);
    }
    if(o.x < cam.x - 420) game.obstacles.splice(i,1);
  }

  // ---- combo decay ----
  if(game.combo>0){
    game.comboT -= dt;
    if(game.comboT<=0){ game.combo=0; elCombo.classList.remove('on'); }
  }

  // ---- pose ----
  buildPlayerPose(dt, speedT);

  // ---- camera ----
  cam.x = damp(cam.x, p.x - PX, 14, dt);
  game.camYT = damp(game.camYT, clamp((p.y-240)*0.16, 0, 90), 5, dt);
  game.camY  = damp(game.camY, game.camYT, 9, dt);
  game.zoomT = 1 - speedT*0.045 - (p.nearT>0?0.03:0);
  game.zoom  = damp(game.zoom, game.zoomT, 7, dt);

  // speed lines when running fast
  if(speedT>0.35 && Math.random() < speedT*dt*32){
    game.parts.push({ x: cam.x+VW+40, y: GROUND - rnd(30, VH*0.55), vx:-game.speed*1.6, vy:0,
      life:0.45, t:0, r:rnd(20,70), col:'rgba(255,242,222,.24)', g:0, kind:'line', rot:0, vr:0, drag:1 });
  }
  // HUD
  elScore.textContent = pad6(game.score);
  if(game.dbg){
    const el=document.getElementById('selftest');
    if(el){ el.style.display='block';
      el.textContent =
        BUILD+'  held='+(p.thrusting?1:0)+'  taps='+(game.tapCount||0)+'  raw='+(game.rawDown||0)+
        '  ev='+(game.lastEv||'-')+'  touch='+(TOUCH?1:0)+String.fromCharCode(10)+
        'y='+Math.round(p.y)+'  vy='+Math.round(p.vy)+'  thrust='+(p.thrusting?1:0)+
        '  ground='+(p.onGround?1:0)+'  mode='+game.mode;
    }
  }
}

function nearMiss(o){
  const p = player;
  game.near++;
  game.combo++; game.comboT = 3.4;
  game.comboBest = Math.max(game.comboBest, game.combo);
  const bonus = 60*game.combo;
  game.score += bonus;
  S.near(); if(game.combo>1) S.combo(game.combo);
  addShake(4); slowmo(0.42, 0.13);
  const y = GROUND - p.y - 150;
  pop(p.x+40, y, (game.combo>1? 'x'+game.combo+' ' : '')+pick(['PHEW!','CLOSE!','NICE!','WOW!']), C.mint, 34, -150);
  pop(p.x+40, y+46, '+'+bonus, C.gold, 24, -110);
  spark(o.x, GROUND - (o.kind==='air'? o.base : o.h) , 10, {col:C.mint, s0:80,s1:300, l0:0.25,l1:0.6, r0:3,r1:8, g:200});
  elScore.classList.remove('pop'); void elScore.offsetWidth; elScore.classList.add('pop');
  if(game.combo>1){ elComboTxt.textContent='x'+game.combo; elCombo.classList.add('on');
    elCombo.style.transform='translateX(-50%) scale(1.25)';
    setTimeout(()=>{ elCombo.style.transform='translateX(-50%) scale(1)'; },90); }
  // SIGNATURE: snap a look back at what nearly got him
  if(p.nearCool<=0){ p.nearT = 0.52; p.nearCool = 0.62; }
}

/* build the player's target pose from the state machine */
function buildPlayerPose(dt, speedT){
  const p = player;
  p.stateT += dt;
  const target = newPose();

  if(game.demoPose){                                 // freeze any single state for review
    const k = game.demoPoseK, t = game.t;
    const P = game.demoPose;
    if(P==='idle')       poseIdle(t, target);
    else if(P==='peck')  posePeck(k, target);
    else if(P==='strut') poseStrut(t, k, target);
    else if(P==='glide') poseGlide(t, 1200*k, target);
    else if(P==='land')  poseLand(k, target);
    else if(P==='hurt')  poseHurt(k, target);
    else if(P==='sit')   poseSit(k, t, target);
    else if(P==='cheer') poseCheer(t, target);
    else                 poseIdle(t, target);
    for(let i=0;i<POSE_KEYS.length;i++) p.pose[POSE_KEYS[i]] = target[POSE_KEYS[i]];
    return;
  }

  if(p.state==='run'){
    poseRun(p.phase, speedT, target);
  } else if(p.state==='land'){
    const k = clamp(1 - p.stateT/0.22, 0, 1) * p.landT;
    poseLand(k, target);
    if(p.stateT>0.24 && p.onGround) p.state='run';
  } else {
    if(p.thrusting){
      poseFly(p.flapT, p.powerT||0, p.vy, target);
    } else {
      poseGlide(game.t, p.vy, target);
    }
  }

  // near miss: he flinches away from it and pops a shock mark, then carries on
  if(p.nearT>0){
    p.nearT -= dt;
    const u = 1 - p.nearT/0.50;
    const k = u<0.24 ? easeOutBack(u/0.24) : 1 - easeOutCubic((u-0.24)/0.76);
    target.headR  += -0.55*k;
    target.headDX += -11*k;
    target.headDY += -4*k;
    target.rot    += -0.13*k;
    target.sx *= 1+0.08*k; target.sy *= 1-0.06*k;
    target.shockT = clamp(k,0,1);
  }

  if(game.demoFlap!==undefined || game.demoRun!==undefined){   // inspection: show the exact key
    for(let i=0;i<POSE_KEYS.length;i++) p.pose[POSE_KEYS[i]] = target[POSE_KEYS[i]];
  } else blendPose(p.pose, target, dt, p.state==='run' ? 46 : 38);
  p.pose.shockT = target.shockT;                     // the pop must not be smoothed away
  springUpdate(dt, 0, -p.vy*0.02);
}

/* --- death: ragdoll, then he picks himself up --- */
function updateDying(dt){
  game.dyingT += dt;
  // world keeps sliding, then stops
  game.speed = damp(game.speed, 0, 2.4, dt);
  player.x += game.speed*dt;
  for(const o of game.obstacles){
    o.x += (o.vx||0)*dt;
    if(o.hitBy){ o.vy += 2200*dt; o.y = (o.y||0) - o.vy*dt; o.rot=(o.rot||0)+(o.spin||0)*dt;
      if(o.y<0){ o.y=0; o.vy*=-0.4; if(Math.abs(o.vy)<80) o.vy=0; } }
  }
  rag.step(dt, GROUND);
  if(game.dyingT<0.35 && Math.random()<dt*14) featherBurst(rag.x, rag.y, 1, 150);

  cam.x = damp(cam.x, rag.x - VW*0.42, 4, dt);
  game.camY = damp(game.camY, -20, 3, dt);
  game.zoom = damp(game.zoom, 1.06, 2.4, dt);

  if(game.dyingT>0.95 && (rag.energy||0) < 40){ startRecovery(); }
  else if(game.dyingT>2.2) startRecovery();
}
function startRecovery(){
  game.mode='dead'; game.deadT=0; game.recover=0;
  player.recX = rag.x;
  player.state = 'sit';
  finish();
}
function updateDead(dt, rawDt){
  game.deadT += rawDt;
  game.speed = damp(game.speed, 0, 3, dt);
  game.recover = Math.min(1, (game.recover||0) + dt*2.4);
  const p = player;
  const target = newPose();
  if(game.newBest && game.deadT>0.8) poseCheer(game.t, target);
  else poseSit(clamp(game.deadT*1.6,0,1), game.t, target);
  blendPose(p.pose, target, dt, 10);
  springUpdate(dt,0,0);
  cam.x = damp(cam.x, player.recX - VW*0.5, 3.2, dt);
  game.camY = damp(game.camY, 0, 3, dt);
  game.zoom = damp(game.zoom, 1.0, 3, dt);
  // confetti
  for(let i=game.ui.length-1;i>=0;i--){
    const c=game.ui[i]; c.t+=rawDt;
    c.x+=c.vx*rawDt; c.y+=c.vy*rawDt; c.vy+=420*rawDt; c.rot+=c.vr*rawDt;
    if(c.t>c.life) game.ui.splice(i,1);
  }
}

function updateParticles(dt){
  for(let i=game.parts.length-1;i>=0;i--){
    const q=game.parts[i]; q.t+=dt;
    if(q.t>=q.life){ game.parts.splice(i,1); continue; }
    q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=q.g*dt; q.rot+=q.vr*dt;
    q.vx*=Math.pow(q.drag,dt*60); q.vy*=Math.pow(q.drag,dt*60);
    if(q.kind==='feather'){
      q.vx += Math.sin(q.t*3.4+q.sway)*46*dt;          // feathers wander on the way down
      q.vy = Math.min(q.vy, 120);
      q.rot += Math.sin(q.t*3.4+q.sway)*1.6*dt;
    } else if(q.kind==='egg' && q.y>GROUND){
      q.y=GROUND; q.vy*=-0.42; q.vx*=0.66; q.vr*=0.5;
      if(Math.abs(q.vy)<70){ q.vy=0; q.vr=0; }
    }
  }
  for(let i=game.pops.length-1;i>=0;i--){
    const q=game.pops[i]; q.t+=dt;
    if(q.t>=q.life){ game.pops.splice(i,1); continue; }
    q.y += q.vy*dt; q.vy *= Math.pow(0.9,dt*60);
  }
}
