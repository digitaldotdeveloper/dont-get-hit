  ctx.beginPath(); ctx.moveTo(-5,-7); ctx.lineTo(-5,0);                     // legs
  ctx.moveTo(7,-7);  ctx.lineTo(7,0); ctx.stroke();
  ctx.save();                                                               // a wing, waving
  ctx.translate(-6,-30); ctx.rotate(cheer ? -1.15 - bob*0.06 : -0.15);
  ctx.beginPath(); ctx.ellipse(-11,0,15,7,0,0,TAU); ctx.fill();
  ctx.restore();
  ctx.restore();
}
/* Who else is in here. Inside the prison they are cricket guards in suits,
   entirely unbothered until he goes past, at which point they panic; outside
   they are other chickens cheering him on. Drawn from frames when the art is
   loaded, and from the flat silhouette otherwise, so a missing file costs a
   detail rather than the level. */
function drawNPC(set, i, sx, gy, scale, flip){
  const list = FRAME_DATA[set];
  if(!list || !FR.ready) return false;
  const fr = list[Math.min(i, list.length-1)];
  const im = FR.img[fr.f];
  if(!im || !im.complete || !im.naturalWidth) return false;
  const w = fr.w*SPR*scale, h = fr.h*SPR*scale, ay = fr.ay*SPR*scale;
  ctx.save();
  ctx.translate(sx, gy);
  if(flip) ctx.scale(-1, 1);
  ctx.globalAlpha = 0.92;
  ctx.drawImage(im, -w*0.46, -ay, w, h);
  ctx.restore();
  return true;
}
/* The neighbours: a cow, a pig and a goat walking the farm road, each with a
   set for strolling and a set for blind panic.

   They walk facing back down the road, which is the way they appear to travel
   once the world scrolls past them -- face them forwards and they moonwalk.
   The panic set faces the other way, because it is a run away from the thing
   that just went past, and that flip is the whole read of the beat: they turn.

   Species comes off the position hash, so the same animal stands in the same
   place every run, and a group can be mixed. */
/* Background NPCs WALK and do nothing else, and there are a lot of them.
   Jetpack Joyride's scientists are a continuous band of movement across the
   bottom of the screen, not a set of encounters -- you never notice an
   individual one, you notice that the world is busy. Reactions turned that into
   encounters: a gap, a thing happening, another gap.

   `NPC_REACT` turns every background reaction back on in one word -- the panic
   run, the farmer's rage, the pigeons' alert. All the frame sets are still
   loaded and still sliced; only the switch is off. */
const NPC_REACT = false;
const NPC_KIND = ['cow', 'pig', 'goat'];

/* They TRAVEL. Every background NPC used to sit at a fixed world position and
   play a walk cycle on the spot -- which is a moonwalk: the legs say one speed
   and the body says nothing, and the eye reads it as the animation being wrong
   rather than the position.

   Two rules keep it honest:

   1. `npcWalk()` is how far they have actually gone, in world units. It is
      subtracted from their position, so they head back down the road, the way
      they are already facing.
   2. The animation phase comes from that DISTANCE, never from the clock. Frame
      = (distance / stride) * frames. Drive it from time instead and the feet
      skate the moment either number is retuned; drive it from distance and the
      stride length is the only thing that can be wrong, and it is measurable.

   `NPC_STRIDE` is world units covered per full six-frame cycle, and it scales
   with how tall the figure is drawn -- a farmer's pace is not a goat's. */
const NPC_WALK = 78;                    // world units a second, an amble
const NPC_STRIDE = 0.92;                // ... per cycle, as a fraction of height
const npcWalk = () => game.t * NPC_WALK;
function npcPose(list, height, phase){
  if(!list || !list.length) return 0;
  const cycles = npcWalk() / Math.max(40, height * NPC_STRIDE);
  return Math.floor((cycles + phase) * list.length) % list.length;
}
/* The field parallax, still used by anything that stands out there. */
const NPC_F = 0.44, NPC_SCALE = 0.58, NPC_BASE = -128;

/* The livestock walk the ROAD, in the lane the chicken runs in, at his scale,
   with their feet on the same ground his are on.

   That is the entire point of them. A player who has just been taught that
   everything glowing kills him needs to meet something that does not, and the
   only way he learns that is by running straight through one and coming out
   the other side. Out in the field at 0.58 scale they were scenery he never
   touched, so the lesson had nothing to land on -- and a cow he cannot reach
   teaches him nothing about a cow.

   Which makes DENSITY the thing that has to be right, because on the road
   they are the only objects sharing his lane and a crowd of them reads as a
   wall of obstacles. The spacing is half a screen or more, so two on screen at
   once is the ceiling and one is the common case -- the layout guarantees it
   rather than a draw-time cap, which would pop a third one in the moment the
   first left. */
const NPC_SPACING = 780;      // >= VW/2, so two on screen at once is the most
const NPC_TEACH_M = 400;      // ...and for the opening 400m there is always one
function drawSpectators(){
  const spacing = NPC_SPACING, walk = npcWalk();
  /* The opening stretch is never empty: the lesson only works if he meets one
     of these BEFORE he meets anything that kills him, and leaving that to a
     hash means the run that teaches it is the run that happens not to. */
  const teach = game.mode === 'play' && game.dist < NPC_TEACH_M*10;
  const first = Math.floor((cam.x - 300 + walk)/spacing);
  for(let i=first; i<first+Math.ceil(VW/spacing)+3; i++){
    if(!teach && hash(i*9.3) > 0.58) continue;         // some stops are empty
    const gx = i*spacing + 300 - walk;                 // they are going somewhere
    const sx = gx - cam.x;
    if(sx < -260 || sx > VW+260) continue;
    /* Panic starts shortly before he arrives and carries on well after: they
       are still going when he is most of a screen down the road, which sells
       it as a reaction to him rather than a state of the scenery. */
    const dx = player.x - gx;
    const near = NPC_REACT && game.mode === 'play' && dx > -430 && dx < 900;
    const ph = hash(i*2.3)*TAU;
    const bob = near ? -Math.abs(Math.sin(game.t*9 + ph))*13
                     :  Math.sin(game.t*1.8 + ph)*2.2;
    const kind = NPC_KIND[(hash(i*5.7)*2.999)|0];
    const set = near ? kind+'run' : kind;
    const list = FRAME_DATA[set] || [];
    const fr0 = list[0];
    const pose = near
      ? (list.length ? Math.floor(game.t*13 + ph*2) % list.length : 0)
      : npcPose(list, fr0 ? fr0.h*SPR : 140, hash(i*2.3));
    const lift = near ? bob*0.35 : Math.sin(game.t*1.6 + ph)*1.6;
    if(drawNPC(set, pose, sx, GROUND - 6 + lift, 1, !near)) continue;
    ctx.save();
    ctx.translate(sx, GROUND - 8);
    ctx.scale(0.82, 0.82);
    drawLilChicken(near, bob);
    ctx.restore();
  }
}
/* THE FARMER./* THE FARMER. He owns the place, and Nugget has just left it. Six frames of
   escalating rage -- noticing, fists up, pointing, hat off, doubled over --
   played only while a chicken is going past, and standing about the rest of the
   time.

   He gets his own pass at his own spacing rather than joining the livestock:
   one farmer reads as a man, three in a row reads as a bug, and the animals
   want to come in groups. */
function drawFarmer(){
  const list = FRAME_DATA.farmer; if(!list || !list.length) return;
  const spacing = 2200, travelled = npcWalk();
  const par = bgReady() ? NPC_F : 1;                   // out in the field with the rest
  const first = Math.floor((cam.x*par - 300 + travelled)/spacing);
  for(let i=first; i<first+Math.ceil(VW/spacing)+3; i++){
    if(hash(i*3.9) > 0.55) continue;                   // rarer still than the animals
    const gx = i*spacing + 640 - travelled;
    const sx = gx - cam.x*par;
    if(sx < -260 || sx > VW+260) continue;
    /* The farmer is the ONE exception to NPC_REACT. The animals were calmed
       down because a field of livestock all panicking at once is noise; he is
       the man whose chicken has just left, so him standing in his own field
       yelling about it is the joke, not the noise. A wide window on purpose --
       he starts before Nugget reaches him and is still going a screen later. */
    const dx = (player.x - cam.x) - sx;                 // on screen, not in the world
    const near = game.mode === 'play' && dx > -900 && dx < 1400;
    const ph = hash(i*2.7)*TAU;
    const bob = near ? -Math.abs(Math.sin(game.t*7 + ph))*8 : Math.sin(game.t*1.4 + ph)*2;
    /* The rage set's first two frames are the calm and the double-take, so the
       loop starts at 2 -- otherwise he resets to placid mid-tantrum. */
    const walk = (FRAME_DATA.farmerwalk && FRAME_DATA.farmerwalk.length)
                 ? 'farmerwalk' : 'farmeridle';
    const set = near ? 'farmer' : walk;
    const list = FRAME_DATA[set] || FRAME_DATA.farmer;
    const fr0 = list[0];
    const pose = near ? 2 + (Math.floor(game.t*8 + i) % 4)
                      : npcPose(list, (fr0 ? fr0.h*SPR : 220) * 0.60, hash(i*2.7));
    // behind the fence and a good head taller than the bird, so he is drawn
    // smaller than his own art and stood a little back from the road
    drawNPC(set, pose, sx, GROUND + (bgReady() ? NPC_BASE : -30) + bob,
            0.60*(bgReady() ? NPC_SCALE/0.66 : 1), false);
  }
}
function drawProps(){
  /* The order IS the depth, and the livestock changed sides.

     Hills, then the farm, then the farmer out in his field, then the fence in
     front of him -- that fence is what puts anything drawn before it into the
     background, and it is still what keeps the farmer there. The animals come
     AFTER it, because they walk the road on the near side now: drawn with the
     farmer, the fence crossed them and they read as being in the field no
     matter what scale they were given. */
  if(!bgReady()){ drawFarmProps(); drawFarmer(); drawSpectators(); return; }
  drawBgLayers(['far', 'mid']);
  drawFarmer();
  drawBgLayers(['near']);
  drawSpectators();
}
function drawGround(){
  const y = GROUND;
  {
    /* The dirt track. Its colour is sampled off the painted panels so the seam
       between the art and the code disappears -- a curb and a hazard stripe are
       a street, and this is a farm road he was just kicked out onto. */
    ctx.fillStyle=C.road; ctx.fillRect(0,y,VW,VH-y+340);
    ctx.fillStyle='rgba(255,244,204,.16)'; ctx.fillRect(0,y,VW,9);   // the sunlit lip
    // a fringe of grass along the top edge, so the dirt starts rather than stops
    const gs=46, go=((cam.x%gs)+gs)%gs;
    ctx.strokeStyle=C.rim; ctx.lineWidth=3.4; ctx.lineCap='round';
    for(let i=-1;i<VW/gs+2;i++){
      const gx=i*gs-go, hgt=7+hash(i*2.3)*11;
      ctx.beginPath(); ctx.moveTo(gx,y+3); ctx.lineTo(gx-4,y+3-hgt);
      ctx.moveTo(gx+7,y+3); ctx.lineTo(gx+10,y+3-hgt*0.8); ctx.stroke();
    }
    // wheel ruts, and a scatter of stones so the track is not a flat slab
    ctx.strokeStyle='rgba(122,80,32,.42)'; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(0,y+62); ctx.lineTo(VW,y+62); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,y+126); ctx.lineTo(VW,y+126); ctx.stroke();
    const sp2=210, f2=Math.floor((cam.x-200)/sp2);
    for(let i=f2;i<f2+Math.ceil(VW/sp2)+2;i++){
      const sx2=i*sp2-cam.x+140, r=5+hash(i*5.1)*7, yy=y+26+hash(i*1.9)*120;
      ctx.fillStyle='rgba(150,104,44,.55)';
      ctx.beginPath(); ctx.ellipse(sx2,yy,r*1.5,r,0,0,TAU); ctx.fill();
    }
  }
}

/* ?hit=1 — every lethal shape, over the art that is supposed to be showing
   it. The rule for this obstacle set is that the sprite fills its hitbox and
   an electric piece kills exactly where it glows; this is how that gets
   checked rather than asserted. Boxes magenta, wires yellow at their true
   lethal thickness, a rotor's swept disc green. */
const HITDBG = /[?&]hit=1/.test(location.search);
function drawHitbox(o){
  ctx.save();
  {
    const p = o.spec.build(o, game.t);
    ctx.strokeStyle='rgba(255,0,220,0.9)'; ctx.lineWidth=2.5;
    for(const q of (p.solids||[])) ctx.strokeRect(q[0], -q[3], q[2]-q[0], q[3]-q[1]);
    ctx.strokeStyle='rgba(255,232,0,0.55)'; ctx.lineWidth=WIRE_R*2; ctx.lineCap='butt';
    for(const w of p.wires){ ctx.beginPath(); ctx.moveTo(w[0],-w[1]); ctx.lineTo(w[2],-w[3]); ctx.stroke(); }
    ctx.strokeStyle='rgba(0,255,170,0.9)'; ctx.lineWidth=2.5;
    for(const c of (p.discs||[])){ ctx.beginPath(); ctx.arc(c[0],-c[1],c[2],0,TAU); ctx.stroke(); }
  }
  ctx.restore();
}

function drawObstacles(){
  for(const o of game.obstacles){
    const sx = o.x - cam.x;
    if(sx < -340 || sx > VW+380) continue;
    ctx.save();
    ctx.translate(sx, GROUND - (o.y||0));
    if(o.hitBy) ctx.rotate(o.rot||0);
    o.spec.draw(o, game.t);
    if(HITDBG) drawHitbox(o);
    ctx.restore();
  }
}
/* The title lives in the scene rather than on a screen in front of it: it sits
   over the cage, shakes as he winds up, and the kick blows it out of frame. */
function drawTitle(){
  if(game.titleT === undefined || game.titleT === 0) return;
  /* titleT > 0 holds it; negative runs the blast, -0.001 to -1 in a third of a
     second. It used to add to titleT and clamp with Math.min(-0.001, ...),
     which walks the wrong way and then sticks, so the blast never actually
     animated -- the kick set -1 and the title vanished between two frames. */
  let k, blast = 0;
  if(game.titleT > 0){ k = 1; }
  else { blast = Math.min(1, -game.titleT);
         game.titleT -= (game.rawDt||0.016)*3.0;
         if(blast >= 1){ game.titleT = 0; return; }
         k = 1 - blast; }
  if(game.mode !== 'intro' && game.titleT > 0) return;
  if(POSTER_TITLE && TITLE.ready){
    // the poster, going: it lifts and grows out of frame as he starts moving
    const r = titleRect();
    ctx.save();
    ctx.globalAlpha = Math.max(0, k);
    ctx.translate(VW*0.5, VH*0.5);
    ctx.scale(1 + blast*0.30, 1 + blast*0.30);
    ctx.translate(-VW*0.5, -VH*0.5 - blast*VH*0.10);
    ctx.drawImage(TITLE.img, r.x, r.y, r.w, r.h);
    ctx.restore();
    return;
  }
  const sh = cageShake();
  const cx = VW*0.5 + (blast?0:rnd(-sh*4, sh*4));
  const cy = VH*0.24 - blast*VH*0.16;
  ctx.save();
  ctx.globalAlpha = Math.max(0, k);
  ctx.translate(cx, cy);
  ctx.scale(1 + blast*0.9, 1 + blast*0.9);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const size = Math.min(VW*0.13, 96);
  ctx.font = '400 '+size+'px Bungee, sans-serif';
  ctx.lineWidth = size*0.16; ctx.strokeStyle = '#241043'; ctx.lineJoin='round';
  ctx.strokeText("DON'T GET", 0, -size*0.52);
  ctx.strokeText('HIT',       0,  size*0.52);
  ctx.fillStyle = '#FFD54A'; ctx.fillText("DON'T GET", 0, -size*0.52);
  ctx.fillStyle = '#F2684F'; ctx.fillText('HIT',       0,  size*0.52);
  ctx.restore();
}
function drawParticles(){
  for(const q of game.parts){
    const a = 1 - q.t/q.life;
    ctx.globalAlpha = a;
    if(q.kind==='line'){
      ctx.strokeStyle=q.col; ctx.lineWidth=3; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(q.x-cam.x, q.y); ctx.lineTo(q.x-cam.x-q.r, q.y); ctx.stroke();
    } else if(q.kind==='feather'){
      ctx.save(); ctx.translate(q.x-cam.x, q.y); ctx.rotate(q.rot);
      ctx.beginPath(); ctx.ellipse(0,0,q.r*0.34,q.r,0,0,TAU);
      ctx.fillStyle=q.col; ctx.fill();
      ctx.strokeStyle='rgba(11,21,38,.45)'; ctx.lineWidth=1.6; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,-q.r*0.85); ctx.lineTo(0,q.r*0.85);
      ctx.strokeStyle='rgba(11,21,38,.30)'; ctx.lineWidth=1.4; ctx.stroke();
      ctx.restore();
    } else if(q.kind==='lock'){
      ctx.save(); ctx.translate(q.x-cam.x, q.y); ctx.rotate(q.rot); ctx.scale(0.85,0.85);
      drawCageLock(0, 0, 0, 0);
      ctx.restore();
    } else if(q.kind==='plank'){
      ctx.save(); ctx.translate(q.x-cam.x, q.y); ctx.rotate(q.rot);
      const L=q.r, W=Math.max(4, q.r*0.26);
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(-L*0.5,-W*0.5,L,W,W*0.5);
      else ctx.rect(-L*0.5,-W*0.5,L,W);
      ctx.fillStyle=q.col; ctx.fill();
      ctx.lineWidth=2.5; ctx.strokeStyle='rgba(21,8,39,.55)'; ctx.stroke();
      ctx.restore();
    } else if(q.kind==='egg'){
      ctx.save(); ctx.translate(q.x-cam.x, q.y-q.r); ctx.rotate(q.rot);
      ctx.beginPath(); ctx.ellipse(0,0,q.r*0.78,q.r,0,0,TAU);
      ctx.fillStyle=q.col; ctx.fill();
      ctx.lineWidth=3.4; ctx.strokeStyle='#0B1526'; ctx.stroke();
      ctx.beginPath(); ctx.ellipse(-q.r*0.24,-q.r*0.3,q.r*0.2,q.r*0.3,-0.4,0,TAU);
      ctx.fillStyle='rgba(255,255,255,.75)'; ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle=q.col;
      ctx.save(); ctx.translate(q.x-cam.x, q.y); ctx.rotate(q.rot);
      ctx.beginPath(); ctx.roundRect(-q.r*0.5,-q.r*0.5,q.r,q.r,q.r*0.35); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha=1;
  }
}
function drawPops(){
  ctx.textAlign='center';
  for(const q of game.pops){
    const u = q.t/q.life;
    const s = u<0.18 ? easeOutBack(u/0.18) : 1;
    ctx.globalAlpha = u>0.7 ? (1-(u-0.7)/0.3) : 1;
    ctx.save(); ctx.translate(q.x-cam.x, q.y); ctx.scale(s,s);
    ctx.font = '900 '+q.size+'px Archivo, sans-serif';
    ctx.lineJoin='round'; ctx.lineWidth=8; ctx.strokeStyle='rgba(21,8,39,.85)';
    ctx.strokeText(q.text,0,0);
    ctx.fillStyle=q.col; ctx.fillText(q.text,0,0);
    ctx.restore(); ctx.globalAlpha=1;
  }
}
function drawPlayerShadow(x, h){
  const k = clamp(1 - h/420, 0.22, 1);
  ctx.beginPath();
  ctx.ellipse(x, GROUND+5, 46*k, 12*k, 0,0,TAU);
  ctx.fillStyle='rgba(21,8,39,'+(0.36*k).toFixed(3)+')'; ctx.fill();
}
function render(){
  if(game.solo){                                   // clean character frame, no world
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle='#2A1445'; ctx.fillRect(0,0,CW,CH);
    ctx.save(); ctx.scale(SCALE,SCALE);
    const z = game.soloZoom||2.4;
    ctx.translate(VW/2, VH*0.60); ctx.scale(z,z);
    if(game.align){
      // the rig underneath in flat magenta, the painted parts over it
      const keep = Object.assign({}, CKC);
      Object.assign(CKC, { body:'#FF2D8F', shade:'#C21E६C'.replace('६','6'), wing:'#FF6FB4',
        edge:'#5A0B33', comb:'#FF2D8F', beak:'#FF2D8F',
        leg:'#FF2D8F', legDark:'#C21E6C', shoe:'#FFB3D8', shoeDark:'#E087B4', lace:'#5A0B33' });
      PARTS_ON = false; drawChicken(0, 0, player.pose);
      Object.assign(CKC, keep);
      PARTS_ON = true; ctx.globalAlpha = 0.70;
      drawChicken(0, 0, player.pose);
      ctx.globalAlpha = 1;
    } else drawChicken(0, 0, player.pose);
    ctx.restore(); return;
  }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  /* Clear to the top of the sky, not to the ink. The camera rises with the bird
     and a zoom punch shrinks the world by a fraction, and both expose canvas
     outside the drawn band -- against the ink that reads as a black letterbox
     round a bright farm. Indoors the ink is still right. */
  ctx.fillStyle = C.skyA; ctx.fillRect(0,0,CW,CH);
  ctx.save();
  ctx.scale(SCALE,SCALE);

  // camera transform
  ctx.save();
  const Z = game.zoomOverride || game.zoom;
  const zx = game.zoomOverride ? (player.x-cam.x) : VW/2;
  const zy = game.zoomOverride ? (GROUND - player.y - 70) : VH*0.55;
  ctx.translate(zx, zy); ctx.scale(Z, Z); ctx.translate(-zx, -zy);
  ctx.translate(cam.shakeX, cam.shakeY + game.camY);

  drawSky(); drawLayers(layers); drawProps();
  drawGround();
  drawObstacles();
  drawEggs();
  drawBasketDrop();

  // character
  let px = (game.mode==='menu') ? PX : player.x - cam.x;
  let py = player.y;
  const inCage = (game.mode==='menu' || game.mode==='intro');
  const cageSX = game.cageX - cam.x;
  if(inCage){
    const cp = cagePose();
    px = cageSX + cp.x; py = cp.y;
  }
  if(inCage || cageSX > -VW*1.3) drawCageBack(cageSX);
  if(game.mode==='dying'){
    drawPlayerShadow(rag.x - cam.x, Math.max(0, GROUND - rag.y - CK.standH));
    ctx.save(); ctx.translate(-cam.x, 0);
    rag.draw();
    ctx.restore();
  } else if(game.mode==='dead'){
    const x = player.recX - cam.x;
    drawPlayerShadow(x, 0);
    drawChicken(x, GROUND, player.pose);
  } else {
    drawPlayerShadow(px, py);
    drawChicken(px, GROUND - py, player.pose);
    /* After him, so the rim of the basket crosses his legs and the balloons
       ride over his head -- he is IN it rather than next to it. */
    if(riding()) drawBasket();
    /* ?hit=1 shows NUGGET'S box over Nugget, next to the hazards' own. The
       question this answers is the only one that matters about a hitbox --
       does it look like the thing it is standing in for -- and it cannot be
       answered by reading two numbers in different files. Solid is the box
       the broad phase uses; dashed is what actually kills, 8 units in on
       every side, which is the forgiveness. */
    if(HITDBG){
      ctx.save();
      ctx.strokeStyle='rgba(64,226,255,0.95)'; ctx.lineWidth=2.5;
      ctx.strokeRect(px-48, GROUND-py-150, 96, 142);
      ctx.setLineDash([7,5]); ctx.strokeStyle='rgba(255,255,255,0.75)'; ctx.lineWidth=2;
      ctx.strokeRect(px-40, GROUND-py-142, 80, 126);
      ctx.restore();
    }
  }

  if(inCage || cageSX > -VW*1.3) drawCageFront(cageSX);
  drawParticles();
  drawCrows();                        // in front of him: it is the thing hitting him
  if(inCage || cageSX > -VW*1.3) drawBoom(cageSX);
  drawTitle();
  drawPops();
  ctx.restore();

  drawCrowAlerts();                   // screen space: it belongs to the display edge

  // screen-space confetti
  for(const c of game.ui){
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.globalAlpha = clamp(1-(c.t/c.life),0,1);
    ctx.fillStyle=c.col; ctx.beginPath(); ctx.roundRect(-c.r*0.5,-c.r*0.35,c.r,c.r*0.7,2); ctx.fill();
    ctx.restore(); ctx.globalAlpha=1;
  }

  // vignette + warm bloom
  // The prison wants the corners crushed. A bright farm under a blue sky does
  // not -- at 0.5 it looked like the sun had gone in.
  const vigK = THEME.vig === undefined ? 0.5 : THEME.vig;
  ctx.drawImage(surface('vignette|'+vigK, VW, VH, false, (g) => {
    const vg = g.createRadialGradient(VW*0.5,VH*0.5,VH*0.30, VW*0.5,VH*0.5,VH*0.85);
    vg.addColorStop(0,'rgba(21,8,39,0)'); vg.addColorStop(1,'rgba(21,8,39,'+vigK+')');
    g.fillStyle=vg; g.fillRect(0,0,VW,VH);
  }), 0, 0, VW, VH);
  ctx.restore();
}

/* ============================================================
   LOOP
   ============================================================ */
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let raw = (now-last)/1000; last = now;
  perfWatch(raw);
  raw = Math.min(raw, 0.05);
  let dt = raw*game.timeScale;
  if(game.freeze>0){ game.freeze -= raw; dt = raw*0.06; }
  game.rawDt = raw;
  if(PORTRAIT){ render(); return; }      // held, not lost, behind the turn prompt
  update(dt, raw);
  render();
}

/* boot */
function boot(){
  document.body.classList.toggle('poster', POSTER_TITLE);
  resize();
  toMenu();
  requestAnimationFrame(frame);
  // dev helper: index.html?auto=1 drops you straight into a run
  if(/[?&]auto/.test(location.search)) setTimeout(startIntro, 60);
  if(/[?&]demo/.test(location.search)) game.demo = true;
  if(/[?&]dbg/.test(location.search)) game.dbg = true;
  const it=/[?&]introt=([0-9.]+)/.exec(location.search);
  if(it){ game.holdIntro = parseFloat(it[1]); }   // freeze the intro to look at a beat
  const sl=/[?&]slow=([0-9.]+)/.exec(location.search);
  if(sl) game.introSlow = Math.max(1, parseFloat(sl[1]));  // run the escape in slow motion
  // ?ride=1 starts the run already in the basket, which is the only sane way
  // to look at a vehicle that otherwise turns up once every twenty seconds
  if(/[?&]ride/.test(location.search)) game.forceRide = true;
  const rt=/[?&]runt=([0-9.]+)/.exec(location.search);
  if(rt) game.presetRunT = parseFloat(rt[1]);   // jump to a difficulty tier
  const ds=/[?&]dist=([0-9.]+)/.exec(location.search);
  if(ds) game.presetDist = parseFloat(ds[1]);   // ...and to a distance, in metres
  if(/[?&]rig/.test(location.search)) game.rig = true;
  if(/[?&]align/.test(location.search)) game.align = true;
  if(/[?&]selftest/.test(location.search)){
    setTimeout(()=>{
      const dt=1/60, out=[];
      function run(name, script, n){
        releaseJump(); startRun();
        game.spawnT=1e9; game.eggT=1e9; game.crowT=1e9;   // physics only
        const log=[];
        for(let i=0;i<n;i++){
          script(i);
          updatePlay(dt);
          log.push({i, y:Math.round(player.y), h:player.thrusting?1:0});
        }
        const apex = Math.max.apply(null, log.map(r=>r.y));
        out.push(name+' apex='+apex+'  '+
          log.filter((_,i)=>i%5===0).map(r=>'y'+r.y+(r.h?'H':'')).join(' '));
      }
      // hold length must map to altitude: short < medium < long
      run('SHORT  ', i=>{ if(i===2) thrustOn(); if(i===14) thrustOff(); }, 120);
      run('MEDIUM ', i=>{ if(i===2) thrustOn(); if(i===32) thrustOff(); }, 120);
      run('LONG   ', i=>{ if(i===2) thrustOn(); if(i===70) thrustOff(); }, 120);
      run('PULSED ', i=>{ if(i%16===2) thrustOn(); if(i%16===8) thrustOff(); }, 120);

      /* ---- frame-rate independence -------------------------------------
         The same hold, in SECONDS, replayed at four refresh rates. If the
         integrator is honest these land on the same altitude; if it is not,
         the game is a different game on a 144Hz phone -- and that is the kind
         of bug nobody reports, they just say it feels wrong on their device.
         Scripted by time rather than by frame index, or each rate would be
         holding for a different length and the test would prove nothing. */
      /* The hold is counted in FRAMES, and the durations below are whole
         frames at all four rates (1/6, 1/3, 1/2 and 1s are integers at 60, 90,
         120 and 144). Scripted against a wall clock instead, 0.20s is 12
         frames at 60Hz and 28.8 at 144 -- the rates then hold for different
         lengths and the test reports its own sampling as a physics fault,
         which it did on the first run of this. */
      function apexAt(hz, hold){
        const h = 1/hz, n = Math.round(1.9*hz), on = Math.round(hold*hz);
        releaseJump(); startRun();
        game.spawnT=1e9; game.eggT=1e9; game.crowT=1e9;
        let apex = 0;
        for(let i=0;i<n;i++){
          if(i < on) thrustOn(); else thrustOff();
          updatePlay(h);
          if(player.y > apex) apex = player.y;
        }
        return apex;
      }
      const RATES = [60, 90, 120, 144];
      let worst = 0;
      for(const hold of [1/6, 1/3, 0.5]){
        const a = RATES.map(hz=>apexAt(hz, hold));
        const lo = Math.min.apply(null,a), hi = Math.max.apply(null,a);
        const spread = hi ? (hi-lo)/hi*100 : 0;
        worst = Math.max(worst, spread);
        out.push('hold '+hold.toFixed(2)+'s  apex '+
          a.map((v,i)=>RATES[i]+'Hz:'+Math.round(v)).join('  ')+
          '   spread '+spread.toFixed(2)+'%');
      }
      out.push(worst < 1 ? 'PHYSICS: frame-rate independent (worst '+worst.toFixed(2)+'%)'
                         : 'PHYSICS: FRAME-RATE DEPENDENT, worst '+worst.toFixed(2)+'%');
      const el = document.getElementById('selftest');
      el.style.display='block';
      el.style.color = worst < 1 ? '#0f0' : '#FF456E';
      el.textContent = out.join(String.fromCharCode(10));
      window.__selftest = out.join(' | ');
    }, 40);
  }
  /* Every sound, actually played. A throwing WebAudio call used to abort
     thrustOn() halfway and take the flight controls with it, so sound is now
     exercised in the same way gameplay exercises it. */
  /* Spawn every tier a few hundred times and look at what comes out: nothing
     may stack into a gate, and none of it
     may throw. */
  /* ?ob=KEY — park one hazard in the middle of a live run and hold it there,
     so a new prop can be LOOKED at instead of waited for. With ?hit=1 the
     lethal shapes are drawn over it, which is how "the sprite fills its
     hitbox" gets checked rather than asserted.

     It also hangs the setup on window, because the whole game is inside an
     IIFE: a headless shot of the next hazard would otherwise mean a full
     reload and every prop fetched again, per hazard. Nothing is exposed
     unless the flag is on the URL. */
  const obm = /[?&]ob=([A-Za-z0-9_]+)/.exec(location.search);
  if(obm){
    const show = (k)=>{
      if(!OB[k]) return 'no such obstacle: '+k;
      startRun();
      game.tut = false; elTut.classList.remove('show');
      game.obstacles.length=0; game.eggs.length=0;
      game.parts.length=0; game.pops.length=0;
      game.spawnT = 1e9; game.eggT = 1e9;      // nothing else joins the picture
      player.x = 2000; player.y = 300; player.vy = 0; player.thrusting = false;
      cam.x = player.x - PX;
      const o = OB[k].elec ? spawnElec(k, 3.0) : spawnOne(k, 3.0);
      o.x = cam.x + VW*0.56;
      o.seed = 3.1; o.phase = 0.85;            // fixed, so two shots agree
      game.freeze = 9999;                      // 6% time: it holds still
      return JSON.stringify({key:k, h:Math.round(o.h), w:Math.round(o.w),
        lo:Math.round(o.lo||0), hi:Math.round(o.hi||0),
        band:Math.round(GROUND-CEIL)});
    };
    window.__ob = show;
    setTimeout(()=>show(obm[1]), 90);
  }
  /* The crow attack takes four seconds to play and half a minute to earn, so
     ?crowshot=1 parks it at one named moment instead: window.__crow('track'),
     'lock', 'fly' or 'close'. Same objects, same draw calls, clock frozen --
     it is the real attack held still, not a mock-up of it. */
  if(/[?&]crowshot/.test(location.search)){
    const stage = (which)=>{
      startRun();
      game.tut = false; elTut.classList.remove('show');
      game.obstacles.length=0; game.eggs.length=0;
      game.parts.length=0; game.pops.length=0; game.crows.length=0;
      game.spawnT = 1e9; game.eggT = 1e9; game.crowT = 1e9;
      player.x = 2000; player.y = 320; player.vy = 0; player.thrusting = false;
      cam.x = player.x - PX;
      launchCrows();
      game.crows.length = 1;                   // one bird, however the dice fell
      const c = game.crows[0];
      c.state = 'warn'; c.wait = 0; c.ty = 340; c.t = 0.4; c.seed = 0;
      if(which === 'track') c.warnT = CROW_WARN*0.8;
      else if(which === 'lock') c.warnT = CROW_LOCK*0.55;
      else {
        c.state = 'fly'; c.warnT = 0; c.y = c.ty;
        c.x = which === 'close' ? player.x + 330 : cam.x + VW*0.74;
      }
      game.spawnT = 1e9; game.crowT = 1e9;     // launchCrows moved both of them
      /* 'live' is the same setup running at full speed with nothing else on
         the field -- the attack as it actually plays, for a clip. */
      game.freeze = which === 'live' ? 0 : 9999;   // otherwise 6% time: it holds still
      if(which === 'live'){ c.state='warn'; c.warnT=CROW_WARN; c.ty=player.y+72;
                            game.crowT = 4.2; }   // and another one behind it
      return JSON.stringify({stage:which, state:c.state,
        warnT:+(c.warnT).toFixed(2), ty:Math.round(c.ty),
        sx:Math.round(c.x - cam.x)});
    };
    window.__crow = stage;
    setTimeout(()=>stage('lock'), 90);
  }
  /* "Wait for clear air" is the kind of rule that reads as obviously fine and
     then never fires once, so it is measured rather than trusted. This runs
     the REAL spawner and the REAL updateCrows against a moving player for two
     minutes per tier, and reports how long a volley had to wait for a window.
     A tier where the longest wait runs away is a tier where the crows have
     quietly been switched off. */
  /* Sound cannot be screenshotted, so it gets rendered instead. ?sfx=1 hangs
     __sfx on window: it swaps A.ctx/master/sfxGain for an OfflineAudioContext,
     calls the REAL entry in S, renders, and hands back a WAV. Swapping the
     three fields rather than reimplementing anything is the point -- what
     comes out is the synthesis the game actually plays, not a copy of it that
     can drift. tools/sfx.py drives it and writes the files. */
  if(/[?&]sfx/.test(location.search)){
    window.__sfx = (name, arg, secs) => new Promise((res, rej)=>{
      const sr = 44100, n = Math.ceil(sr*(secs||1.2));
      const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      const keep = { ctx:A.ctx, master:A.master, sfxGain:A.sfxGain,
                     started:A.started, on:A.on, nb:noiseBuf,
                     w:{src:WIND.src, bp:WIND.bp, g:WIND.g} };
      const oc = new OC(1, n, sr);
      A.ctx = oc;
      A.master  = oc.createGain(); A.master.gain.value = 0.9;
      A.master.connect(oc.destination);
      A.sfxGain = oc.createGain(); A.sfxGain.gain.value = 0.85;
      A.sfxGain.connect(A.master);
      A.started = true; A.on = true;
      noiseBuf = null;                       // the old buffer belongs to the old context
      try{
        if(name === 'wind'){                 // a state, not an event: sweep it
          WIND.src = WIND.bp = WIND.g = null;
          windStart();
          windSet(0.006, 280);
          for(let i=1;i<=10;i++){
            const k = i/10, t = k*(secs||1.2)*0.92;
            WIND.g.gain.setTargetAtTime(0.004 + k*0.055, t, 0.10);
            WIND.bp.frequency.setTargetAtTime(260 + k*1500, t, 0.16);
          }
        } else S[name](arg);                 // one sound; runs are joined outside
      }catch(e){ rej(e.message); return; }
      oc.startRendering().then(buf=>{
        const d = buf.getChannelData(0);
        let peak = 0;
        for(let i=0;i<d.length;i++) peak = Math.max(peak, Math.abs(d[i]));
        const ab = new ArrayBuffer(44 + d.length*2), v = new DataView(ab);
        const str = (o,t)=>{ for(let i=0;i<t.length;i++) v.setUint8(o+i, t.charCodeAt(i)); };
        str(0,'RIFF'); v.setUint32(4, 36+d.length*2, true); str(8,'WAVEfmt ');
        v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
        v.setUint32(24,sr,true); v.setUint32(28,sr*2,true);
        v.setUint16(32,2,true); v.setUint16(34,16,true);
        str(36,'data'); v.setUint32(40, d.length*2, true);
        for(let i=0;i<d.length;i++){
          const x = Math.max(-1, Math.min(1, d[i]));
          v.setInt16(44+i*2, x<0 ? x*0x8000 : x*0x7FFF, true);
        }
        const b = new Uint8Array(ab); let bin = '';
        for(let i=0;i<b.length;i+=8192)
          bin += String.fromCharCode.apply(null, b.subarray(i, i+8192));
        A.ctx=keep.ctx; A.master=keep.master; A.sfxGain=keep.sfxGain;
        A.started=keep.started; A.on=keep.on; noiseBuf=keep.nb;
        WIND.src=keep.w.src; WIND.bp=keep.w.bp; WIND.g=keep.w.g;
        res(JSON.stringify({ name, peak:+peak.toFixed(4), wav: btoa(bin) }));
      }, e => rej(String(e)));
    });
  }
  if(/[?&]crowtest/.test(location.search)){
    setTimeout(()=>{
      const out = [], dt = 1/60;
      for(const rt of [26, 45, 70, 100]){
        startRun();
        game.runT = rt; game.diff = clamp(rt/95, 0, 1);
        game.speed = (340 + 400*game.diff)*PACE;
        game.obstacles.length = 0; game.spawnT = 0;
        game.crows.length = 0; game.crowT = 0; game.crowN = 0;
        player.x = 0; player.y = 300; cam.x = -PX;
        const waits = []; let wait = 0;
        /* Split at the flock threshold, because the whole claim being tested
           is that the sizes on one side of it differ from the other. */
        const sizes = { pre:[0,0,0,0], post:[0,0,0,0] };
        for(let T=0; T<120; T+=dt){
          player.x += game.speed*dt; cam.x = player.x - PX;
          game.dist += game.speed*dt;          // the rule reads this

          game.spawnT -= dt;
          if(game.spawnT <= 0) spawnPattern();
          for(let i=game.obstacles.length-1;i>=0;i--)
            if(game.obstacles[i].x < player.x-500) game.obstacles.splice(i,1);
          wait += dt;
          updateCrows(dt);
          if(game.crows.length){                 // a volley got its window
            (game.dist >= CROW_FLOCK_M*10 ? sizes.post : sizes.pre)[game.crows.length]++;
            waits.push(wait); wait = 0;
            game.crows.length = 0;               // no camera here to fly it across
          }
        }
        const mx = waits.length ? Math.max.apply(null, waits) : 999;
        const av = waits.length ? waits.reduce((a,b)=>a+b,0)/waits.length : 999;
        out.push('runT='+rt+'  volleys='+waits.length+
                 '  every '+av.toFixed(1)+'s  worst '+mx.toFixed(1)+'s'+
                 '  1/2/3 under '+CROW_FLOCK_M+'m='+sizes.pre.slice(1).join('/')+
                 '  over='+sizes.post.slice(1).join('/'));
      }
      /* And the other half of "fair": a locked bird has to be able to reach
         him wherever he is, including pinned to the floor and pinned to the
         roof, where the lane clamp is the only thing deciding the height. */
      startRun();
      const ceilH = GROUND-CEIL, lane = crowLane();
      for(const py of [0, 60, ceilH*0.5, ceilH-40, ceilH]){
        const ty = clamp(py+72, lane[0], lane[1]);
        const pb = py+8, pt = py+150;
        out.push('lock py='+Math.round(py)+' -> ty='+Math.round(ty)+
                 '  reaches him: '+(pt > ty-CROW_HH+8 && pb < ty+CROW_HH-8));
      }
      const el = document.getElementById('selftest');
      if(el){ el.style.display='block'; el.textContent = out.join(String.fromCharCode(10)); }
      window.__crowtest = out.join(' | ');
      console.log(out.join(String.fromCharCode(10)));
    }, 400);
  }
  if(/[?&]obtest/.test(location.search)){
    setTimeout(()=>{
      const out=[]; let bad=0;
      const band = GROUND - CEIL;
      for(let tier=0; tier<=4; tier++){
        // These must map through tierNow(): <9=0 <22=1 <40=2 <64=3 else 4.
        // They used to be [0,30,55,80,120], which lands on tiers 0,2,3,4,4 --
        // so tier 1 was never tested at all and tier 4 was tested twice.
        game.runT = [0,15,30,50,80][tier];
        const kinds={}; let worst=1e9, tight=1e9, shut=0;
        for(let n=0;n<240;n++){
          game.obstacles.length = 0;
          /* The crop's cooldown is in seconds and this loop does not advance
             the clock, so without this the corn appears once per tier and then
             locks itself out of its own test. */
          game.cornT = 0;
          try{ spawnPattern(); }catch(e){ out.push('tier'+tier+' THREW '+e.message); bad++; break; }
          const os = game.obstacles;
          for(const o of os) kinds[o.key]=(kinds[o.key]||0)+1;
          for(const o of os){
            /* Every piece answers for its own opening. Measuring it as
               band-o.h would read every one of them as a solid wall, because
               a ladder IS the full column height -- the gap is the point, and
               a zapper's two corridors are not its height at all. */
            let best = 0;
            for(const f of o.spec.free(o, band)) best = Math.max(best, f[1]-f[0]);
            worst = Math.min(worst, best);
            if(best < CLEAR-1){ bad++;
              out.push('tier'+tier+' '+o.key+' opening only '+Math.round(best)); }
            /* And no side may be in between. A corridor is either flyable or
               plainly shut; the space that looks passable and is not is the
               thing rollZap exists to refuse, so it is checked here too. */
            for(const f of o.spec.free(o, band)){
              const g = f[1]-f[0];
              if(g >= SHUT && g < CLEAR){ shut++;
                out.push('tier'+tier+' '+o.key+' half-gap '+Math.round(g)); }
            }
            if(!isFinite(worst)){ out.push('tier'+tier+' BAD '+o.key+
              ' h='+o.h+' cy='+o.cy+' len='+o.len); bad++; worst=1e9; }
          }
          // spacing inside a pattern, in arrival time
          for(let a=0;a<os.length;a++) for(let b2=a+1;b2<os.length;b2++)
            tight = Math.min(tight, Math.abs(os[a].x-os[b2].x)/game.speed);
        }
        if(shut){ bad++; out.push('tier'+tier+' HALF-GAPS: '+shut); }
        if(worst<CLEAR-1){ bad++; out.push('tier'+tier+' corridor only '+Math.round(worst)); }
        if(tight<0.62){ bad++; out.push('tier'+tier+' spacing only '+tight.toFixed(2)+'s'); }
        out.push('tier'+tier+' corridor>='+Math.round(worst)+
          '  gap>='+(tight<1e8?tight.toFixed(2)+'s':'-')+'  '+
          Object.keys(kinds).sort().map(k=>k+':'+kinds[k]).join(' '));
      }
      out.unshift(bad ? ('OBSTACLES: '+bad+' PROBLEMS') : 'OBSTACLES: ok, every opening flyable');
      const el=document.getElementById('selftest');
      el.style.display='block'; el.style.color = bad ? '#FF456E' : '#0f0';
      el.textContent = out.join(String.fromCharCode(10));
    }, 60);
  }
  /* Which piece of music each state asks for. The failure this catches is the
     two overlapping, or the chase theme carrying on into the menu after a
     death -- neither of which shows up as an error. */
  if(/[?&]musictest/.test(location.search)){
    setTimeout(()=>{
      const out=[]; let bad=0;
      audioInit(); initTrack();
      out.push('menu file  : ' + (MENU_TRACK ? MENU_TRACK.src.split('/').pop() : 'MISSING'));
      out.push('play files : ' + TRACKS.map(t=>t.src.split('/').pop()).join(' '));
      if(!MENU_TRACK){ out.push('no menu track'); bad++; }
      const want = [['menu',0.40,0],['play',0,0.55],['duck',0,0.18],['menu',0.40,0]];
      for(const [scene,m,t] of want){
        musicScene(scene);
        const ok = Math.abs(menuWanted-m)<0.001 && Math.abs(trackWanted-t)<0.001;
        if(!ok) bad++;
        out.push((ok?'ok   ':'FAIL ') + scene + ' -> menu '+menuWanted.toFixed(2)+
                 ' chase '+trackWanted.toFixed(2));
        if(menuWanted>0 && trackWanted>0){ out.push('  BOTH PLAYING AT ONCE'); bad++; }
      }
      out.unshift(bad ? ('MUSIC: '+bad+' PROBLEMS') : 'MUSIC: scenes ok, never both at once');
      const el=document.getElementById('selftest');
      el.style.display='block'; el.style.color = bad ? '#FF456E' : '#0f0';
      el.textContent = out.join(String.fromCharCode(10));
    }, 80);
  }
  if(/[?&]audiotest/.test(location.search)){
    setTimeout(()=>{
      const out=[]; let bad=0;
      try{ audioInit(); }catch(e){ out.push('audioInit THREW: '+e.message); bad++; }
      A.on = true;
      out.push('ctx=' + (A.ctx ? A.ctx.state : 'none') + ' started=' + (A.started?1:0));
      for(const k of Object.keys(S)){
        A.err = null;
        try{ S[k](1); }catch(e){ A.err = 'THREW ' + e.message; }
        if(A.err){ out.push('FAIL ' + k + ': ' + A.err); bad++; }
      }
      A.err = null;
      try{ musicTick(); }catch(e){ A.err='THREW '+e.message; }
      if(A.err){ out.push('FAIL musicTick: '+A.err); bad++; }
      out.unshift(bad ? ('AUDIO: ' + bad + ' FAILING') : 'AUDIO: all ' + Object.keys(S).length + ' sounds OK');
      const el=document.getElementById('selftest');
      el.style.display='block'; el.style.color = bad ? '#FF456E' : '#0f0';
      el.textContent = out.join(String.fromCharCode(10));
    }, 60);
  }
  if(/[?&]solo/.test(location.search)){ game.solo = true; document.body.classList.add('solo'); }
  const rmv=/[?&]run=([0-9.]+)/.exec(location.search); if(rmv) game.demoRun=parseFloat(rmv[1]);
  const sz=/[?&]sz=([0-9.]+)/.exec(location.search); if(sz) game.soloZoom=parseFloat(sz[1]);
  const pm=/[?&]pose=([a-z]+)(?::([0-9.]+))?/.exec(location.search);
  if(pm){ game.demoPose=pm[1]; game.demoPoseK = pm[2]!==undefined?parseFloat(pm[2]):1; }
  if(/[?&]hold=0/.test(location.search)) game.holdOff = true;
  const wm=/[?&]wear=([^&]+)/.exec(location.search);
  if(wm) decodeURIComponent(wm[1]).split(',').forEach(pair=>{
    const [slot,id]=pair.split(':'); equip(slot, id==='none'?null:id);
  });
  const zm=/[?&]zoom=([0-9.]+)/.exec(location.search); if(zm) game.zoomOverride=parseFloat(zm[1]);
  const fm=/[?&]flap=([0-9.]+)/.exec(location.search); if(fm) game.demoFlap=parseFloat(fm[1]);
}
/* Surface runtime errors on screen. A device-only exception is invisible
   otherwise, and it will break the game no matter what the input code says. */
window.addEventListener('error', e => {
  document.title = 'ERR: ' + e.message;
  const el = document.getElementById('selftest');
  if(el){
    el.style.display = 'block';
    el.style.color = '#FF456E';
    el.style.whiteSpace = 'pre-wrap';
    el.textContent = 'ERROR: ' + e.message +
      String.fromCharCode(10) + 'at line ' + e.lineno + ':' + e.colno +
      String.fromCharCode(10) + (e.filename||'').slice(-60);
  }
});
window.addEventListener('unhandledrejection', e => {
  document.title = 'ERR: promise';
  const el = document.getElementById('selftest');
  if(el){ el.style.display='block'; el.style.color='#FF456E';
    el.textContent = 'PROMISE REJECTED: ' + (e.reason && e.reason.message || e.reason); }
});
if(document.fonts && document.fonts.ready){
  const t = setTimeout(boot, 1400);
  document.fonts.ready.then(()=>{ clearTimeout(t); boot(); }).catch(boot);
} else boot();

})();
</script>
</body>
</html>
