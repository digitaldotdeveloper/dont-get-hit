apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

/* The version and the upload key live OUTSIDE android/ (in "Android App/"), so
   regenerating the platform folder with `npx cap add android` loses neither.
   scripts/build.mjs moves versionCode on by one after every release build,
   because Play refuses a code it has already seen. */
def appRoot = rootProject.file('..')
def appVersion = new JsonSlurper().parse(new File(appRoot, 'version.json'))
def keyDir = new File(appRoot, 'keystore')
def keyFile = new File(keyDir, 'keystore.properties')
def keyProps = new Properties()
if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }
def commit = project.findProperty('dghCommit')

android {
    namespace = "com.digitaldotdeveloper.dontgethit"
    compileSdk = rootProject.ext.compileSdkVersion
    buildToolsVersion = "36.0.0"
    defaultConfig {
        applicationId "com.digitaldotdeveloper.dontgethit"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersion.versionCode as int
        versionName appVersion.versionName + (commit ? " (${commit})" : "")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keyFile.exists()) {
                storeFile new File(keyDir, keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // R8 cuts the Java side (Capacitor, AndroidX) down to what actually
            // runs. proguard-rules.pro keeps Capacitor whole: it works by reflection.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keyFile.exists()) signingConfig signingConfigs.release
        }
    }
    androidResources {
        // WebP, Opus and WOFF2 arrive compressed. Zipping them again saves nothing
        // and costs an inflate every time the WebView reads one.
        noCompress 'webp', 'ogg', 'woff2'
    }
    // The dependency report is for Play; a sideloaded APK has no use for it.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
